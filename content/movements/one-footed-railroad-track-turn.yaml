structures:
  - structure: acl
    side: inside
    phases: [shaping]
    mechanism: Loaded if the lifted ski is put down wide and catches in a wedge to save balance, twisting the knee inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
