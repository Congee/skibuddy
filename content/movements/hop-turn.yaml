    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Controls the low back's bend toward the outside ski on landing
    confidence: low
    basis: EMG off snow; the role here is mechanics
    sources: [andersson-1996, mcgill-1996]
  - muscle: quadratus-lumborum
    side: outside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the inside side to steady the low back
    confidence: low
    basis: EMG off snow
    sources: [mcgill-1996]
  - muscle: internal-oblique
    side: inside
    serves: [thoracic.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Helps control the trunk's bend toward the outside ski on landing
    confidence: low
