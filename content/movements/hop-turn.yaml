      shaping: { action: Head kept level through the landing, contraction: isometric, cue: Don't tip the head into the turn, confidence: low, sources: [{ source: lemaster-2010, pages: 72 }] }
      finish: { action: Head kept level, contraction: isometric, cue: Level head, confidence: low, sources: [] }
