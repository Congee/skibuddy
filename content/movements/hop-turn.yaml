      shaping: { neutral: true, contraction: isometric, cue: Head faces down the hill with the chest, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Head faces down the hill with the chest, confidence: low, sources: [] }

activations:
  # Both legs take off and land together, so the leg extensors work on both sides; the outside leg carries more
  # in the short arc. Stretch-shortening: eccentric loading in the finish and landing, concentric take-off.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 3, dynamic: 3 }
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Spring the knee open for the take-off, brake the landing, and load again for the next hop, with the stretch carried straight into the push
    confidence: medium
    basis: Quadriceps action was faster in moguls than in other events (berg-1999), and jump knee speeds are several times those of turns (cross-raschner-2023 pp 17-18). The push and the landing each run at roughly 1.4-1.9 times body weight shared by both legs at drill hops (our inference from L&S pp 118-120), plus the turn load; per-setting values are inference. No study has measured this drill
    sources:
      - berg-1999
      - hintermeister-1997
      - { source: cross-raschner-2023, pages: "17-18" }
      - { source: lind-sanders-2004, pages: "103, 118-120" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Helps extend the knee in the take-off, then flexes the hip to tuck the skis up in the air
    confidence: low
    basis: Two-joint muscle measured in turns; its knee and hip roles here are mechanics
    sources: [kroll-2010, panizzolo-2013]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 3, dynamic: 3 }
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Drives the hip open in the take-off and brakes the fold of the landing, so the hips stay above the knees
    confidence: medium
    basis: Highly active in turns (hintermeister-1997); the hip extensors drive a jump with the knee extensors when the ankle cannot (patterson-2023 p 89). Per-setting values are inference from the push and landing loads
    sources:
      - hintermeister-1997
      - { source: patterson-2023, pages: 89 }
      - { source: lemaster-2010, pages: 104 }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Shares the hip extension in the take-off and the landing
    confidence: low
    basis: Anatomy; not measured apart from the adductor group
    sources: [neumann-2010]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Tucks the skis up in the air, then co-contracts through the landing to protect the ACL and share the hip extension
    confidence: medium
    basis: Hamstring co-contraction cut ACL strain by more than 70 % in cadaver landings (jordan-sporri-taylor-2023 p 120); hamstrings are highly active in turns. Levels are inference
    sources:
      - hintermeister-1997
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-120" }
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting and caving in on landing
    confidence: medium
    basis: Measured in turns and a simulated edged stance; their landing role is the ACL mechanics
    sources: [hintermeister-1997, zorko-2020, { source: jordan-sporri-taylor-2023, pages: 120 }]
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: 2
    contraction: { initiation: isometric, shaping: eccentric, finish: isometric }
    role: Catches the pelvis as the landing loads the outside leg, keeping the inside half up and the knee over the foot
    confidence: medium
    basis: Measured on snow in turns; landing on one edged leg loads the hip abductors as in a single-leg landing (inference)
    sources: [seifert-2023, distefano-2009, moore-2020]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: eccentric, finish: isometric }
    role: Shares the pelvic catch with gluteus medius and steadies the head of the femur
    confidence: low
    basis: Never measured on snow; off-snow EMG puts it with gluteus medius
    sources: [moore-2020]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps turn the thigh inward in the air and hold the pelvis on landing
    confidence: low
    basis: Moment arms and exercise data; not measured on snow
    sources: [delp-1999, selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent, light thigh inward in the air to pivot the ski
    confidence: low
    basis: The adductors are the strong rotators of a flexed leg (LeMaster p 108); unloaded in the air, so the effort is in the speed, not the force
    sources:
      - { source: lemaster-2010, pages: "108, 119" }
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steady the hip joint through the take-off and landing
    confidence: low
    basis: Anatomy; prevention programmes train the hip external rotators for landing control (jordan-sporri-taylor-2023 p 123)
    sources: [delp-1999, { source: jordan-sporri-taylor-2023, pages: 123 }]
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the feet up in the air so the skis land level, and holds the shins on the tongues through the landing so it is not on the tails
    confidence: low
    basis: Highly active in turns; the landing role is the back-weighted landing mechanism read in reverse. Not measured in hops
    sources:
      - hintermeister-1997
      - { source: jordan-sporri-taylor-2023, pages: 120 }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the feet up with tibialis anterior in the air
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Shortens briefly in the push as the ankle opens a few degrees with the shank coming upright, then brakes the ankle as the landing drives the shin forward
    confidence: low
    basis: The boot shaft carries much of the ankle moment in carving (heinrich-2022) and leaves no room for a full ankle push (patterson-2023 p 89), but the ankle still opens a little as the knees and hips extend; its landing role is mechanics
    sources: [heinrich-2022, { source: patterson-2023, pages: 89 }]
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Helps the small ankle opening in the push, stiffens the ankle in the landing, and helps tuck the knee in the air
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: concentric }
    role: Roll the ski to its new edge in the air and hold the edge against the landing
    confidence: low
    basis: Highly active in turns for edge control; the landing hold is mechanics
    sources: [louie-1984, { source: cross-raschner-2023, pages: 14 }]
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up under the push and landing
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 0 }
    contraction: { initiation: concentric, shaping: null, finish: null }
    role: Tucks the thigh up in the air to lift the skis clear
    confidence: low
    basis: Inference; never measured on snow
    sources: [jiroumaru-2014]
  # Inside leg: the same take-off and landing, a little less loaded in the arc.
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Spring the inside knee open with the outside one, then brake the two-footed landing
    confidence: low
    basis: Mechanics of a two-footed jump; the inside vasti drop in ordinary turns (kroll-2010) but here the take-off and landing are shared
    sources: [kroll-2010, { source: lind-sanders-2004, pages: "118-120" }]
  - muscle: rectus-femoris
    side: inside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Helps the take-off, then flexes the hip to tuck the inside ski up and keep the inside leg short
    confidence: medium
    basis: Measured as an inside-leg hip flexor in recreational turns
    sources: [kroll-2010]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Drives the inside hip open in the take-off, brakes the landing and helps turn the thigh outward in the air
    confidence: low
    basis: Mechanics of a two-footed jump; not measured in hops
    sources: [delp-1999]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Tucks the inside ski up in the air, then co-contracts through the landing
    confidence: low
    basis: Landing co-contraction is the ACL mechanics; not measured in hops
    sources: [{ source: jordan-sporri-taylor-2023, pages: 120 }]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help tuck the inside ski and steady the knee on landing
    confidence: low
    basis: Mechanics; not measured in hops
    sources: []
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the light inside thigh outward in the air so both skis pivot together
    confidence: low
    basis: Anatomy; with the hip flexed their moment arms shrink and gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: sartorius
    side: inside
    serves: [hip.rotation, hip.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 0 }
    contraction: { initiation: concentric, shaping: null, finish: null }
