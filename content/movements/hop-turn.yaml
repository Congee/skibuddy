    sources: [jiroumaru-2014]
  - muscle: adductors
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the feet at hip width in the air and on landing
    confidence: low
    basis: Modelled in carved turns
    sources: [heinrich-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the inside foot up in the air, rolls the ski to its new edge and holds the shin on the tongue on landing
    confidence: low
    basis: Modelled on the inside leg in carved turns; not measured in hops
    sources: [heinrich-2023]
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Shortens briefly as the inside ankle opens a little in the push, then brakes the landing
    confidence: low
    basis: Mechanics; not measured in hops
    sources: [{ source: patterson-2023, pages: 89 }]
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Rolls the inside ski onto its little-toe edge in the air and holds it on landing
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: inside
