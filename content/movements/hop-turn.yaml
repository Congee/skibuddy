id: hop-turn
name: Linked turns with a two-footed hop through each edge change
# Hop turns and leapers: both skis leave the snow at the transition, the edges change in the air, and the legs
# absorb the landing (psia-c-basic-parallel-leaper). In leapers the skis land on their new edges and carve
# away (psia-c-dynamic-leapers); in hop turns, the steep-terrain form, a strong pole plant supports the
# take-off and the skis are pivoted in the air before landing in an edge set (IASI p 171; biomechanics.md D11).
# One movement covers both: they share the same joint actions, and how far the skis pivot in the air is technique,
# not intensity. No study has measured either: nothing here is high confidence.
# Phases (biomechanics.md D11): initiation = take-off and flight; shaping = landing and the early arc; finish =
# the arc and the loading for the next take-off. The take-off and landing are two-footed; outside and inside
# are the legs of the turn being landed into.
#
# Stretch-shortening (biomechanics.md 0.3): the finish loads the legs (knee and hip extensors and the calf
# lengthen under load as the skier sinks onto the edges) and the take-off follows at once (concentric), so the
# stretched extensors recoil (LeMaster p 104 calls it a rubber-band effect). The landing is the eccentric half
# of the next cycle.
# No triple extension: the boot keeps the ankle flexed, so the push comes from the knees and hips, not from
# pointing the feet (patterson-2023 p 89; the IASI manual's "primarily from the ankle" on p 171 does not survive
# that constraint). The ankle still opens a few degrees as the shank comes back toward upright over the feet, so
# the calf works briefly concentric and the tongue pressure lightens; in the air tibialis anterior pulls the feet
# up. The knees never straighten in skiing (patterson-2023 p 89).
#
# Forces. Up-unweighting by a push, a float, then a landing of equal impulse: the time integral of the extra
# force is zero over each cycle (Lind & Sanders pp 118-120, Fig 5.4b, Technote 6). With the push and the landing
# each about 0.2-0.25 s and flights of about 0.15 s gentle, 0.25 s moderate and 0.35 s dynamic (our inference
# for drill hops), the push and the landing each run at roughly 1.4, 1.6 and 1.9 times body weight shared by
# both legs. They replace the turn's load at the switch, where it is near its trough; for comparison, the turn's
# own load from eq 4.9 (p 103) at the fall line and below it is:
#   gentle    6 m/s, R 8 m, 12°:   about 1.01, 1.08, 1.15
#   moderate  7 m/s, R 7 m, 18°:   about 1.03, 1.19, 1.33
#   dynamic   8 m/s, R 7 m, 25°:   about 1.04, 1.30, 1.53
# A pivoted hop turn lands in an edge set, which brakes like eq 4.7 (p 91). Knee speeds in a jump are about
# 300°/s against under 80°/s in turns (cross-raschner-2023 pp 17-18), so the drill trains a quality ordinary
# turns do not.
# Landing position matters more for knee load than landing force (cross-raschner-2023 p 4); landing back on the
# tails is the back-weighted ACL mechanism (jordan-sporri-taylor-2023 p 120).
#
# Equipment assumed: recreational carving skis of about 12-15 m sidecut; boots with about 15° cuff lean, about
# 0.9° binding ramp and about 42 mm stand height. A stiff boot shaft limits the ankle's part in the push and
# pushes the shin forward on a tail landing (jordan-sporri-taylor-2023 pp 120-121).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Opens a few degrees in the take-off as the knees and hips extend and the shank comes back toward upright over the feet, so the tongue pressure lightens; the boot keeps it flexed. In the air tibialis anterior pulls the feet up (also concentric) so the skis land level, not tail first
        moment: Plantarflexion during the push, mostly carried by the boot
        contraction: concentric
        cue: Jump from the knees and hips; shins stay forward
        confidence: low
        sources:
          - { source: patterson-2023, pages: 89 }
          - { source: lemaster-2010, pages: "94-96" }
          - heinrich-2022
      shaping:
        action: Closes further under the landing, shin driven into the tongue, the calf braking it
        moment: Plantarflexion, shared with the boot shaft
        contraction: eccentric
        cue: Land with the shins on the tongues
        confidence: low
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "81, 94-96" }
      finish:
        action: Closes again as the legs sink onto the edges to load the next take-off
        contraction: eccentric
        cue: Sink with the shins forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "94-96, 104" }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Opens a few degrees in the take-off with the outside ankle, the boot keeping it flexed; tibialis anterior pulls the feet up in the air
        moment: Plantarflexion during the push, mostly carried by the boot
        contraction: concentric
        cue: Both shins forward through the jump
        confidence: low
        sources:
          - { source: patterson-2023, pages: 89 }
          - { source: lemaster-2010, pages: "94-96" }
      shaping:
        action: Closes under the landing with the outside ankle
        contraction: eccentric
        cue: Land on both feet, shins forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "94-96" }
      finish:
        action: Closes as the legs sink to load the next take-off
        contraction: eccentric
        cue: Sink with both shins forward
        confidence: low
        sources: []
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Pushes off the old edges, then in the air rolls the light ski toward its new big-toe edge
        contraction: concentric
        cue: Change edges in the air
        confidence: low
        sources:
          - psia-c-basic-parallel-leaper
          - { source: iasi-2021, pages: 171 }
      shaping:
        action: Lands on the big-toe edge and holds it against the landing load, setting the edge in a hop turn or carving away in a leaper
        moment: Eversion
        contraction: isometric
        cue: Land on the new edges
        confidence: low
        sources:
          - psia-c-dynamic-leapers
          - { source: lind-sanders-2004, pages: "54-55" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Edge built into a platform for the next take-off, then released only as the skis leave the snow
        contraction: concentric
        cue: Build a platform to jump from
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "104, 201" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: In the air rolls the light inside ski toward its little-toe edge with the outside ski
        contraction: concentric
        cue: Both skis change edges together
        confidence: low
        sources:
          - psia-c-basic-parallel-leaper
      shaping:
        action: Lands on its little-toe edge, tilt held with the outside ski
        contraction: isometric
        cue: Land on both new edges
        confidence: low
        sources: []
      finish:
        action: Tilt held into the platform for the next take-off
        contraction: isometric
        cue: Both skis edged for the take-off
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation: { action: Arch held under the push, contraction: isometric, cue: Push through the whole foot, confidence: low, sources: [] }
      shaping: { action: Arch held under the landing load, contraction: isometric, cue: Land on the whole foot, confidence: low, sources: [{ source: lemaster-2010, pages: 139 }] }
      finish: { action: Arch held as the legs load, contraction: isometric, cue: Stand on heel and both balls of the foot, confidence: low, sources: [] }
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under the push, contraction: isometric, cue: Push through the whole foot, confidence: low, sources: [] }
      shaping: { action: Arch held under the landing load, contraction: isometric, cue: Land on the whole foot, confidence: low, sources: [] }
      finish: { action: Arch held as the legs load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Extends fast from the loaded bend to spring both skis off the snow, never to straight; in the air the knees fold a little to lift the skis clear
        moment: Extension during the push
        contraction: concentric
        cue: Spring up from bent knees, then tuck the skis up
        confidence: medium
        sources:
          - berg-1999
          - { source: patterson-2023, pages: 89 }
          - { source: lind-sanders-2004, pages: "118-120" }
          - psia-c-basic-parallel-leaper
      shaping:
        action: Flexes under the landing, absorbing it quickly and quietly, then steadies through the short arc
        moment: Extension, at its highest in the landing
        contraction: eccentric
        cue: Land soft and stay over the feet
        confidence: medium
        sources:
          - berg-1999
          - psia-c-basic-parallel-leaper
          - { source: lemaster-2010, pages: "94-96" }
      finish:
        action: Sinks onto the edges to load the next take-off; the stretched extensors rebound straight into it
        contraction: eccentric
        cue: Sink and spring, no pause at the bottom
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "104, 201" }
          - { source: iasi-2021, pages: 171 }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Extends fast with the outside knee in the two-footed take-off, then folds a little in the air
        moment: Extension during the push
        contraction: concentric
        cue: Both legs spring together
        confidence: low
        sources:
          - psia-c-basic-parallel-leaper
          - { source: lind-sanders-2004, pages: "118-120" }
      shaping:
        action: Absorbs the landing with the outside knee, ending a little more bent, the inside leg short
        moment: Extension, at its highest in the landing
        contraction: eccentric
        cue: Land on both feet, inside leg short
        confidence: low
        sources:
          - heinrich-2022
      finish:
        action: Sinks with the outside knee to load the next take-off
        contraction: eccentric
        cue: Sink on both legs
        confidence: low
        sources: []
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Turn the thighs not the knees in the air, confidence: low, sources: [{ source: lemaster-2010, pages: "107-108" }] }
      shaping: { neutral: true, moment: Resisting the twist of a landing on an edge, contraction: isometric, cue: Knees point where the skis point on landing, confidence: low, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Turn the thighs not the knees, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Turn the thighs not the knees in the air, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knees point where the skis point on landing, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Turn the thighs not the knees, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knees over the feet in the take-off, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the landing invites, contraction: isometric, cue: Knees over the feet on landing and not caving in, confidence: medium, sources: [zorko-2020, bere-2011] }
      finish: { neutral: true, contraction: isometric, cue: Knees over the feet, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knees over the feet in the take-off, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knees over the feet on landing, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knees over the feet, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Extends fast with the knee in the take-off, the trunk staying forward and quiet, then flexes a little to tuck the skis up in the air
        moment: Extension during the push
        contraction: concentric
        cue: Spring from the hips, chest stays forward
        confidence: low
        sources:
          - { source: patterson-2023, pages: 89 }
          - { source: lemaster-2010, pages: "94-96" }
      shaping:
        action: Folds under the landing, hips above the knees, then steadies through the short arc
        moment: Extension, at its highest in the landing
        contraction: eccentric
        cue: Fold at the hips to land, hips above the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 62 }
          - { source: cross-raschner-2023, pages: 4 }
      finish:
        action: Folds further as the legs sink to load the next take-off
        contraction: eccentric
        cue: Sink at the hips and knees together
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "94-96, 104" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Extends with the outside hip in the take-off, then flexes a little in the air
        moment: Extension during the push
        contraction: concentric
        cue: Both legs spring together
        confidence: low
        sources:
          - psia-c-basic-parallel-leaper
      shaping:
        action: Folds under the landing, a little more than the outside hip
        contraction: eccentric
        cue: Inside leg short on landing
        confidence: low
        sources:
          - heinrich-2022
      finish:
        action: Folds as the legs sink to load the next take-off
        contraction: eccentric
        cue: Sink on both legs
        confidence: low
        sources: []
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: Held near neutral through the take-off; the skis are tipped toward the new turn in the air
        contraction: isometric
        cue: Feet hip width apart in the air
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
      shaping:
        action: Lands with the legs tipped into the new turn; the landing drops the inside half of the pelvis a little and the outside abductors catch it, pelvis on femur, before it sags
        contraction: eccentric
        cue: Land with the inside hip up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
          - seifert-2023
      finish:
        action: Angulation held into the platform for the next take-off, then released into the air
        contraction: isometric
        cue: Hips in over the edges before you jump
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 128 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Held at hip width through the take-off and flight
        contraction: isometric
        cue: Feet hip width apart in the air
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
      shaping:
        action: Held, the inside thigh drawn toward the turn at hip width as the skis land
        moment: Adduction in a modelled carved turn
        contraction: isometric
        cue: Land with the feet hip width apart
        confidence: low
        sources:
          - heinrich-2022
      finish:
        action: Held at hip width
        contraction: isometric
        cue: Feet hip width apart
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: In the air the light skis are turned toward the new direction by the thighs rotating under a pelvis held facing down the hill by the pole plant; far in a pivoted hop turn, little in a leaper
        contraction: concentric
        cue: Turn the legs, not the shoulders, in the air
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "107-110, 119" }
          - { source: lind-sanders-2004, pages: "115-117" }
          - { source: iasi-2021, pages: 171 }
      shaping:
        action: Held turned in as the skis land and grip
        moment: Resisting the snow's twist at the landing
        contraction: isometric
        cue: Land with the skis already pointing the new way
        confidence: low
        sources:
          - heinrich-2023
      finish:
        action: Held, the skis across the hill under a pelvis still facing down it, winding up the next turn
        contraction: isometric
        cue: Skis across, belly button down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "109-110" }
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward in the air with the outside thigh so both skis pivot together
        contraction: concentric
        cue: Turn both legs together in the air
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "107-110" }
          - delp-1999
      shaping:
        action: Held turned out as the skis land
        contraction: isometric
        cue: Land with the skis parallel
        confidence: low
        sources: []
      finish:
        action: Held turned out under the pelvis
        contraction: isometric
        cue: Skis parallel and across
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Opens with the hips in the take-off but stays hinged forward; the trunk does not throw the jump, and the low back stays slightly flattened from standing, never arched
        contraction: concentric
        cue: Jump with the legs, not the back
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63, 94-96" }
      shaping:
        action: Tilts forward with the hip fold as the landing is absorbed, the trunk over the feet, never pitched back
        contraction: eccentric
        cue: Chest forward on landing
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 4 }
          - { source: jordan-sporri-taylor-2023, pages: "120-121" }
      finish:
        action: Hinge deepens as the legs sink for the next take-off
        contraction: eccentric
        cue: Fold at the hips to load
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: Levels through the take-off as the legs come upright under it
        contraction: concentric
        cue: Level hips in the air
        confidence: low
        sources: []
      shaping:
        action: The inside half drops a little under the landing and is caught by the outside hip abductors
        contraction: eccentric
        cue: Don't let the inside hip drop on landing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      finish:
        action: Held up into the platform for the next take-off
        contraction: isometric
        cue: Inside hip up
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Held facing down the hill in the air while the legs turn under it; the pole plant blocks the upper body from turning with them
        moment: Resisting the reaction torque of the legs turning in the air
        contraction: isometric
        cue: Plant and keep facing down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "110, 112-116, 119" }
          - { source: lind-sanders-2004, pages: "116-117" }
      shaping:
        action: Faces down the hill as the skis land across it, so counter is large on landing
        contraction: isometric
        cue: Upper body quiet as you land
        confidence: low
        sources:
          - { source: iasi-2021, pages: 64 }
          - hintermeister-1997
      finish:
        action: Held facing down the hill, the legs wound up under it for the next hop
        contraction: isometric
        cue: Stay facing down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "109-110" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched to help the jump
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing through the landing, never slumped under it
        moment: Extension, against the forward fold the landing drives
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
          - { source: cross-raschner-2023, pages: 12 }
      finish:
        action: Held slightly flattened from standing as the legs sink
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources: []
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Straightens through the take-off
        contraction: concentric
        cue: Shoulders level in the air
        confidence: low
        sources: []
      shaping:
        action: Bends toward the outside ski as the landing loads the new edges; the inside quadratus lumborum and obliques control it
        contraction: eccentric
        cue: Upper body over the outside ski on landing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      finish:
        action: Bend held into the platform
        contraction: isometric
        cue: Shoulders level with the slope
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: The legs turn in the hips not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: The legs turn in the hips not the low back, confidence: low, sources: [fujii-2007] }
      finish: { neutral: true, contraction: isometric, cue: The legs turn in the hips not the low back, confidence: low, sources: [] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation: { action: Chest forward and quiet through the take-off, contraction: isometric, cue: Chest over the knees in the air, confidence: low, sources: [{ source: lemaster-2010, pages: 94 }] }
      shaping: { action: Chest forward and held through the landing, contraction: isometric, cue: Don't sit up as you land, confidence: low, sources: [{ source: cross-raschner-2023, pages: 4 }] }
      finish: { action: Chest forward and held, contraction: isometric, cue: Chest over the knees, confidence: low, sources: [] }
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Straightens through the take-off
        contraction: concentric
        cue: Shoulders level in the air
        confidence: low
        sources: []
      shaping:
        action: Tips toward the outside ski on landing a little more than the pelvis; the inside obliques control it
        contraction: eccentric
        cue: Outside shoulder over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 70 }
      finish:
        action: Held into the platform
        contraction: isometric
        cue: Shoulders level with the slope
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Chest held facing down the hill against the legs' turning in the air
        contraction: isometric
        cue: Chest down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-119" }
      shaping:
        action: Held facing down the hill through the landing
        contraction: isometric
        cue: Chest down the hill
        confidence: low
        sources:
          - hintermeister-1997
      finish:
        action: Held facing down the hill
        contraction: isometric
        cue: Chest down the hill
        confidence: low
        sources: []
  - dof: shoulder-girdle.protraction
    side: both
    cells:
      initiation: { action: Shoulder blades forward and level as the planting arm braces, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
      finish: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
  - dof: shoulder.flexion
    side: outside
    cells:
      initiation:
        action: Arm held forward through the jump, hand in view
        contraction: isometric
        cue: Outside hand forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "142-143" }
      shaping:
