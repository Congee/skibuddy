      initiation: { action: Hands held a little wide through the jump, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [{ source: lind-sanders-2004, pages: "127-128" }] }
      shaping: { action: Hands held wide for balance on landing, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [] }
      finish: { action: Hands held wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [] }
  - dof: elbow.flexion
    side: outside
    cells:
      initiation: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [{ source: lemaster-2010, pages: 142 }] }
      shaping: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
      finish: { action: Opens a little as the arm reaches the pole down the hill, contraction: concentric, cue: Reach the pole forward, confidence: low, sources: [] }
  - dof: elbow.flexion
    side: inside
