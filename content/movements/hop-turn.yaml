    sources: []
  - muscle: neck-stabilisers
    side: both
    serves: [neck.flexion, neck.side-bend, neck.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the head level and the eyes down the hill through the jump and landing
    confidence: low
