structures:
  - structure: acl
    side: both
    phases: [shaping]
    mechanism: Loaded by a landing back on the tails with the knees forced into deep flexion, the boot's rear cuff and a hard quadriceps contraction pushing the shins forward; landing position matters more than landing force
    protected_by: [biceps-femoris, medial-hamstrings, tibialis-anterior, gluteus-maximus]
    confidence: medium
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "119-121" }
      - { source: cross-raschner-2023, pages: 4 }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: outside
    phases: [shaping]
    mechanism: Loaded if the skis land with the knees caving in and turning inward, or land on one ski with the edge catching
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius, deep-hip-rotators]
    confidence: low
    sources:
      - { source: jordan-sporri-taylor-2023, pages: "120-123" }
  - structure: patellar-tendon
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Pulled hard and fast by the quadriceps in every take-off and landing
    protected_by: [vasti]
    confidence: low
    sources: []
  - structure: lumbar-discs
    side: both
    phases: [shaping]
    mechanism: Compressed by each landing, more if the trunk folds or twists as it absorbs it
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: low
    sources:
