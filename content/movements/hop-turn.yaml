      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Pairs with the outside internal oblique to hold the upper body facing down the hill
    confidence: medium
    basis: Measured in turns; the pairing is anatomy
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: quadratus-lumborum
    side: inside
