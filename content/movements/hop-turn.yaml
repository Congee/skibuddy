    confidence: low
    basis: Linked to back complaints in racers; not measured in turns
    sources:
      - { source: jordan-sporri-taylor-2023, pages: 116 }
  - muscle: internal-oblique
    side: outside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the pelvis and chest facing down the hill while the legs turn under them in the air, paired with the inside external oblique
    confidence: medium
    basis: Obliques measured and modelled in turns; the airborne pivot's reaction torque is mechanics (L&S pp 116-117)
    sources: [hintermeister-1997, heinrich-2023, { source: lind-sanders-2004, pages: "116-117" }]
  - muscle: external-oblique
    side: inside
