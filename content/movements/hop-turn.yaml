      initiation: { action: Straightens against the plant as the arm pushes down on the pole, contraction: concentric, cue: Push off the pole, confidence: low, sources: [{ source: lemaster-2010, pages: "154-156" }] }
      shaping: { action: Bends back to about 75° as the hand comes forward, contraction: concentric, cue: Hand back in view, confidence: low, sources: [] }
      finish: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
  - dof: wrist.grip
