    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the inside sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  # Pelvis and trunk: quiet through the jump, braced for the landing, and held facing down the hill.
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the hinged trunk through the take-off and landing so the legs, not the back, do the jumping and the landing does not fold the spine
    confidence: medium
    basis: Trunk muscles measured in turns (hintermeister-1997); D11's trunk is stable through take-off and landing; weak trunk muscles predicted ACL injury in racers (jordan-sporri-taylor-2023 p 124)
    sources:
      - hintermeister-1997
      - zeglinski-1998
      - { source: jordan-sporri-taylor-2023, pages: 124 }
  - muscle: rectus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Balances the back extensors and stops the low back arching at take-off or landing
    confidence: low
    basis: Measured at low levels in turns; the landing role is mechanics
    sources: [hintermeister-1997]
  - muscle: transversus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the trunk for the landing without bracing it rigid
    confidence: low
    basis: Anatomy; not measured on snow
