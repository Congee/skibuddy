activations:
  # Stance leg: lands, loads and pushes sideways. Stretch then shortening, like a lateral bound.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: concentric }
    role: Absorb the step onto the new ski, load the bend, then extend the knee in the push
    confidence: medium
    basis: Uphill V-steps, a related task, drove thigh activity as high as short and medium turns (hermann-2023). The push leg carries about 1.2-1.5 W at the settings by our inference; per-setting values are inference
    sources:
      - hermann-2023
      - { source: lind-sanders-2004, pages: 153 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: eccentric, finish: concentric }
    role: Works with the vasti in the push
    confidence: low
    basis: Thigh activity measured as a group in V-steps; its share here is inference
    sources: [hermann-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: concentric }
    role: Controls the fold onto the new ski, then drives the hip open in the push and holds the leg turned out
    confidence: medium
    basis: Gluteus maximus and medius reached about 59-64 % MVIC in single-leg squat and deadlift off snow (distefano-2009), the nearest measured analogue of the loaded push leg; per-setting values are inference
    sources: [distefano-2009, hermann-2023]
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: concentric }
    role: Holds the free side of the pelvis up over the stance hip, then drives the sideways push
    confidence: medium
    basis: Single-leg exercise EMG off snow (distefano-2009); the hip hitch ranks top for gluteus medius and minimus (moore-2020). The push abduction is mechanics
    sources: [distefano-2009, moore-2020]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity:
      initiation: 1
      shaping: 2
      finish: 2
    contraction: { initiation: isometric, shaping: isometric, finish: concentric }
    role: Shares the pelvic hold and the push with gluteus medius
    confidence: low
    basis: Off-snow EMG puts it with gluteus medius; never measured on snow
    sources: [moore-2020, ganderton-2017]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: concentric }
    role: Helps hold the pelvis and push the leg out
    confidence: low
    basis: Exercise EMG off snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
