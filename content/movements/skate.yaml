structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the push is made with the knee caving in and turning inward, or off a flat ski that slides out and catches its edge
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius, deep-hip-rotators]
    confidence: low
    sources:
      - { source: jordan-sporri-taylor-2023, pages: "120-123" }
  - structure: mcl
    side: outside
    phases: [shaping, finish]
    mechanism: Our inference; the sideways push on an edged ski invites the knee to cave in, which opens its inner side
    protected_by: [medial-hamstrings, gracilis, sartorius]
    confidence: low
    sources: []

