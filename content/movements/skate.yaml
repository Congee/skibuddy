        confidence: medium
        sources:
          - moore-2020
          - distefano-2009
      shaping:
        action: Held level over the stance hip
        contraction: isometric
        cue: Hips level
        confidence: low
        sources: []
      finish:
        action: Moves across with the push toward the next ski, the free side lowering as that foot is set down
        contraction: eccentric
        cue: Move the hips over the new ski
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Faces the line of travel while the gliding ski points out to the side
        contraction: isometric
        cue: Belly button down the hill
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 152 }
      shaping:
        action: Held facing the line of travel
        contraction: isometric
        cue: Belly button down the hill
        confidence: low
        sources: []
      finish:
        action: Held facing the line of travel against the push's twist
        contraction: isometric
        cue: Push with the leg, not by twisting
        confidence: low
        sources: []
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation: { action: Low back slightly flattened from standing and held, contraction: isometric, cue: Low back slightly flattened and never arched or slumped, confidence: low, sources: [{ source: lemaster-2010, pages: "62-63" }] }
      shaping: { action: Low back slightly flattened from standing and held, moment: Extension against the forward fold, contraction: isometric, cue: Low back slightly flattened and never arched or slumped, confidence: low, sources: [] }
      finish: { action: Low back slightly flattened from standing and held through the push, contraction: isometric, cue: Low back slightly flattened and never arched or slumped, confidence: low, sources: [] }
  - dof: lumbar.side-bend
    side: trunk
