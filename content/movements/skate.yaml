      shaping: { neutral: true, contraction: isometric, cue: Keep the shoulders quiet, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Keep the shoulders quiet, confidence: low, sources: [] }
  - dof: lumbar.rotation
    side: trunk
