id: skate
name: Skating down the hill, stepping from ski to diverging ski
# Forward momentum made by stepping from ski to ski with the tips apart. Each ski lands on its little-toe edge,
# glides as it rolls flat, then tips onto its big-toe edge as a platform to push from; the free foot comes back
# beside the stance foot and is set down diverging (psia-c-skating-down-the-hill; biomechanics.md D15).
# No study has measured this drill. The nearest data: uphill V-steps produced thigh activity like short and
# medium turns and above the plough (hermann-2023). Nothing here is high confidence.
# Phases (biomechanics.md D15), one step: initiation = the glide on the new ski, little-toe edge rolling flat;
# shaping = tipping to the big-toe edge and loading it; finish = the push-off. Outside means the stance (gliding,
# then pushing) leg; inside means the free leg, recovering after its own push. There is no round turn.
#
# Forces (our inference, Newton's second law in the slope plane as Lind & Sanders use it, pp 78-86). The push
# runs at about 10-20° to the line of travel (L&S p 153); take 12°. Each step reverses the body's sideways speed,
# u = v sin 12°, within the push, taken as about 40 % of the step. The push leg then carries the slope's normal
# share of weight plus that sideways force:
#   gentle    5 m/s, 6°,  1.2 steps/s:  sideways about 0.6 W, push leg about 1.2 W
#   moderate  6 m/s, 8°,  1.4 steps/s:  sideways about 0.9 W, push leg about 1.3 W
#   dynamic   7 m/s, 10°, 1.6 steps/s:  sideways about 1.2 W, push leg about 1.5 W
# Through the glide the stance leg carries about the slope's normal share, just under body weight. Speeds, slopes
# and step rates are our inference for a drill on easy terrain.
# No triple extension: in a ski boot the ankle stays flexed, so the push comes from the hip and knee, sideways
# (patterson-2023 p 89). The push leg's abductors and extensors drive it, as in a lateral bound
# (pritchard-cross-2023 p 79 programmes ice-skater hops).
#
# Ankle: the shins stay on the tongues of both boots throughout; the stance ankle closes as the body moves over
# the new ski and opens only a little in the push (LeMaster pp 79-81).
# Spine: hinged forward at the hips about 30° (biomechanics.md 2.0), low back slightly flattened from standing,
# never arched or slumped; the hips move over each ski, not the shoulders, so the upper body does not swing side
# to side (D15's error list).
# Equipment assumed: recreational carving skis; boots with about 15° cuff lean, about 0.9° binding ramp and
# about 42 mm stand height. A stiff boot leaves the push to the knee and hip.
# Book citations give printed page numbers.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Closes as the body moves forward and across onto the new ski, shin to the tongue
        contraction: concentric
        cue: Move the shin forward onto the new ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "79-81" }
          - psia-c-skating-down-the-hill
      shaping:
        action: Held flexed and closing a little more as the leg loads for the push
        moment: Plantarflexion, shared with the boot shaft
        contraction: eccentric
        cue: Keep the shin on the tongue as you load
        confidence: low
        sources:
          - heinrich-2022
      finish:
        action: Opens a little in the push, still flexed in the boot; the push comes from the knee and hip
        contraction: concentric
        cue: Push through the whole foot, not onto the toes
        confidence: low
        sources:
          - { source: patterson-2023, pages: 89 }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Foot pulled up as the free leg leaves the snow after its push and swings forward
        contraction: concentric
        cue: Pull the free foot up as it comes forward
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      shaping:
        action: Held flexed, the shin on the tongue, while the free foot is carried beside the stance foot
        contraction: isometric
        cue: Free shin forward too
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 81 }
          - { source: patterson-2023, pages: 89 }
      finish:
        action: Held flexed as the free foot reaches out to be set down
        contraction: isometric
        cue: Set the new ski down with the shin forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 81 }
          - { source: patterson-2023, pages: 89 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: The new ski lands on its little-toe edge and rolls toward flat as the body glides over it
        contraction: eccentric
        cue: Land on the little-toe edge and roll it flat
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      shaping:
        action: Rolls onto the big-toe edge to make a platform to push from
        moment: Eversion
        contraction: concentric
        cue: Tip onto the big-toe edge before you push
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
          - { source: lind-sanders-2004, pages: "54-55" }
      finish:
        action: Big-toe edge held for the push so the ski grips instead of sliding out
        moment: Eversion
        contraction: isometric
        cue: Push off the edge, not a flat ski
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: "117-118" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet free foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet free foot, confidence: low, sources: [] }
      finish:
        action: Tipped slightly toward its little-toe edge so the ski lands on it
        contraction: concentric
        cue: Set the new ski down on its little-toe edge
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
  - dof: foot.arch
    side: outside
    cells:
      initiation: { action: Arch held as the foot takes the body's weight, contraction: isometric, cue: Stand on heel and both balls of the foot, confidence: low, sources: [{ source: lemaster-2010, pages: "139, 161-162" }] }
      shaping: { action: Arch held as the edge loads, contraction: isometric, cue: Keep the arch from collapsing, confidence: low, sources: [{ source: lemaster-2010, pages: "139, 161-162" }] }
      finish: { action: Arch held under the push, contraction: isometric, cue: Push through the whole foot, confidence: low, sources: [{ source: lemaster-2010, pages: "139, 161-162" }] }
  - dof: foot.arch
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet free foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet free foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: A quiet free foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Flexes as the new ski takes the body's weight, absorbing the step
        contraction: eccentric
        cue: Land soft on the new ski
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      shaping:
        action: Flexes further as the edge loads, setting up the push
        moment: Extension
        contraction: eccentric
        cue: Sink onto the ski before you push
        confidence: medium
        sources:
          - hermann-2023
      finish:
        action: Extends to push the body sideways and forward onto the next ski, never to straight
        contraction: concentric
        cue: Push the ski away from you
        confidence: medium
        sources:
          - hermann-2023
          - { source: patterson-2023, pages: 89 }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Bends as the free leg leaves the snow after its push and swings forward
        contraction: concentric
        cue: Fold the free leg as it comes in
        confidence: low
        sources: []
      shaping:
        action: Held bent while the free foot travels beside the stance foot
        contraction: isometric
        cue: Free foot beside the stance foot
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      finish:
        action: Extends a little to reach the new ski out to the side
        contraction: concentric
        cue: Reach the new ski out, tip first
        confidence: low
        sources: []
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, moment: Resisting the twist of the push, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Free knee points where its ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Free knee points where its ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Free knee points where its ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse an edged load invites, contraction: isometric, cue: Knee over the foot and not caving in, confidence: low, sources: [zorko-2020] }
      finish: { neutral: true, moment: Resisting valgus in the push, contraction: isometric, cue: Knee over the foot as you push, confidence: low, sources: [zorko-2020] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Free knee in line with its foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Free knee in line with its foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Free knee in line with its foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Flexes as the body settles onto the new ski, chest forward over it
        contraction: eccentric
        cue: Fold at the hips over the new ski
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      shaping:
        action: Folds a little further as the leg loads for the push
        moment: Extension
        contraction: eccentric
        cue: Sink at the hips and knee together
        confidence: low
        sources:
          - hermann-2023
      finish:
        action: Extends with the knee in the push, the trunk staying forward
        contraction: concentric
        cue: Push from the hip
        confidence: low
        sources:
          - { source: patterson-2023, pages: 89 }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: The free thigh swings forward after its push
        contraction: concentric
        cue: Bring the free knee forward
        confidence: low
        sources:
          - andersson-1997
      shaping:
        action: Held flexed with the free foot beside the stance foot
        contraction: isometric
        cue: Free foot beside the stance foot
        confidence: low
        sources: []
      finish:
        action: Lowers to set the new ski on the snow
        contraction: eccentric
        cue: Set the ski down, don't drop it
        confidence: low
        sources: []
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: Abducted with the diverging ski; the pelvis held level over the stance hip as the free leg leaves the snow, pelvis on femur
        contraction: isometric
        cue: Hips level over the new ski
        confidence: medium
        sources:
          - distefano-2009
          - moore-2020
      shaping:
        action: Held as the edge loads; the abductors carry the pelvis while the adductors brace the leg against the sideways load
        moment: Abduction, the free side unsupported
        contraction: isometric
        cue: Stay balanced over the stance hip
        confidence: low
        sources:
          - moore-2020
      finish:
        action: Abducts as the leg pushes the body sideways, away from the ski
        contraction: concentric
        cue: Push the ski out to the side
        confidence: medium
        sources:
          - distefano-2009
          - { source: pritchard-cross-2023, pages: 79 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The free leg comes in toward the stance foot after its push
        contraction: concentric
        cue: Bring the free foot back under you
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
      shaping:
        action: Held beside the stance leg
        contraction: isometric
        cue: Free foot beside the stance foot
        confidence: low
        sources: []
      finish:
        action: Swings out to set the new ski down wide of the stance ski
        contraction: concentric
        cue: Step the new ski out to the side
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Held turned out so the gliding ski points away from the line of travel, tip diverging
        contraction: isometric
        cue: Tips apart, tails together
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
          - { source: lind-sanders-2004, pages: 153 }
      shaping:
        action: Held turned out as the ski loads
        contraction: isometric
        cue: Keep the tip diverging
        confidence: low
        sources: []
      finish:
        action: Held turned out through the push
        contraction: isometric
        cue: Push along the edge, not off the tail
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns back toward neutral as the free leg comes in under the body
        contraction: concentric
        cue: Bring the free ski back parallel
        confidence: low
        sources: []
      shaping:
        action: Held near neutral beside the stance leg
        contraction: isometric
        cue: Free ski parallel to the line of travel
        confidence: low
        sources: []
      finish:
        action: Turns out so the new ski is set down with its tip diverging
        contraction: concentric
        cue: Set the new tip out at an angle
        confidence: low
        sources:
          - psia-c-skating-down-the-hill
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Hinged forward at the hips about 30° as the body moves onto the new ski; low back slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Chest forward over the gliding ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Hinge held as the leg loads
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened
        confidence: low
        sources: []
      finish:
        action: Opens a little with the push, the trunk staying forward
        contraction: concentric
        cue: Push forward, not up
        confidence: low
        sources: []
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The free side is held up as the free leg leaves the snow, by the stance hip's abductors
        contraction: isometric
