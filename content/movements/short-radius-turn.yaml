structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the skier is behind the feet at the edge set and the outside ski catches its inner edge while the knee straightens and turns in, the slip-catch seen in racing injuries; a hard set from the back seat adds the boot's push on the shin
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: patellar-tendon
    side: outside
    phases: [finish]
    mechanism: Pulled hard by the quadriceps braking the edge set at a deep knee bend, many times a run
    protected_by: [vasti]
    confidence: low
    sources: []
  - structure: lumbar-discs
    side: both
    phases: [shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under load; the legs' turning torque passes up through a trunk held facing down the hill
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

