activations:
  # Outside leg. Load-bearing efforts follow the load and the edge set; balance efforts change little.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthens the knee into the turn, holds it through the short peak and brakes it through the edge set
    confidence: high
    basis: Vastus medialis and lateralis averaged above 50 % MVC, with peaks above 150 %, in short-radius parallel turns (hintermeister-1997, abstract only; 1997 straight skis); the electrodes were on one leg through both turns, so the outside-leg share is higher still. Even gentle initiation, about 0.6 W on one bent leg (as much as a 1.2 W two-leg squat), sits above light effort. That is the dynamic setting; gentle and moderate are scaled down by our inference from the load (about 0.7-1.1 W on this leg at the finish). The finish carries the edge set's brief spike
    sources:
      - hintermeister-1997
      - hermann-2023
      - alhammoud-2020
      - { source: cross-raschner-2023, pages: "13-14" }
      - { source: lind-sanders-2004, pages: "91, 103" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the loaded leg
    confidence: medium
    basis: Rectus femoris averaged above 50 % MVC in short-radius turns, recorded on one leg through both turns; in instructors' slalom it peaked at the start of the cycle in the inside position (panizzolo-2013), so its outside-leg share is set below the vasti
    sources: [hintermeister-1997, panizzolo-2013, kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip against the load and brakes the fold through the edge set; brakes the thigh's inward turn when the skis carve
    confidence: high
    basis: Averaged above 50 % MVC in short-radius parallel turns (hintermeister-1997, abstract only; 1997 straight skis; one leg through both turns). Lower settings scaled down by inference from the load
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - { source: lemaster-2010, pages: "45, 54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Keeps the inside half of the pelvis up as the legs tip, and with its front fibres turns the bent thigh inward to steer
    confidence: medium
    basis: Measured on both legs on snow in normal turns. The inside ski shares some of the pelvic hold, so it stays below stork-turn levels; the steering role at a flexed hip is moment-arm anatomy
    sources:
      - seifert-2023
      - louie-1984
      - delp-1999
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, hip.rotation, pelvis.list]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Turns the bent thigh inward with gluteus medius's front fibres and steadies the head of the femur
    confidence: low
    basis: Never measured on snow; its internal-rotation moment arm grows with hip flexion (delp-1999) and off-snow EMG puts it with gluteus medius
    sources: [delp-1999, moore-2020, uebayashi-2026]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps turn the thigh inward and hold the pelvis
    confidence: low
    basis: Inferred from moment arms and exercise data; not measured on snow
    sources: [delp-1999, selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: isometric }
    role: Turn the bent thigh inward to steer and edge, the strongest rotators of a flexed leg, and stiffen the hip against the abductors
    confidence: medium
    basis: The adductors averaged above 50 % MVC in short-radius turns, recorded as a group on one leg through both turns; that they drive the steering is mechanics of the bent leg. In short turns LeMaster has the leg's rotation blend into knee angulation as the early edge. Lower settings by inference
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "53, 108, 124-125, 128" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured apart from the adductor group
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and protect the ACL, more than in any other turn type, and shares the hip extension moment
    confidence: high
    basis: Averaged above 50 % MVC in short-radius parallel turns (hintermeister-1997, abstract only; 1997 straight skis; one leg through both turns); short turns had the lowest quadriceps-to-hamstrings ratio of the recreational tasks. Lower settings by inference
    sources: [hintermeister-1997, hermann-2023, heinrich-2023]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in, most at the edge set
    confidence: medium
    basis: Medial hamstrings averaged above 50 % MVC in short-radius turns (one leg through both turns); semitendinosus 6-15 % MVC in a simulated edged stance. Set a step below biceps femoris
    sources: [hintermeister-1997, zorko-2020, hermann-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: eccentric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn when the skis carve
    confidence: low
    basis: The hip rotation moment's sign depends on whether the skis carve or are brushed; extrapolated from a model of a carved GS turn. With the hip flexed their external-rotation moment arms shrink
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the feet back at every edge change, many times a minute, then co-contracts to keep the shin on the tongue and the ankle closed through the edge set
    confidence: high
    basis: Averaged above 50 % MVC in short-radius parallel turns (hintermeister-1997, abstract only; 1997 straight skis; one leg through both turns), and highly activated in racing turns for fore-aft and edge control (cross-raschner-2023 p 14). The quick rhythm repeats the pull every second or so; the shaping moment is plantarflexion, so its later work is co-contraction. LeMaster pairs the early ankle bend with the knee turning in as early edging. Lower settings by inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "53, 79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Yields as the shin presses into the tongue, then holds the ankle against the rising load and through the edge set with the boot shaft
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus, not the gastrocnemius, does the ankle work. Pressure ahead of the ankle makes the net ankle moment plantarflexor (our reading of Lind and Sanders). Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
      - { source: lind-sanders-2004, pages: "54, 69-70" }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the closed ankle against the boot under load and through the edge set; slack with the knee bent
    confidence: low
    basis: Inferred from the plantarflexor ankle moment of a modelled carved turn, where the medial head averaged above 50 % MVC in GS. Short turns bend the knee deeper, so less of its pull reaches the ankle; the dynamic edge set is our inference
    sources:
      - heinrich-2022
      - hintermeister-1997
      - { source: lind-sanders-2004, pages: "54, 69-70" }
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity:
      initiation: 2
      shaping: 2
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot quickly onto the new big-toe edge, build it into late shaping, then let it go
    confidence: medium
    basis: Peroneus longus is highly active in turns, attributed to edge control; the boot shell carries most of the edging moment. Tipping is quick foot and lower-leg work that the upper body is too slow to lead, and the quick edge changes repeat it every turn
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "53, 127" }
      - { source: lind-sanders-2004, pages: "54-55, 95, 139" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the foot rolls onto the big-toe edge, holds the arch up against the peroneals through the set, then helps roll the foot flat at the release
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; the medial arch takes the lateral load. Not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: "95, 139" }
      - { source: lemaster-2010, pages: 139 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the loaded hip, a minor role
    confidence: low
    basis: Inference; never measured on snow. The loaded hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. Loaded, more bent, and turning outward: in short turns its share is large (bon-2021).
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Let the inside knee fold under its own load, hold it bent, and take the extra load the inside foot carries at the edge set
    confidence: medium
    basis: Inside vastus lateralis ran about 54 % below the outside leg in recreational turns, so it sits a step lower; inside load rises at the end of a short turn (bon-2021). Slalom is more symmetric between legs than other events (cross-raschner-2023 p 12)
    sources:
      - kroll-2010
      - bon-2021
      - heinrich-2023
      - { source: cross-raschner-2023, pages: "12, 14" }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Switches between knee extensor and hip flexor on the inside leg, helping it stay short
    confidence: medium
    basis: Measured on the inside leg in normal turns, where it matched the outside leg while the inside vasti dropped
    sources: [kroll-2010, panizzolo-2013, cuniberti-2026]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Holds the more-flexed inside hip against its load and helps turn the thigh outward
    confidence: low
    basis: The inside hip carries an extension moment similar to the outside one in a modelled turn, at a deeper fold; scaled with the inside load by inference
    sources: [heinrich-2022, delp-1999]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts to steady the bent inside knee
    confidence: medium
    basis: Inside-leg hamstring activity measured in turns
    sources: [chollet-2025, hermann-2023]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contract to steady the bent inside knee
    confidence: medium
    basis: Inside-leg hamstring activity measured in turns
    sources: [chollet-2025]
  - muscle: adductors
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the inside thigh drawn toward the turn at hip width
    confidence: medium
    basis: Adductor longus ranked among the most active inside-leg muscles in an EMG-validated model of a carved turn
    sources: [heinrich-2023, heinrich-2022]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: isometric }
    role: Turn the inside thigh outward so the inside ski steers with the outside one
    confidence: low
    basis: Anatomy; never measured on snow. With the hip deeply flexed their moment arms shrink, so gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: sartorius
    side: inside
    serves: [hip.rotation, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: isometric }
    role: Helps flex and turn the inside thigh outward
    confidence: low
    basis: Anatomy and hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps the inside knee tip toward the turn and steadies the inside hip
    confidence: medium
    basis: Inside gluteus medius was active on snow through steering and the transition
    sources: [seifert-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the inside foot back, tips the inside ski first, and keeps the shin on the tongue, rising after the fall line
    confidence: medium
    basis: The second most active inside-leg muscle in an EMG-validated model of a carved turn, rising after the fall line; highly activated in racing turns (cross-raschner-2023 p 14); scaled by inference
    sources:
      - heinrich-2023
      - hintermeister-1997
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: toe-extensors
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the inside foot up with tibialis anterior
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Rolls the inside ski onto its little-toe edge and lets it go
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: "95, 139" }
  - muscle: peroneals
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Control the inside foot's roll onto its little-toe edge, then roll it flat toward its new big-toe edge at the release
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; the inside foot becomes the next outside foot within a second. Not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: "95, 139" }
      - { source: lemaster-2010, pages: 127 }
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
