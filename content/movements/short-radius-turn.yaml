    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the pelvis and chest facing down the hill against the legs' turning, paired with the inside external oblique
    confidence: medium
    basis: Internal oblique was a primary trunk muscle in a model of carving; external oblique was measured in turns, lower in slalom than in GS. The counter is larger here than in long turns, so the hold works every turn
    sources: [heinrich-2023, hintermeister-1995, hintermeister-1997]
