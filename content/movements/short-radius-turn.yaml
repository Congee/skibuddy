id: short-radius-turn
name: Short-radius turns, legs turning under a pelvis that faces down the hill
# Measured in this movement: short-radius parallel turns put vastus medialis and lateralis, biceps femoris,
# gluteus maximus and the adductors above 50 % MVC on average with peaks above 150 %, and tibialis anterior,
# the medial hamstrings and rectus femoris above 50 % (hintermeister-1997, abstract; right-leg electrodes only,
# so each average spans outside and inside turns). Short turns had the lowest quadriceps-to-hamstrings ratio of
# the recreational tasks, the most hamstring co-contraction (hermann-2023). Everything else is inference from
# normal turns and mechanics.
# Phases: initiation = release, edge change and engagement up to the fall line (LeMaster's initiation, IASI's
# initiation, P&T's initiation after the turn switch); shaping = around the fall line (LeMaster's control, IASI's
# fall line, P&T's steering); finish = completion, here a quick edge set that brakes and rebounds into the
# next turn. The transition is the instant between finish and the next initiation.
#
# Intensity (the drill's scenarios). Lind & Sanders eq 4.9 (p 103), total snow force over body weight at the top,
# the fall line and below it (heading 135°):
#   gentle    6 m/s, R 6 m, 12°:   about 1.06, 1.15, 1.24
#   moderate  7 m/s, R 6 m, 15°:   about 1.12, 1.28, 1.40
#   dynamic   9 m/s, R 7 m, 20°:   about 1.26, 1.51, 1.70
# Eq 4.9 assumes a steady round arc. A short turn also brakes: a skidded finish is an edge set, eq 4.7 (p 91),
# which on these numbers adds a short spike of about 1.4-1.5 W (L&S notes on a short-turn edge set; our
# inference for drill speeds). Speeds and radii are our inference, well under slalom levels (2-3 W averages,
# cross-raschner-2023 p 10).
# Both skis carry load. In slalom the outside leg carries about 1.3 times the inside (cross-raschner-2023 p 11),
# and instructors' inside foot carried 0.9-1.0 BW at the end of a short turn (bon-2021), so the outside leg takes
# about 55-65 % here: roughly 0.7-0.8 W gentle, 0.8-0.9 W moderate and 0.9-1.1 W dynamic at the finish.
#
# Flexion pattern (LeMaster pp 40-42, 90; bacharach-cross-2023 p 27; IASI pp 65-66): flexed most in the
# transition, extending a little through initiation, quasi-isometric through a short shaping window (the knee
# holds steady for only about 17 % of a slalom turn, the hip 11-34 % in technical events: alhammoud-2020,
# cross-raschner-2023 pp 12-13), then absorbing through the finish's edge set. The rhythm is faster than in long
# turns, so the same joints work through more cycles per minute; that, not a deeper bend, is what tires the legs.
# Counter: the pelvis and chest face down the fall line while the legs turn under them, so counter to the skis
# grows through shaping to the most at the finish (about 30-40°) and unwinds as the edges release
# (biomechanics.md 2.0; LeMaster pp 74, 109-110, 128). It comes from the femurs turning in the hips, not the
# spine (fujii-2007; sacrum-to-sternum torsion about 5° in slalom, sporri-2016).
# Edging: early and progressive, but compressed: the new edges engage right after the release and the edge
# angle builds through late shaping into the edge set, then releases right after the set (reid-2020;
# LeMaster p 128).
#
# Equipment assumed: recreational carving skis of about 12-15 m sidecut; boots with about 15° cuff lean, about
# 0.9° binding ramp and about 42 mm stand height (as stork turns). A shorter sidecut makes a carved short turn
# possible at lower speed; more lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the feet are drawn back under the body after the release, so the shin meets the tongue and the new tips bite
        contraction: concentric
        cue: Pull the feet back as the edges change
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 85-86" }
          - { source: iasi-2021, pages: 33 }
          - psia-c-performance-short-turns
      shaping:
        action: Held flexed against the rising load, shin on the tongue, a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue
        confidence: medium
        sources:
          - heinrich-2022
          - hintermeister-1997
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Held closed through the edge set, shin on the tongue and pressure mid-foot; opens only slightly after the set as the legs release
        contraction: isometric
        cue: Stay over the feet as you set the edges
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "81, 85" }
          - { source: iasi-2021, pages: "33, 66" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Dorsiflexes with the outside ankle as the feet are drawn back; the inside shin meets its tongue too
        contraction: concentric
        cue: Both shins forward, not just the outside one
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
          - heinrich-2023
      shaping:
        action: Held flexed, shin on the tongue; the inside dorsiflexors work harder after the fall line
        contraction: isometric
        cue: Keep the inside shin on the tongue
        confidence: medium
        sources:
          - heinrich-2023
          - heinrich-2022
      finish:
        action: Held closed while the outside ankle holds through the set, so the inside foot is ready to become the new outside foot
        contraction: isometric
        cue: Inside ankle stays bent
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts quickly inside the boot right after the release, rolling the ski onto its big-toe edge early, above the fall line
        contraction: concentric
        cue: Roll quickly onto the new big-toe edge
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "53, 127" }
          - { source: lind-sanders-2004, pages: 139 }
      shaping:
        action: Eversion keeps building to its most in late shaping, then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line
        confidence: medium
        sources:
          - reid-2020
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55" }
      finish:
        action: Sets the edge briefly, then lets it go early toward flat, ready for the next release
        contraction: eccentric
        cue: Set, then let the edge go
        confidence: low
        sources:
          - reid-2020
          - psia-c-performance-short-turns
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts to roll the inside ski onto its little-toe edge, leading the outside ski
        contraction: concentric
        cue: Tip the inside foot first, toward its little toe
        confidence: low
        sources:
          - { source: iasi-2021, pages: 46 }
          - psia-c-performance-short-turns
      shaping:
        action: Tilt held, building with the outside ski's edge
        contraction: isometric
        cue: Keep both skis tipped the same way
        confidence: low
        sources: []
      finish:
        action: Releases toward flat with the outside ski
        contraction: eccentric
        cue: Flatten both skis together
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the new load
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under the peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held through the edge set, pressure spread mid-foot
        contraction: isometric
        cue: Keep the pressure spread under the whole foot
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      shaping: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { action: Arch held as the inside foot takes more load at the edge set, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [bon-2021] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition as the new turn loads; quicker and shorter than in long turns
        contraction: concentric
        cue: Grow into the new turn
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
      shaping:
        action: Held near its longest, quasi-isometric, through a short window as the load builds past the fall line; never straight
        moment: Extension, near its peak
        contraction: isometric
        cue: Strong and steady over the fall line
        confidence: medium
        sources:
          - alhammoud-2020
          - { source: cross-raschner-2023, pages: "11-13" }
          - hintermeister-1997
      finish:
        action: Flexes quickly under the edge set, absorbing the peak load, into its deepest bend in the transition, then the rebound starts the next turn
        contraction: eccentric
        cue: Flex to set the edges, then let the rebound carry you
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 45, 104" }
          - { source: lind-sanders-2004, pages: 91 }
          - hintermeister-1997
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Shortens under its own load as the skis tip, so the inside leg is more bent than the outside one
        moment: Extension, about as large as the outside knee's, because it is more bent
        contraction: eccentric
        cue: Let the inside leg fold so the skis can tip
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "55, 61-62" }
          - { source: iasi-2021, pages: 65 }
      shaping:
        action: Held more bent than the outside knee
        contraction: isometric
        cue: Short inside leg, long outside leg
        confidence: medium
        sources:
          - heinrich-2022
          - kroll-2011
      finish:
        action: Held bent under the extra load the inside foot takes at the edge set, while the outside knee flexes to match it, so both are level at the edge change
        contraction: isometric
        cue: Both knees bent together at the edge set
        confidence: low
        sources:
          - bon-2021
          - { source: lemaster-2010, pages: "40-42" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: Turn the thigh not the knee, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, moment: Resisting the twist of the edge set, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [heinrich-2023] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: Knee stays over the foot and does not cave in, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, moment: Resisting valgus at the edge set, contraction: isometric, cue: Knee stays over the foot through the edge set, confidence: medium, sources: [zorko-2020, bere-2013] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Small abduction moment, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [heinrich-2022] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens from its deepest fold in the transition as the leg lengthens into the new turn
        contraction: concentric
        cue: Rise a little into the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: Held at its most open, folded forward at the hip with the pelvis facing down the hill
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - hintermeister-1997
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further with the knee under the edge set, into the transition
        contraction: eccentric
        cue: Fold at the hips as the legs flex to set the edges
        confidence: medium
        sources:
          - hintermeister-1997
          - { source: lemaster-2010, pages: "40-42, 45" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Flexes under its own load with the knee as the inside leg shortens; its femur ends more flexed than the outside one, which brings the inside foot slightly ahead
        contraction: eccentric
        cue: Inside hip folds a little more
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "61-62" }
      shaping:
        action: Held more flexed than the outside hip
        moment: Extension, similar to the outside hip because it is more flexed
        contraction: isometric
        cue: Inside leg short, inside foot slightly ahead
        confidence: medium
        sources:
          - heinrich-2022
      finish:
        action: Held flexed while the outside hip folds to match it at the edge set
        contraction: isometric
        cue: Both hips folded at the edge set
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The knee moves toward the turn as the leg tips the ski, then the pelvis tips over the loaded thigh so the inside half stays up; the outside abductors hold it, pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up as you tip in
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
          - moore-2020
          - seifert-2023
      shaping:
        action: Hip angulation builds quickly to its most in late shaping, then holds; smaller than in long turns, coming mostly from the legs winding under the pelvis
        moment: Changes sign within the turn; abductors and adductors co-contract
        contraction: concentric
        cue: Hips in, shoulders over the outside ski
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "74, 128" }
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Holds through the edge set, then releases early as the legs come back under the body
        contraction: eccentric
        cue: Let the hips come back over the skis to release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 130 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The inside knee tips toward the turn with its ski, leading the edge change
        contraction: concentric
        cue: Inside knee leads the tipping
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "67, 142" }
      shaping:
        action: Held, the inside thigh drawn toward the turn at hip width
        moment: Adduction, the adductor longus the main contributor in a modelled carved turn
        contraction: isometric
        cue: Inside knee stays out of the way of the outside knee
        confidence: medium
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held, then eases back toward neutral as the edges flatten
        contraction: isometric
        cue: Keep the feet hip width apart
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward from the outward rotation it held as the old inside leg, through neutral, as the released skis swing toward the fall line under a pelvis already facing it; the stretched rotators recoil and the internal rotators drive
        contraction: concentric
        cue: Let the legs turn under a quiet upper body
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-110" }
          - delp-1999
          - psia-c-performance-short-turns
      shaping:
        action: Keeps turning inward as the skis come across the fall line under the still pelvis
        moment: Internal when the skis are brushed; when they carve, sidecut turns them and the external rotators brake instead
        contraction: concentric
        cue: Keep turning the thigh in the hip socket
        confidence: low
        sources:
          - heinrich-2023
          - { source: lind-sanders-2004, pages: 117 }
          - { source: lemaster-2010, pages: 108 }
      finish:
        action: At its most turned in, about 30-40° of counter, held through the edge set; this stretch winds up the next turn
        contraction: isometric
        cue: Skis across, belly button down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "74, 109-110" }
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward from the inward rotation it held as the old outside leg, through neutral, so the inside ski turns with the outside one
        contraction: concentric
        cue: Turn both legs together
        confidence: low
        sources:
          - delp-1999
          - psia-c-basic-short-turns
      shaping:
        action: Keeps turning outward as the skis come across the fall line
        moment: Internal in a modelled carved turn, so the external rotators drive only when the skis are brushed
        contraction: concentric
        cue: Steer the inside ski too
        confidence: low
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: 142 }
      finish:
        action: Held turned out through the edge set
        contraction: isometric
        cue: Inside ski parallel at the edge set
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up a little from the transition's hip hinge as the legs lengthen; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the legs; the hinge stays at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held over the legs, less forward than in long turns
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the edge set
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half stays up as the legs tip, held by the outside hip abductors with some support from the inside ski
        contraction: concentric
        cue: Inside hip up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
      shaping:
        action: Kept up, a little more as the edge builds to late shaping
        contraction: concentric
        cue: Don't let the inside hip drop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
      finish:
        action: Levels as the edges release
        contraction: eccentric
        cue: Level the hips for the edge change
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Faces down the fall line in space while the skis turn under it, so its counter to the skis unwinds from the last turn's 30-40° through square
        contraction: isometric
        cue: Belly button down the hill
        confidence: medium
        sources:
          - psia-c-performance-short-turns
          - hintermeister-1997
          - { source: lemaster-2010, pages: "74, 109-110" }
      shaping:
        action: Still facing down the hill; counter to the skis grows to about 25° as they turn across
        moment: Resisting the reaction torque of the turning legs
        contraction: isometric
        cue: Upper body quiet, legs turning
        confidence: medium
        sources:
          - hintermeister-1997
          - heinrich-2023
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Counter at its most, about 30-40°, held against the edge set's twist
        contraction: isometric
        cue: Stay facing down the hill as you set the edges
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "74, 110, 112-116" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing through the edge set
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Shoulders level with the slope
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Bend builds a little to late shaping, then holds; less than in long turns
        contraction: eccentric
        cue: Upper body over the outside ski
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: 128 }
      finish:
        action: Returns toward straight as the edges release
        contraction: concentric
        cue: Straighten up over the skis
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: medium, sources: [sporri-2016, fujii-2007] }
      finish: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation: { action: Chest slightly forward and held, contraction: isometric, cue: Chest over the knees, confidence: low, sources: [{ source: lemaster-2010, pages: 74 }] }
      shaping: { action: Chest slightly forward and held, contraction: isometric, cue: Chest over the knees, confidence: low, sources: [sporri-2016] }
      finish: { action: Chest slightly forward and held through the edge set, contraction: isometric, cue: Don't sit up as you set the edges, confidence: low, sources: [] }
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips toward the outside ski a little more than the pelvis does; the inside obliques lengthen to control it
