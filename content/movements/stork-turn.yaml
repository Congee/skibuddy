activations:
  # Outside leg. Load-bearing efforts scale with the load factor and knee bend; balance efforts change little.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthens the knee into the turn, holds it against the whole turn force with no help from the inside leg, then lets it flex under the late load
    confidence: medium
    basis: Measured in normal turns, where activity peaks in the steering phase at a steady knee bend. Here one leg carries the whole load, about body weight when gentle and up to 1.3 times it when dynamic, peaking below the fall line, at a deeper bend as the turn gets harder; the per-setting values are our inference from that load and bend. At initiation the load is nearly the same at every setting, so gentle 1 against moderate 2 reflects the knee depth, not the load
    sources:
      - hintermeister-1997
      - kroll-2010
      - panizzolo-2013
      - heinrich-2022
      - { source: cross-raschner-2023, pages: "13-14" }
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the stance leg
    confidence: medium
    basis: Measured as a knee extensor on the outside leg in normal turns; scaled with load by inference
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip against the load, sharing the work with the hamstrings and adductor magnus
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn, shared with the hamstrings and adductor magnus. Scaled like the vasti, with the load and the depth of the fold; the per-setting values are inference. At initiation gentle 1 against moderate 2, at almost the same load, reflects the depth of the fold
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - distefano-2009
      - { source: lind-sanders-2004, pages: 103 }
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Hikes the unsupported inside half of the pelvis from the stance hip as the edge builds, holds it, and lets it down as the tail comes down
    confidence: medium
    basis: Measured on both legs in normal turns; the one-leg pelvic hold follows from mechanics and single-leg exercise data. Highest from late shaping into the finish, where the angulation peaks and the pelvis is still held up under the peak load until the tail comes down
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - distefano-2009
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow. Scaled as gluteus medius
    sources: [moore-2020, ganderton-2017, uebayashi-2026, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps hold the pelvis and turn the thigh inward
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to steer and edge, then brace against the abductors
    confidence: medium
    basis: Measured in normal turns; the steering role is mechanics of the bent leg
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and shares the hip extension moment
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance; modelled hip extension share. Scaled with the load like adductor magnus
    sources: [hintermeister-1997, heinrich-2022, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation, pelvis.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn when the ski carves
    confidence: low
    basis: The hip rotation moment is small and its sign depends on whether the ski carves or brushes; extrapolated from a model of a carved GS turn. Their action also shifts with hip flexion
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the feet back into the new turn; once the turn loads, only co-contracts, as the net ankle moment is plantarflexion
    confidence: medium
    basis: Measured in normal turns, where it is highly active; active ankle flexion is a book technique point. The modelled shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the flexed ankle against the rising load to the fall line, sharing the plantarflexion moment with the boot shaft, then opens the ankle to push the foot forward through the finish
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus, not the gastrocnemius, does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee bent
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the big-toe edge and build it into late shaping, make the constant small balance corrections on one edge, then let it go
    confidence: medium
    basis: Highly active in turns, attributed to edge control; balancing on one ski adds continuous co-contraction. A balance effort, so it changes little with intensity; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals for balance on one edge
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the stance hip, a minor role
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The stance hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. It carries no snow force; its effective weight grows with n, but by too little to move a level.
  # Inside gastrocnemius is left out: pointing the foot would press the tip down.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the inside thigh up while the knee lifts the tail
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow, and only rectus femoris has been measured as an inside-leg hip flexor. Holding up the leg, boot and ski, about 16 kg, is a moderate hip-flexor effort; their effective weight grows with the load factor, about 6-21 % at the fall line, too little to move a level
    sources:
      - jiroumaru-2014
      - juan-2024
      - andersson-1997
      - kroll-2010
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works as a hip flexor on the inside leg, not as a knee extensor
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg in normal turns; changes little with intensity
    sources:
      - kroll-2010
      - cuniberti-2026
      - seifert-2023
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 1 }
    contraction: { initiation: isometric, shaping: null, finish: eccentric }
    role: Nearly idle while the leg is lifted; take the load again at set-down
    confidence: medium
    basis: Measured low on the inside leg in normal turns; lower still with no load
    sources:
      - kroll-2010
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Bends the knee to raise the tail, then holds the heel toward the seat; its short head is a pure knee bender
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the lift is mechanics. Holding the lower leg and ski up is a light effort
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Help bend the knee and hold the tail up
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gracilis
    side: inside
    serves: [knee.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Bends the knee and keeps the lifted leg at hip width
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, hip.rotation, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Flexes the hip, turns the thigh out and bends the knee together, which is the stork posture
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps hold the thigh up
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Keep the lifted thigh at hip width; pectineus also lifts it
    confidence: low
    basis: Modelled in normal turns
    sources: [heinrich-2023]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the lifted thigh out so the ski stays parallel, and resist the tip drag that would cross the tips
    confidence: low
    basis: Anatomy; not measured on snow. With the hip deeply flexed their external rotation moment arm shrinks, and piriformis flips to an internal rotator, so gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps turn the lifted thigh out so the ski stays parallel
    confidence: low
    basis: Anatomy and moment arms; not measured on snow
    sources: [delp-1999]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the free thigh from falling inward
    confidence: low
    basis: Inside gluteus medius is active in normal turns; its role here is mechanics
    sources: [seifert-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the shin on the tongue and tips the lifted ski, and keeps the ankle closed as the tail comes down so the ski is ready to take the next turn; light, because the resting tip balances the ski
    confidence: low
    basis: Modelled on the inside leg in normal turns; low here by mechanics
    sources:
      - heinrich-2023
      - { source: lind-sanders-2004, pages: 47 }
      - { source: lemaster-2010, pages: "81, 86" }
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Tips the lifted ski onto its new edge and holds it there for the set-down
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  # Pelvis and trunk. The spine bends toward the outside ski, so the inside side controls it lengthening.
  - muscle: quadratus-lumborum
    side: inside
    serves: [lumbar.side-bend]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Controls the low back's bend toward the outside ski, then straightens it at the finish; the pelvic hike itself is the outside hip abductors' work
    confidence: low
    basis: EMG off snow; the role here is mechanics. The side bend grows with the edge angle, so its effort rises with intensity by inference
    sources:
      - andersson-1996
      - mcgill-1996
      - { source: lemaster-2010, pages: "70-71" }
  - muscle: quadratus-lumborum
    side: outside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the inside side to steady the low back
    confidence: low
    basis: EMG off snow
    sources: [mcgill-1996]
  - muscle: internal-oblique
    side: outside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Holds the counter against the legs' turning, paired with the inside external oblique
    confidence: medium
    basis: Measured and modelled in normal turns
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: external-oblique
    side: inside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Pairs with the outside internal oblique to hold the counter
    confidence: medium
    basis: Measured and modelled in normal turns
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: internal-oblique
    side: inside
    serves: [lumbar.side-bend, thoracic.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Helps the inside quadratus lumborum control the trunk's bend toward the outside ski, then straighten it
    confidence: low
    basis: Internal oblique ranks high in a model of carving; this side-bend role is mechanics, and a light one
    sources: [heinrich-2023]
  - muscle: external-oblique
