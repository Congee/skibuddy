id: stork-turn
name: Turn balanced on the outside ski, inside tail held up
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# Phases: initiation = LeMaster's and IASI's initiation, Pritchard & Taylor's initiation after the turn switch;
# shaping = LeMaster's control phase, IASI's fall line, P&T's steering phase; finish = completion in all three.
# Their transition sits between our finish and the next initiation.
# The inside tail is up from mid-initiation to mid-finish (PSIA-C task page); the pole touch comes just before the lift.
#
# Intensity (the drill's scenarios): with the inside ski up, the outside leg carries 100 % of the snow force.
# Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it (heading 135°):
#   gentle    6 m/s, R 10 m,  8°: about 1.02, 1.06, 1.09
#   moderate  8 m/s, R 12 m, 12°: about 1.03, 1.12, 1.20
#   dynamic  10 m/s, R 14 m, 15°: about 1.07, 1.21, 1.33
# The load builds past the fall line and peaks in late shaping or early finish, then eases as the radius opens
# toward the traverse (falda-buscaiot-2017, zorko-2015, L&S Table 6.1, P&T p 27), so outside-leg efforts hold
# up into the finish while the tail is still up.
# Outside knee: most flexed in the transition, extending a little through initiation, quasi-isometric and
# most extended through shaping, flexing again (eccentric, absorbing) through the finish (LeMaster pp 40-42,
# P&T p 27, IASI pp 65-66); the hip follows. Our inference, solved for balance over the foot: outside hip
# flexion mid-turn to transition about 48-62° gentle, 55-70° moderate, 63-78° dynamic; the knee that balances
# it about 60-68°, 65-74° and 71-81°; the chest 20-33° forward of vertical. Race reference: heinrich-2022's
# GS outside hip 50-81°, knee 56-80°.
# Per-setting values are inference from these mechanics; a single number means it changes little with intensity.
# The balance stabilisers (peroneals, tibialis posterior, foot intrinsics) change little: they answer balance,
# not the turn force. The lifted inside leg carries no snow force, but its effective weight grows with n
# (about 6-21 % at the fall line), too little to move a level.
#
# Equipment assumed: recreational carving skis; boots with about 15° cuff lean, about 0.9° binding ramp
# (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167);
# a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132); a deeper
# sidecut tightens the turn (LeMaster pp 32-33, L&S p 53).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the feet are drawn back and the shin presses into the tongue while the body crosses over; flexed about as far as it goes in the turn
        contraction: concentric
        cue: Pull the toes up and the feet back
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 182-183" }
          - { source: cross-raschner-2023, pages: 14 }
          - { source: iasi-2021, pages: 187 }
      shaping:
        action: Held flexed against the rising load to the fall line, then opens a little as the foot starts forward; a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Opens progressively as the foot slides forward under the body, still flexed past upright; pressure moves toward the heel
        contraction: concentric
        cue: Let the foot slide ahead as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Flexed with the shin in the tongue as the tail lifts, so the ski pitches tip down
        contraction: isometric
        cue: Both shins forward, not just the outside one
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
      shaping:
        action: Held flexed with the tip resting on the snow; the ski's longer, heavier forebody and the snow under the tip balance it, so little ankle effort is needed
        contraction: isometric
        cue: Tip resting on the snow, not pressed
        confidence: low
        sources:
          - psia-c-stork-turns
          - { source: lind-sanders-2004, pages: 47 }
      finish:
        action: Stays closed, shin on the tongue, while the tail comes down by knee and hip extension, ready to become the new outside ski
        contraction: isometric
        cue: Keep the shin on the tongue as the tail comes down
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Begins to evert inside the boot, rolling the ski onto its big-toe edge
        contraction: concentric
        cue: Roll onto the big-toe edge
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: 127 }
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Eversion keeps building to its most in late shaping, below the fall line, then holds against the snow force that would flatten the ski, with constant small corrections on the one edge
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line; the edge angle builds with speed and pitch
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55, 137" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Holds, then releases toward flat through the finish into the transition
        contraction: eccentric
        cue: Let the edge go as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 38 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts so the lifted ski tips onto its little-toe edge with the stance ski
        contraction: concentric
        cue: Tip the lifted ski the same way as the stance ski
        confidence: low
        sources:
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Tilt held, building with the stance ski's edge
        contraction: isometric
        cue: Keep the lifted ski tilted with the stance ski
        confidence: low
        sources: []
      finish:
        action: Tilt held as the ski is set down on its little-toe edge, ready for the edge change
        contraction: isometric
        cue: Set it down parallel, at hip width, on its little-toe edge alongside the stance ski
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the whole load
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition as the new turn loads
        contraction: concentric
        cue: Grow into the new turn
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
      shaping:
        action: Held near its longest, quasi-isometric, while the load builds; deeper the harder the turn, about 60° gentle, 65° moderate, 71° dynamic (our inference; heinrich-2022 GS 56-80°)
        moment: Extension, near its peak
        contraction: isometric
        cue: Stay long, strong and steady on the outside leg
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: cross-raschner-2023, pages: "11-14" }
          - alhammoud-2020
          - heinrich-2022
      finish:
        action: Flexes, absorbing the load as it peaks below the fall line and eases, into its deepest bend in the transition, about 68° gentle, 74° moderate, 81° dynamic (our inference)
        contraction: eccentric
        cue: Flex under control as the turn ends
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
          - falda-buscaiot-2017
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Flexes to raise the tail just after the pole touch, once the body has tipped into the turn and the new outside ski holds; knee flexion gives the tail-up pitch
        contraction: concentric
        cue: Touch, tip in, then lift the inside heel toward your seat
        confidence: low
        sources:
          - psia-c-stork-turns
          - { source: lind-sanders-2004, pages: "137-138" }
      shaping:
        action: Held more bent than the outside knee, heel drawn toward the seat
        contraction: isometric
        cue: Heel toward your seat; the tip stays on the snow
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 55 }
      finish:
        action: Lengthens with the hip to set the tail down through the middle of the finish
        contraction: eccentric
        cue: Lower the tail, don't drop it
        confidence: low
        sources: [psia-c-stork-turns]
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Set the ski down straight, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Set the ski down without the knee caving in, confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: 122 }] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens from its deepest fold in the transition as the leg lengthens into the new turn
        contraction: concentric
        cue: Rise a little into the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: Held at its most open, folded forward at the hip with the pelvis countered, about 48° gentle, 55° moderate, 63° dynamic (our inference; heinrich-2022 GS 50-81°)
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist; deeper with speed and pitch
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
          - alhammoud-2020
      finish:
        action: Folds further with the knee, absorbing the late load, into the transition, about 62° gentle, 70° moderate, 78° dynamic (our inference)
        contraction: eccentric
        cue: Fold at the hips as the legs flex to finish
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Flexes to hold the thigh up while the knee bends to lift the tail; hip flexion shortens the leg as a whole
        contraction: concentric
        cue: Bring the inside thigh up a little; the tip stays on the snow
        confidence: medium
        sources:
          - kroll-2010
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "61-62" }
      shaping:
        action: Held more flexed than the outside hip, the hip flexors holding the thigh up
        contraction: isometric
        cue: Inside thigh held up a little, tip on the snow
        confidence: medium
        sources:
          - kroll-2010
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Lowered to set the tail down
        contraction: eccentric
        cue: Lower the leg under control
        confidence: low
        sources: [psia-c-stork-turns]
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The pelvis tips over the stance thigh as the legs tilt in, so the inside half rises; the outside abductors hike it, pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
      shaping:
        action: Hip angulation keeps building with the edge to its most in late shaping, then held, the outside hip carrying the unsupported inside half of the pelvis
        moment: Abduction
        contraction: concentric
        cue: Stay strong over the outside hip; the angle builds with speed and pitch
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
          - moore-2020
          - ganderton-2017
      finish:
        action: Holds under the late load, then releases through the finish as the legs come upright and the inside ski returns to the snow
        contraction: eccentric
        cue: Level the hips as the tail comes down
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Kept at hip width as the tail lifts, neither drawn in nor out; the net moment is near zero
        contraction: isometric
        cue: Lifted boot at hip width
        confidence: low
        sources: []
      shaping:
        action: Held at hip width beside the stance leg
        contraction: isometric
        cue: Lifted boot at hip width
        confidence: low
        sources: []
      finish:
        action: Held, then the foot is set down at hip width
        contraction: isometric
        cue: Set the foot down at hip width, not wide
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward a little, the thigh rotating under the pelvis to steer and tip the ski
        contraction: concentric
        cue: Turn the thigh in the hip socket
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - { source: iasi-2021, pages: 193 }
          - delp-1999
      shaping:
        action: Held turned in as the ski turns
        moment: Small; internal (steering) in a brushed turn, external (braking) if carved, extrapolated from a modelled carved GS turn
        contraction: isometric
        cue: Keep the knee over the foot as the ski turns
        confidence: low
        sources: [heinrich-2023]
      finish:
        action: Held, then back toward neutral at the release
        contraction: isometric
        cue: Let the thigh unwind with the release
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward with the turn so the lifted ski stays parallel
        contraction: concentric
        cue: Keep the lifted ski parallel
        confidence: low
        sources: [delp-1999]
      shaping:
        action: Held turned out; the external rotators resist tip drag, the inside tip being pulled toward the stance ski until the tips cross
        contraction: isometric
        cue: Keep the lifted tip from drifting toward the stance ski
        confidence: low
        sources: []
      finish:
        action: Held until the ski is set down
        contraction: isometric
        cue: Set it down parallel
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up from the transition's deep hip hinge as the legs lengthen, moving with the thighs; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the legs; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held at its most open over the long legs, more tilted the harder the turn, never standing tall. Tilting it further forward than the balance needs, so the low back arches, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
          - { source: iasi-2021, pages: 194 }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the transition
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half rises against the balance axis as the inside foot unloads, hiked by the outside hip abductors
        contraction: concentric
        cue: Inside hip up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, with no support from the inside ski
        contraction: concentric
        cue: Don't let the inside hip drop; more as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Held up under the late load, then lowers through the finish as the tail is set down
        contraction: eccentric
        cue: Level the hips for the edge change
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space while the femurs rotate under it
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Slight counter held
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      finish:
        action: Square to the skis as they release; the new counter forms as the legs turn under
        contraction: isometric
        cue: Chest and pelvis square to the skis as they release; the new counter forms as the legs turn under
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
          - { source: iasi-2021, pages: 64 }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load, never arched or slumped; a harder turn folds more at the hips, not the low back
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Tip the upper body over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, keeping the trunk over the outside ski rather than banking
        contraction: eccentric
        cue: Hips in, shoulders out; more as speed and pitch build
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Holds, then returns toward straight through the finish
        contraction: concentric
        cue: Straighten up as the turn ends
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
      finish: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest forward, about 20-33° from vertical through the turn, a little more the harder the turn; it rises a little with the hips as the legs lengthen
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "182-183" }
      shaping:
        action: Slight forward flexion held
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 74 }
      finish:
        action: Slight forward flexion held
        contraction: isometric
        cue: Don't sit up as the turn ends
        confidence: low
        sources: []
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips toward the outside ski a little more than the pelvis does; the inside obliques lengthen to control it
        contraction: eccentric
        cue: Shoulders level with the slope
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 70 }
          - fujimori-2014
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Outside shoulder over the outside ski; more as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-72, 128" }
      finish:
        action: Holds, then returns toward straight through the finish
        contraction: concentric
        cue: Let the shoulders come level
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space with the pelvis while the femurs rotate under
        contraction: isometric
        cue: Chest a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      shaping:
        action: Slight counter held against the legs' turning
        contraction: isometric
        cue: Quiet upper body while the legs turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73, 107" }
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Square to the skis as they release; the new counter forms as the legs turn under
        contraction: isometric
        cue: Chest and pelvis square to the skis as they release; the new counter forms as the legs turn under
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
          - { source: iasi-2021, pages: 64 }
  - dof: shoulder-girdle.protraction
    side: both
    cells:
      initiation: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
      finish: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
  - dof: shoulder.flexion
    side: outside
    cells:
      initiation:
        action: Arm held forward, hand in view
