    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Control the inside foot's roll onto its little-toe edge, then start rolling it flat toward its new big-toe edge at the release
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; the inside foot becomes the next outside foot. Not measured on snow
