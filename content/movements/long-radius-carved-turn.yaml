      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the inside foot back and tips it onto its little-toe edge first, then presses the shin into the tongue, more after the fall line
