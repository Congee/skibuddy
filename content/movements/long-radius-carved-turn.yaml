        sources: []
  - dof: shoulder.abduction
    side: both
    cells:
      initiation: { action: "Arms a little out from the sides, hands wide for balance", contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Hands held wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [{ source: lind-sanders-2004, pages: "127-128" }] }
      finish: { action: Hands held wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [] }
  - dof: elbow.flexion
    side: both
    cells:
      initiation: { action: Bent about 75°; the touching arm reaches forward from the shoulder, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [{ source: lemaster-2010, pages: 142 }] }
      shaping: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
      finish: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
  - dof: wrist.grip
    side: both
    cells:
      initiation: { action: Light grip; the touching wrist flicks the pole tip forward, contraction: concentric, cue: "Touch with the wrist, not the arm", confidence: low, sources: [] }
      shaping: { action: Light grip held, contraction: isometric, cue: Hold the poles lightly, confidence: low, sources: [] }
      finish: { action: Light grip held, contraction: isometric, cue: Hold the poles lightly, confidence: low, sources: [] }
  - dof: neck.flexion
    side: trunk
    cells:
      initiation: { action: "Head held up with the eyes ahead along the path, a few ski lengths on", contraction: isometric, cue: Eyes on the next turn, confidence: low, sources: [{ source: lemaster-2010, pages: 64 }, collin-psia-nw] }
      shaping: { action: Head held steady against the turn load, contraction: isometric, cue: A steady head, confidence: low, sources: [{ source: lemaster-2010, pages: 64 }] }
      finish: { action: Head held steady, contraction: isometric, cue: A steady head, confidence: low, sources: [] }
  - dof: neck.side-bend
    side: trunk
    cells:
      initiation: { action: "Head kept level, or tipped slightly toward the outside with the shoulders", contraction: isometric, cue: Don't tip the head into the turn, confidence: low, sources: [{ source: lemaster-2010, pages: 72 }] }
      shaping: { action: Head kept level with the slope as the body inclines, contraction: isometric, cue: Don't tip the head into the turn, confidence: low, sources: [{ source: lemaster-2010, pages: 72 }] }
      finish: { action: Head kept level, contraction: isometric, cue: Level head, confidence: low, sources: [] }
  - dof: neck.rotation
    side: trunk
    cells:
      initiation: { action: Head turns toward the coming apex so the eyes lead the turn, contraction: concentric, cue: Look where the turn is going, confidence: low, sources: [land-tatler-2001, lappi-2025] }
      shaping: { action: "Held along the arc a little inside the direction of travel, not at the turn's centre, against the slight counter", contraction: isometric, cue: Trace the arc just ahead, confidence: low, sources: [collin-psia-nw] }
      finish: { action: Head and eyes move on to the next turn's apex before the transition, contraction: concentric, cue: Look to the next turn, confidence: low, sources: [decroix-2017, { source: lemaster-2010, pages: 150 }] }

activations:
  # Outside leg. Load-bearing efforts scale with the load factor, the outside share and knee bend.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthen the knee into the turn, hold it near its longest against the building load, then let it flex under the late load
    confidence: high
    basis: Vastus medialis and lateralis averaged above 50 % MVC in GS turns, with peaks above 150 %, and vastus lateralis ranked first on the outside leg in a model of a carved turn. Dynamic is that turn; gentle and moderate carry about 0.7-1.0 BW on the outside foot at a shallower bend, so their values are our inference. The eccentric share is shorter and lighter than once thought; most of the work is a near-isometric hold
    sources:
      - hintermeister-1997
      - berg-1995
      - heinrich-2023
      - panizzolo-2013
      - { source: cross-raschner-2023, pages: "13-14, 19" }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the outside leg
    confidence: medium
    basis: Measured as an outside-leg knee extensor in recreational turns and at 43 % MVC in instructors' slalom; not reported in GS. Scaled with load by inference
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip against the turn load, brakes the femur's inward turn and helps hold the pelvis up over the deeply flexed hip
    confidence: high
    basis: Averaged above 50 % MVC in GS turns and ranked second on the outside leg in a model of a carved turn, where it was the main abductor of the deeply flexed hip. Gentle and moderate values are our inference from the lower load
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Hikes the inside half of the pelvis from the stance hip as the edge builds, helped by the lightly loaded inside foot, and lets it down at the release
    confidence: medium
    basis: Measured on both legs in carved turns, but in mV, which ranks rather than sets a level. The inside ski carries part of the pelvis, so the demand is below a one-ski drill's, and the hip's frontal moment changes sign within the turn
    sources:
      - seifert-2023
      - louie-1984
      - heinrich-2022
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: low
    basis: Not measured in skiing; its role is the pelvic hold that single-leg exercise data rank it high for, here shared with the inside foot
    sources: [moore-2020, ganderton-2017, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps tip the thigh inward at initiation and hold the pelvis
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024, delp-1999]
  - muscle: adductors
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: concentric }
    role: Move the bent thigh's knee toward the turn to tip the ski, then carry the stance hip's adduction moment, yielding as the angulation builds
    confidence: high
    basis: Adductors averaged above 50 % MVC in GS turns. The hip's frontal moment was mostly adduction in one model, so they are a working part of the hold, not just co-contraction. LeMaster has the bent leg turned in by the adductors as the early edging move. Gentle and moderate values are our inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "53, 108, 124-125, 182" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; the GS EMG does not separate it from the other adductors
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and guard the ACL, shares the hip extension moment and brakes the femur's inward turn
    confidence: high
    basis: Averaged above 50 % MVC in GS turns; a model of a carved turn credited the lateral hamstrings with the hip's external rotation moment. Gentle and moderate values are our inference
    sources: [hintermeister-1997, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in under the edged load
    confidence: medium
    basis: Ranked among the top outside-leg muscles in a model of a carved turn; semitendinosus 6-15 % MVC in a simulated edged stance
    sources: [heinrich-2023, zorko-2020]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation, pelvis.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: eccentric, finish: isometric }
    role: Brake and hold the femur's inward turn while the ski carves, and steady the hip joint
    confidence: low
    basis: Quadratus femoris added to the hip's external rotation moment in a model of a carved turn; model only, and their action shifts with hip flexion
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the feet back and the shins into the tongues as the edges change, then keeps the shin forward against the boot's spring and the load
    confidence: high
    basis: Averaged above 50 % MVC in GS and parallel turns, read as fore-aft and edge control. LeMaster pairs the early ankle bend with the knee turning in as early edging. How that splits by phase is our inference; the modelled shaping moment is plantarflexion, so its later work is co-contraction against the calf
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "53, 79-81, 182-183" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the flexed ankle against the load with the boot shaft, then opens the ankle to push the foot forward through the finish
    confidence: medium
    basis: The modelled ankle moment put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus keeps its length where the gastrocnemius does not. Pressure ahead of the ankle makes the net ankle moment plantarflexor (our reading of Lind and Sanders), and LeMaster straightens the ankle through control into completion. Not measured by EMG in skiing
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: "81, 182-183" }
      - { source: lind-sanders-2004, pages: "54, 69-70" }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the ankle against the boot under load and co-contracts across the bent knee
    confidence: high
    basis: The medial head averaged above 50 % MVC in GS turns. With the knee bent much of its pull is lost to knee flexion, so it stiffens rather than drives the ankle; gentle and moderate values are our inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lind-sanders-2004, pages: "54, 69-70" }
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity:
      initiation: 2
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the big-toe edge early, keep building the edge into late shaping, then let it go
    confidence: medium
    basis: Peroneus longus is reported highly active in racing turns and was recorded on snow, though its activity tracked posture more than measured torsion; the boot shell carries most of the edging moment. Tipping is quick foot and lower-leg work that the upper body is too slow to lead. On two skis the one-edge balance work is lighter than in a one-ski drill
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "53, 127" }
      - { source: lind-sanders-2004, pages: "54-55, 95, 139" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the foot rolls onto the big-toe edge, holds the arch up against the peroneals under load, then helps roll the foot back toward flat at the release
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; the medial arch takes the lateral load. Not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: "95, 139" }
      - { source: lemaster-2010, pages: 139 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole as it moves from ball to heel
    confidence: low
    basis: Anatomy; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 139 }
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the stance hip, a minor role
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The stance hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. It carries about 25-40 % of the load at a deeper bend, so its extensors still work.
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Let the inside knee bend under its share of the load as the leg shortens, hold the deep bend, then lengthen it into the next turn
    confidence: medium
    basis: Inside vastus lateralis was the most active inside-leg muscle in a model of a carved turn, because the more bent knee needs nearly the outside knee's extension moment on less force; recreational skiers' inside vastus lateralis ran about 54 % below the outside one
    sources: [heinrich-2022, heinrich-2023, kroll-2010]
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Draws the inside thigh up as a hip flexor to shorten the inside leg, then holds it
    confidence: medium
    basis: Inside rectus femoris was as active as the outside one in recreational turns while inside vastus lateralis was not, read as a hip-flexor role on the inside leg
    sources:
      - kroll-2010
      - cuniberti-2026
      - seifert-2023
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps draw the inside thigh up so the inside leg shortens rather than pushing the skier off the outside ski
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The loaded inside hip carries an extension moment, so the hip flexors only add to what the extensors let go
    sources:
      - jiroumaru-2014
      - heinrich-2022
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Lets the loaded inside hip fold as the leg shortens, holds it against the hip extension moment, and helps turn the thigh out
    confidence: medium
    basis: The inside hip's extension moment reached about 1.05 Nm/kg in the modelled turn; its share among the extensors is our inference
    sources: [heinrich-2022, delp-1999]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the inside vasti at the deep bend
    confidence: medium
    basis: Inside-leg hamstring activity measured in GS-type turns
    sources: [chollet-2025]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion, knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contract at the deep bend and resist the inside knee's internal rotation moment
    confidence: medium
    basis: Inside-leg hamstring activity measured in GS-type turns
    sources: [chollet-2025, heinrich-2022]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the inside thigh adducted at hip width against the inside hip's adduction moment, and help hold it against further outward rotation
    confidence: medium
    basis: Adductor longus was the third most active inside-leg muscle and the main inside adductor in a model of a carved turn
    sources: [heinrich-2022, heinrich-2023]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Its anterior fibres hold the turned-out inside thigh against the internal rotation moment, and it steadies the inside hip
    confidence: medium
    basis: Inside gluteus medius was active through steering and the transition on snow; the rotation role is the measured inside-hip moment with moment arms
    sources: [seifert-2023, heinrich-2022, delp-1999]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh out as the skis tip; once held, the net moment is internal, so they only co-contract to steady the hip
    confidence: low
    basis: Anatomy and the measured inside-hip moment; not measured on snow
    sources: [delp-1999, heinrich-2022]
  - muscle: sartorius
    side: inside
