  # Pelvis and trunk. The spine bends toward the outside ski, so the inside side controls it lengthening.
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the hinged trunk with the low back slightly flattened from standing, never arched or slumped, against the largest moment in the turn; quiet, not rigid
    confidence: medium
    basis: Reached full model activation in a carved turn, where the low-back extension moment was the largest joint moment, and measured in racing turns; no %MVC in GS. Highest from late shaping into the finish with the peak load
    sources:
      - heinrich-2022
      - heinrich-2023
      - zeglinski-1998
      - hintermeister-1995
      - { source: cross-raschner-2023, pages: 12 }
