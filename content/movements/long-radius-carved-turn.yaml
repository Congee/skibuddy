  - muscle: internal-oblique
    side: outside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Holds the slight counter against the legs' turning, paired with the inside external oblique
    confidence: medium
    basis: Internal oblique was a primary trunk muscle in a model of a carved turn; external oblique ran higher in GS than in parallel or wedge turns. Counter stays small in carving, so the anti-rotation work is lighter than in short turns
