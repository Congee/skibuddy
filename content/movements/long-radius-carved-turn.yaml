structures:
  - structure: acl
    side: outside
    phases: [shaping, finish]
    mechanism: Loaded if the skier falls back and inward, the outside ski loses its grip, and its inner edge catches as the knee straightens and turns in, the slip-catch seen in racing injuries. In a balanced carved turn the knee stays past 60° with the hamstrings co-contracting, which kept the modelled ACL force low
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
  - structure: acl
    side: inside
    phases: [shaping, finish]
    mechanism: Loaded if the skier banks onto an inside ski that then catches, or if a light inside ski re-engages in a wedge, twisting the knee inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: patellar-tendon
    side: outside
    phases: [shaping, finish]
    mechanism: Pulled hard through long quadriceps holds at a deep knee bend, more so at higher intensity and in a flexion transition
    protected_by: [vasti]
    confidence: low
    sources: [seifert-2023]
  - structure: lumbar-discs
    side: both
    phases: [shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under the turn load, about 2.9 BW at the low back in GS; longer turns hold that load longer
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

