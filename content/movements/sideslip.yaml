structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the edge set is abrupt with the skier sitting back, so the downhill ski catches while the knee straightens and turns in; the slip-catch seen in racing injuries. Our inference for this drill
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "121-122" }
      - { source: lind-sanders-2004, pages: "98, 192-193" }

