activations:
  # Downhill (outside) leg: most of a steady body-weight load, then the edge set's braking load.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Hold the flexed downhill knee under most of the skier's weight, then absorb the edge set
    confidence: medium
    basis: Measured as the main load-bearing muscle in normal turns, not in sideslips. Here the load is about body weight, mostly on the downhill leg, below a normal turn's; the edge set's braking adds to it, about 1.4 times body weight when dynamic by Lind & Sanders eq 4.7. The steady slip is about body weight at every pitch (eq 4.8), so only the finish steps up; per-setting values are our inference
    sources:
      - hintermeister-1997
      - kroll-2010
      - { source: lind-sanders-2004, pages: 91 }
      - { source: lemaster-2010, pages: "42-45" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Works with the vasti on the downhill knee
    confidence: medium
    basis: Measured as a knee extensor on the outside leg in normal turns; scaled with the load by inference
    sources: [kroll-2010, panizzolo-2013]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Eases the hip fold to release, holds it over the downhill ski, then controls it deepening into the edge set's angulation
    confidence: medium
    basis: Measured in normal turns; the hip extension moment here is smaller than in a turn and steady at about body weight, rising with the edge set's braking (eq 4.7) and its forward fold. Per-setting values are our inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "42-45, 54" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Holds the pelvis level over the downhill ski and the small sideways part of the angulation; eases to release and adds to it in the edge set. Its front fibres help turn the downhill thigh in
    confidence: medium
    basis: Measured on both legs in normal turns; the pelvic hold is mechanics and single-leg exercise data. Facing down the hill, the angulation is mostly hip fold, so its sideways load is small; the steady slip is about body weight at every pitch, and only the edge set's braking (eq 4.7, about 1.02, 1.09 and 1.39 W) steps it up when dynamic, by inference
    sources:
      - seifert-2023
      - moore-2020
      - { source: lind-sanders-2004, pages: "92-95" }
      - { source: lemaster-2010, pages: "70-71, 126" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Shares the pelvic hold with gluteus medius and helps turn the downhill thigh in
    confidence: low
    basis: Inferred from single-leg exercise data and moment arms in hip flexion; not measured on snow
    sources: [moore-2020, ganderton-2017, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Helps hold the downhill thigh turned in, yielding as the knee rolls down the hill and turning it back in for the edge set
    confidence: low
    basis: Inferred from exercise data and moment arms; not measured on snow
    sources: [selkowitz-2024, delp-1999]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Prime movers of the knee roll with the hip bent; they yield as the downhill knee rolls down the hill to release, hold it, then turn the thigh in to set the edge
    confidence: medium
    basis: Measured in normal turns; with the hip bent they are the strongest internal rotators, so they lead the knee roll (LeMaster p 108), by mechanics
    sources:
      - hintermeister-1997
      - delp-1999
      - { source: lemaster-2010, pages: 108 }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus, controlling the fold into the edge set
    confidence: low
    basis: Anatomy and a modelled hip extension moment in turns; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Co-contracts with the quadriceps to steady the downhill knee, and lengthens under load at the hip as the trunk folds into the edge set
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance
    sources: [hintermeister-1997, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting and caving in as the edge bites
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; the edge set adds a twisting load by mechanics
    sources: [zorko-2020, hintermeister-1997]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the shin on the tongue and makes the small fore-aft adjustments that keep the slip straight
    confidence: medium
    basis: Highly active in normal turns; a light, continuous holding role here, by inference
    sources:
      - hintermeister-1997
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 81 }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Help tibialis anterior keep the ankle closed
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources: [{ source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: 1
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the ankle against the boot; the edge set brakes across the skis, so it adds no fore-aft load here
    confidence: low
    basis: Anatomy and the boot's support, as modelled in turns; not measured on snow
    sources:
      - heinrich-2022
      - { source: lind-sanders-2004, pages: "87-88, 91" }
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Let the downhill ski flatten to release, hold its few degrees of edge with constant small corrections, then roll it back onto the edge to stop
    confidence: low
    basis: Recorded on snow, where activity followed posture; edge control in the boot is the drill's main job, but the boot shell carries most of the edging moment. Light while the femurs and boot do the release and the steady hold; higher only for the quick edge set, by inference
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lind-sanders-2004, pages: "54-55, 95" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch and co-contracts with the peroneals for fine edge control
    confidence: low
    basis: Inferred from anatomy; the ankle muscles help the boot resist the edge's flattening torque, and the outside foot's arch takes the sideways load; not measured on snow
    sources: [{ source: lemaster-2010, pages: "123-124, 139" }]
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole of the downhill foot
    confidence: low
    basis: Inferred; the outside foot's arch is built for sideways load; not measured on snow
    sources: [{ source: lemaster-2010, pages: 139 }]
  # Uphill (inside) leg: more bent, lightly loaded.
  - muscle: vasti
    side: inside
