structures:
  - structure: acl
    side: outside
    phases: [shaping]
    mechanism: Loaded if the skier drifts back on the one ski and is thrown onto the tail, the boot and the quadriceps pushing the shin forward; the backward-fall mechanism, at low speed here
    protected_by: [biceps-femoris, medial-hamstrings, tibialis-anterior]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: "192-193" }
      - { source: jordan-sporri-taylor-2023, pages: "120-121" }
  - structure: mcl
    side: outside
    phases: [shaping]
    mechanism: Our inference; if the flat ski rolls onto its big-toe edge and catches, it twists the stance knee inward
    protected_by: [medial-hamstrings, gracilis, sartorius, tibialis-anterior]
    confidence: low
    sources:
      - { source: lind-sanders-2004, pages: 98 }
  - structure: acl
    side: inside
    phases: [finish]
    mechanism: Loaded if the lifted ski is set down wide and angled, catches and is forced into a wedge, twisting the knee inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }

