activations:
  # Stance leg. The load is about body weight at every setting; what rises with intensity is the swing over
  # ripples and the stance depth, so only the extensors take per-setting values. Balance efforts stay flat.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Settle the stance knee as the whole weight arrives, hold it supple under body weight on one leg, and soak up the ripples
    confidence: medium
    basis: Body weight on one leg at a moderate knee bend is a single-leg stance or quarter-squat load, measured off snow; the vasti are measured highly active in turns, at higher loads. The load swing over ripples grows from about ±0.05 to ±0.25 body weight with speed, and the stance is a little deeper at speed; the per-setting values are our inference
    sources:
      - distefano-2009
      - hintermeister-1997
      - { source: lind-sanders-2004, pages: 113 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Works with the vasti as a knee extensor on the stance leg
    confidence: medium
    basis: Measured as a knee extensor on the loaded leg in normal turns; light here by inference
    sources: [kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Holds the hip hinge against the forward pitch that snow friction gives the body, and helps hold the pelvis over the stance hip
    confidence: medium
    basis: Measured in single-leg stance and squat exercises; the hip extension moment here is small because the hinge is shallow. Rises a step at dynamic with the deeper, more absorbing stance; our inference
    sources:
      - distefano-2009
      - { source: lind-sanders-2004, pages: 88 }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds up the lifted side of the pelvis, pelvis on femur, and makes the small side-to-side corrections that keep the CoM over a flat ski
    confidence: medium
    basis: Single-leg stance and the hip hitch rank top for gluteus medius in off-snow EMG; the job here is the same action. A balance effort, so it changes little with intensity
    sources:
      - moore-2020
      - ganderton-2017
      - distefano-2009
      - neumann-2010
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow
    sources: [moore-2020, ganderton-2017]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps hold the pelvis level over the stance hip
    confidence: low
    basis: Inferred from hip-hike exercise EMG; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contract with the abductors so the stance hip is stiff side to side, and make small rotary corrections
    confidence: low
    basis: Mechanics of single-leg balance; adductors are measured highly active in turns, at far higher loads
    sources: [hintermeister-1997]
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Shares the small hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [neumann-2010]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and checks the forward pitch of the trunk
    confidence: low
    basis: Measured in a simulated edged single-leg stance at 12-35 % of maximum, rising on wider skis; here the ski is flat and the load lower
    sources: [zorko-2020, ishige-2021]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.valgus, knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the stance knee caving in or twisting
    confidence: low
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged single-leg stance; lower with a flat ski by inference
    sources: [zorko-2020]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steady the femoral head and make the small rotary corrections that keep the flat ski running straight
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the shin onto the tongue as the weight arrives, then keeps it there and answers every roll toward the big-toe edge
    confidence: medium
    basis: Highly active in turns, where it holds the shin forward against a large load; on a flat glide the ankle moment is a small plantarflexion, so it works in short bursts against rolls toward the big-toe edge, a light balance job that changes little with intensity
    sources:
      - hintermeister-1997
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 81 }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Answer every roll toward the little-toe edge so the ski stays flat; co-contract with the inverters
    confidence: medium
    basis: Peroneus longus is measured highly active in turns and in balancing; on one flat ski the corrections never stop. A balance effort, so it changes little with intensity
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lind-sanders-2004, pages: "54-55" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals to keep the ski flat
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over heel, big-toe ball and little-toe ball and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow
    sources:
      - { source: iasi-2021, pages: 190 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Yields as the shin moves to the tongue, then holds the small plantarflexion moment that keeps the reaction just ahead of the CoM, shared with the boot shaft
    confidence: low
    basis: The net ankle moment under a loaded, flexed ankle is plantarflexion shared with the boot in a modelled turn; here it is small, set by snow friction
    sources:
      - heinrich-2022
      - { source: lind-sanders-2004, pages: 88 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness
    confidence: low
    basis: Inferred; medial gastrocnemius averaged above half of maximum in GS turns, but the boot shaft carries much of the ankle moment and the bent knee slackens it, so its share here is small; not measured in this drill
    sources: [hintermeister-1997, heinrich-2022]
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
