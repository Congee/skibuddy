    confidence: low
    basis: Inference; no study has measured iliopsoas on snow
    sources:
      - { source: lemaster-2010, pages: "62-63" }
  # Lifted leg. It carries no snow force except at the resting tip.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the thigh up while the knee lifts the tail, for the whole glide
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Holding up the leg, boot and ski, about 16 kg, is a moderate hip-flexor effort even with the tip resting, and it lasts the whole run
    sources:
      - jiroumaru-2014
      - juan-2024
      - andersson-1997
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works as a hip flexor on the lifted leg, not as a knee extensor
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg in normal turns; changes little with intensity
    sources: [kroll-2010, cuniberti-2026]
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 1 }
    contraction: { initiation: isometric, shaping: null, finish: concentric }
    role: Steady the knee lightly as the leg unloads, idle while the shank hangs, then extend the knee the last bit to place the ski and take the load at set-down
    confidence: medium
    basis: Measured low on the lightly loaded inside leg in normal turns; with the shank unweighted there is nothing to lower, so no eccentric work
    sources: [kroll-2010]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
