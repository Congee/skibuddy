structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the skier leans into the hill and back in the uphill arc, the downhill ski slips, and its edge catches as the knee straightens and turns in, the slip-catch seen in racing injuries
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: lemaster-2010, pages: 184 }
      - { source: jordan-sporri-taylor-2023, pages: "121-122" }

