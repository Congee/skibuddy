activations:
  # Downhill (outside) leg. Load is about body weight toward the fall line and builds in the uphill arc.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthen the downhill knee a little to release, hold it as the edges bite, then let it flex under the uphill arc's load
    confidence: medium
    basis: Measured high in normal turns; here the downhill foot carries about 0.6-1.0 BW at a modest bend, highest in the uphill arc, so the values are our inference
    sources:
      - hintermeister-1997
      - kroll-2010
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor
    confidence: medium
    basis: Measured as a knee extensor on the outside leg in normal turns
    sources: [kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip and lets it fold under the uphill arc's load
    confidence: medium
    basis: Measured in normal turns; scaled down here by inference
    sources: [hintermeister-1997, heinrich-2022]
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: concentric, finish: concentric }
    role: Lets the uphill half of the pelvis down for the release, then hikes and holds it as the angulation builds in the uphill arc
    confidence: medium
    basis: Measured on both legs in normal turns; the pelvic hold is mechanics, shared with the uphill foot
    sources: [seifert-2023, moore-2020]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: concentric, finish: concentric }
    role: Shares the pelvic hold with gluteus medius and helps turn the bent thigh inward in the uphill arc
    confidence: low
    basis: Not measured in skiing; single-leg exercise data and moment arms
    sources: [moore-2020, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: concentric, finish: concentric }
    role: Helps turn the downhill thigh inward to steer the uphill arc
    confidence: low
    basis: Moment arms in hip flexion; not measured on snow
    sources: [delp-1999, selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: concentric, finish: concentric }
    role: Turn the bent downhill thigh inward and its knee uphill to steer and edge the uphill arc
    confidence: medium
    basis: Adductors were highly active in turns on snow; with the leg bent they are the strongest turners of the thigh
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: eccentric, finish: eccentric }
    role: Turn the downhill thigh outward to steer the flattened skis toward the fall line, then control its inward turn in the uphill arc
    confidence: low
    basis: Moment arms in hip flexion; in a carved arc they brake rather than drive. Not measured in this drill
    sources: [delp-1999, heinrich-2023]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
