id: garland
name: Garland, a run of half-turns down and back up the hill without crossing the fall line
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# Sides: as in traverses and slips, outside is the downhill ski and inside the uphill ski, the same legs all run;
# the downhill ski is the outside ski of each uphill arc.
# Phases, one garland: initiation = from the traverse the edges let go (flat in the brushed form, just past flat
# onto the downhill edges in the carved form) and the skis head toward the fall line; shaping = the brief moment
# closest to the fall line, where the skis go back onto their uphill edges and start to bite; finish = the arc back
# across the hill on the uphill edges, where the load peaks. The transition is the short traverse between garlands.
# Brushed (steered with the legs) and carved (rolled only) garlands are technique, not intensity; the matrix gives
# both where they differ.
#
# Intensity (the drill's scenarios), Lind & Sanders eq 4.9 (p 103), load factor n heading toward the fall line
# (45° from across, gravity opposing the turn), near it (70°) and in the uphill arc (135°, gravity adding):
#   gentle   5 m/s, R 8 m,  12°:  about 0.99, 1.01, 1.08
#   moderate 7 m/s, R 10 m, 16°:  about 1.01, 1.04, 1.19
#   dynamic  9 m/s, R 12 m, 20°:  about 1.04, 1.10, 1.32
# Toward the fall line the load sits at or under body weight and, at low speed, gravity can supply more than the
# turn needs, so the skis can only drift flat or be tipped onto the downhill edges with angulation (L&S pp 103,
# 211). In the uphill arc gravity and the turn force add, and the downhill (outside) foot takes about 60-75 % of
# the load (heinrich-2022, falda-buscaiot-2017). Edge angle is released into each initiation and builds through
# the uphill arc to its most in the finish (IASI p 31).
# Downhill knee: most flexed at the end of the uphill arc, extending a little through the release, long and steady
# near the fall line, flexing (eccentric) through the uphill arc (LeMaster pp 40-42, IASI pp 35, 65-66). Our
# inference: downhill knee about 45-60°, hip about 40-55°, from shaping to the end of the arc; the uphill leg more
# flexed by the slope and the edge.
#
# Equipment assumed: recreational carving skis of about 15 m sidecut radius; boots with about 15° cuff lean,
# about 0.9° binding ramp (4.7 mm) and about 42 mm stand height. A deeper sidecut makes the carved uphill arc
# tighter at the same edge (LeMaster pp 32-33, L&S p 53); more lean or ramp deepens the knee (posch-2025).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the feet are drawn back and the shins move into the tongues while the edges let go, so the skis tip toward the fall line from the shovels
        contraction: concentric
        cue: Feet back and shins forward as the skis go downhill
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 85-86" }
          - { source: iasi-2021, pages: "33, 66" }
      shaping:
        action: Held flexed with the shin on the tongue as the uphill edges start to bite
        moment: Plantarflexion, small, shared with the boot shaft
        contraction: isometric
        cue: Shin on the tongue as the skis bite
        confidence: medium
        sources:
          - psia-c-l3-railroad-track-garlands
          - { source: lemaster-2010, pages: 85 }
      finish:
        action: Held, then opens a little as the foot runs forward and pressure moves toward the heel in the uphill arc
        contraction: concentric
        cue: Let the feet run a little ahead as the arc ends
        confidence: medium
        sources:
          - falda-buscaiot-2017
          - { source: iasi-2021, pages: "33, 66" }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Dorsiflexes with the downhill ankle; both shins forward
        contraction: concentric
        cue: Both shins forward, not just the downhill one
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
          - { source: cross-raschner-2023, pages: 14 }
      shaping:
        action: Held flexed with the shin on the tongue
        contraction: isometric
        cue: Uphill shin on the tongue too
        confidence: low
        sources: []
      finish:
        action: Held closed through the uphill arc, the uphill foot a little ahead
        contraction: isometric
        cue: Keep the uphill shin forward
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 126 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Lowered under control from the big-toe edge toward flat to release, and in the carved form just past flat onto the little-toe edge, so the skis head toward the fall line
        contraction: eccentric
        cue: Roll the feet downhill to let the edges go
        confidence: medium
        sources:
          - psia-c-l3-railroad-track-garlands
          - psia-c-basic-garlands
          - { source: iasi-2021, pages: "167-168" }
      shaping:
        action: Rolls back onto the big-toe edge before the fall line, early and gently
        contraction: concentric
        cue: Roll back uphill before the fall line
        confidence: medium
        sources:
          - psia-c-l3-railroad-track-garlands
          - { source: iasi-2021, pages: 167 }
      finish:
        action: Eversion keeps building through the uphill arc to its most near the end, then lets go into the next release
        moment: Eversion; most of it carried by the boot shell
        contraction: concentric
        cue: Keep rolling uphill as the arc tightens, then let go
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "123-124, 127" }
          - { source: iasi-2021, pages: 31 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Lowered under control from the little-toe edge toward flat with the downhill foot, and in the carved form just past flat onto the big-toe edge
        contraction: eccentric
        cue: Both feet roll downhill together
        confidence: low
        sources: [psia-c-l3-railroad-track-garlands]
      shaping:
        action: Rolls back onto the little-toe edge with the downhill ski
        contraction: concentric
        cue: Both feet roll uphill together
        confidence: low
        sources: [psia-c-l3-railroad-track-garlands]
      finish:
        action: Tilt built with the downhill ski through the uphill arc, then released
        contraction: concentric
        cue: Similar edge angles on both skis
        confidence: low
        sources: [psia-c-basic-parallel-garlands]
  - dof: foot.arch
    side: outside
    cells:
      initiation: { action: Arch held as the foot rolls, contraction: isometric, cue: Stand on heel and both balls of the foot, confidence: low, sources: [{ source: iasi-2021, pages: 190 }] }
      shaping: { action: Arch held as the edge bites, contraction: isometric, cue: Keep the arch from collapsing, confidence: low, sources: [] }
      finish: { action: Arch held under the uphill arc's load, contraction: isometric, cue: Spread the pressure as it moves to the heel, confidence: low, sources: [{ source: lemaster-2010, pages: 139 }] }
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under a light load, contraction: isometric, cue: Whole foot on the boot sole, confidence: low, sources: [] }
      shaping: { action: Arch held under a light load, contraction: isometric, cue: Whole foot on the boot sole, confidence: low, sources: [] }
      finish: { action: Arch held on the outer border of the foot, contraction: isometric, cue: Feel the little-toe side of the uphill foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend at the end of the last arc, helping the edges let go
        contraction: concentric
        cue: Rise a little to let the skis go
        confidence: medium
        sources:
          - psia-c-l3-railroad-track-garlands
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "35, 65" }
      shaping:
        action: Held near its longest, quasi-isometric, as the uphill edges bite; about 45° gentle, 50° moderate, 55° dynamic (our inference)
        moment: Extension, about body weight shared between the feet
        contraction: isometric
        cue: Long and steady as the skis bite
        confidence: low
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lind-sanders-2004, pages: 103 }
      finish:
        action: Flexes, absorbing the load that builds through the uphill arc, into its deepest bend at the end of it, about 55° gentle, 60° moderate, 65° dynamic (our inference)
        contraction: eccentric
        cue: Flex under control as the skis come back across the hill
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "35, 65-66" }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Lengthens toward the downhill leg as the edges flatten and the legs come back under the body
        contraction: concentric
        cue: Legs even as the skis flatten
        confidence: low
        sources: []
      shaping:
        action: Flexes again as the skis roll back onto their uphill edges, so the uphill leg is shorter
        contraction: eccentric
        cue: Shorten the uphill leg as the skis roll uphill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Held more bent than the downhill knee through the uphill arc, the difference growing with the edge
        contraction: isometric
        cue: Short uphill leg, long downhill leg
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
          - { source: iasi-2021, pages: 65 }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: lemaster-2010, pages: "124-125" }] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Uphill knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Uphill knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Uphill knee points where the ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee moves with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [{ source: lemaster-2010, pages: 69 }] }
      finish: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: low, sources: [zorko-2020] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Uphill knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Uphill knee in line with the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Uphill knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens a little from its fold at the end of the last arc as the leg lengthens
        contraction: concentric
        cue: Rise a little with the release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: Held at its most open, folded forward at the hip, about 40° gentle, 45° moderate, 50° dynamic (our inference)
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "54, 73-74" }
      finish:
        action: Folds further with the knee through the uphill arc
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Opens toward the downhill hip's angle as the skis flatten
        contraction: concentric
        cue: Legs even as the skis flatten
        confidence: low
        sources: []
      shaping:
        action: Flexes again as the uphill leg shortens; the uphill foot leads a little
        contraction: eccentric
        cue: Uphill thigh up a little
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
          - { source: lind-sanders-2004, pages: 126 }
      finish:
        action: Held more flexed than the downhill hip through the uphill arc
        contraction: isometric
        cue: Uphill half of the body strong and a little forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The hip angulation of the last arc lets go as the legs come back under the body and tip toward the fall line
        contraction: eccentric
        cue: Let the hips come over the feet to release
        confidence: low
        sources:
          - { source: iasi-2021, pages: 168 }
          - { source: lemaster-2010, pages: 130 }
      shaping:
        action: The downhill knee moves uphill with the rolling foot, then the pelvis tips over the downhill thigh as the legs tilt uphill, the uphill half rising, pelvis on femur
        contraction: concentric
        cue: Uphill hip up as the skis roll uphill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
      finish:
        action: Hip angulation builds through the uphill arc to its most near the end, then holds
        moment: Abduction and adduction co-contract; the sign of the frontal moment varies in modelled turns
        contraction: concentric
        cue: Hips in, over the downhill ski, as the arc tightens
        confidence: low
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: 128 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation: { action: Back toward neutral as the legs come under the body, contraction: isometric, cue: Keep the stance width, confidence: low, sources: [psia-c-basic-parallel-garlands] }
      shaping: { action: The uphill knee moves uphill with the rolling foot, contraction: concentric, cue: Uphill knee moves with the uphill foot, confidence: low, sources: [] }
      finish: { action: Held adducted at hip width under its share of the load, contraction: isometric, cue: Feet stay hip width apart, confidence: low, sources: [heinrich-2023] }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: In the brushed form the downhill thigh turns outward under the pelvis to steer the flattened skis toward the fall line; in the carved form it only follows the tipping
        contraction: concentric
        cue: Release first, then turn the legs downhill
        confidence: low
        sources:
          - psia-c-basic-parallel-garlands
          - { source: lemaster-2010, pages: "107-108" }
      shaping:
        action: Back toward neutral as the skis come under the pelvis near the fall line
        contraction: concentric
        cue: Skis under you, pelvis quiet
        confidence: low
        sources: []
      finish:
        action: Turns inward to steer the skis back across the hill in the brushed form; held and braked against the snow in the carved form
        contraction: concentric
        cue: Turn the legs uphill under a quiet upper body
        confidence: low
        sources:
          - psia-c-basic-parallel-garlands
          - delp-1999
          - heinrich-2023
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: In the brushed form the uphill thigh turns inward with the downhill one to steer the skis toward the fall line
        contraction: concentric
        cue: Both legs turn together
        confidence: low
        sources: [psia-c-basic-parallel-garlands]
      shaping:
        action: Back toward neutral near the fall line
        contraction: concentric
        cue: Skis parallel and the same distance apart
        confidence: low
        sources: []
      finish:
        action: Turns outward with the downhill thigh through the uphill arc, then holds
        contraction: concentric
        cue: Both legs turn together
        confidence: low
        sources: [psia-c-basic-parallel-garlands, delp-1999]
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up a little from the hinge as the legs lengthen; the low back slightly flattened from standing, never arched or slumped
