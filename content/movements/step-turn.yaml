structures:
  - structure: acl
    side: inside
    phases: [initiation]
    mechanism: Loaded if a diverging step lands with the tip out and catches, so the knee twists inward in a wedge; the dynamic snowplow seen in racing injuries, here at far lower speed
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the skier sits back to stop and the outside ski catches its inner edge with the knee straight; the boot-induced and slip-catch mechanisms
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: "192-193" }

