    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the pelvis level over the inside leg each time the outside ski is up
    confidence: medium
    basis: Repeated single-leg pelvic holds, as in off-snow single-leg exercises; measured on the inside leg in normal turns
