      shaping:
        action: Bends a little toward the outside ski as the legs tilt into the turn; the inside side lengthens to control it
        contraction: eccentric
        cue: Upper body a little over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      finish:
