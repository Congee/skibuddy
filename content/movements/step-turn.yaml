id: step-turn
name: Turn from a traverse by stepping the skis into the fall line, finished skidding to a stop
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# One turn, not linked. Our phases map onto it as follows: initiation = the steps from the traverse into the fall
# line; shaping = gliding through the fall line on both skis while the edges change; finish = the parallel
# skidded turn across the hill to a stop (psia-c-step-turn-fall-line, psia-national-activities).
# Sides are those of this turn: the inside ski is the downhill ski of the starting traverse and steps first,
# lifted and turned a little toward the fall line in the air; the outside (uphill) ski is then stepped to match.
# Each foot carries the whole load for a moment at every step. Steps may be small and diverging or parallel.
# The upper body faces generally down the hill throughout, so the legs turn under it: anticipation at the
# start, square in the fall line, counter in the finish.
# The steps repeat within initiation, so each leg both lifts (hip and knee flexors concentric) and takes a step
# (extensors catch it, eccentric). The schema gives one contraction per phase; cells and activations give the
# one that carries the most load and name the other in words.
#
# Intensity (the drill's scenarios): green terrain at walking-to-jogging speed.
# Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it (heading 135°):
#   gentle    3 m/s, R 5 m,  6°:   about 1.00, 1.01, 1.03
#   moderate  4 m/s, R 6 m,  9°:   about 0.99, 1.02, 1.06
#   dynamic   5 m/s, R 7 m, 12°:   about 0.99, 1.04, 1.10
# The finish ends in a stop. Braking from that speed over about 4 m (L&S eq 4.7, p 91) needs about the same
# total, about 1.02, 1.05 and 1.11 (our calculation), so the eq 4.9 values stand for it.
# The legs' pattern: independent flexion and extension through the steps, quasi-isometric and fairly tall
# through the fall line, then flexing to absorb the braking through the finish (LeMaster pp 40-42, P&T p 27).
# Our inference at these near-body-weight loads: outside knee about 50° gentle, 55° moderate, 60° dynamic in the
# fall line, 58°, 63° and 68° at the stop; hip about 40°, 45° and 50°, then 50°, 56° and 62°.
# Per-setting values are inference from these mechanics; a single number means it changes little with intensity.
#
# Equipment assumed: recreational skis, likely shorter and softer for this level; boots with about 15° cuff lean,
# about 0.9° binding ramp (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee
# (posch-2025, LeMaster pp 164-167).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes, shin into the tongue, so each step lands on the middle of the foot rather than the heel
        contraction: concentric
        cue: Pull the toes up; land each step centred
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81" }
          - psia-c-step-turn-fall-line
      shaping:
        action: Held flexed with the shin on the tongue as the skis run through the fall line, where the slope pulls the body back if the ankles open
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Stay forward as the skis point down the hill
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "83-86" }
          - heinrich-2022
      finish:
        action: Held flexed against the braking load as the skis skid to a stop; opening the ankle and sitting back to stop is a fault
        contraction: isometric
        cue: Keep the shin on the tongue as you slow to a stop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 85" }
          - kurpiers-2024
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Dorsiflexes and stays closed as the foot is lifted and placed, so the lifted ski stays level
        contraction: concentric
        cue: Lift the ski level, not tip down
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - { source: lemaster-2010, pages: 81 }
      shaping:
        action: Held flexed, shin on the tongue
        contraction: isometric
        cue: Both shins forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
      finish:
        action: Held flexed through the skid to a stop
        contraction: isometric
        cue: Both shins forward to the stop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 81 }
          - { source: patterson-2023, pages: 89 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: The uphill ski of the traverse starts on its little-toe edge; while loaded there the invertors hold it, then each time it is stepped it is placed flatter, ready for the edge change, a light eversion while the ski is lifted
        moment: Inversion while loaded on the little-toe edge; a light eversion while the ski is lifted
        contraction: concentric
        cue: Place the uphill ski flat as you step it
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
      shaping:
        action: Rolls through flat onto its big-toe edge as the skis pass the fall line; the edging starts in the feet and ankles
        contraction: concentric
        cue: Roll onto the big-toe edge with the feet
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - { source: lemaster-2010, pages: 127 }
      finish:
        action: Edge builds progressively to brake the skid and stop, then holds
        moment: Eversion
        contraction: concentric
        cue: More edge, gradually, to stop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "19-23" }
          - { source: lind-sanders-2004, pages: "91, 96" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: The downhill ski of the traverse starts on its big-toe edge; it is lifted and placed flatter at each step, rolled toward its little-toe edge
        contraction: concentric
        cue: Place the downhill ski flat as you step it
        confidence: low
        sources: [psia-c-step-turn-fall-line]
      shaping:
        action: Tips onto its little-toe edge with the outside ski as the skis pass the fall line
        contraction: concentric
        cue: Tip both skis together
        confidence: low
        sources:
          - { source: iasi-2021, pages: 189 }
      finish:
        action: Tilt held through the skid to the stop
        contraction: isometric
        cue: Both skis on matching edges
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 95 }
          - { source: lemaster-2010, pages: "123-124" }
  - dof: foot.arch
    side: outside
    cells:
      initiation: { action: Arch held up under each step's full load, contraction: isometric, cue: "Stand on heel, big-toe ball and little-toe ball", confidence: low, sources: [{ source: lemaster-2010, pages: 139 }] }
      shaping: { action: Arch held under load, contraction: isometric, cue: Keep the arch from collapsing, confidence: low, sources: [{ source: lemaster-2010, pages: "139, 161-162" }] }
      finish: { action: Arch held under the braking load, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "139, 161-162" }] }
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held up under each step's full load, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
      shaping: { action: Arch held under a lighter load, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
      finish: { action: Arch held under a lighter load, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Cycles with each step; flexes to lift the uphill ski and set it beside the inside ski, then takes the weight, the knee extensors catching it, which is the heavier part
        moment: Extension while loaded, a small flexion moment while lifted
        contraction: eccentric
        cue: Flex to lift, then flex a little to take the weight
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - psia-national-activities
      shaping:
        action: "Held fairly long and steady, quasi-isometric, as both skis glide through the fall line; about 50° gentle, 55° moderate, 60° dynamic (our inference)"
        moment: Extension
        contraction: isometric
        cue: Tall and balanced on both feet
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
          - { source: cross-raschner-2023, pages: 11 }
      finish:
        action: "Flexes to absorb the braking as the skis skid to a stop, about 58° gentle, 63° moderate, 68° dynamic at the stop (our inference)"
        contraction: eccentric
        cue: Sink a little to stop
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 45" }
          - hintermeister-1997
          - { source: lind-sanders-2004, pages: 91 }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Cycles with each step; flexes to lift the downhill ski first, then takes the weight when it is placed, the knee extensors catching it
        moment: Extension while loaded, a small flexion moment while lifted
        contraction: eccentric
        cue: Lift the inside ski first
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
      shaping:
        action: Held a little more bent than the outside knee as the weight moves toward the outside ski
        contraction: isometric
        cue: Inside leg a little shorter
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 55 }
      finish:
        action: Held more bent than the outside knee through the skid, lightly loaded
        contraction: isometric
        cue: Most of the weight on the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 137-139" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the leg in the hip socket, not at the knee", confidence: low, sources: [psia-c-step-turn-fall-line] }
      shaping: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the leg in the hip socket, not at the knee", confidence: low, sources: [psia-c-step-turn-fall-line] }
      shaping: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Land each step with the knee over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      finish:
        neutral: true
        moment: Resisting the inward collapse the edged braking load invites
        contraction: isometric
        cue: Knee over the foot as you stop
        confidence: low
        sources: [zorko-2020]
  - dof: knee.valgus
    side: inside
    cells:
      initiation:
        neutral: true
        contraction: isometric
        cue: Land a diverging step without the knee caving in
        confidence: low
        sources:
          - { source: jordan-sporri-taylor-2023, pages: 122 }
      shaping: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Cycles with each step; flexes to lift the ski, then the hip extensors catch the weight when it lands
        moment: Extension while loaded
        contraction: eccentric
        cue: Lift from the hip, not by leaning
        confidence: low
        sources: [psia-c-step-turn-fall-line]
      shaping:
        action: "Held at a modest fold, about 40° gentle, 45° moderate, 50° dynamic (our inference)"
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "54, 57" }
      finish:
        action: "Folds further with the knee as the legs absorb the braking, about 50°, 56° and 62° at the stop (our inference)"
        contraction: eccentric
        cue: Fold at the hips as you sink to stop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 45" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Cycles with each step; the hip flexors lift the downhill ski first, then the extensors catch the weight when it lands
        moment: Extension while loaded, flexion while lifted
        contraction: eccentric
        cue: Lift the inside ski with the hip
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - andersson-1997
      shaping:
        action: Held a little more flexed than the outside hip
        contraction: isometric
        cue: Inside leg a little shorter
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
      finish:
        action: Held more flexed than the outside hip through the skid, which brings the inside foot a little ahead
        contraction: isometric
        cue: Inside foot a little ahead
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: Holds the pelvis level over the outside leg each time the inside ski is up
        contraction: isometric
        cue: Pick a foot up without the hips dropping
        confidence: medium
        sources:
          - psia-c-step-turn-fall-line
          - ganderton-2017
          - distefano-2009
      shaping:
        action: The pelvis tips a little over the outside thigh as the legs tilt into the turn past the fall line
        contraction: concentric
        cue: Inside hip up a little
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      finish:
        action: Held, with a little angulation, as the edges build to stop
        contraction: isometric
        cue: Hips over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "126, 184" }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Holds the pelvis level over the inside leg each time the outside ski is up; the steps diverge a little at the tips, not wide at the feet
        contraction: isometric
        cue: Step the feet under the hips, not wide
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - ganderton-2017
      shaping: { action: Held at hip width, contraction: isometric, cue: Feet at hip width, confidence: low, sources: [] }
      finish: { action: Held at hip width, contraction: isometric, cue: Feet at hip width, confidence: low, sources: [] }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward while the ski is in the air, so the outside ski is stepped parallel to the inside one
        contraction: concentric
        cue: Turn the uphill ski in the air to match
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - delp-1999
      shaping:
        action: Keeps turning inward as the legs guide the skis through the fall line under a stable upper body
        contraction: concentric
        cue: Turn the legs, not the shoulders
        confidence: low
        sources:
          - psia-national-activities
          - { source: lemaster-2010, pages: "107-108" }
      finish:
        action: Keeps turning inward as the skis skid across the hill under a pelvis that still faces down the hill
        moment: Internal, steering against the snow
        contraction: concentric
        cue: Turn the legs under you to the stop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "107-108" }
          - delp-1999
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward while the ski is in the air, so the inside ski is set down pointing a little more down the hill, tips slightly diverging
        contraction: concentric
        cue: Turn the inside ski in the air, small changes of direction
        confidence: low
        sources:
          - psia-c-step-turn-fall-line
          - delp-1999
      shaping:
        action: Keeps turning outward with the turn
        contraction: concentric
        cue: Both legs turn together
        confidence: low
        sources: [psia-national-activities]
      finish:
        action: Keeps turning outward as the skis skid across the hill
        contraction: concentric
        cue: Both legs turn together to the stop
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Hip hinge held small and steady while the legs step; the low back slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Hinged a little at the hips, quiet
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "56-57, 62-63" }
      shaping:
        action: Held as the skis point down the hill; leaning back from the slope is a fault
        contraction: isometric
        cue: Stay with the skis as they point downhill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "83-84" }
      finish:
        action: Tilts forward a little with the hip hinge as the legs flex to stop
        contraction: eccentric
        cue: Fold at the hips as you sink
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: Kept nearly level; each lifted foot leaves that half of the pelvis to the standing hip's abductors, and a small drop or lateral shift of the upper body at each step is the common fault
        contraction: isometric
        cue: Lift a foot without the upper body moving sideways
        confidence: low
        sources: [psia-c-step-turn-fall-line]
      shaping:
        action: The inside half rises a little as the legs tilt into the turn
        contraction: concentric
        cue: Inside hip up a little
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      finish:
        action: Held through the skid to the stop
        contraction: isometric
        cue: "Don't let the inside hip drop as you stop"
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 71 }
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Faces generally down the hill from the traverse, the uphill half slightly ahead, while the skis are stepped round under it toward the fall line
        contraction: isometric
        cue: Belly button down the hill; step the skis to it
        confidence: low
        sources: [psia-c-step-turn-fall-line, psia-national-activities]
      shaping:
        action: Square to the skis as they point down the fall line
        contraction: isometric
        cue: Skis and belly button point the same way
        confidence: low
        sources: [psia-national-activities]
      finish:
        action: Keeps facing down the hill while the skis skid round across it, so counter builds to the stop
        contraction: isometric
        cue: Upper body faces down the hill as the skis turn across
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped, as the hips fold to stop
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
