    confidence: medium
    basis: Measured as a hip flexor on the inside leg in normal turns
    sources: [kroll-2010, seifert-2023]
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Catch each step on the inside ski, then hold the lightly loaded knee
    confidence: medium
    basis: Measured lower on the inside leg in normal turns
