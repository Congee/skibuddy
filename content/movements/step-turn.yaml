activations:
  # Outside (uphill at the start) leg: steps second in each pair, then takes most of the load in the skid.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Catch each step on the outside ski, hold the knee through the fall line, then absorb the braking to the stop
    confidence: medium
    basis: Measured in normal and wedge turns. Here the loads are about body weight at slow speed, carried by one foot only at each step, and the bend is shallow, so the effort is low except while braking to a stop at the faster settings; per-setting values are inference
    sources:
      - hintermeister-1997
      - hermann-2023
      - { source: lind-sanders-2004, pages: "91, 103" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti under load, and as a hip flexor when the outside ski is lifted to step
    confidence: medium
    basis: Measured as a knee extensor on the outside leg and a hip flexor on the inside leg in normal turns
    sources: [kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Catches each step at the hip and absorbs the braking with the knee extensors
    confidence: medium
    basis: Measured in normal turns; low at these loads, by inference
    sources: [hintermeister-1997, distefano-2009]
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Holds the pelvis level over the outside leg each time the inside ski is up, then tips it a little over the leg as the turn develops
    confidence: medium
    basis: Repeated single-leg pelvic holds, as in off-snow single-leg exercises; measured on snow in normal turns. A support effort, so it changes little with intensity
    sources: [ganderton-2017, distefano-2009, seifert-2023]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Shares the pelvic holds with gluteus medius
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow
    sources: [ganderton-2017, moore-2020]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Helps turn the thigh inward to step and steer the outside ski
    confidence: low
    basis: Moment arms in the flexed hip; not measured on snow
    sources: [delp-1999, selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Turn the bent outside thigh inward to match the inside ski and steer through the skid
    confidence: medium
    basis: Measured in wedge and normal turns; with the leg bent the adductors are strong internal rotators (LeMaster). Low at these loads
    sources: [hintermeister-1997, delp-1999, { source: lemaster-2010, pages: 108 }]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Bends the knee to lift the outside ski at each step, then co-contracts with the quadriceps
    confidence: medium
    basis: Hamstrings measured in normal turns; the lift is mechanics
    sources: [hintermeister-1997]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.flexion, knee.valgus]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help lift the ski and resist the knee caving in under the braking load
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance
    sources: [hintermeister-1997, zorko-2020]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: eccentric }
    role: Steady the hip joint as the thigh turns inward
    confidence: low
    basis: Anatomy and moment arms; not measured on snow
    sources: [delp-1999]
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the foot back so each step lands centred, and keeps the shin on the tongue to the stop
    confidence: medium
    basis: Measured in wedge and normal turns; beginners load the heel, so active ankle flexion is the point to teach
    sources: [hintermeister-1997, kurpiers-2024, { source: lemaster-2010, pages: "79-81" }]
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources: [{ source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Shares the plantarflexion moment with the boot shaft under load
    confidence: medium
    basis: Modelled ankle moments in carving; with the knee bent the soleus does the ankle work. Low at these loads
    sources: [heinrich-2022]
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Roll the outside ski off its little-toe edge, onto its big-toe edge through the fall line, and build the edge to stop; balance corrections at each one-foot step
    confidence: low
    basis: Peroneus longus recorded on snow, tracking posture; the edge-building role is mechanics. Rises with the braking edge at the faster settings
    sources: [louie-1984, { source: lind-sanders-2004, pages: "54-55" }]
  - muscle: tibialis-posterior
    side: outside
    serves: [ankle.inversion, foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: isometric }
    role: Lets the uphill ski off its little-toe edge, and holds the arch under each step
    confidence: low
    basis: Inferred; the foot can still roll inside the boot to let an edge go, and the outside foot's arch takes the sideways load; not measured on snow
    sources: [{ source: lind-sanders-2004, pages: 95 }, { source: lemaster-2010, pages: 139 }]
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure and make fine balance corrections on one foot
    confidence: low
    basis: Anatomy and the mechanics of single-leg balance; not measured on snow
    sources: [{ source: lind-sanders-2004, pages: 137 }]
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 0, finish: 0 }
    contraction: { initiation: concentric, shaping: null, finish: null }
    role: Lifts the outside ski to step it to parallel
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Repeated lifts of leg, boot and ski, about 0.6 Nm/kg of hip flexion moment while up (our estimate)
    sources: [andersson-1997, juan-2024, jiroumaru-2014]
  # Inside (downhill at the start) leg: steps first, turned out in the air; lightly loaded after the steps.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 0, finish: 0 }
    contraction: { initiation: concentric, shaping: null, finish: null }
    role: Lifts the inside ski at each step so it can be turned in the air
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Repeated lifts at about 0.6 Nm/kg of hip flexion moment (our estimate)
    sources: [andersson-1997, juan-2024, jiroumaru-2014]
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion, knee.flexion]
