structures:
  - structure: acl
    side: outside
    phases: [initiation]
    mechanism: Loaded if the tic ski is landed with the trunk behind the knee, on the tail with the knee near straight, so the boot cuff and a hard quadriceps pull drive the shin forward; the back-weighted landing seen in racing injuries, likelier at the dynamic, airborne tempo
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, tibialis-anterior]
    confidence: medium
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "120-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: inside
    phases: [initiation]
    mechanism: Loaded if the tac ski is set down wide, tip out, on its big-toe edge instead of its little-toe edge, so it catches in a wedge and twists the knee inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
      - { source: lind-sanders-2004, pages: "98, 193" }
  - structure: mcl
    side: inside
    phases: [initiation]
    mechanism: Our inference from the same wide catch, which the sources describe without naming this ligament; the knee caving in opens its inner side
    protected_by: [medial-hamstrings, gracilis, sartorius]
    confidence: low
    sources:
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: patellar-tendon
    side: outside
    phases: [initiation, finish]
    mechanism: Pulled hard by the quadriceps at each landing and through the absorbing finish at a deep knee bend, many times a run, more so at the dynamic tempo
    protected_by: [vasti]
    confidence: low
    sources: []
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under repeated landing and turn loads
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

