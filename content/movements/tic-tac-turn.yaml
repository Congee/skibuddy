id: tic-tac-turn
name: Short turn with a stepped edge change, each ski lifted and set on its new edge in turn
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns, stepping and
# landing mechanics.
# Sides: outside and inside are those of the new turn. The outside leg makes the "tic": it is the old inside (uphill)
# leg, lifted and stretched down onto its new big-toe edge. The inside leg makes the "tac": it is the old outside leg,
# the stance leg during the tic, then lifted and set on its new little-toe edge (IASI pp 172-173).
# Phases: initiation = the pole plant, the tic and the tac (the stepped edge change, two short single-leg moments,
# the CoM moving inside as each ski is placed out from under it); shaping = both skis on their new edges, edge angle
# and load building to and past the fall line; finish = completion on both edges, the legs flexing to absorb and to
# load the next lift, the next pole swinging forward. IASI's transition (skis flat, CoM crossing) is here the moment
# the old inside ski leaves the snow, between our finish and the next initiation.
#
# Intensity (the drill's scenarios) is tempo, speed and pitch, never a technique label:
#   gentle    5 m/s, R 7 m,  8°: very shallow and slow, the tic and the tac separate steps
#   moderate  7 m/s, R 8 m, 12°: quicker, the steps close together
#   dynamic   8 m/s, R 9 m, 16°: steeper, the tic and tac overlap into a brief airborne switch
# Arc load n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it (heading 135°), our inference:
#   gentle about 1.02, 1.06, 1.09; moderate about 1.06, 1.16, 1.25; dynamic about 1.06, 1.20, 1.33.
# In shaping and finish both skis carry it, the outside about 60-75 % (falda-buscaiot-2017, heinrich-2022).
# In initiation one leg carries all of it for a moment, twice: the inside (old outside) leg while the tic ski is in
# the air, then the outside leg while the tac ski is. Each lift unloads a leg and each placement pays it back:
# every unweighting is matched by an equal over-weighting (L&S p 119, T6 pp 215-217). As a reference, 0.2 s of
# free fall is stopped by about 2 W for 0.2 s (Fig 5.4, pp 118-120). Our inference per setting for the single-leg
# peak at the placement: about 1.0-1.1 W gentle (a step with almost no drop), 1.2-1.4 W moderate, 1.5-2 W dynamic
# (a short flight of about 0.1-0.15 s caught on the tic ski first). Drill values are inference; race data
# (1.5-2.8 W turn plateaus, cross-raschner-2023 pp 9-11) are a ceiling.
# Placing each ski out from under the CoM is what lets the CoM fall into the new turn: the feet must go out before
# the body can tip in (L&S p 138, T11 pp 234-241); stepping off the edged ski is the lateral projection of
# L&S pp 117-118.
# Edging: the new edge is set at the placement, so it engages earlier and more abruptly than a rolled edge change,
# above the fall line (IASI pp 172-173); from that modest angle it still builds progressively to its peak in late
# shaping and releases through the finish (lemaster-2010 p 128, IASI p 31).
# Flexion pattern: most flexed at the end of the finish and in the switch; each leg then lifts (hip and knee flexion,
# light) and is stretched down onto its edge (extension under load), so the legs lengthen a little through
# initiation; quasi-isometric through shaping; flexing again, absorbing, through the finish (LeMaster pp 40-42,
# P&T p 27, IASI pp 65-66). Our inference for the outside knee: about 55° gentle, 60° moderate, 65° dynamic in
# shaping, about 70°, 75° and 80° at the end of the finish; the hip about 10° less; the chest 20-30° forward of
# vertical, more as the tempo rises, mostly from the hips: slalom bent the spine forward less than GS (sporri-2016).
# The upper body faces down the hill while the legs turn under it, more than in long turns (IASI p 64, LeMaster
# p 128); the rotation of the skis is passive, from placing them on edge, not a twist (IASI p 172).
#
# Equipment assumed: recreational carving skis with a short-turn sidecut; boots with about 15° cuff lean, about 0.9°
# binding ramp (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster
# pp 164-167); a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132);
# a deeper sidecut tightens the turn (LeMaster pp 32-33, L&S p 53). A stiff boot cuff resists the shin at
# placement; a soft one lets the skier fall back on landing.
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the lifted foot is drawn back under the body, then the shin presses into the tongue as the ski is set down on its new edge, so the forebody grips first
        contraction: concentric
        cue: Pull the toes up as you lift; land with the shin on the tongue
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 86" }
          - { source: cross-raschner-2023, pages: 14 }
          - { source: iasi-2021, pages: "33, 187" }
      shaping:
        action: Held flexed against the rising load to the fall line, then opens a little as the foot starts forward; a little more flexed the faster the tempo
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
      finish:
        action: Opens progressively as the foot slides forward and pressure moves toward the heel, still flexed past upright, ready to become the next stance foot
        contraction: concentric
        cue: Let the feet come forward as the turn ends, not the hips back
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Closed under load while this leg stands alone during the tic, then dorsiflexes again as the foot is lifted and drawn back for the tac, and is set down with the shin on the tongue
        contraction: concentric
        cue: Both shins forward, the lifted one too
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "61-62, 79-81" }
          - { source: iasi-2021, pages: 16 }
      shaping:
        action: Held flexed, shin on the tongue, the inside foot a little ahead because the inside leg is more flexed
        moment: Small plantarflexion; the inside tibialis anterior rises after the fall line in a modelled carved turn
        contraction: isometric
        cue: Keep the inside shin forward too
        confidence: medium
        sources:
          - heinrich-2023
          - { source: lemaster-2010, pages: "61-62" }
      finish:
        action: Held closed while the outside foot comes forward; this foot will be the next lifted (tic) foot
        contraction: isometric
        cue: Keep the inside shin on the tongue
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 81 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: In the air the foot everts in the boot so the ski meets the snow already on its new big-toe edge, set a little away from the CoM; the edge grips at the placement
        contraction: concentric
        cue: Put the ski down on its big-toe edge, a little out from under you
        confidence: low
        sources:
          - { source: iasi-2021, pages: "172-173, 189" }
          - { source: lemaster-2010, pages: 127 }
      shaping:
        action: Eversion keeps building with the edge angle to its most in late shaping, below the fall line, then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Keep tipping onto the big-toe edge past the fall line
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Holds, then releases toward flat through the finish; this ski is lifted next and changes edge in the air
        contraction: eccentric
        cue: Let the edge go as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 38 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Lets go of the old big-toe edge as this foot is lifted, then inverts in the air so the ski is set down on its new little-toe edge, out from under the CoM rather than beneath it
        contraction: concentric
        cue: Roll the lifted foot to its little-toe edge before it lands
        confidence: low
        sources:
          - { source: iasi-2021, pages: "172-173, 189" }
      shaping:
        action: Inversion held, the edge building with the outside ski's
        contraction: isometric
        cue: Keep both skis tipped the same way
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "67, 142" }
      finish:
        action: Held, then rolls toward flat as the edges release; this ski becomes the next stance ski through the tic
        contraction: eccentric
        cue: Flatten both skis together
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 95 }
          - { source: lemaster-2010, pages: "123-124" }
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch braced as the foot lands and takes the whole load for a moment
        contraction: isometric
        cue: Land on heel, big-toe ball and little-toe ball together
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under the rising load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
          - falda-buscaiot-2017
  - dof: foot.arch
    side: inside
    cells:
      initiation:
        action: Arch braced while this foot carries the whole load during the tic, then quiet in the air
        contraction: isometric
        cue: Stand on the whole foot before you lift it
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
      shaping: { neutral: true, contraction: isometric, cue: A quiet foot on the little-toe edge, confidence: low, sources: [] }
      finish:
        action: Arch braced again as this foot takes more load, ready to carry the next tic
        contraction: isometric
        cue: Feel the whole foot before the next lift
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "137-139" }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Flexes a little to lift the ski, then extends to stretch it down onto the snow and takes the load as the inside ski lifts; the leg lengthens from its deepest bend in the switch
        moment: Extension once the ski is down; about 1-1.1 W gentle, 1.2-1.4 W moderate, 1.5-2 W dynamic at the placement (our inference)
        contraction: concentric
        cue: Lift, then reach the ski down and stand on it
        confidence: medium
        sources:
          - { source: iasi-2021, pages: "65-66, 172-173" }
          - { source: lind-sanders-2004, pages: "117-120" }
          - { source: bacharach-cross-2023, pages: 27 }
      shaping:
        action: Held near its longest, quasi-isometric, while the load builds with the inside ski helping; deeper the faster the tempo, about 55° gentle, 60° moderate, 65° dynamic (our inference)
        moment: Extension, near its peak
        contraction: isometric
        cue: Stay long and strong on the outside leg
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: cross-raschner-2023, pages: "11-14" }
          - alhammoud-2020
      finish:
        action: Flexes, absorbing the load as it peaks below the fall line and eases, into the switch, about 70° gentle, 75° moderate, 80° dynamic (our inference)
        contraction: eccentric
        cue: Flex under control to finish, ready to step
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
          - falda-buscaiot-2017
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Holds the whole load at its old-turn bend while the tic ski is in the air, then flexes to lift the tac ski once the outside ski holds, and lengthens a little to set it down, ending shorter than the outside leg
        moment: Extension while it stands alone; flexion (light) while lifted
        contraction: concentric
        cue: Stand, then lift the inside heel and set the ski down beside, not under, you
        confidence: low
        sources:
          - { source: iasi-2021, pages: "65, 172-173" }
          - psia-c-1000-steps
      shaping:
        action: Held more flexed than the outside knee while it carries its smaller share; the shorter inside leg lets the legs tip in together
        moment: Extension, similar to the outside knee because it is more flexed
        contraction: isometric
        cue: Short inside leg, still standing on it a little
        confidence: medium
        sources:
          - heinrich-2022
          - kroll-2011
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Flexes further with the outside leg as both absorb; it will be the stance leg through the next tic
        contraction: eccentric
        cue: Both legs flex together to finish
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Land with the knee pointing where the ski points, confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Set the ski down straight, not twisted", confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee points where the ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, moment: Resisting the inward collapse a wide landing invites, contraction: isometric, cue: Land with the knee over the foot, confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: "120-122" }] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Set the ski down without the knee caving in, confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: 122 }] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Flexes a little to lift the thigh, then opens from the switch's deep fold as the leg is stretched down and takes the load
        contraction: concentric
        cue: Lift, reach, then rise a little onto the new edge
        confidence: low
        sources:
          - { source: iasi-2021, pages: "172-173" }
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: Held at its most open, folded forward at the hip, about 10° less than the knee (our inference)
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further with the knee, absorbing the late load, into the switch
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Held under load during the tic, then flexes to lift the thigh for the tac, and stays more flexed than the outside hip as the ski is set down; the shortening comes mostly from the hip
        contraction: concentric
        cue: Draw the inside thigh up, then set the ski down short
        confidence: medium
        sources:
          - kroll-2010
          - { source: lemaster-2010, pages: "61-62" }
          - { source: iasi-2021, pages: 65 }
      shaping:
        action: Held more flexed than the outside hip while loaded; the inside foot leads a little as a result
        moment: Extension, similar to the outside hip because it is more flexed
        contraction: isometric
        cue: Inside hip folded, inside foot a little ahead
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "61-62" }
      finish:
        action: Folds further with the outside hip as both absorb
        contraction: eccentric
        cue: Fold both hips to finish
        confidence: low
        sources: []
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The free thigh moves out to place the ski a little wide of the CoM; once the ski is down and the inside foot lifts, the outside abductors hold up the unsupported inside half of the pelvis, pelvis on femur
        contraction: concentric
        cue: Step the ski out a little, then stand tall over the outside hip
        confidence: medium
        sources:
          - { source: iasi-2021, pages: "172-173" }
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
      shaping:
        action: Hip angulation builds with the edge to its most in late shaping, then held, now with the inside ski sharing the support
        moment: Abduction, varying; both abductors and adductors work
        contraction: isometric
        cue: Stay strong over the outside hip as the edge builds
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Holds under the late load, then releases as the legs come upright
        contraction: eccentric
        cue: Let the hips level as the turn ends
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: As the lone stance leg during the tic its abductors hold the other half of the pelvis up; then the free thigh is placed at hip width toward the turn's centre, out from under the CoM
        contraction: isometric
        cue: Stand tall on the inside leg, then set the inside ski down at hip width, not under you
        confidence: medium
        sources:
          - { source: iasi-2021, pages: "59, 172-173" }
          - moore-2020
          - ganderton-2017
      shaping:
        action: Held a little adducted relative to the pelvis as the legs tilt in more than the trunk
        moment: Adduction, held by adductor longus
        contraction: isometric
        cue: Keep the inside knee tipped in with the outside one
        confidence: medium
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held, then back toward neutral as the edges release
        contraction: isometric
        cue: Hip-width skis as the edges go flat
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: The free thigh turns inward a little so the ski lands pointing slightly into the new turn; the rotation is passive, set by the edge, not a twist of the ski
        contraction: concentric
        cue: Place the ski on its edge and let it point the way
        confidence: low
        sources:
          - { source: iasi-2021, pages: "172-173, 193" }
          - delp-1999
      shaping:
        action: Held turned in as the legs turn under a downhill-facing pelvis
        moment: Small; internal (steering) in a brushed turn, external (braking) if carved, extrapolated from a modelled carved GS turn
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - heinrich-2023
          - { source: lemaster-2010, pages: "107, 128" }
      finish:
        action: Turned further in as the skis come across under the downhill-facing pelvis, then unwinds with the release
        contraction: concentric
        cue: Legs turn, chest stays downhill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "109-110" }
          - { source: iasi-2021, pages: 64 }
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: The lifted thigh turns outward so the tac ski lands parallel to the outside ski
        contraction: concentric
        cue: Set the inside ski down parallel
        confidence: low
        sources: [delp-1999]
      shaping:
        action: Held turned out against an internal rotation moment
        moment: Internal, about 0.23 Nm/kg at most in a modelled carved turn, so the internal rotators hold the femur
        contraction: isometric
        cue: Keep the skis parallel as they turn
        confidence: medium
        sources: [heinrich-2022]
      finish:
        action: Held turned out as the skis come across, then unwinds with the release
        contraction: isometric
        cue: Keep the skis parallel to the end
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up from the switch's deep hip hinge as the legs lengthen onto the new edges; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise a little with the legs; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held over the long legs, never standing tall; tilting further than the balance needs, so the low back arches, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
          - { source: iasi-2021, pages: 194 }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the switch
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: Rocks side to side with each step; during the tic the outside half is held up by the inside (stance) hip's abductors, during the tac the inside half by the outside hip's, so it never drops toward the lifted foot
        contraction: concentric
        cue: Don't let the hip drop on the side of the lifted foot
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
          - psia-c-1000-steps
      shaping:
        action: Inside half held up as the edges build, with the inside ski sharing the support
        contraction: isometric
        cue: Inside hip up as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
      finish:
        action: Lowers toward level as the edges release
        contraction: eccentric
        cue: Level the hips for the next step
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Faces down the hill while the new skis are placed on edge; the separation from the old turn unwinds as the legs come under the body
        contraction: isometric
        cue: Belt buckle down the hill
        confidence: low
        sources:
          - { source: iasi-2021, pages: 64 }
          - { source: lemaster-2010, pages: "109-110, 128" }
      shaping:
        action: Held facing down the hill as the legs turn under it, building counter toward the outside of the turn
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 128" }
      finish:
        action: Counter at its most as the skis come across under a pelvis still facing down the hill
        contraction: isometric
        cue: Skis across, pelvis down the hill
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "74, 109" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the steps; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load, never arched or slumped
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped, while the hips fold
        contraction: isometric
        cue: Fold at the hips, not the low back
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends a little toward each stance foot in turn, then toward the outside ski once it holds; the lateral muscles on the lengthening side control it
        contraction: eccentric
        cue: Keep the upper body over the stance foot, not swaying
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
