activations:
  # Outside (tic) leg: lifts lightly, then is stretched down and carries the load alone during the tac, then most of it.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Stretches the leg down onto the new edge and takes the whole load while the inside ski is lifted, holds it through shaping, then lets it flex under the late load
    confidence: medium
    basis: Measured as the main outside-leg muscle in normal turns. At initiation this leg carries the whole load for a moment, about body weight in a gentle step and up to 1.5-2 times it when the dynamic switch is airborne and caught on this ski first (Lind & Sanders unweighting relations); shaping and finish follow the arc load of 1.1-1.3 times body weight shared with the inside ski. Per-setting values are our inference
    sources:
      - hintermeister-1997
      - kroll-2010
      - panizzolo-2013
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: "103, 118-120" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps lift the thigh for the tic, then works with the vasti as a knee extensor on the loaded leg
    confidence: medium
    basis: Measured as a knee extensor on the outside leg and a hip flexor on an unloading leg in normal turns; here it does both in turn. Scaled with load by inference
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Opens the hip as the leg is stretched onto the edge and takes the load, holds the fold, then lets it close under the late load
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn, shared with the hamstrings and adductor magnus. Scaled like the vasti with the placement and arc loads; the per-setting values are inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Places the free thigh out and then holds up the unsupported inside half of the pelvis while the inside ski is in the air; shares the hold with the inside ski afterwards
    confidence: medium
    basis: Single-leg stance and the hip hitch rank highest for gluteus medius and minimus off snow; measured on both legs in normal turns. The single-leg moment is short but repeated every turn, and the landing load rises with tempo; with both skis on the snow in shaping it is a normal-turn hold
    sources:
      - seifert-2023
      - moore-2020
      - ganderton-2017
      - distefano-2009
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and turns the flexed thigh inward as the ski is placed
    confidence: medium
    basis: Inferred from single-leg exercise data and moment arms; not measured on snow. Scaled as gluteus medius
    sources: [moore-2020, ganderton-2017, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps place the thigh out and turned in, and helps hold the pelvis
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: concentric }
    role: Brace the leg against the abductors at the landing, then turn the bent thigh inward as the skis come across under a downhill-facing pelvis
    confidence: medium
    basis: Measured in normal turns; the rotating role of the bent leg is mechanics, larger in short turns where the legs turn under the body
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Bends the knee to lift the tic ski, then co-contracts with the quadriceps at the landing and through the turn, sharing the hip extension moment
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance; a landing with the trunk forward of the knee keeps it working. Scaled with the load by inference
    sources: [hintermeister-1997, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee caving in and twisting outward at the landing and under the edged load
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns. Higher at a dynamic landing by inference
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Steady the femoral head at the landing and brake the thigh's inward turn as the skis come across
    confidence: low
    basis: The rotation moment is small and its sign depends on how much the ski carves; model of a carved GS turn only
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion, pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Lifts the thigh for the tic, then co-contracts to steady the pelvis on the loaded hip
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The lift is short and the leg light, so the effort is low
    sources: [jiroumaru-2014, juan-2024]
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the lifted foot back and up so the shin lands on the tongue; once the turn loads, only co-contracts
    confidence: medium
    basis: Measured as highly active in normal turns; active ankle flexion is a book technique point. The modelled shaping moment is plantarflexion, so its later work is co-contraction. Higher with a quicker tempo by inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin lands on the tongue, holds the flexed ankle with the boot shaft, then opens it to push the foot forward through the finish
    confidence: medium
    basis: Ankle moments modelled in carving sit partly in the muscles and partly in the boot shaft; with the knee bent the soleus does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps bend the knee for the lift, then adds a little ankle stiffness
    confidence: low
    basis: Inferred from anatomy; it crosses the knee, so it can help bend the leg for the lift, and on landing it adds a little stiffness while the boot holds the ankle flexed; not measured on snow
    sources: [{ source: patterson-2023, pages: 89 }]
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity:
      initiation: 2
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the new big-toe edge in the air and hold it at the landing, then build the edge into late shaping and let it go
    confidence: medium
    basis: Highly active in turns, attributed to edge control. The landing on one edge is a balance effort that changes little with intensity; the shaping edge grows with speed and pitch
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Braces the arch at the landing and co-contracts with the peroneals for balance on the edge
    confidence: low
    basis: Anatomy and the mechanics of landing on one ski; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the landing pressure over the sole and make fine balance corrections
    confidence: low
    basis: Inferred; the outside foot's arch is built for sideways load; not measured on snow
    sources: [{ source: lemaster-2010, pages: 139 }]
  # Inside (tac) leg: the lone stance leg during the tic, then lifted and set down short, then loaded and shortened.
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Hold the whole load on the old edge while the tic ski is in the air, then a smaller share on the shortened inside leg
    confidence: medium
    basis: Inside vastus lateralis measured about half the outside in normal turns; the single-leg stance during the tic briefly carries the whole load, more the quicker the tempo. Per-setting values are inference
    sources:
      - kroll-2010
      - heinrich-2023
      - { source: lind-sanders-2004, pages: "118-120" }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity:
      initiation: 2
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lifts the thigh for the tac and keeps the inside leg short, a hip-flexor role
    confidence: medium
    basis: Measured as a hip flexor on the inside leg in normal turns, higher in flexion-led transitions; the lift is mechanics
    sources: [kroll-2010, seifert-2023, cuniberti-2026]
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Lifts the thigh off the old edge for the tac and holds the inside hip folded
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Lifting leg, boot and ski quickly is a moderate hip-flexor effort; in shaping the inside leg is loaded, so only a hold
    sources: [jiroumaru-2014, juan-2024, andersson-1997]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Bends the knee to lift the tac ski; its short head is a pure knee bender. Then co-contracts on the loaded inside leg
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the lift is mechanics
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion, knee.valgus]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help lift the ski, then guard the knee against caving in as the ski is set down wide
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gracilis
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps bend the knee for the lift and steadies the knee's inner side at the set-down
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, hip.rotation, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Flexes the hip, turns the thigh out and bends the knee together as the tac ski is lifted and set down parallel
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: gastrocnemius
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps bend the knee for the lift, then adds a little ankle stiffness
    confidence: low
    basis: Inferred from anatomy; it crosses the knee, so it can help bend the leg for the lift, and on landing it adds a little stiffness while the boot holds the ankle flexed; not measured on snow
    sources: [{ source: patterson-2023, pages: 89 }]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Holds the hip under the whole load during the tic and turns the lifted thigh out; then shares the inside leg's extension moment
    confidence: medium
    basis: The inside hip carries an extension moment similar to the outside in a modelled turn because it is more flexed; the single-leg moment adds to it briefly
    sources: [heinrich-2022, delp-1999]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction, pelvis.list]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: 1
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds up the other half of the pelvis while this leg stands alone during the tic, then places the free thigh at hip width
    confidence: medium
    basis: Single-leg stance ranks highest for gluteus medius off snow, and inside gluteus medius is active in normal turns; the moment is short but repeated each turn, and loaded harder at a quicker tempo
    sources: [seifert-2023, moore-2020, ganderton-2017]
