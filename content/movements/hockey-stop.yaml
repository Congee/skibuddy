structures:
  - structure: acl
    side: outside
    phases: [shaping]
    mechanism: Loaded if the edges are set abruptly with the skier back, so the downhill ski catches while the knee straightens and turns in; the slip-catch seen in racing injuries. Our inference for this drill
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - bere-2013
      - { source: jordan-sporri-taylor-2023, pages: "121-122" }
      - { source: lind-sanders-2004, pages: "98, 192-193" }
  - structure: patellar-tendon
    side: outside
    phases: [shaping, finish]
    mechanism: Pulled hard by the quadriceps braking at a deep knee bend, more so the shorter and faster the stop
    protected_by: [vasti]
    confidence: low
    sources: [{ source: lind-sanders-2004, pages: 91 }]
  - structure: lumbar-discs
    side: both
    phases: [shaping]
    mechanism: Squeezed when the braking load meets a trunk bent forward and sideways and held against twist; our inference from the racers' pattern
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: low
    sources: [sporri-2015, sporri-2016]

