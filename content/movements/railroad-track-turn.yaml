  - dof: neck.flexion
    side: trunk
    cells:
      initiation: { action: Head up with the eyes down the corridor, contraction: isometric, cue: Eyes ahead down the corridor, confidence: low, sources: [{ source: lemaster-2010, pages: 64 }] }
      shaping: { action: Head held steady, contraction: isometric, cue: A steady head, confidence: low, sources: [] }
