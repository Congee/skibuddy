      shaping: { neutral: true, contraction: isometric, cue: Look straight down the corridor, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Look straight down the corridor, confidence: low, sources: [] }

activations:
  # Ankles and feet: the drill's working part. Tipping moments are small and mostly carried by the shell.
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the outside foot onto its big-toe edge with the inside foot, build the small edge to the fall line, then let it roll back
    confidence: low
    basis: Peroneus longus was recorded on snow, and racing books report it highly active for edge control; at these small edge angles the moment is small, so effort 2 at the roll itself is our inference. Changes little with intensity
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.inversion, ankle.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Lifts the inside big toe to lead the roll onto the little-toe edge, and keeps the shin on the tongue
    confidence: low
    basis: Mechanics of inversion and dorsiflexion inside the boot; inside tibialis anterior was active in a model of a carved turn, but this drill is not measured
    sources:
      - heinrich-2023
      - psia-c-railroad-tracks
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Inverts the inside foot with tibialis anterior to lead the edge change
    confidence: low
    basis: Inferred from anatomy and the mechanics of tipping inside the boot; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: "95, 139" }
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
