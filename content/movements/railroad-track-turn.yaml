      initiation: { action: Arm held forward with the pole tip off the snow, contraction: isometric, cue: Hands forward; no pole touch needed, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Arm held forward, contraction: isometric, cue: Hands forward, confidence: low, sources: [] }
