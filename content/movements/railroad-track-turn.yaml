structures:
  - structure: acl
    side: outside
    phases: [initiation]
    mechanism: Loaded if the new outside ski is put on its big-toe edge first and catches while the skier sits back, twisting the knee inward; at these speeds the load is small, so this is a habit to avoid rather than a likely injury
    protected_by: [biceps-femoris, gluteus-medius, adductors]
    confidence: low
    sources:
      - psia-c-railroad-tracks
      - { source: lind-sanders-2004, pages: "98, 192-193" }

