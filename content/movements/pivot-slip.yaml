structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the new edge catches while the thigh is still turning in and the skier is back, twisting the knee inward; our inference from the caught-edge and slip-catch mechanisms
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: 98 }

