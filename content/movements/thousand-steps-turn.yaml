activations:
  # Outside leg: the main stance leg, loaded for most of each step cycle and lifted for a moment between its steps.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 2
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Carry the outside leg's stances through the turn's flex pattern; each step adds a small eccentric catch and a small concentric push-off
    confidence: medium
    basis: Measured in normal turns. Each stance carries the whole load, about 1.0-1.2 times body weight at these speeds, but only for part of each cycle, so the mean stays at 2; dynamic's 2 at initiation reflects a deeper bend. Inference from the loads and the step pattern
    sources:
      - hintermeister-1997
      - kroll-2010
      - heinrich-2022
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti under each stance, and as a hip flexor when the outside ski is lifted between steps
    confidence: medium
    basis: Measured as a knee extensor on the outside leg and a hip flexor on the inside leg in normal turns; here it does both in turn
    sources: [kroll-2010, panizzolo-2013]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 2
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip under each stance and helps catch each step
    confidence: medium
    basis: Hip extension moment modelled in carved turns; scaled like the vasti for part-time loading. Inference
    sources: [hintermeister-1997, heinrich-2022, distefano-2009]
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the pelvis over the outside leg each time the inside foot lifts, catching a small drop at every step, and hikes the inside half as the edge builds
    confidence: medium
    basis: Measured on both legs in normal turns; repeated single-leg pelvic holds match off-snow single-leg exercise data. A balance and support effort that changes little with these modest loads
    sources: [seifert-2023, ganderton-2017, distefano-2009, moore-2020]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the repeated pelvic holds with gluteus medius and steadies the head of the femur
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow
    sources: [moore-2020, ganderton-2017]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps hold the pelvis and turn the thigh inward
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to steer, then co-contract with the abductors so each step lands at hip width
    confidence: medium
    basis: Measured in normal turns; lower here, with little steering in a large turn
    sources: [hintermeister-1997, { source: lemaster-2010, pages: "108, 124-125" }]
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment under each stance
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps at each landing, and bends the knee to lift the outside ski between its steps
    confidence: medium
    basis: Hamstring co-contraction measured in normal turns and on landing; the lift is mechanics. Scaled with the load by inference
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in at each landing
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns
    sources: [zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and control the thigh's inward turn
    confidence: low
    basis: Extrapolated from a model of a carved GS turn and cadaver moment arms
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: { gentle: 1, moderate: 2, dynamic: 2 }, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the foot back into the new turn and re-centres it at each step; once the turn loads, co-contracts, as the net ankle moment under a stance is plantarflexion
    confidence: medium
    basis: Measured in normal turns, where it is highly active; active ankle flexion is a book technique point
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources: [{ source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Shares the plantarflexion moment with the boot shaft under each stance, then opens the ankle through the finish
    confidence: medium
    basis: Modelled ankle moments in carving; with the knee bent the soleus does the ankle work. Scaled with load by inference
    sources: [heinrich-2022]
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee bent
    confidence: low
    basis: Inferred; medial gastrocnemius averaged above half of maximum in GS turns, but the boot shaft carries much of the ankle moment and the bent knee slackens it, so its share here is small; not measured in this drill
    sources: [hintermeister-1997, heinrich-2022]
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Place each outside step on the big-toe edge, build the edge, and make the balance corrections of every single-leg stance
    confidence: medium
    basis: Highly active in turns, attributed to edge control; every step is a fresh landing on one edge. A balance effort, so it changes little with intensity
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals at each landing
    confidence: low
    basis: Anatomy and the mechanics of single-leg balance; not measured on snow
    sources: [{ source: lind-sanders-2004, pages: 137 }]
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of single-leg balance; not measured on snow
    sources: [{ source: lind-sanders-2004, pages: 137 }]
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Lifts the outside ski a little between its steps
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Short, low lifts of a leg, boot and ski
    sources: [andersson-1997, juan-2024]
  # Inside leg: lifted for more of each cycle, loaded for brief steps on its little-toe edge.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Lifts the inside leg at every step, the ski level; placing it again is a short eccentric lowering
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. Repeated lifts of the leg, boot and ski, about 16 kg, at about 0.6 Nm/kg of hip flexion moment while up (our estimate), with short rests while the foot stands
    sources: [jiroumaru-2014, juan-2024, andersson-1997, kroll-2010]
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Works as a hip flexor lifting the inside leg at each step
    confidence: medium
    basis: Measured as a hip flexor on the inside leg in normal turns
    sources: [kroll-2010, cuniberti-2026, seifert-2023]
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: eccentric, finish: eccentric }
    role: Catch each brief step on the inside ski at its deeper knee bend, then push off it
    confidence: medium
    basis: Measured lower on the inside leg in normal turns; here it carries the whole load only for short steps. Rises in the finish as the leg becomes the outside one
    sources: [kroll-2010, { source: cross-raschner-2023, pages: 14 }]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Bends the knee to lift the inside ski at each step and co-contracts at each landing
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the lift is mechanics
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Help bend the knee to lift the ski
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: eccentric }
    role: Catches each brief step on the inside ski at its deeper hip fold, and helps turn the thigh out
    confidence: low
    basis: The loaded inside leg needs hip extension moments like the outside one (modelled); brief here
    sources: [heinrich-2022]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the pelvis for the brief moments the inside foot stands alone
    confidence: medium
    basis: Measured on the inside leg in normal turns; repeated single-leg pelvic holds match off-snow data. Brief, so lower than the outside side; rises as this leg becomes the outside one
    sources: [seifert-2023, ganderton-2017, distefano-2009]
  - muscle: gluteus-minimus
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Shares the brief pelvic holds with gluteus medius
    confidence: low
    basis: Inferred from single-leg exercise data; not measured on snow
    sources: [moore-2020]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh out so each step lands parallel
    confidence: low
    basis: Anatomy and moment arms; not measured on snow
    sources: [delp-1999]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep each inside step at hip width and hold the thigh against the internal-rotation moment of a loaded inside leg
    confidence: low
    basis: Modelled inside adductor longus in normal turns
    sources: [heinrich-2023, heinrich-2022]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Helps lift the thigh
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: concentric }
    role: Helps lift the thigh and bend the knee
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Keeps the shin on the tongue and the lifted ski level, and tips the inside ski onto its little-toe edge
    confidence: low
    basis: Modelled on the inside leg in normal turns
    sources: [heinrich-2023, { source: lind-sanders-2004, pages: 47 }]
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the inside ski on its little-toe edge under each brief step
    confidence: low
    basis: Anatomy and the mechanics of a load on the little-toe edge; the boot shell takes most of it
    sources: [{ source: lemaster-2010, pages: "137-139" }]
  # Trunk: a stable torso while the legs step under it.
  - muscle: quadratus-lumborum
    side: inside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Controls the trunk's slight bend toward the outside ski and keeps it from swaying with the steps
    confidence: low
    basis: EMG off snow; the role here is mechanics
    sources: [andersson-1996, mcgill-1996]
  - muscle: quadratus-lumborum
    side: outside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the inside side so the trunk stays quiet as the weight moves foot to foot
    confidence: low
    basis: EMG off snow
    sources: [mcgill-1996]
  - muscle: internal-oblique
    side: outside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the slight counter, paired with the inside external oblique
    confidence: medium
    basis: Measured and modelled in normal turns; a large turn needs little counter
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: external-oblique
    side: inside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Pairs with the outside internal oblique to hold the counter
    confidence: medium
    basis: Measured and modelled in normal turns
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: internal-oblique
    side: inside
    serves: [lumbar.side-bend, thoracic.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Helps the inside quadratus lumborum control the trunk's bend
    confidence: low
    basis: Mechanics; internal oblique ranks high in a model of carving
    sources: [heinrich-2023]
  - muscle: external-oblique
    side: outside
    serves: [thoracic.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the trunk by co-contraction
    confidence: low
    basis: Mechanics
    sources: []
  - muscle: rectus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Balances the back extensors so the low back stays slightly flattened from standing, never arched or slumped
    confidence: medium
    basis: Measured at low levels in normal turns
    sources: [hintermeister-1997, { source: lemaster-2010, pages: "62-63" }]
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the forward-folded trunk, quiet and steady over the stepping legs
    confidence: medium
    basis: Measured in normal turns; the loads here change little between settings
    sources: [hintermeister-1997, zeglinski-1998, heinrich-2022]
  - muscle: multifidus
    side: both
    serves: [lumbar.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies each segment of the low back
    confidence: low
    basis: Linked to back complaints in racers; not measured in turns
    sources: [{ source: jordan-sporri-taylor-2023, pages: 116 }]
  - muscle: transversus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the trunk so the legs can step under a still torso
    confidence: low
    basis: Anatomy; not measured on snow. The task asks for a stable torso while the legs step
    sources: [psia-national-activities]
  - muscle: neck-stabilisers
    side: both
    serves: [neck.flexion, neck.side-bend, neck.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the head level and the eyes ahead while the body steps
    confidence: low
    basis: Book technique point; not measured on snow
    sources: [{ source: lemaster-2010, pages: "64, 72" }]
  # Upper body: arms held forward and wide; no pole touch.
  - muscle: anterior-deltoid
    side: both
    serves: [shoulder.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the arms forward with the hands in view
    confidence: low
    basis: Book technique point; not measured on snow
    sources: [{ source: lemaster-2010, pages: "142-143" }]
