structures:
  - structure: acl
    side: outside
    phases: [shaping, finish]
    mechanism: Loaded if a step lands back on the tail with the knee straight and the ski catches its inner edge; the boot-induced and slip-catch mechanisms seen in racing injuries
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
  - structure: acl
    side: inside
    phases: [initiation, shaping]
    mechanism: Loaded if an inside step lands diverging, tip out, and catches, so the knee twists inward in a wedge; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by forward flexion and side bend under the turn load; swaying the trunk with each step adds repeated side bending
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: low
