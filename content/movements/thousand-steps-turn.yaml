id: thousand-steps-turn
name: Turn made of continuous small steps from ski to ski
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# Phases: initiation = LeMaster's and IASI's initiation, Pritchard & Taylor's initiation after the turn switch;
# shaping = LeMaster's control phase, IASI's fall line, P&T's steering phase; finish = completion in all three.
# Their transition sits between our finish and the next initiation; the stepping carries on through it.
# The skier steps from ski to ski all turn: each ski is lifted a little, about parallel to the snow, and placed
# on its edge, so each foot in turn carries the whole load for a moment. After the first diverging step into the
# turn the skis stay nearly parallel and leave narrow edged tracks; the outside ski carries the load for more of
# each cycle than the inside ski (psia-c-1000-steps, psia-national-activities).
# The cycle repeats several times in every phase, so each row and muscle works two ways within a phase: a leg
# lifts (hip and knee flexors concentric) and is placed (eccentric), and a leg takes a step (extensors catch it,
# eccentric) and pushes off (concentric). The schema gives one contraction per phase, so cells and activations
# give the one that carries the most load and name the other in words.
#
# Intensity (the drill's scenarios): during each single-leg stance that foot carries the whole snow force.
# Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it (heading 135°):
#   gentle    6 m/s, R 14 m,  8°:   about 1.00, 1.02, 1.05
#   moderate  8 m/s, R 16 m, 11°:   about 1.01, 1.06, 1.12
#   dynamic  10 m/s, R 18 m, 14°:   about 1.02, 1.12, 1.22
# Each step's catch adds a little on top, more the higher and quicker the step; we do not size it. Efforts are
# means over a phase in which each leg is loaded for only part of the time, so they sit a step below a drill that
# holds one leg loaded all turn.
# Under the steps the turn keeps the usual flexion pattern: most flexed in the transition, a little longer
# through initiation, quasi-isometric through shaping, absorbing through the finish (LeMaster pp 40-42,
# P&T p 27, IASI pp 65-66). Our inference for the outside leg at these lower loads: hip about 46-58° gentle,
# 51-64° moderate, 57-71° dynamic mid-turn to transition; knee about 58-66°, 62-70° and 67-76°. Race reference:
# heinrich-2022's GS outside hip 50-81°, knee 56-80°.
# Per-setting values are inference from these mechanics; a single number means it changes little with intensity.
#
# Equipment assumed: recreational carving skis; boots with about 15° cuff lean, about 0.9° binding ramp
# (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167);
# a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132); a deeper
# sidecut tightens the turn (LeMaster pp 32-33, L&S p 53).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the feet are drawn back and the shin presses into the tongue while the body crosses over; re-closed each time the foot is placed, so every step lands centred
        contraction: concentric
        cue: Pull the toes up and land each step on the middle of the foot
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 182-183" }
          - { source: cross-raschner-2023, pages: 14 }
          - psia-c-1000-steps
      shaping:
        action: Held flexed against the rising load through every step, then opens a little as the foot starts forward
        moment: Plantarflexion while loaded, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue through every step
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - psia-national-activities
      finish:
        action: Opens progressively as the foot slides forward under the body, still flexed past upright; pressure moves toward the heel
        contraction: concentric
        cue: Let the foot slide ahead as the turn ends, without stepping onto the tail
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Dorsiflexes with the outside ankle, shin into the tongue, and stays closed as the foot is lifted and placed
        contraction: concentric
        cue: Both shins forward, every step
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
      shaping:
        action: Held flexed, shin on the tongue, so the lifted ski stays level and lands centred
        contraction: isometric
        cue: Lift the ski level, not tip down
        confidence: low
        sources: [psia-c-1000-steps]
      finish:
        action: Held flexed as the steps carry on into the transition, where this leg becomes the outside one
        contraction: isometric
        cue: Keep the shin on the tongue into the next turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts in the boot as the skis change edges, so each step of this foot lands on the big-toe edge; the stepping carries on through the edge change
        contraction: concentric
        cue: Step onto the big-toe edge
        confidence: medium
        sources:
          - psia-c-1000-steps
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: 127 }
      shaping:
        action: Eversion keeps building with the edge to its most in late shaping and holds the edge under each stance; each step is placed on the edge, never flat, so the track stays narrow
        moment: Eversion while loaded
        contraction: concentric
        cue: Place every step on its edge; the edge angle builds with speed and pitch
        confidence: medium
        sources:
          - psia-c-1000-steps
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55, 137" }
      finish:
        action: Eases toward flat as the turn ends, while the steps continue into the edge change
        contraction: eccentric
        cue: Let the edge go as the turn ends, still stepping
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 38 }
          - psia-national-activities
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts so the inside ski lands on its little-toe edge with each step, leading the edge change
        contraction: concentric
        cue: Step onto the little-toe edge
        confidence: low
        sources:
          - psia-c-1000-steps
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Tilt held; for the moment the inside foot carries the whole load, the snow force on its little-toe edge needs an inversion moment, and the boot shell takes most of it
        moment: Inversion while loaded
        contraction: isometric
        cue: Short, light steps on the inside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "137-139" }
          - { source: lind-sanders-2004, pages: "54-55" }
      finish:
        action: Tilt held, then rolls toward flat as the edges change and this ski becomes the outside one
        contraction: eccentric
        cue: Let the little-toe edge go into the next turn
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 95 }
          - { source: lemaster-2010, pages: "123-124" }
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the whole load at each step
        contraction: isometric
        cue: Land on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under each loaded step
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
          - falda-buscaiot-2017
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under each brief loaded step on the little-toe edge, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
      shaping: { action: Arch held under each brief loaded step, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
      finish: { action: Arch held under each brief loaded step, contraction: isometric, cue: Spread the pressure over the sole, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition as the new turn loads. Under that, each step is caught with a small yield and pushed off with a small extension, and the leg is lifted for a moment between its steps
        contraction: concentric
        cue: Grow into the new turn, stepping all the time
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - psia-c-1000-steps
      shaping:
        action: "Held near its longest, quasi-isometric, under each stance; deeper the harder the turn, about 58° gentle, 62° moderate, 67° dynamic (our inference). Small yields and pushes ride on top as the weight moves foot to foot"
        moment: Extension while loaded
        contraction: isometric
        cue: Flex and extend each leg on its own to move the weight across
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: cross-raschner-2023, pages: "11-14" }
          - psia-c-1000-steps
          - heinrich-2022
      finish:
        action: "Flexes, absorbing the load as it peaks below the fall line, into its deepest bend in the transition, about 66° gentle, 70° moderate, 76° dynamic (our inference), still stepping"
        contraction: eccentric
        cue: Flex under control as the turn ends; keep stepping
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: More bent than the outside knee. Cycles with each step; the hamstrings lift the ski a little, then the knee extensors catch the brief load when it is placed, which is the heavier part
        moment: Extension while loaded, a small flexion moment while lifted
        contraction: eccentric
        cue: Short leg, light quick steps
        confidence: low
        sources:
          - psia-c-1000-steps
          - kroll-2010
          - { source: lemaster-2010, pages: 55 }
      shaping:
        action: Held more bent than the outside knee while it keeps lifting and catching brief steps
        contraction: eccentric
        cue: Step the inside ski as quickly as the outside one
        confidence: low
        sources: [psia-c-1000-steps]
      finish:
        action: Keeps stepping; lengthens toward the outside knee's bend as the leg becomes the next outside leg
        contraction: concentric
        cue: Let the inside leg lengthen into the next turn
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
  - dof: knee.rotation
    side: outside
    cells:
      initiation:
        neutral: true
        contraction: isometric
        cue: Step the ski with the thigh, not by twisting the knee
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "124-125" }
      shaping:
        neutral: true
        moment: Resisting the twist the snow force invites at each landing
        contraction: isometric
        cue: Land each step with the knee and foot pointing the same way
        confidence: medium
        sources: [zorko-2020, heinrich-2023]
      finish: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee and foot point the same way, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Land each step with the knee over the foot, confidence: low, sources: [] }
      shaping:
        neutral: true
        moment: Resisting the inward collapse the edged load invites at each landing
        contraction: isometric
        cue: Knee over the foot as it takes the step
        confidence: medium
        sources: [zorko-2020, heinrich-2023]
      finish: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      finish:
        neutral: true
        contraction: isometric
        cue: Place each step without the knee caving in
        confidence: low
        sources:
          - { source: jordan-sporri-taylor-2023, pages: 122 }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens from its deepest fold in the transition as the leg lengthens; between its steps the hip flexors lift the ski a little
        contraction: concentric
        cue: Rise a little into the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: "Held at its most open, folded forward at the hip, about 46° gentle, 51° moderate, 57° dynamic (our inference); the extensors hold it under each stance"
        moment: Extension while loaded
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: "Folds further with the knee, absorbing the late load, into the transition, about 58° gentle, 64° moderate, 71° dynamic (our inference)"
        contraction: eccentric
        cue: Fold at the hips as the legs flex to finish
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: More flexed than the outside hip. The hip flexors lift the leg at each step; when the ski is placed, the hip extensors catch the brief load, the heavier part
        moment: Extension while loaded, flexion while lifted
        contraction: eccentric
        cue: Lift from the hip, ski level
        confidence: low
        sources:
          - psia-c-1000-steps
          - kroll-2010
          - { source: lemaster-2010, pages: "61-62" }
      shaping:
        action: Held more flexed than the outside hip while it keeps lifting and catching steps
        contraction: eccentric
        cue: Keep the inside leg short and quick
        confidence: low
        sources: [kroll-2010]
      finish:
        action: Keeps stepping; opens toward the outside hip's fold as the leg becomes the next outside leg
        contraction: concentric
        cue: Let the inside leg lengthen into the next turn
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The pelvis tips over the stance thigh as the legs tilt in; while the inside foot is up, the outside abductors hold the inside half of the pelvis, pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up as you step
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
      shaping:
        action: Angulation builds with the edge; under each stance the outside hip holds the inside half up with the edge, a small hike and drop each step
        moment: Abduction while loaded
        contraction: isometric
        cue: Move the weight with the legs, not by swaying the hips
        confidence: medium
        sources:
          - ganderton-2017
          - distefano-2009
          - psia-c-1000-steps
          - { source: lemaster-2010, pages: "70-71, 140" }
      finish:
        action: Holds, then releases as the legs come upright for the edge change
        contraction: eccentric
        cue: Level the hips as the turn ends
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: When the inside foot takes its step, the inside abductors hold the other half of the pelvis up for that moment; between steps the leg is kept at hip width
        contraction: isometric
        cue: Steps at hip width, narrow tracks
        confidence: low
        sources:
          - psia-c-1000-steps
          - ganderton-2017
      shaping:
        action: Repeated brief single-leg pelvic holds on the inside ski, the foot placed at hip width
        contraction: isometric
        cue: Steps at hip width, not wide
        confidence: low
        sources: [psia-c-1000-steps]
      finish:
        action: Repeated brief pelvic holds, longer as this leg becomes the next outside leg
        contraction: isometric
        cue: Steps at hip width
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward a little, the thigh rotating under the pelvis to steer and tip the ski; after the first diverging step the skis stay nearly parallel
        contraction: concentric
        cue: Turn the thigh in the hip socket
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - delp-1999
          - psia-c-1000-steps
      shaping:
        action: Held turned in as the ski turns; each step lands pointing along the arc
        moment: Small
        contraction: isometric
        cue: Land each step pointing along the arc
        confidence: low
        sources: [heinrich-2023]
      finish:
        action: Held, then back toward neutral at the release
        contraction: isometric
        cue: Let the thigh unwind with the release
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward with the turn, so each step of the inside ski lands parallel to the outside ski, not diverging
        contraction: concentric
        cue: Step the skis parallel, not in a fan
        confidence: low
        sources: [delp-1999, psia-c-1000-steps]
      shaping:
        action: Held turned out
        moment: Internal rotation while loaded, as in a normal turn (modelled)
        contraction: isometric
        cue: Inside ski parallel to the outside ski
        confidence: low
        sources: [heinrich-2022]
      finish:
        action: Held, then unwinds as this leg becomes the outside leg
        contraction: isometric
        cue: Keep the skis parallel
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up from the transition's deep hip hinge as the legs lengthen, moving with the thighs; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the legs; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held at its most open, never standing tall, and steady while the legs step under it. Tilting it further forward than the balance needs, so the low back arches, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the transition
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half rises with the edge as the legs tilt in; on top of that it hikes and drops a little with each step, held by whichever hip is standing
        contraction: concentric
        cue: Inside hip up; small, quiet weight shifts
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Inside half held up with the edge; a small hike and drop each step
        contraction: isometric
        cue: Inside hip up; the legs step
        confidence: low
        sources: [psia-national-activities, { source: lemaster-2010, pages: "70-71, 140" }]
      finish:
        action: Lowers toward level for the edge change, still shifting a little with each step
        contraction: eccentric
        cue: Level the hips for the edge change
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space while the femurs rotate under it
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
      shaping:
        action: Slight counter held
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      finish:
        action: Square to the skis as they release; the new counter forms as the legs turn under
        contraction: isometric
        cue: Pelvis square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load, never arched or slumped
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends a little toward the outside ski as the edges build; the inside quadratus lumborum and obliques lengthen to control it. Swaying the trunk side to side with each step is a fault
        contraction: eccentric
        cue: Step with the legs, not by swaying the upper body
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
          - psia-national-activities
      shaping:
        action: Slight bend held over the outside ski, steady while the weight moves foot to foot
        contraction: isometric
        cue: A steady torso over the feet
        confidence: low
        sources:
          - psia-c-1000-steps
          - { source: lemaster-2010, pages: "126, 128" }
      finish:
        action: Returns toward straight through the finish
        contraction: concentric
        cue: Straighten up as the turn ends
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
      finish: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest forward, about 20-33° from vertical through the turn; it rises a little with the hips as the legs lengthen
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "182-183" }
      shaping: { action: Slight forward flexion held, contraction: isometric, cue: Chest over the knees, confidence: low, sources: [{ source: lemaster-2010, pages: 74 }] }
      finish: { action: Slight forward flexion held, contraction: isometric, cue: "Don't sit up as the turn ends", confidence: low, sources: [] }
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips a little toward the outside ski with the edge; the inside obliques lengthen to control it
        contraction: eccentric
        cue: Shoulders level with the slope
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 70 }
      shaping:
        action: Held, quiet while the legs step
        contraction: isometric
        cue: Quiet shoulders while the feet step
        confidence: low
        sources: [psia-national-activities]
      finish:
        action: Returns toward straight through the finish
        contraction: concentric
        cue: Let the shoulders come level
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space with the pelvis while the femurs rotate under
        contraction: isometric
        cue: Chest a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      shaping:
        action: Slight counter held against the legs' turning
        contraction: isometric
        cue: Quiet upper body while the legs step and turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73, 107" }
      finish:
        action: Square to the skis as they release; the new counter forms as the legs turn under
        contraction: isometric
        cue: Chest square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: shoulder-girdle.protraction
    side: both
    cells:
