structures:
  - structure: acl
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Loaded if a wedge ski catches its edge and the tip is pulled outward, twisting the knee inward with the ski as a long lever; the inward twist of a caught wedge, and the dynamic snowplow seen in racing, more likely sitting back in a wide wedge
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius, gluteus-maximus]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: "98, 193" }
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: mcl
    side: both
    phases: [shaping, finish]
    mechanism: Our inference from the same caught edge, which the sources describe as tearing knee ligaments without naming this one; the knee caving in opens its inner side
    protected_by: [medial-hamstrings, gracilis, adductors]
    confidence: low
    sources:
      - { source: lind-sanders-2004, pages: 98 }
  - structure: patellar-tendon
    side: outside
    phases: [shaping, finish]
    mechanism: Pulled harder when the skier sits back in a wide wedge and holds the knees deeply bent on the quadriceps
    protected_by: [vasti]
    confidence: low
    sources: [kurpiers-2024]

