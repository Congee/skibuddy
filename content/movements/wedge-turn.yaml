      finish: { action: Head kept level, contraction: isometric, cue: Level head, confidence: low, sources: [] }
  - dof: neck.rotation
    side: trunk
    cells:
      initiation: { action: Eyes turn toward the new turn's path a little ahead of the skis, contraction: concentric, cue: Look into the next turn, confidence: low, sources: [] }
      shaping: { action: Eyes held on the path, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
      finish: { action: Eyes move ahead to the next turn's path, contraction: concentric, cue: Look along the next turn, confidence: low, sources: [] }

activations:
  # Outside leg. Measured in wedge turns (hintermeister-1997, abstract, side and phase not given): vasti, biceps
  # femoris, gluteus maximus and adductors averaged above 50 % MVC, gluteus maximus higher than in parallel turns.
  # Per-setting and per-phase values are our inference from that and the load share; the measured mean sits at
  # the dynamic end.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthen the outside knee as weight moves onto it, hold it flexed under most of the weight, then let it soften as the turn finishes
    confidence: medium
    basis: Measured above 50 % MVC in wedge turns, though lower than in parallel turns (hintermeister-1997, abstract only); the plough also had the highest quadriceps-to-hamstrings ratio of the tasks measured (hermann-2023). The load is near body weight at every setting, so the per-setting rise is our inference from the outside foot's growing share and the deeper stance
    sources:
      - hintermeister-1997
      - hermann-2023
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the more loaded leg
    confidence: medium
    basis: Whole-quadriceps EMG was measured in the plough (hermann-2023); rectus femoris's share is inferred from normal turns (kroll-2010)
    sources: [hermann-2023, kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.abduction, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded, abducted and inward-rotated hip under most of the weight, and steadies the femur as it steers
    confidence: medium
    basis: Measured above 50 % MVC in wedge turns and higher there than in parallel turns, the one muscle that was (hintermeister-1997, abstract only). The abducted, internally rotated wedge hip is the reason we infer. With the load about body weight and shared by both skis, it stays at 2, in line with crab wedge, carved J and stork turns, whose single-leg loads are higher; the per-setting values are inference
    sources:
      - hintermeister-1997
      - heinrich-2023
      - { source: lemaster-2010, pages: 54 }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.rotation, hip.abduction, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Its front fibres turn the flexed thigh inward to steer; the whole muscle keeps the leg abducted in the wedge and the pelvis level over it
    confidence: medium
    basis: Measured on both legs in normal turns (seifert-2023); internal rotation in hip flexion is anatomy (delp-1999). Less pelvic work than a one-legged drill because the inside foot still supports the pelvis
    sources: [seifert-2023, delp-1999, moore-2020]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Turns the flexed thigh inward with gluteus medius and steadies the head of the femur
    confidence: low
    basis: Anatomy and moment arms in hip flexion; not measured on snow
    sources: [delp-1999, uebayashi-2026]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps turn the thigh inward and hold the wedge
    confidence: low
    basis: Exercise EMG and anatomy; not measured on snow
    sources: [selkowitz-2024, delp-1999]
  - muscle: adductors
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Hold the wedge width against the abductors and help turn the bent thigh inward to steer and edge
    confidence: medium
    basis: Measured above 50 % MVC in wedge turns (hintermeister-1997, abstract only); the steering role of the bent leg is LeMaster's mechanics (pp 108, 124-125). Per-setting values are inference
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment and the wedge-width hold
    confidence: low
    basis: Anatomy; adductors as a group were measured in the wedge (hintermeister-1997), adductor magnus alone was not
    sources: [neumann-2010, hintermeister-1997]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee
    confidence: medium
    basis: The two wedge studies disagree. Biceps femoris averaged above 50 % MVC in wedge turns (hintermeister-1997, abstract), yet the plough had the least hamstring co-contraction of any task in older recreational women (hermann-2023, full text). We keep it low and rising only at the dynamic setting
    sources: [hintermeister-1997, hermann-2023]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the shin twisting outward under the skidding ski and the knee caving in
    confidence: low
    basis: Mechanics of the skidding wedge ski (lind-sanders-2004 p 98); low hamstring activity in the plough (hermann-2023)
    sources: [hermann-2023, { source: lind-sanders-2004, pages: 98 }]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Steady the femoral head and brake the thigh's inward turn so steering stays progressive
    confidence: low
    basis: Anatomy; their rotation moment arms shrink and some flip with hip flexion (delp-1999)
    sources: [delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the shin forward into the tongue as weight moves onto this foot, then co-contracts to keep it there
    confidence: medium
    basis: Highly active in skiing turns (cross-raschner-2023 p 14); active ankle flexion is a book technique point (LeMaster p 81, IASI p 16). Beginners taught the plough load the rearfoot (kurpiers-2024), which this guards against
    sources:
      - kurpiers-2024
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 81 }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources: [{ source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, shares the held ankle with the boot shaft, then opens the ankle a little as pressure moves to the middle of the foot
    confidence: medium
    basis: The boot shaft carries much of the ankle moment in turns (heinrich-2022); at a load near body weight the soleus share is small
    sources: [heinrich-2022]
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; the knee is less bent than in a carved turn, so it is not slack
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the outside ski further onto its big-toe edge as the turn builds, hold it, then ease it back to the wedge's resting edge
    confidence: low
    basis: Peroneus longus is highly active in turns (cross-raschner-2023 p 14); the boot shell carries most of the edging moment (lind-sanders-2004 pp 54-55). Rises a little with the higher dynamic edge angle, by inference
    sources:
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lind-sanders-2004, pages: "54-55" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up under the edged foot
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [{ source: iasi-2021, pages: 190 }]
  # Inside leg: still loaded, about a quarter to a half of the weight, flatter ski, a little shorter.
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Let the inside knee soften as weight leaves it, then hold it flexed under its smaller share
    confidence: medium
    basis: The wedge's vasti measurement does not split the legs (hintermeister-1997); inside vastus lateralis runs about half the outside value in normal turns (kroll-2010). The inside leg carries more here than in a parallel turn, by inference, so it reaches 2 when dynamic
    sources: [hintermeister-1997, kroll-2010]
  - muscle: rectus-femoris
    side: inside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Helps hold the shorter, flexed inside leg
    confidence: medium
    basis: Active on the inside leg in normal turns (kroll-2010); plough quadriceps measured as a group (hermann-2023)
    sources: [kroll-2010, hermann-2023]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turns the inside thigh outward a little to steer the flatter ski, and holds the flexed hip under its share of the load
    confidence: medium
    basis: Measured high in the wedge without a side (hintermeister-1997); the inside share is smaller, so the effort is inference
    sources: [hintermeister-1997, delp-1999]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the inside leg abducted so the ski stays in the wedge
    confidence: medium
    basis: Inside gluteus medius is active through steering in normal turns (seifert-2023); its wedge role is mechanics
    sources: [seifert-2023]
  - muscle: gluteus-minimus
    side: inside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the inside thigh's inward rotation that keeps the tips together
    confidence: low
    basis: Anatomy; internal rotators in hip flexion (delp-1999)
    sources: [delp-1999]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Helps hold the inside thigh turned in and out to the side, the wedge shape
    confidence: low
    basis: Anatomy and exercise EMG; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: inside
    serves: [hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the inside ski from drifting wide, holding the wedge width with the abductors
    confidence: medium
    basis: Adductors measured above 50 % MVC in the wedge, side not given (hintermeister-1997); inside adductor longus is active in normal turns (heinrich-2023)
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh outward a little to steer the flatter ski, then steady it
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [delp-1999]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts lightly to steady the inside knee
    confidence: low
    basis: Low hamstring co-contraction in the plough (hermann-2023)
    sources: [hermann-2023]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.rotation, knee.valgus]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the inside knee caving in or twisting if the inside ski catches
    confidence: low
    basis: Mechanics of the wedge catch (jordan-sporri-taylor-2023 p 122); not measured on snow
    sources: [{ source: jordan-sporri-taylor-2023, pages: 122 }]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Keeps the inside shin on its tongue too
    confidence: low
    basis: Inside tibialis anterior is active in a modelled carved turn (heinrich-2023); in the wedge it is mechanics
    sources: [heinrich-2023, { source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Shares the light ankle moment with the boot shaft
    confidence: low
    basis: Smaller inside ankle moment in a modelled turn (heinrich-2022)
    sources: [heinrich-2022]
  - muscle: peroneals
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Let the inside ski flatten while keeping it on its big-toe edge, then hold that low edge
    confidence: low
    basis: Mechanics; the inside ski of a wedge is everted, not inverted, because it sits on its big-toe edge (psia-c-wedge-turn)
    sources: [psia-c-wedge-turn]
  # Pelvis and trunk: lower in the wedge than in parallel or GS turns (hintermeister-1997).
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the hinged trunk with the low back slightly flattened from standing, never arched or slumped
    confidence: medium
    basis: Trunk muscles were less active in the wedge than in parallel turns (hintermeister-1997); the hinge is shallow and the load near body weight
    sources: [hintermeister-1997, { source: lemaster-2010, pages: "62-63" }]
  - muscle: rectus-abdominis
    side: both
    serves: [lumbar.flexion, pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Balances the back extensors so the pelvis stays neutral and the skier stays off the tails
    confidence: medium
    basis: Measured at low levels in skiing turns (hintermeister-1997)
    sources: [hintermeister-1997, { source: lemaster-2010, pages: "62-63" }]
  - muscle: external-oblique
    side: both
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the upper body quiet while both legs turn under it
    confidence: medium
    basis: External oblique was lowest in the wedge of the three turn types measured (hintermeister-1997)
    sources: [hintermeister-1997]
  - muscle: internal-oblique
    side: both
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Pair with the external obliques to steady the trunk against the legs' turning
    confidence: low
    basis: Internal oblique ranks high in a model of carving (heinrich-2023); in the wedge the demand is small, by inference
    sources: [heinrich-2023]
  - muscle: quadratus-lumborum
    side: inside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Controls the low back's small bend toward the outside ski from the lengthening side, then straightens it
    confidence: low
    basis: EMG off snow; the side bend is small here
    sources: [andersson-1996, mcgill-1996]
  - muscle: quadratus-lumborum
    side: outside
    serves: [lumbar.side-bend]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts to steady the low back
    confidence: low
    basis: EMG off snow
    sources: [mcgill-1996]
  - muscle: multifidus
    side: both
    serves: [lumbar.rotation, lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies each segment of the low back against twist
    confidence: low
    basis: Linked to back complaints in racers; not measured in turns
    sources: [{ source: jordan-sporri-taylor-2023, pages: 116 }]
  - muscle: transversus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the trunk without bracing it rigid
    confidence: low
    basis: Anatomy; IASI asks for an active but not tense core (p 60)
    sources: [{ source: iasi-2021, pages: 60 }]
  - muscle: neck-stabilisers
    side: both
    serves: [neck.flexion, neck.side-bend, neck.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keep the head level and the eyes on the path
    confidence: low
    basis: Book technique point; not measured on snow
    sources: [{ source: lemaster-2010, pages: "64, 72" }]
  # Upper body: arms held forward, no pole touch.
  - muscle: anterior-deltoid
