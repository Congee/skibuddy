id: wedge-turn
name: Linked turns in a gliding wedge, steered by both legs
# Wedge turns were measured (hintermeister-1997, wedge vs parallel vs GS EMG; hermann-2023, plough among other tasks),
# but both report the whole turn, not phases, and hintermeister-1997 was read as abstract only, with no side given.
# Phases: there is no edge change. Both skis stay on their big-toe edges all the time (opposing edges), tips
# closer than tails, and the wedge width does not change (psia-c-wedge-turn; IASI pp 44-45).
#   transition (between our finish and the next initiation): the moment of even weight, both skis about equally
#     edged, the wedge pointing down the hill;
#   initiation: the CoM moves toward the new outside ski, its edge angle and inward leg rotation build while the
#     new inside ski flattens a little so it can steer (the IASI and LeMaster initiation);
#   shaping: around the fall line, the outside ski at its highest edge and most weight (IASI fall line,
#     LeMaster control phase);
#   finish: below the fall line, the turn shape slows the skier; edge and weight on the outside ski hold, then
#     ease back toward centre for the next turn (IASI completion).
# The CoM travels between the feet and never crosses either of them (psia-c-wedge-turn), so the body's lean
# into the turn is small and the turn is made by leg rotation and the offset of the CoM toward the outside ski:
# Lind & Sanders pp 95-98, each ski's force is about perpendicular to it, and moving the CoM a distance J toward
# one ski gives a turning torque J·W·sin α.
#
# Intensity (the drill's scenarios), Lind & Sanders eq 4.9 (p 103), load factor n at the top, the fall line and
# below it (heading 135°), with the balanced tilt of the resultant from the slope normal:
#   gentle    3 m/s, R 6 m,  6°:   n about 1.00, 1.01, 1.02; tilt about 3°, 9°, 13°
#   moderate  4 m/s, R 7 m,  8°:   n about 1.00, 1.02, 1.04; tilt about 5°, 13°, 19°
#   dynamic   5 m/s, R 8 m, 10°:   n about 1.00, 1.04, 1.08; tilt about 8°, 18°, 24°
# The total load barely leaves body weight. What changes with intensity is the share on the outside ski, the
# outside edge angle, how deep the stance is and how fast the legs must steer. Our inference: the outside foot
# carries about 55-60 % gentle, 60-70 % moderate and 65-75 % dynamic in shaping and finish; the outside edge
# builds to about 10-12°, 12-16° and 15-20°, the inside ski stays at about 5-10° (biomechanics.md 2.0 gives
# 10-20° for the wedge's outside ski). Speeds and radii are our inference: slow enough that a parallel turn is
# not easy (psia-c-wedge-turn).
# Flexion pattern: no crossover and no big load swing, so the turn cycle is muted. Both legs stay flexed in an
# athletic stance; the new outside leg lengthens a little through initiation as weight moves onto it (IASI
# pp 35, 65), holds quasi-isometric through shaping, and flexes a little, absorbing, through the finish as the
# load peaks below the fall line (LeMaster pp 40-42); the inside leg stays a little more flexed. Our inference,
# solved for balance over the middle of the foot with the cuff below: outside knee about 35-45° gentle, 40-50°
# moderate, 45-55° dynamic; hip about 35-50°; trunk about 20° forward of vertical (biomechanics.md 2.0).
# Wedge geometry (our inference): each hip abducted about 8-15° and internally rotated about 10-20° to hold the
# tips together, more on the outside leg while it steers.
# Common fault the content guards against: the beginner's back seat in a wide wedge (kurpiers-2024), which
# raises the quadriceps load and the knee's valgus exposure.
#
# Equipment assumed: recreational skis of any sidecut (the wedge is steered, not carved); boots with about 15°
# cuff lean, about 0.9° binding ramp (4.7 mm) and about 42 mm stand height. A boot with too little lean, or too
# stiff to flex, lets the shin stand upright and the skier sit back (LeMaster pp 58-59, posch-2025); a higher
# stand height raises the edging leverage, which a wedge does not need.
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the CoM moves forward and toward the new outside ski; the shin presses into the tongue
        contraction: concentric
        cue: Shins forward into both tongues, toes up a little
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "58-59, 81" }
          - { source: iasi-2021, pages: 16 }
          - { source: cross-raschner-2023, pages: 14 }
      shaping:
        action: Held flexed with the shin on the tongue while this ski carries most of the weight; a little more flexed the deeper the stance
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - kurpiers-2024
          - { source: lemaster-2010, pages: 81 }
      finish:
        action: Held, opening only a little as the pressure moves from the ball toward the middle of the foot; still flexed past upright
        contraction: concentric
        cue: Stay over the middle of the foot; don't sit back as the turn slows you
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 85" }
          - { source: iasi-2021, pages: 33 }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Dorsiflexed with the outside ankle, the shin kept on the tongue as the ski lightens
        contraction: concentric
        cue: Both shins forward, not just the outside one
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: 81 }
          - { source: iasi-2021, pages: 16 }
      shaping:
        action: Held flexed, shin on the tongue, under a lighter load
        moment: Plantarflexion, smaller than outside
        contraction: isometric
        cue: Both shins on the tongues
        confidence: low
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held flexed as this ski readies to take the weight of the next turn
        contraction: isometric
        cue: Keep the inside shin forward too
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 81 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts inside the boot so the ski's big-toe edge, already engaged in the wedge, edges a little more; the edge is never released, only built
        moment: Eversion
        contraction: concentric
        cue: Roll a little more onto the big toe of the outside foot
        confidence: low
        sources:
          - psia-c-wedge-turn
          - { source: lemaster-2010, pages: 127 }
          - { source: lind-sanders-2004, pages: "54-55" }
      shaping:
        action: Eversion keeps building to the turn's highest edge angle around and just below the fall line, about 10-20° from gentle to dynamic (our inference), then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Most edge on the outside ski as you pass the fall line
        confidence: low
        sources:
          - psia-c-wedge-turn
          - { source: lind-sanders-2004, pages: "54-55, 95" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Holds, then eases toward the wedge's resting edge as the weight returns to centre; it stays on the big-toe edge and becomes the flatter inside ski of the next turn
        moment: Eversion, falling
        contraction: eccentric
        cue: Ease the outside edge as the turn ends; don't let it go flat
        confidence: low
        sources:
          - psia-c-wedge-turn
          - { source: iasi-2021, pages: 45 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Eversion eases so this ski, the old outside ski, flattens toward a low edge on its big-toe edge; this is the wedge's release, with no edge change
        moment: Eversion, falling
        contraction: eccentric
        cue: Let the new inside ski go flatter so it can turn
        confidence: low
        sources:
          - psia-c-wedge-turn
          - { source: iasi-2021, pages: 45 }
      shaping:
        action: Held flatter than the outside ski, still on its big-toe edge, about 5-10° (our inference), with small corrections so it steers and brushes rather than grips
        moment: Eversion, small
        contraction: isometric
        cue: Inside ski flatter, still in the wedge
        confidence: low
        sources:
          - psia-c-wedge-turn
          - { source: iasi-2021, pages: 45 }
      finish:
        action: Held at its low edge, ready to edge more as it becomes the next outside ski
        contraction: isometric
        cue: Keep the inside ski quiet and flat-ish
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes more of the weight
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under the edged load along the inside of the foot
        contraction: isometric
        cue: Keep the arch from collapsing as you roll onto the big toe
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as the weight starts back toward centre
        contraction: isometric
        cue: Spread the pressure over the whole foot
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under a lighter load as weight leaves this foot, contraction: isometric, cue: Keep some weight on the inside foot too, confidence: low, sources: [{ source: iasi-2021, pages: 190 }] }
      shaping: { action: Arch held under a light load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { action: Arch held as the foot readies to take the weight, contraction: isometric, cue: Feel the whole inside foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from the even-weighted stance as weight moves onto this leg, never straight
        contraction: concentric
        cue: Grow a little tall on the new outside leg
        confidence: medium
        sources:
          - { source: iasi-2021, pages: "35, 65" }
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: Held flexed, quasi-isometric, while this leg takes most of the weight; about 35-45° gentle, 40-50° moderate, 45-55° dynamic (our inference)
        moment: Extension
        contraction: isometric
        cue: Steady on the outside leg; knees bent, not locked
        confidence: medium
        sources:
          - hintermeister-1997
          - hermann-2023
          - { source: bacharach-cross-2023, pages: 27 }
      finish:
        action: Flexes a little, absorbing the load that peaks below the fall line, as the turn slows the skier
        contraction: eccentric
        cue: Soften the outside leg as the turn finishes
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Flexes a little as weight leaves it, so the inside leg becomes the shorter one and the pelvis can stay level over the outside ski
        moment: Extension
        contraction: eccentric
        cue: Soften the new inside leg
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
          - { source: lemaster-2010, pages: 55 }
      shaping:
        action: Held a little more flexed than the outside knee, still loaded
        moment: Extension, smaller than outside
        contraction: isometric
        cue: Inside knee a little more bent
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 55 }
          - kroll-2010
      finish:
        action: Held flexed while the ski, now uphill of the outside ski, sits higher on the slope; it lengthens again only as it becomes the next outside leg
        contraction: isometric
        cue: Keep the inside leg short until the next turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the outward twist the skidding ski puts on the shin, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: lind-sanders-2004, pages: 98 }] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, moment: Resisting the twist of the brushing ski, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: "Small; the snow force runs from the edge toward the body's centre close to the knee, but a caught edge twists the knee in", contraction: isometric, cue: "Knee over the foot, not caving in", confidence: low, sources: [{ source: lind-sanders-2004, pages: 98 }] }
      finish: { neutral: true, contraction: isometric, cue: "Knee over the foot, not caving in", confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee over its foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: "Small, unless the inside ski catches its edge", contraction: isometric, cue: "Inside knee over its foot, not caving in", confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: 122 }] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee over its foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens a little with the knee as this leg lengthens under the shifting weight
        contraction: concentric
        cue: Rise a little over the outside ski
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
      shaping:
        action: Held flexed, about 35-50° (our inference), the trunk hinged forward at the hip
        moment: Extension
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - hintermeister-1997
          - { source: lemaster-2010, pages: "54, 62-63" }
      finish:
        action: Folds a little more with the knee, absorbing the late load
        contraction: eccentric
        cue: Soften at the hips and knees together
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Folds a little with the knee as weight leaves this leg
        moment: Extension
        contraction: eccentric
        cue: Soften the new inside leg at hip and knee
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
      shaping:
        action: Held a little more flexed than the outside hip
        moment: Extension
        contraction: isometric
        cue: Inside leg a little shorter
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Held flexed until it becomes the next outside leg
        contraction: isometric
        cue: Keep the inside leg short
        confidence: low
        sources: []
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: Held abducted, which keeps the tail out in the wedge, while the pelvis moves over this leg; abductors and adductors co-contract to keep the wedge width
        moment: Small and changing sign with the wedge width; abductors and adductors co-contract
        contraction: isometric
        cue: Keep the wedge the same size as you move over the outside ski
        confidence: medium
        sources:
          - hintermeister-1997
          - psia-c-wedge-turn
          - { source: lind-sanders-2004, pages: "95-96" }
      shaping:
        action: Held abducted under most of the weight; the outside hip also holds the pelvis level over the femur so the inside half does not drop, helped by the still-loaded inside foot
        moment: Abduction and adduction co-contraction
        contraction: isometric
        cue: Stand over the outside ski with level hips
        confidence: medium
        sources:
          - hintermeister-1997
          - moore-2020
          - { source: lemaster-2010, pages: "70-71" }
      finish:
        action: Held, then shares the pelvis again with the inside leg as the weight returns to centre
        contraction: isometric
        cue: Keep the wedge width steady
        confidence: low
        sources:
          - psia-c-wedge-turn
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Held abducted; the wedge width does not change as weight leaves this leg
        contraction: isometric
        cue: Keep the inside ski in the wedge
        confidence: medium
        sources:
          - hintermeister-1997
          - psia-c-wedge-turn
      shaping:
        action: Held abducted, the adductors and abductors co-contracting so the inside ski neither drifts wide nor closes
        contraction: isometric
        cue: Same wedge, tips apart
        confidence: medium
        sources:
          - hintermeister-1997
      finish:
        action: Held abducted
        contraction: isometric
        cue: Same wedge width throughout
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward in the hip socket, pivoting the ski about the foot to steer it into the new turn; the tail is not pushed out
        moment: Internal rotation, against the snow's resistance to the skidding ski
        contraction: concentric
        cue: Turn the outside thigh and foot toward the turn
        confidence: medium
        sources:
          - psia-c-wedge-turn
          - { source: iasi-2021, pages: "44-45, 51, 53" }
          - { source: lemaster-2010, pages: "107-108" }
          - delp-1999
      shaping:
        action: Keeps turning inward, spread evenly through the turn so the track is a C, not a V
        moment: Internal rotation
        contraction: concentric
        cue: Keep steering the outside ski round
        confidence: medium
        sources:
          - { source: iasi-2021, pages: "28, 45" }
          - delp-1999
      finish:
