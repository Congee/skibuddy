structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the backward segment becomes sitting back on the tails, the boot and quadriceps pushing the shin forward while the hamstrings lag; our inference for this slow drill, from the backward-fall mechanism
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: "192-193" }
      - { source: jordan-sporri-taylor-2023, pages: "120-123" }

