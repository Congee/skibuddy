activations:
  # Outside (stance) leg. Load-bearing efforts scale with the load factor and knee bend; balance efforts change little.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 2
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthens the knee into the turn, holds it against the whole turn force once the inside ski lifts, then lets it flex under the late load
    confidence: medium
    basis: Measured in normal turns, where activity peaks in the steering phase at a steady knee bend. Here one leg carries the whole load from the lift on, about 1.06-1.21 times body weight at the slow speeds of a brushed drill on easy terrain, so it stays at 2 at every setting; the per-setting values are our inference from that load and the knee bend. At initiation the load is still shared and nearly body weight at every setting; dynamic's 2 reflects a deeper bend
    sources:
      - hintermeister-1997
      - kroll-2010
      - panizzolo-2013
      - heinrich-2022
      - { source: cross-raschner-2023, pages: "13-14" }
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the stance leg
    confidence: medium
    basis: Measured as a knee extensor on the outside leg in normal turns; scaled with load by inference
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.abduction, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 2
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip against the load, sharing the work with the hamstrings and adductor magnus, and steadies the turned-in hip
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn, shared with the hamstrings and adductor magnus. Scaled like the vasti, with the load and the depth of the fold; the per-setting values are inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - distefano-2009
      - { source: lind-sanders-2004, pages: 103 }
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Holds up the unsupported inside half of the pelvis once the ski lifts in early shaping, and with its front fibres turns the bent stance thigh inward while the cross forms, then holds that crossed angle isometrically
    confidence: medium
    basis: Measured on both legs in normal turns; the one-leg pelvic hold follows from mechanics and single-leg exercise data. In the flexed hip the front fibres become internal rotators (cadaver moment arms), so here they also drive the steering. The per-setting values are inference, as in stork turns at similar loads
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - distefano-2009
      - delp-1999
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius, turns the flexed thigh inward while the cross forms and then holds it, and steadies the head of the femur
    confidence: medium
    basis: Inferred from single-leg exercise data and cadaver moment arms; not measured on snow. Scaled as gluteus medius
    sources: [moore-2020, ganderton-2017, uebayashi-2026, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps turn the thigh inward while the cross forms, then hold it there, and hold the pelvis
    confidence: low
    basis: Inferred from exercise data and moment arms; not measured on snow
    sources: [selkowitz-2024, delp-1999]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 2
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: The main drivers of the stance thigh's large inward turn with the leg bent while the cross forms, then hold the crossed angle and brace against the abductors
    confidence: medium
    basis: Measured in normal turns; with the leg bent the adductors are the strong rotators that turn and edge the ski (LeMaster). The drill asks for far more of this turning than a normal turn, at low loads; the per-setting values are inference
    sources:
      - hintermeister-1997
      - delp-1999
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.flexion]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee, shares the hip extension moment, and checks the trunk's forward pitch on one ski
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance; modelled hip extension share. A one-legged racer's biceps femoris was much more active in the first half of the turn on his harder side. Scaled with the load by inference
    sources: [hintermeister-1997, heinrich-2022, heinrich-2023, zorko-2020, ishige-2021]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 1, dynamic: 2 }, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in while the thigh turns in hard
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: eccentric, finish: isometric }
    role: Steady the head of the femur and control the thigh's inward turn as they lengthen
    confidence: low
    basis: In a brushed, steered turn the net hip rotation moment is internal, so these external rotators only co-contract; extrapolated from a model of a carved GS turn and cadaver moment arms, which also shift with hip flexion
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: { gentle: 1, moderate: 1, dynamic: 2 }, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the feet back into the new turn; once the turn loads, only co-contracts, as the net ankle moment is plantarflexion
    confidence: medium
    basis: Measured in normal turns, where it is highly active; active ankle flexion is a book technique point. The modelled shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 1, dynamic: 2 }, finish: { gentle: 1, moderate: 1, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the flexed ankle against the rising load, sharing the plantarflexion moment with the boot shaft, then opens the ankle to push the foot forward through the finish
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus, not the gastrocnemius, does the ankle work. Lower loads than a carved turn here; scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee bent
    confidence: low
    basis: Inferred; medial gastrocnemius averaged above half of maximum in GS turns, but the boot shaft carries much of the ankle moment and the bent knee slackens it, so its share here is small; not measured in this drill
    sources: [hintermeister-1997, heinrich-2022]
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the big-toe edge and build it into late shaping, make the constant small balance corrections on one edge, then let it go
    confidence: medium
    basis: Highly active in turns, attributed to edge control; balancing on one ski adds continuous co-contraction. A balance effort, so it changes little with intensity; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals for balance on one edge
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the stance hip, a minor role
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The stance hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. Lightly loaded through the edge change, then off the snow with nothing resting on it.
  # Inside gastrocnemius is left out: pointing the foot would tip the lifted ski down.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shortens the inside leg through the edge change, lifts the thigh and the whole ski in early shaping once the new edges hold, and holds them above the stance ski to the transition
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow, and only rectus femoris has been measured as an inside-leg hip flexor. Holding up the leg, boot and ski, about 16 kg, with nothing on the snow is about 0.6 Nm/kg of hip flexion moment (our estimate), a moderate effort; the load factor adds 6-21 % at the fall line, too little to move a level
    sources:
      - jiroumaru-2014
      - juan-2024
      - andersson-1997
      - kroll-2010
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Works as a hip flexor on the inside leg, not as a knee extensor, lifting the ski in early shaping
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg in normal turns; changes little with intensity
    sources:
      - kroll-2010
      - cuniberti-2026
      - seifert-2023
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 1 }
    contraction: { initiation: isometric, shaping: null, finish: eccentric }
    role: Hold the lightly loaded inside knee through the edge change, idle while the leg is lifted, and take the load again at set-down
    confidence: medium
    basis: Measured low on the inside leg in normal turns; lower still with no load
    sources:
      - kroll-2010
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Bends the knee to lift the ski in early shaping, then holds the heel up so the lifted ski stays level; its short head is a pure knee bender
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the lift is mechanics. Holding the lower leg, boot and ski is a light effort once lifted
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Help bend the knee to lift the ski in early shaping and hold it up
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gracilis
    side: inside
    serves: [knee.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Bends the knee to lift the ski in early shaping and helps hold the lifted boot close, near hip width
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps lift the thigh and bend the knee in early shaping
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: isometric }
    role: Helps lift the thigh in early shaping and hold it up, and keeps it from turning out with the turn so the lifted ski stays with the pelvis
    confidence: low
    basis: Hip-flexor EMG off snow; the rotation role is moment arms in the flexed hip
    sources: [andersson-1997, jiroumaru-2014, delp-1999]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contract with the abductors to hold the lifted boot close beside the stance boot, near hip width; the cross comes from the counter, not from adducting the leg across; pectineus also helps lift the thigh
    confidence: low
    basis: Modelled inside adductor longus in normal turns. Light here, because with the pelvis listed the hanging leg's own weight already draws it toward the stance leg, so the net moment is a small abduction
    sources: [heinrich-2023]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the lifted thigh near hip width against its weight drawing it in; its front fibres help keep the lifted ski with the pelvis
    confidence: low
    basis: Inside gluteus medius is active in normal turns; its role here is mechanics
    sources: [seifert-2023, delp-1999]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh out with the skis through the edge change, then co-contract to hold the lifted ski in line with the pelvis
    confidence: low
    basis: Anatomy and moment arms; not measured on snow
    sources: [delp-1999]
