    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Pairs with the outside internal oblique to keep the chest with the pelvis while the stance leg's rotation turns both into counter
    confidence: medium
    basis: Measured and modelled in normal turns; scaled as the outside internal oblique
    sources: [hintermeister-1997, heinrich-2023]
  - muscle: quadratus-lumborum
