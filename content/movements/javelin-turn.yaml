  # Pelvis and trunk. The trunk holds a large counter against the stance leg's turning, and bends toward the outside ski.
  - muscle: internal-oblique
    side: outside
    serves: [pelvis.rotation, thoracic.rotation]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the chest with the pelvis while the stance leg's rotation turns both into counter, paired with the inside external oblique, through the finish
    confidence: medium
    basis: Measured and modelled in normal turns. The drill holds far more counter than a normal turn, and longer, but the hip rotation moments it resists are small (about 0.2 Nm/kg modelled), so a moderate effort by inference
    sources: [hintermeister-1997, heinrich-2023, heinrich-2022]
  - muscle: external-oblique
