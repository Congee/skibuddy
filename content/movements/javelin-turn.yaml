structures:
  - structure: acl
    side: outside
    phases: [shaping, finish]
    mechanism: Loaded if the skier falls back, often from pushing the hips back to make room for the crossed ski, and the stance ski catches its inner edge while the knee straightens and turns in; the slip-catch seen in racing injuries. The large inward turn of the stance thigh puts the knee nearer that position, so it must stay flexed and over the foot
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: inside
    phases: [finish]
    mechanism: Loaded if the crossed ski is set down still crossed or wide and catches, so the leg re-engages tip out in a wedge and the knee twists inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
      - { source: lind-sanders-2004, pages: 193 }
  - structure: mcl
    side: outside
    phases: [shaping, finish]
    mechanism: Our inference; the sources name valgus on the outside knee as what loads this ligament, and a hard inward turn of the stance thigh can let the knee cave in
    protected_by: [medial-hamstrings, gracilis, sartorius]
    confidence: low
    sources:
      - zorko-2020
  - structure: lumbar-discs
    side: both
    phases: [shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under the turn load; the large counter must come from the hips, not from twisting the low back
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - fujii-2007
      - { source: cross-raschner-2023, pages: 12 }

