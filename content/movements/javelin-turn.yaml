id: javelin-turn
name: Turn on the outside ski with the lifted inside ski crossed over it
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# Phases: initiation = LeMaster's and IASI's initiation, Pritchard & Taylor's initiation after the turn switch;
# shaping = LeMaster's control phase, IASI's fall line, P&T's steering phase; finish = completion in all three.
# Their transition sits between our finish and the next initiation.
# The edges change on two feet. The inside ski lifts in early shaping, by the fall line, as in PSIA's mapped task
# and LeMaster's (psia-c-javelin, LeMaster p 76); IASI lifts it earlier, in initiation (iasi-2021 p 169). The
# lifted ski stays about level and points where the countered pelvis and chest face, while the outside leg turns
# its ski underneath, so the tips cross from shaping through the finish. In the transition the lifted ski is
# uncrossed and set down parallel, and becomes the new outside ski. The crossing must come from the stance leg's
# rotation, not from twisting the free leg across (IASI's named fault, p 169).
#
# Intensity (the drill's scenarios): two feet share the load at the start of initiation, then the outside leg
# carries 100 % of it. Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it
# (heading 135°):
#   gentle    6 m/s, R 10 m,  8°:   about 1.02, 1.06, 1.09
#   moderate  7 m/s, R 11 m, 11°:   about 1.02, 1.08, 1.14
#   dynamic   8 m/s, R 12 m, 14°:   about 1.02, 1.11, 1.21
# The task asks for a brushed track on green to gentle blue terrain, so the speeds stay low; the stance ski is
# steered, not purely carved, at every setting. That is technique, not intensity.
# The load builds past the fall line and peaks in late shaping or early finish, then eases as the radius opens
# (falda-buscaiot-2017, zorko-2015, L&S Table 6.1, P&T p 27).
# Outside knee: most flexed in the transition, extending a little through initiation, quasi-isometric and
# most extended through shaping, flexing again (eccentric, absorbing) through the finish (LeMaster pp 40-42,
# P&T p 27, IASI pp 65-66); the hip follows. Our inference, solved for balance over the foot and scaled from
# the stork model to these lower loads: outside hip flexion mid-turn to transition about 46-58° gentle, 51-64°
# moderate, 56-70° dynamic; the knee that balances it about 58-66°, 62-70° and 66-75°. Race reference:
# heinrich-2022's GS outside hip 50-81°, knee 56-80°.
# Counter: the drill's point. By the end of shaping the pelvis faces well outside the stance ski, of the order of
# 30-50° (our estimate; the research pose guide suggests 40-60°), almost all of it from the stance femur turning
# in under the pelvis, not from the low back (fujii-2007, sporri-2016). The hip rotation moments it takes are
# small, about 0.2 Nm/kg in a modelled GS turn (heinrich-2022), so the trunk's hold is moderate, not maximal.
# Per-setting values are inference from these mechanics; a single number means it changes little with intensity.
# The lifted inside leg carries no snow force. Leg, boot and ski, about 16 kg, hang from the hip with nothing on
# the snow: about 0.6 Nm/kg of hip flexion moment (our estimate); its effective weight grows with n, too little
# to move a level.
#
# Equipment assumed: recreational carving skis; boots with about 15° cuff lean, about 0.9° binding ramp
# (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167);
# a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132); a deeper
# sidecut tightens the turn (LeMaster pp 32-33, L&S p 53).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the feet are drawn back and the shin presses into the tongue while the body crosses over; flexed about as far as it goes in the turn
        contraction: concentric
        cue: Pull the toes up and the feet back
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 182-183" }
          - { source: cross-raschner-2023, pages: 14 }
          - { source: iasi-2021, pages: 187 }
      shaping:
        action: Held flexed against the rising load to the fall line, then opens a little as the foot starts forward; pushing the hips back to make room for the crossed ski opens it too far, which is a fault
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue while the ski turns under you
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Opens progressively as the foot slides forward under the body, still flexed past upright; pressure moves toward the heel
        contraction: concentric
        cue: Let the foot slide ahead as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Flexed with the shin in the tongue through the edge change, so the ski comes up level rather than tip down when it lifts in early shaping
        contraction: isometric
        cue: Both shins forward, not just the outside one
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
      shaping:
        action: Held flexed with the lifted ski about parallel to the snow; the ski's longer forebody pitches it tip down, and the shin and cuff hold it level with a little ankle effort
        moment: Small dorsiflexion, against the forebody's weight
        contraction: isometric
        cue: Lifted ski level, tip just above the stance ski
        confidence: low
        sources:
          - psia-c-javelin
          - { source: lind-sanders-2004, pages: 47 }
      finish:
        action: Stays closed, shin on the tongue, through the finish and as the ski is set down, ready to become the new outside ski
        contraction: isometric
        cue: Keep the shin on the tongue as you set the ski down
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Begins to evert inside the boot, rolling the ski onto its big-toe edge with the other ski
        contraction: concentric
        cue: Roll onto the big-toe edge
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: 127 }
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Eversion keeps building to its most in late shaping, below the fall line, then holds against the snow force that would flatten the ski, with constant small corrections on the one edge while the ski is steered
        moment: Eversion
        contraction: concentric
        cue: Keep the edge building as the ski turns under you
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107, 123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55, 137" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Holds, then releases toward flat through the finish into the transition
        contraction: eccentric
        cue: Let the edge go as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 38 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts so the inside ski tips onto its little-toe edge with the outside ski through the edge change, before it lifts
        contraction: concentric
        cue: Tip the inside ski the same way as the outside ski
        confidence: low
        sources:
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Tilt held loosely; the lifted ski only needs to clear the stance ski
        contraction: isometric
        cue: Lifted ski quiet, just above the stance ski
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 95 }
          - { source: lemaster-2010, pages: "123-124" }
      finish:
        action: Tilt held as the ski is uncrossed and set down on its little-toe edge alongside the stance ski
        contraction: isometric
        cue: Set it down parallel, at hip width, on its little-toe edge
        confidence: low
        sources: [psia-c-javelin]
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes most of the load, all of it once the other ski lifts in early shaping
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
          - falda-buscaiot-2017
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under a light load until the ski lifts in early shaping, contraction: isometric, cue: A quiet foot, confidence: low, sources: [{ source: lemaster-2010, pages: "137-139" }] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition as the new turn loads
        contraction: concentric
        cue: Grow into the new turn
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
      shaping:
        action: "Held near its longest, quasi-isometric, while the load builds and the leg turns its ski; about 58° gentle, 62° moderate, 66° dynamic (our inference; heinrich-2022 GS 56-80°)"
        moment: Extension, near its peak
        contraction: isometric
        cue: Stay long and steady on the outside leg while it turns
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: cross-raschner-2023, pages: "11-14" }
          - alhammoud-2020
          - heinrich-2022
      finish:
        action: "Flexes, absorbing the load as it peaks below the fall line and eases, into its deepest bend in the transition, about 66° gentle, 70° moderate, 75° dynamic (our inference)"
        contraction: eccentric
        cue: Flex under control as the turn ends
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
          - falda-buscaiot-2017
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Shortens with the hip through the edge change, both skis still on the snow; the ski lifts in early shaping (IASI lifts it here, in initiation)
        contraction: concentric
        cue: Change edges on both feet
        confidence: low
        sources:
          - { source: iasi-2021, pages: 169 }
          - { source: lemaster-2010, pages: 76 }
      shaping:
        action: Flexes further in early shaping to lift the whole ski once the new outside ski holds, then held more bent than the outside knee, heel up, so the lifted ski rides level above the stance ski
        contraction: concentric
        cue: Pick the inside ski up, heel up, ski level
        confidence: low
        sources: [psia-c-javelin]
      finish:
        action: Held through the finish, then lengthens with the hip to set the ski down in the transition
        contraction: eccentric
        cue: Lower the ski, don't drop it
        confidence: low
        sources: [psia-c-javelin]
  - dof: knee.rotation
    side: outside
    cells:
      initiation:
        neutral: true
        contraction: isometric
        cue: Turn the thigh, not the knee
        confidence: low
        sources:
          - { source: iasi-2021, pages: 191 }
          - { source: lemaster-2010, pages: "124-125" }
      shaping:
        neutral: true
        moment: Resisting the twist the snow force invites
        contraction: isometric
        cue: Turn the thigh, not the knee
        confidence: medium
        sources: [zorko-2020, heinrich-2023]
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Set the ski down straight, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping:
        neutral: true
        moment: Resisting the inward collapse the edged load invites, more so as the thigh turns in
        contraction: isometric
        cue: Turn the thigh in, but keep the knee over the foot
        confidence: medium
        sources: [zorko-2020, heinrich-2023, bere-2013]
      finish: { neutral: true, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      finish:
        neutral: true
        contraction: isometric
        cue: Set the ski down without the knee caving in
        confidence: low
        sources:
          - { source: jordan-sporri-taylor-2023, pages: 122 }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens from its deepest fold in the transition as the leg lengthens into the new turn
        contraction: concentric
        cue: Rise a little into the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: "Held at its most open, folded forward at the hip over a strongly countered pelvis, about 46° gentle, 51° moderate, 56° dynamic (our inference; heinrich-2022 GS 50-81°); the counter lets the trunk fold forward rather than sideways"
        moment: Extension, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
          - alhammoud-2020
      finish:
        action: "Folds further with the knee, absorbing the late load, into the transition, about 58° gentle, 64° moderate, 70° dynamic (our inference)"
        contraction: eccentric
        cue: Fold at the hips as the legs flex to finish
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Flexes more than the outside hip through the edge change, both skis still on the snow; the thigh lifts in early shaping (IASI lifts it here, in initiation)
        contraction: concentric
        cue: Shorten the inside leg as the edges change
        confidence: medium
        sources:
          - kroll-2010
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "61-62, 76" }
          - { source: iasi-2021, pages: 169 }
      shaping:
        action: Lifts the thigh and the whole ski in early shaping once the new edges hold, then held more flexed than the outside hip, the hip flexors carrying the whole leg, boot and ski above the stance ski's forebody
        moment: Flexion, about 0.6 Nm/kg with nothing resting on the snow (our estimate)
        contraction: concentric
        cue: Bring the inside thigh up, lifted ski level
        confidence: medium
        sources:
          - kroll-2010
          - psia-c-javelin
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Held through the finish, then lowered to set the ski down parallel in the transition
        contraction: eccentric
        cue: Lower the leg under control
        confidence: low
        sources: [psia-c-javelin]
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The pelvis tips over the stance thigh as the legs tilt in, with both skis still on the snow
        contraction: concentric
        cue: Keep the inside hip up as the edges change
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
      shaping:
        action: Once the inside ski lifts in early shaping, the outside abductors hold up the unsupported inside half of the pelvis alone, pelvis on femur; hip angulation keeps building with the edge to its most in late shaping, then held; lifting the inside leg helps the hips move inside
        moment: Abduction
        contraction: concentric
        cue: Hips in, over the outside hip
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 76, 128, 140" }
          - moore-2020
          - psia-c-javelin
      finish:
        action: Holds under the late load, then releases as the legs come upright and the lifted ski comes down
        contraction: eccentric
        cue: Level the hips as the ski comes down
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Kept at hip width through the edge change
        contraction: isometric
        cue: Inside boot at hip width
        confidence: low
        sources: []
      shaping:
        action: Held near hip width, the lifted boot close beside the stance boot; the cross comes from the counter, not from adducting the free leg across
        moment: Small abduction, holding the leg's own weight against the listed pelvis
        contraction: isometric
        cue: Boots close, tips crossed by the counter
        confidence: low
        sources:
          - psia-c-javelin
          - { source: lemaster-2010, pages: 76 }
      finish:
        action: Held near hip width while the counter unwinds, uncrossing the ski, and it is set down parallel
        contraction: isometric
        cue: Set the ski down at hip width
        confidence: low
        sources: [psia-c-javelin]
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward, the thigh rotating under the pelvis and turning it into counter, to steer and tip the ski as the cross starts to form
        moment: Small internal, reacted by the upper body turning into counter
        contraction: concentric
        cue: Turn the outside thigh under the pelvis
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - { source: iasi-2021, pages: "169, 193" }
          - delp-1999
      shaping:
        action: Keeps turning inward through early shaping, far more than in a normal turn, as the stance ski is steered under the lifted one and the cross forms; then the crossed angle is held through the rest of shaping and the finish
        moment: Small internal, reacted by the upper body turning into counter
        contraction: isometric
        cue: Steer the outside ski under the lifted one, then hold the cross
        confidence: medium
        sources:
          - psia-c-javelin
          - { source: iasi-2021, pages: 169 }
          - { source: lemaster-2010, pages: "107-108" }
          - delp-1999
      finish:
        action: Crossed angle held from shaping through the finish, then unwinds as the skis come together in the transition
        contraction: isometric
        cue: Keep the cross through the finish
        confidence: low
        sources: [psia-c-javelin]
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward a little with the skis through the edge change, as in a normal turn; the pelvis already faces into the new turn (anticipation), so it is small
        contraction: concentric
        cue: Both skis turn together at first
        confidence: low
        sources: [delp-1999]
      shaping:
        action: Held near neutral to the pelvis, so the lifted ski points where the pelvis and chest face; the leg is not twisted across
        contraction: isometric
        cue: Lifted ski points where your belly button points
        confidence: low
        sources:
          - psia-c-javelin
          - { source: iasi-2021, pages: 169 }
      finish:
        action: Held near neutral to the pelvis until the ski is set down parallel to the stance ski
        contraction: isometric
        cue: Keep the lifted ski with the upper body
        confidence: low
        sources: [psia-c-javelin]
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up from the transition's deep hip hinge as the legs lengthen, moving with the thighs; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the legs; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held at its most open over the long stance leg, never standing tall. Pushing the hips back to make room for the crossed ski, so the low back arches and the weight goes to the tail, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
          - { source: iasi-2021, pages: 194 }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the transition
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half rises against the balance axis as the inside ski unloads, hiked by the outside hip abductors; it is carried alone once the ski lifts in early shaping
        contraction: concentric
        cue: Inside hip up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, with no support from the inside ski
        contraction: concentric
        cue: "Don't let the inside hip drop; more as the edge builds"
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Held up under the late load, then lowers as the lifted ski is set down
        contraction: eccentric
        cue: Level the hips for the edge change
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Stays facing down the hill while the skis turn under it, so the counter starts to build
        contraction: isometric
        cue: Belly button down the hill while the skis turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Strong counter held, the pelvis facing well outside the stance ski, of the order of 30-50° by the end of shaping (our estimate), almost all of it from the stance femur turning in under it
        moment: Small; the obliques keep the chest with the pelvis while the stance leg's rotation turns both into counter
        contraction: isometric
        cue: Pelvis and chest face where the lifted ski points
        confidence: low
        sources:
          - psia-c-javelin
          - psia-national-activities
          - { source: lemaster-2010, pages: "73, 76, 107" }
      finish:
        action: Counter held through the finish; it unwinds as the skis release and turn under it into the next turn
        contraction: isometric
        cue: Keep the separation through the finish
        confidence: low
        sources:
          - psia-c-javelin
          - { source: lemaster-2010, pages: "109-110" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load, never arched or slumped; the counter lets the trunk fold forward at the hips rather than bend at the low back
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63, 73" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Tip the upper body over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, keeping the trunk over the outside ski rather than banking
        contraction: eccentric
        cue: Hips in, shoulders out
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Holds, then returns toward straight through the finish
        contraction: concentric
        cue: Straighten up as the turn ends
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping:
        neutral: true
        moment: Small, about a twelfth of the extension moment in a modelled carved turn
        contraction: isometric
