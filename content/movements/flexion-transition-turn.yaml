id: flexion-transition-turn
name: Linked turns with a flexion transition, the legs retracted under a low body
# Measured in this movement: 23 PSIA Level III instructors, examiners and demo-team members skied both
# transition styles with EMG of rectus femoris, vastus lateralis and gluteus medius on both legs (seifert-2023,
# full text, in mV, so it ranks muscles but sets no absolute effort). Against the extension transition the
# flexion transition gave more quadriceps desaturation and higher perceived exertion; higher outside vastus
# lateralis in steering and transition; much higher outside rectus femoris in the transition; higher inside
# rectus femoris in both; lower inside gluteus medius. Knees, hips and trunk stay flexed up to about 90° through
# the switch, so the centre of mass barely rises. The rest is inference from carved turns (D13 pattern) and
# mechanics.
# Phases: initiation = the switch (edges flat, legs crossing under the body) and engagement up to the fall line;
# shaping = around the fall line; finish = completion. Through the switch the old outside leg becomes the inside
# leg, so its retraction sits in the inside rows at initiation.
#
# Mechanics: retracting the legs is down-unweighting. The legs are pulled up, the body is in near free fall for
# about 0.2 s, and the skis go light at once; the fall is then caught as the new edges load (Lind & Sanders
# pp 118-120, Fig 5.4a). The time integral of the extra force is zero, so the unweighting is paid back by an
# equal overweighting (p 119). Flexing near the switch keeps the skis on the snow and lowers the peak force
# (komissarov-2022b). Sinking is pulling the legs up, not pushing down (L&S p 120): hip flexors and hamstrings
# concentric (LeMaster pp 97-98, 152-154).
# Intensity (the drill's scenarios). Lind & Sanders eq 4.9 (p 103), total snow force over body weight at the top,
# the fall line and below it:
#   gentle    8 m/s, R 12 m, 12°:   about 1.03, 1.12, 1.20
#   moderate 10 m/s, R 14 m, 15°:   about 1.07, 1.21, 1.33
#   dynamic  12 m/s, R 16 m, 18°:   about 1.13, 1.32, 1.48
# The outside leg carries about 60-75 % of it (heinrich-2022, falda-buscaiot-2017). Speeds and radii are our
# inference, well under GS levels; the flexion depth, not the load, is what makes this style costly
# (seifert-2023; scheiber-2012 via biomechanics.md F5).
#
# Flexion pattern: deepest in the switch (near 90° at knee and hip), extending gradually through initiation as
# the legs lengthen out to the side, not upward, quasi-isometric through shaping, absorbing through the finish
# into the next retraction (LeMaster pp 40-42, 90, 152-154; bacharach-cross-2023 p 27).
# Edging: early and progressive. The skis tip onto the new edges while the body is still low and inside, so the
# edge angle builds from the top of the turn to a peak in late shaping, then releases with the retraction
# (LeMaster pp 46-49, 128, 154; IASI pp 31, 62-63).
#
# Equipment assumed: recreational carving skis of about 14-17 m sidecut; boots with about 15° cuff lean, about
# 0.9° binding ramp and about 42 mm stand height. Too little forward lean makes the deep switch a back-seat
# position (LeMaster pp 58-59, 96, 164-165).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Held closed through the low switch, shin pressed into the tongue, so the deep knee and hip bend does not tip the body back; then the feet are drawn further back as the new edges engage
        contraction: concentric
        cue: Shins forward as you sink; don't sit down
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "58-59, 79-81, 96" }
          - { source: iasi-2021, pages: "16, 33" }
          - hintermeister-1997
      shaping:
        action: Held flexed against the rising load, a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Opens a little as the foot slides forward under the body and pressure moves toward the heel, still flexed past upright
        contraction: concentric
        cue: Let the feet come forward a little as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Closes as the foot is pulled up and back under the body during the retraction; the shin stays on the tongue
        contraction: concentric
        cue: Pull the inside foot back as you fold it up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "86, 154" }
          - { source: iasi-2021, pages: 174 }
      shaping:
        action: Held flexed, shin on the tongue; the inside dorsiflexors work harder after the fall line
        contraction: isometric
        cue: Keep the inside shin on the tongue
        confidence: medium
        sources:
          - heinrich-2023
          - heinrich-2022
      finish:
        action: Held closed while the outside foot comes forward, ready to become the new outside foot low and flexed
        contraction: isometric
        cue: Inside ankle stays bent
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts inside the boot as the legs cross under, rolling the ski onto its big-toe edge early, above the fall line
        contraction: concentric
        cue: Roll onto the new big-toe edge while you are still low
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "53, 127, 154" }
      shaping:
        action: Eversion keeps building to its most in late shaping, then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55" }
          - { source: iasi-2021, pages: 31 }
      finish:
        action: Holds, then releases toward flat as the legs begin to retract
        contraction: eccentric
        cue: Let the edge go as you fold
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "38, 130" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts to roll the retracting inside ski onto its little-toe edge, leading the outside ski
        contraction: concentric
        cue: Tip the folded foot toward its little toe
        confidence: low
        sources:
          - { source: iasi-2021, pages: 46 }
          - psia-c-medium-radius-carved
      shaping:
        action: Tilt held, building with the outside ski's edge
        contraction: isometric
        cue: Keep both skis tipped the same way
        confidence: low
        sources: []
      finish:
        action: Releases toward flat with the outside ski
        contraction: eccentric
        cue: Flatten both skis together
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the new load after the light switch
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under the peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held as the folded foot takes little load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      shaping: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Starts from its deepest bend in the switch, near 90°, and lengthens only gradually, out to the side rather than up, as the new turn loads; the body stays low
        moment: Extension, held at a deep bend
        contraction: concentric
        cue: Stay low and let the leg reach out to the side
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "90, 152-154" }
          - { source: bacharach-cross-2023, pages: 27 }
      shaping:
        action: Held near its longest, quasi-isometric, while the load peaks; deeper than in an extension transition, which costs the vasti more
        moment: Extension, near its peak
        contraction: isometric
        cue: Strong and steady on the outside leg
        confidence: medium
        sources:
          - seifert-2023
          - alhammoud-2020
          - heinrich-2022
          - { source: cross-raschner-2023, pages: "11-13" }
      finish:
        action: Flexes, absorbing the load as it peaks below the fall line and eases, on into the deep bend of the next switch
        contraction: eccentric
        cue: Keep folding as the turn ends; don't stand up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "38, 65-66" }
          - komissarov-2022b
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: The old outside leg is pulled up through the switch, knee folding actively so the skis cross under the body; the skis go light at once
        moment: Flexion while the leg is light
        contraction: concentric
        cue: Pull the old outside foot up and under you
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "97-98, 152-154" }
          - { source: lind-sanders-2004, pages: "118-120" }
      shaping:
        action: Held short and more bent than the outside knee as it takes its share of the load again
        moment: Extension, about as large as the outside knee's, because it is more bent
        contraction: isometric
        cue: Short inside leg, long outside leg
        confidence: medium
        sources:
          - heinrich-2022
          - kroll-2011
      finish:
        action: Held bent while the outside knee folds to match it, so both are low and level at the switch
        contraction: isometric
        cue: Both knees folding together
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 154" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: Turn the thigh not the knee, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Folded knee points where its ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: Knee stays over the foot and does not cave in, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Knee stays over the foot and does not cave in, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Folded knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Small abduction moment, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [heinrich-2022] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens slowly from its deep fold in the switch, near 90°, as the leg reaches out to the side; the hips stay low
        moment: Extension, held at a deep fold
        contraction: concentric
        cue: Stay folded at the hips as the leg reaches out
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "40-42, 152-154" }
      shaping:
        action: Held at its most open, folded forward at the hip with the pelvis slightly countered
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further with the knee, absorbing the late load, into the deep fold of the next switch
        contraction: eccentric
        cue: Keep folding at the hips as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 90" }
          - komissarov-2022b
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: The old outside thigh is pulled up toward the chest through the switch, iliopsoas and rectus femoris lifting it, so the leg shortens without the body rising
        moment: Flexion while the leg is light
        contraction: concentric
        cue: Draw the knee up toward your chest
        confidence: medium
        sources:
          - seifert-2023
          - kroll-2010
          - { source: lemaster-2010, pages: "97-98, 152-154" }
      shaping:
        action: Held more flexed than the outside hip as it takes its share of the load
        moment: Extension, similar to the outside hip because it is more flexed
        contraction: isometric
        cue: Inside leg short, inside foot slightly ahead
        confidence: medium
        sources:
          - heinrich-2022
          - seifert-2023
          - { source: lemaster-2010, pages: "61-62" }
      finish:
        action: Held flexed while the outside hip folds to match it
        contraction: isometric
        cue: Both hips folding together
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The leg tips out to the side under the low body; as the load arrives the pelvis tips over the loaded thigh so the inside half stays up, the outside abductors holding it pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up as the legs tip
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
          - moore-2020
          - seifert-2023
      shaping:
        action: Hip angulation builds with the edge to its most in late shaping, then holds
        moment: Changes sign within the turn; abductors and adductors co-contract
        contraction: concentric
        cue: Hips in, shoulders over the outside ski; more with speed
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 74, 128" }
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Holds under the late load, then releases as the legs fold and come back under the body
        contraction: eccentric
        cue: Let the hips come back over the skis as you fold
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 130 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The folded inside knee tips toward the new turn with its ski, leading the edge change
        contraction: concentric
        cue: Inside knee leads the tipping
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "67, 142" }
      shaping:
        action: Held, the inside thigh drawn toward the turn at hip width
        moment: Adduction, the adductor longus the main contributor in a modelled carved turn
        contraction: isometric
        cue: Feet hip width apart
        confidence: medium
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held, then eases toward neutral as the edges flatten
        contraction: isometric
        cue: Keep the feet hip width apart
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward a little as the light skis are tipped and pointed into the new turn under a quiet pelvis
        contraction: concentric
        cue: Turn the thigh in the hip socket
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - delp-1999
      shaping:
        action: Held turned in as the ski carves
        moment: External in a modelled carved turn, the external rotators braking the inward turn
        contraction: isometric
        cue: Keep the knee over the foot as the ski turns
        confidence: medium
        sources:
          - heinrich-2023
          - heinrich-2022
      finish:
        action: Held, then back toward neutral at the release
        contraction: isometric
        cue: Let the thigh unwind with the release
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward as the folded leg steers the inside ski into the new turn
        contraction: concentric
        cue: Steer the folded inside ski too
        confidence: low
        sources:
          - delp-1999
          - { source: lemaster-2010, pages: 142 }
      shaping:
        action: Held turned out, about 10-26° in a modelled carved turn
        moment: Internal, so the internal rotators hold the femur against further outward turn
        contraction: isometric
        cue: Inside ski parallel
        confidence: medium
        sources:
          - heinrich-2022
      finish:
        action: Held until the release
        contraction: isometric
        cue: Inside ski parallel
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Deeply hinged at the hips through the low switch, the trunk forward about 40-50°, and comes up only a little as the legs reach out; the low back stays slightly flattened, never rounded to make the fold
        contraction: isometric
        cue: Fold at the hips, not the waist; chest over the knees
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "62-63, 94" }
      shaping:
        action: Hinge held over the long outside leg, more tilted the harder the turn
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Tilts forward again with the hip hinge as the legs fold toward the switch
        contraction: eccentric
        cue: Fold at the hips as the legs fold
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63, 94" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half stays up as the legs tip under the low body, held by the outside hip abductors
        contraction: concentric
        cue: Inside hip up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Kept up, a little more as the edge builds to late shaping
        contraction: concentric
        cue: Don't let the inside hip drop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Levels as the edges release
        contraction: eccentric
        cue: Level the hips for the switch
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Square to the skis at the switch; a slight counter forms as the legs turn under the quiet pelvis
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Slight counter held, about 5-10°
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
          - psia-c-medium-radius-carved
      finish:
        action: Squares to the skis as they release
        contraction: isometric
        cue: Chest and pelvis square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, even at the deepest fold; folding at the waist instead of the hips is the retraction fault
        moment: Extension, against the deep forward fold
        contraction: isometric
        cue: Low back slightly flattened; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63, 94" }
      shaping:
        action: Held slightly flattened from standing under load
        moment: Extension, the largest moment in a modelled carved turn
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing as the fold deepens
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski as the legs tip under; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Shoulders level with the slope
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Hips in, shoulders out; more as speed builds
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Returns toward straight as the edges release
        contraction: concentric
        cue: Straighten up over the skis as you fold
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: medium, sources: [sporri-2016, fujii-2007] }
      finish: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest low and well forward through the switch, but the upper back not rounded; it rises a little as the legs reach out
        contraction: isometric
        cue: Chest over the knees, hands in front and level
        confidence: low
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "94, 154" }
      shaping:
        action: Slight forward flexion held
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 74 }
      finish:
        action: Chest lowers with the fold toward the switch
        contraction: isometric
        cue: Don't sit up as the turn ends
        confidence: low
        sources: []
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips toward the outside ski a little more than the pelvis does; the inside obliques lengthen to control it
        contraction: eccentric
        cue: Outside shoulder over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 70 }
          - fujimori-2014
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Outside shoulder over the outside ski; more as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-72, 128" }
      finish:
        action: Returns toward straight through the finish
        contraction: concentric
        cue: Let the shoulders come level
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space with the pelvis while the femurs turn under
        contraction: isometric
        cue: Chest a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      shaping:
        action: Slight counter held against the legs' turning
        contraction: isometric
        cue: Quiet upper body while the legs turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73, 107" }
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Squares to the skis as they release
        contraction: isometric
        cue: Chest square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: shoulder-girdle.protraction
    side: both
    cells:
      initiation: { action: Shoulder blades forward and level with the hands reaching ahead through the low switch, contraction: isometric, cue: Hands in front and level, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143, 154" }] }
      shaping: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
      finish: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
  - dof: shoulder.flexion
    side: outside
    cells:
      initiation:
        action: Arm held forward, hand in view and level with the other
        contraction: isometric
        cue: Outside hand forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "142-143, 154" }
      shaping:
        action: Arm held forward, ready
        contraction: isometric
        cue: Keep the outside hand ready
        confidence: low
        sources: []
      finish:
        action: Swings forward to ready the next touch
        contraction: concentric
        cue: Swing the next pole forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "112-116" }
  - dof: shoulder.flexion
    side: inside
    cells:
      initiation:
        action: Touches the pole lightly at the switch as a timing aid, without leaning on it
        contraction: concentric
        cue: A light touch as you fold
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 127 }
          - { source: iasi-2021, pages: 60 }
      shaping:
        action: Hand held forward, leading
        contraction: isometric
        cue: Inside hand up and forward, not dropped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "71, 142" }
      finish:
        action: Hand held forward
        contraction: isometric
        cue: Keep the inside hand up
        confidence: low
        sources: []
  - dof: shoulder.abduction
    side: both
    cells:
      initiation: { action: Arms a little out from the sides with the hands wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Hands held wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [] }
      finish: { action: Hands held wide, contraction: isometric, cue: Hands wide and forward, confidence: low, sources: [] }
  - dof: elbow.flexion
    side: both
    cells:
      initiation: { action: Bent about 75°; the touching arm reaches forward from the shoulder, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [{ source: lemaster-2010, pages: 142 }] }
      shaping: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
      finish: { action: Bent about 75° and held, contraction: isometric, cue: Forearms roughly parallel to the snow, confidence: low, sources: [] }
  - dof: wrist.grip
    side: both
    cells:
      initiation: { action: Light grip; the touching wrist flicks the pole tip forward, contraction: concentric, cue: Touch with the wrist not the arm, confidence: low, sources: [] }
      shaping: { action: Light grip held, contraction: isometric, cue: Hold the poles lightly, confidence: low, sources: [] }
      finish: { action: Light grip held, contraction: isometric, cue: Hold the poles lightly, confidence: low, sources: [] }
  - dof: neck.flexion
    side: trunk
    cells:
      initiation: { action: Head held up with the eyes ahead even with the chest low, contraction: isometric, cue: Eyes ahead as you fold, confidence: low, sources: [{ source: lemaster-2010, pages: 64 }] }
      shaping: { action: Head held steady, contraction: isometric, cue: A steady head, confidence: low, sources: [{ source: lemaster-2010, pages: 64 }] }
      finish: { action: Head held up as the chest lowers, contraction: isometric, cue: Eyes ahead as you fold, confidence: low, sources: [] }
  - dof: neck.side-bend
    side: trunk
    cells:
      initiation: { action: Head kept level or tipped slightly toward the outside with the shoulders, contraction: isometric, cue: Don't tip the head into the turn, confidence: low, sources: [{ source: lemaster-2010, pages: 72 }] }
      shaping: { action: Head kept level, contraction: isometric, cue: Don't tip the head into the turn, confidence: low, sources: [{ source: lemaster-2010, pages: 72 }] }
      finish: { action: Head kept level, contraction: isometric, cue: Level head, confidence: low, sources: [] }
  - dof: neck.rotation
    side: trunk
    cells:
      initiation: { action: Head turns with the chest toward the new turn so the eyes stay on the path, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
      shaping: { action: Held against the slight counter, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
      finish: { action: Eyes move ahead to the next turn's path, contraction: concentric, cue: Look along the next turn, confidence: low, sources: [] }

activations:
  # Outside leg. It works at a deeper bend than in an extension transition; that depth is the cost.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Hold the knee at a deep bend through the low switch, lengthen it slowly into the turn, hold it at the peak and let it fold again
    confidence: medium
    basis: Vastus medialis and lateralis averaged above 50 % MVC in GS turns (hintermeister-1997, abstract only; 1997 straight skis, long turns, not split by transition style), the same carved pattern. Outside vastus lateralis ran higher with a flexion transition than with an extension one, in steering and transition alike, with more desaturation and higher perceived exertion (seifert-2023, in mV). The per-setting values are our inference from the load and the deeper bend
    sources:
      - hintermeister-1997
      - seifert-2023
      - kroll-2010
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the deep knee bend through the switch and helps lengthen it, its activity there much higher than in an extension transition
    confidence: medium
    basis: Outside rectus femoris was much higher in the transition with a flexion transition (seifert-2023, in mV, so ranked, not scaled). Levels are our inference
    sources: [seifert-2023, kroll-2010, panizzolo-2013]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the deeply folded hip against the load and brakes the thigh's inward turn as the ski carves
    confidence: medium
    basis: Averaged above 50 % MVC in GS turns (hintermeister-1997, abstract only; 1997 straight skis, long turns, not split by transition style); hip extension moment about 1.3 Nm/kg in a modelled carved turn. Per-setting values are inference from the load and the fold
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Keeps the inside half of the pelvis up as the legs tip and the hip angulates
    confidence: medium
    basis: Measured on both legs on snow with both transition styles (seifert-2023); the inside ski shares the pelvic hold. Rises with the angulation at speed by inference
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: low
    basis: Never measured on snow; off-snow EMG puts it with gluteus medius
    sources: [moore-2020, ganderton-2017]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps hold the pelvis and turn the thigh inward
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to tip and steer the light skis, then stiffen the hip against the abductors
    confidence: medium
    basis: The adductors averaged above 50 % MVC in GS turns as a group; the carved turn needs little steering, so they sit lower here by inference
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured apart from the adductor group
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and brakes the thigh's inward turn as the ski carves
    confidence: medium
    basis: Biceps femoris averaged above 50 % MVC in GS turns on one leg through both turns; modelled as an external rotator braking the outside hip. Per-setting values are inference
    sources: [hintermeister-1997, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in
    confidence: medium
    basis: Semitendinosus 6-15 % MVC in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation, pelvis.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn as the ski carves
    confidence: low
    basis: Quadratus femoris contributed to the external rotation moment in a model of a carved turn; model only
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Keeps the shin on the tongue through the deep, light switch so the fold does not tip the body back, then co-contracts as the turn loads
    confidence: medium
    basis: Highly active in GS turns (hintermeister-1997); the deep switch puts the knee and hip far forward of the ankle only if the ankle stays closed, which is our mechanics reading of LeMaster's back-seat warning. The shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "58-59, 79-81, 96" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the ankle against the load with the boot shaft, then opens it as the foot comes forward
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee deeply bent
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the new big-toe edge while the body is still low, build it into late shaping, then let it go
    confidence: medium
    basis: Peroneus longus is highly active in turns, attributed to edge control; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the loaded hip
    confidence: low
    basis: Inference; never measured on snow. The loaded hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. At initiation it is the old outside leg, pulled up through the switch: hip flexors and
  # knee flexors concentric while it is light, then loaded again, short and bent.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity:
      initiation: 2
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the old outside thigh up toward the chest through the switch, then helps keep the inside leg short
    confidence: low
    basis: Inference; iliopsoas has never been measured on snow. LeMaster names the hip flexors as the active retractors; with the hip flexed iliopsoas carries more of the hip-flexion torque than TFL or sartorius (jiroumaru-2014). Lifting a leg, boot and ski that are briefly unloaded is a moderate effort that changes little with intensity
    sources:
      - jiroumaru-2014
      - juan-2024
      - { source: lemaster-2010, pages: "97-98, 152-154" }
      - { source: lind-sanders-2004, pages: 120 }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Works as a hip flexor to retract the old outside leg, and keeps the inside leg short through the turn
    confidence: medium
    basis: Inside rectus femoris was higher with a flexion transition in both steering and transition (seifert-2023, in mV); measured as an inside-leg hip flexor in recreational turns (kroll-2010). Levels are our inference
    sources: [seifert-2023, kroll-2010, cuniberti-2026]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Folds the old outside knee to pull the foot up and back under the body, then steadies the bent inside knee
    confidence: low
    basis: Mechanics of the retraction; inside-leg hamstring activity has been measured in turns but not in this drill
    sources:
      - chollet-2025
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help fold the knee through the retraction and steady it afterwards
    confidence: low
    basis: Mechanics of the retraction; not measured in this drill
    sources: [chollet-2025]
  - muscle: gastrocnemius
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 0 }
    contraction: { initiation: concentric, shaping: null, finish: null }
    role: Helps fold the knee while the leg is light
    confidence: low
    basis: Anatomy; a knee flexor on an unloaded leg (biomechanics.md F6.4)
    sources: []
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Nearly quiet while the leg is pulled up, then hold the bent inside knee under its share of the load
    confidence: medium
    basis: Inside vastus lateralis ran about 54 % below the outside leg in recreational turns
    sources: [kroll-2010, heinrich-2023]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Holds the more-flexed inside hip against its load and helps turn the thigh outward as the leg steers
    confidence: low
    basis: The inside hip carries an extension moment in a modelled carved turn; scaled with the inside load by inference
    sources: [heinrich-2022, delp-1999]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the inside thigh drawn toward the turn and, with the hip flexed, hold it against further outward turn
    confidence: medium
    basis: Adductor longus ranked among the most active inside-leg muscles in an EMG-validated model of a carved turn; the inside hip carried an internal rotation moment
    sources: [heinrich-2023, heinrich-2022]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the folded inside thigh outward so the inside ski steers with the outside one
    confidence: low
    basis: Anatomy; with the hip deeply flexed their moment arms shrink, so gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, hip.rotation, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Flexes the hip, turns the thigh out and bends the knee together, the shape of the retraction
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps the folded knee tip toward the new turn and steadies the inside hip
    confidence: medium
    basis: Inside gluteus medius was active through steering and transition, but lower with a flexion transition than with an extension one (seifert-2023)
    sources: [seifert-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the retracting foot up and back, tips the inside ski first, and keeps the shin on the tongue, rising after the fall line
    confidence: medium
    basis: The second most active inside-leg muscle in an EMG-validated model of a carved turn, rising after the fall line; scaled by inference
    sources: [heinrich-2023, hintermeister-1997]
  - muscle: toe-extensors
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the inside foot up with tibialis anterior
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Rolls the inside ski onto its little-toe edge and lets it go
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Shares the inside ankle's plantarflexion moment with the boot once the leg is loaded again
    confidence: medium
    basis: The modelled inside ankle moment was about 45 % lower than the outside one
    sources: [heinrich-2022]
  - muscle: foot-intrinsics
    side: inside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the lighter load over the inside sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  # Pelvis and trunk. The trunk folds deep at the switch, so the back extensors hold it there.
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the deeply folded trunk with the low back slightly flattened, so the retraction comes from the hips and knees, not a rounded back
    confidence: medium
    basis: Measured in turns; the lumbar extension moment was the largest joint moment in a modelled carved turn. The trunk is folded further through the switch than in an extension transition, so the hold is longer; levels are inference
    sources:
      - hintermeister-1997
      - zeglinski-1998
      - heinrich-2022
      - heinrich-2023
  - muscle: rectus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Balances the back extensors and helps the hip flexors pull the legs up, without rounding the back
    confidence: medium
    basis: Measured at low levels in turns; LeMaster names the abdominals with iliopsoas as active flexors
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "62-63, 97-98" }
  - muscle: multifidus
