structures:
  - structure: acl
    side: outside
    phases: [initiation, finish]
    mechanism: Loaded if the deep fold drops the hips behind the feet, so the skier lands the new turn back-seated with the boot pushing the shin forward against a hard quadriceps pull; the backward-fall mechanism
    protected_by: [biceps-femoris, medial-hamstrings, tibialis-anterior, gluteus-maximus]
    confidence: medium
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "119-122" }
      - { source: lind-sanders-2004, pages: "192-193" }
      - { source: lemaster-2010, pages: 62 }
  - structure: patellar-tendon
    side: outside
    phases: [initiation, shaping]
    mechanism: Pulled hard by the quadriceps holding the knee near 90° through the switch, deeper than in an extension transition
    protected_by: [vasti]
    confidence: low
    sources: [seifert-2023]
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by the deep forward fold at the switch and by flexion, side bend and twist combined under the turn load; worse if the fold is made by rounding the back
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

