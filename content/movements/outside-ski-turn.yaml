id: outside-ski-turn
name: Turn on the outside ski alone, inside ski held off the snow
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns and mechanics.
# Phases: initiation = LeMaster's and IASI's initiation, Pritchard & Taylor's initiation after the turn switch;
# shaping = LeMaster's control phase, IASI's fall line, P&T's steering phase; finish = completion in all three.
# Their transition sits between our finish and the next initiation.
# The new inside ski leaves the snow before the edge change and stays up through every phase; the edge change is
# made on the one stance ski, rolled from its little-toe edge to its big-toe edge (psia-c-outside-ski-turn,
# psia-national-activities). At the end of the finish the lifted ski is set down on its little-toe edge, takes the
# weight and becomes the next stance ski; the old stance ski is lifted before the next edge change.
#
# Intensity (the drill's scenarios): the outside leg carries 100 % of the snow force all turn.
# Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and below it (heading 135°):
#   gentle    7 m/s, R 12 m, 12°:   about 1.00, 1.06, 1.13
#   moderate  9 m/s, R 14 m, 16°:   about 1.01, 1.13, 1.24
#   dynamic  11 m/s, R 16 m, 20°:   about 1.03, 1.22, 1.38
# Tilt of the balanced body from the slope normal at the fall line and the finish: about 23° and 30° gentle,
# 32° and 39° moderate, 39° and 47° dynamic. The task asks for a brushed track, so the ski skids a little at
# every setting; that is technique, not intensity. The load builds past the fall line and peaks in late shaping
# or early finish, then eases as the radius opens (falda-buscaiot-2017, zorko-2015, L&S Table 6.1, P&T p 27).
# Outside knee: most flexed in the transition, extending a little through initiation, quasi-isometric and
# most extended through shaping, flexing again (eccentric, absorbing) through the finish (LeMaster pp 40-42,
# P&T p 27, IASI pp 65-66); the hip follows. Our inference, solved for balance over the foot and scaled from
# the stork model to these loads: outside hip flexion mid-turn to transition about 50-63° gentle, 57-71°
# moderate, 64-79° dynamic; the knee that balances it about 62-70°, 67-76° and 72-80°. Race reference:
# heinrich-2022's GS outside hip 50-81°, knee 56-80°.
# Per-setting values are inference from these mechanics; a single number means it changes little with intensity.
# The balance stabilisers (peroneals, tibialis posterior, foot intrinsics) change little: they answer balance,
# not the turn force. On one ski the skier is an inverted pendulum on one edge, so lateral corrections come from
# the foot, the ankle and the hip, fast (L&S pp 137-139).
# The lifted inside leg carries no snow force. Leg, boot and ski, about 16 kg, hang from the hip with nothing
# resting on the snow: about 0.6 Nm/kg of hip flexion moment (our estimate from L&S's segment and ski masses); its
# effective weight grows with n, too little to move a level.
#
# Equipment assumed: recreational carving skis; boots with about 15° cuff lean, about 0.9° binding ramp
# (4.7 mm) and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167);
# a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132); a deeper
# sidecut tightens the turn (LeMaster pp 32-33, L&S p 53).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the foot is drawn back and the shin presses into the tongue while the body crosses over the one stance ski; flexed about as far as it goes in the turn
        contraction: concentric
        cue: Pull the toes up and the foot back as you roll onto the new edge
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 182-183" }
          - { source: cross-raschner-2023, pages: 14 }
          - { source: iasi-2021, pages: 187 }
      shaping:
        action: Held flexed against the rising load to the fall line, then opens a little as the foot starts forward; a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Opens progressively as the foot slides forward under the body, still flexed past upright; pressure moves toward the heel. Fore-aft balance along the one ski is the task's point
        contraction: concentric
        cue: Let the foot slide ahead as the turn ends, without sitting back
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
          - psia-c-outside-ski-turn
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Flexed with the shin in the tongue as the leg is drawn up, so the lifted ski hangs level rather than tip down
        contraction: isometric
        cue: Both shins forward, not just the stance one
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
      shaping:
        action: Held flexed with the ski about parallel to the snow; the ski's longer forebody, ahead of the boot, pitches it tip down, and the shin and cuff hold it level with a little ankle effort
        moment: Small dorsiflexion, against the forebody's weight
        contraction: isometric
        cue: Lifted ski level with the snow, tip not dragging
        confidence: low
        sources:
          - psia-c-outside-ski-turn
          - { source: lind-sanders-2004, pages: 47 }
      finish:
        action: Stays closed, shin on the tongue, as the ski is lowered at the end of the finish, so it lands centred and ready to take the weight
        contraction: isometric
        cue: Keep the shin on the tongue as you set the ski down
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: The stance foot alone changes the edge. It starts on the little-toe edge, where it took the weight in the transition; the invertors let it go eccentrically while the ski is still on that edge, then the evertors roll the ski over concentrically, through flat onto its big-toe edge
        moment: Inversion while loaded on the little-toe edge (invertors briefly eccentric), then eversion as the evertors roll the ski over
        contraction: concentric
        cue: Roll the one ski from its little-toe edge onto its big-toe edge
        confidence: medium
        sources:
          - psia-c-outside-ski-turn
          - psia-c-intermediate-one-ski
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: 127 }
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Eversion keeps building to its most in late shaping, below the fall line, then holds against the snow force that would flatten the ski, with constant small corrections on the one edge
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line; the edge angle builds with speed and pitch
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55, 137" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Eases as the turn ends; the ski is still on its big-toe edge when the weight moves onto the other ski and this one is lifted
        contraction: eccentric
        cue: Ease the edge as the turn ends, then step off it
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "38, 128" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts so the lifted ski tips onto its little-toe edge with the stance ski
        contraction: concentric
        cue: Tip the lifted ski the same way as the stance ski
        confidence: low
        sources:
          - psia-c-intermediate-one-ski
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Tilt held, building with the stance ski's edge
        contraction: isometric
        cue: Keep the lifted ski tilted with the stance ski
        confidence: low
        sources:
          - psia-c-intermediate-one-ski
      finish:
        action: Tilt held as the ski is set down on its little-toe edge, where it takes the whole load for a moment before its own edge change
        moment: Inversion once loaded on the little-toe edge
        contraction: isometric
        cue: Set it down parallel, at hip width, on its little-toe edge
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "137-139" }
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the whole load through its own edge change
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      finish:
        neutral: true
        contraction: isometric
        cue: Spread the pressure over the sole as the foot takes the weight
        confidence: low
        sources: []
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition, where it took the weight, as the new turn loads
        contraction: concentric
        cue: Grow into the new turn on the one leg
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
      shaping:
        action: "Held near its longest, quasi-isometric, while the load builds; deeper the harder the turn, about 62° gentle, 67° moderate, 72° dynamic (our inference; heinrich-2022 GS 56-80°)"
        moment: Extension, near its peak
        contraction: isometric
        cue: Stay long, strong and steady on the outside leg
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42" }
          - { source: cross-raschner-2023, pages: "11-14" }
          - alhammoud-2020
          - heinrich-2022
      finish:
        action: "Flexes, absorbing the load as it peaks below the fall line and eases, into its deepest bend in the transition, about 70° gentle, 76° moderate, 80° dynamic (our inference)"
        contraction: eccentric
        cue: Flex under control as the turn ends
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
          - falda-buscaiot-2017
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Flexes to draw the whole ski off the snow as the weight moves onto the new outside ski, before its edge change; knee flexion lifts the heel and keeps the ski level
        contraction: concentric
        cue: Pick the ski up before you change edges
        confidence: low
        sources:
          - psia-c-outside-ski-turn
          - psia-national-activities
      shaping:
        action: Held more bent than the outside knee, with no tip on the snow to help
        contraction: isometric
        cue: Heel up, ski level with the snow
        confidence: low
        sources:
          - psia-c-outside-ski-turn
          - { source: lemaster-2010, pages: 55 }
      finish:
        action: Held up through most of the finish, then lengthens with the hip to set the ski down at the end of it
        contraction: eccentric
        cue: Lower the ski, don't drop it
        confidence: low
        sources: [psia-c-outside-ski-turn]
  - dof: knee.rotation
    side: outside
    cells:
      initiation:
        neutral: true
        contraction: isometric
        cue: Turn the thigh, not the knee
        confidence: low
        sources:
          - { source: iasi-2021, pages: 191 }
          - { source: lemaster-2010, pages: "124-125" }
      shaping:
        neutral: true
        moment: Resisting the twist the snow force invites
        contraction: isometric
        cue: Turn the thigh, not the knee
        confidence: medium
        sources: [zorko-2020, heinrich-2023]
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Set the ski down straight, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping:
        neutral: true
        moment: Resisting the inward collapse the edged load invites
        contraction: isometric
        cue: Knee stays over the foot, not caving in
        confidence: medium
        sources: [zorko-2020, heinrich-2023]
      finish: { neutral: true, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      finish:
        neutral: true
        contraction: isometric
        cue: Set the ski down without the knee caving in
        confidence: low
        sources:
          - { source: jordan-sporri-taylor-2023, pages: 122 }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens from its deepest fold in the transition as the leg lengthens into the new turn
        contraction: concentric
        cue: Rise a little into the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
      shaping:
        action: "Held at its most open, folded forward at the hip with the pelvis countered, about 50° gentle, 57° moderate, 64° dynamic (our inference; heinrich-2022 GS 50-81°)"
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist; deeper with speed and pitch
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
          - alhammoud-2020
      finish:
        action: "Folds further with the knee, absorbing the late load, into the transition, about 63° gentle, 71° moderate, 79° dynamic (our inference)"
        contraction: eccentric
        cue: Fold at the hips as the legs flex to finish
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Flexes to lift the thigh and the whole ski before the edge change; hip flexion does most of the shortening and brings the lifted foot a little ahead
        contraction: concentric
        cue: Bring the inside thigh up; the whole ski comes off the snow
        confidence: medium
        sources:
          - kroll-2010
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "61-62" }
          - psia-c-outside-ski-turn
      shaping:
        action: Held more flexed than the outside hip, the hip flexors carrying the whole leg, boot and ski
        moment: Flexion, about 0.6 Nm/kg with nothing resting on the snow (our estimate)
        contraction: isometric
        cue: Inside thigh held up, ski level
        confidence: medium
        sources:
          - kroll-2010
          - { source: lemaster-2010, pages: "55, 61-62" }
          - { source: lind-sanders-2004, pages: "47, 103" }
      finish:
        action: Held through most of the finish, then lowered to set the ski down at hip width just before the edge change
        contraction: eccentric
        cue: Lower the leg under control
        confidence: low
        sources: [psia-c-outside-ski-turn]
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The pelvis tips over the stance thigh as the leg tilts in, so the inside half, unsupported since the transition, rises; the outside abductors hike it, pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up from the moment the ski lifts
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
      shaping:
        action: Hip angulation keeps building with the edge to its most in late shaping, then held, the outside hip carrying the unsupported inside half of the pelvis
        moment: Abduction
        contraction: concentric
        cue: Stay strong over the outside hip; the angle builds with speed and pitch
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
          - moore-2020
          - ganderton-2017
      finish:
        action: Holds under the late load, then releases as the legs come upright and the other ski is set down
        contraction: eccentric
        cue: Level the hips as the other ski comes down
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Kept at hip width as the ski lifts, neither drawn in nor out; the net moment is near zero
        contraction: isometric
        cue: Lifted boot at hip width
        confidence: low
        sources: []
      shaping:
        action: Held at hip width beside the stance leg, the ski parallel to the stance ski
        contraction: isometric
        cue: Lifted ski parallel and at hip width
        confidence: low
        sources: [psia-national-activities]
      finish:
        action: Held, then the foot is set down at hip width
        contraction: isometric
        cue: Set the foot down at hip width, not wide
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward, the thigh rotating under the pelvis to steer and tip the one ski through its edge change
        contraction: concentric
        cue: Turn the thigh in the hip socket
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - { source: iasi-2021, pages: 193 }
          - delp-1999
      shaping:
        action: Held turned in as the ski turns; the brushed track needs a little steering
        moment: Small; internal (steering) in a brushed turn, external (braking) if carved, extrapolated from a modelled carved GS turn
        contraction: isometric
        cue: Keep the knee over the foot as the ski turns
        confidence: low
        sources: [heinrich-2023, psia-c-outside-ski-turn]
      finish:
        action: Held, then back toward neutral as the turn ends
        contraction: isometric
        cue: Let the thigh unwind as the turn ends
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward with the turn so the lifted ski stays parallel to the stance ski
        contraction: concentric
        cue: Keep the lifted ski parallel
        confidence: low
        sources: [delp-1999, psia-national-activities]
      shaping:
        action: Held turned out, keeping the lifted tip from drifting toward the stance ski
        contraction: isometric
        cue: Lifted ski aligned with the stance ski
        confidence: low
        sources: [psia-national-activities]
      finish:
        action: Held until the ski is set down
        contraction: isometric
        cue: Set it down parallel
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up from the transition's deep hip hinge as the stance leg lengthens, moving with the thigh; the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the leg; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held at its most open over the long stance leg, more tilted the harder the turn, never standing tall. Tilting it further forward than the balance needs, so the low back arches, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
          - { source: iasi-2021, pages: 194 }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex into the transition
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half has no support from the transition on; it rises against the balance axis as the stance leg tips in, hiked by the outside hip abductors
        contraction: concentric
        cue: Inside hip up before the edges change
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, with no support from the inside ski
        contraction: concentric
        cue: Don't let the inside hip drop; more as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Held up under the late load, then lowers as the lifted ski is set down
        contraction: eccentric
        cue: Level the hips as the ski comes down
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space while the stance femur rotates under it
        contraction: isometric
        cue: Let the leg turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
          - { source: iasi-2021, pages: 64 }
          - psia-c-outside-ski-turn
      shaping:
        action: Slight counter held
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      finish:
        action: Slight counter held through the finish and released with the skis as they ease off their edge; the new counter forms as the new stance leg turns under
        contraction: isometric
        cue: Keep the slight counter until the skis release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
          - { source: iasi-2021, pages: 64 }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under load, never arched or slumped; a harder turn folds more at the hips, not the low back
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing, never arched or slumped
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski as the one ski changes edges; the inside quadratus lumborum and obliques lengthen to control it. Angulation, not banking, keeps the body over the one edge
        contraction: eccentric
        cue: Tip the upper body over the stance ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
          - psia-c-outside-ski-turn
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held, keeping the trunk over the outside ski rather than banking
        contraction: eccentric
        cue: Hips in, shoulders out; more as speed and pitch build
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Holds, then returns toward straight through the finish
        contraction: concentric
        cue: Straighten up as the turn ends
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
      finish: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest forward, about 20-33° from vertical through the turn, a little more the harder the turn; it rises a little with the hips as the stance leg lengthens
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "182-183" }
      shaping:
        action: Slight forward flexion held
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
