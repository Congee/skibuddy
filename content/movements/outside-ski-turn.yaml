    role: Tips the lifted ski onto its little-toe edge, holds it there, and holds that edge as the ski is set down and loaded
    confidence: low
    basis: Anatomy; not measured on snow. The loaded moment on the little-toe edge at set-down is brief, and the boot shell carries most of it
    sources:
