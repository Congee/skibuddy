activations:
  # Outside (stance) leg. Load-bearing efforts scale with the load factor and knee bend; balance efforts change little.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthens the knee into the turn, holds it against the whole turn force with no help from the inside leg, then lets it flex under the late load
    confidence: medium
    basis: Measured in normal turns, where activity peaks in the steering phase at a steady knee bend. Here one leg carries the whole load all turn, about body weight when gentle and up to 1.4 times it when dynamic, peaking below the fall line, at a deeper bend as the turn gets harder; the per-setting values are our inference from that load and bend. At initiation the load is nearly body weight at every setting, so gentle 1 against moderate 2 reflects the knee depth, not the load
    sources:
      - hintermeister-1997
      - kroll-2010
      - panizzolo-2013
      - heinrich-2022
      - { source: cross-raschner-2023, pages: "13-14" }
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the stance leg
    confidence: medium
    basis: Measured as a knee extensor on the outside leg in normal turns; scaled with load by inference
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded hip against the load, sharing the work with the hamstrings and adductor magnus
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn, shared with the hamstrings and adductor magnus. Scaled like the vasti, with the load and the depth of the fold; the per-setting values are inference. At initiation gentle 1 against moderate 2, at almost the same load, reflects the depth of the fold
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - distefano-2009
      - { source: lind-sanders-2004, pages: 103 }
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 3, dynamic: 3 }
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Holds up the inside half of the pelvis, unsupported from the transition to the set-down, hikes it further as the edge builds, and lets it down as the other ski comes down
    confidence: medium
    basis: Measured on both legs in normal turns; the one-leg pelvic hold follows from mechanics and single-leg exercise data. Unlike stork turns the pelvis has no support from before the edge change, through a one-foot edge change on blue to gentle black terrain, so moderate and dynamic reach 3 from initiation; gentle stays 2, near body weight on easier pitch. All values per setting are inference
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - distefano-2009
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 3, dynamic: 3 }
      shaping: { gentle: 2, moderate: 3, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow. Scaled as gluteus medius
    sources: [moore-2020, ganderton-2017, uebayashi-2026, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation, pelvis.list]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps hold the pelvis and turn the thigh inward
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to steer and edge the one ski through its edge change, then brace against the abductors
    confidence: medium
    basis: Measured in normal turns; the steering role is mechanics of the bent leg
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee, shares the hip extension moment, and checks the trunk's forward pitch on one ski
    confidence: medium
    basis: Measured in normal turns and a simulated edged stance; modelled hip extension share. A one-legged racer's biceps femoris was much more active in the first half of the turn on his harder side, so it matters on one ski. Scaled with the load like adductor magnus
    sources: [hintermeister-1997, heinrich-2022, heinrich-2023, zorko-2020, ishige-2021]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation, pelvis.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn
    confidence: low
    basis: The hip rotation moment is small and its sign depends on whether the ski carves or brushes; extrapolated from a model of a carved GS turn. Their action also shifts with hip flexion
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the foot back into the new turn; once the turn loads, only co-contracts, as the net ankle moment is plantarflexion
    confidence: medium
    basis: Measured in normal turns, where it is highly active; active ankle flexion is a book technique point. The modelled shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the flexed ankle against the rising load to the fall line, sharing the plantarflexion moment with the boot shaft, then opens the ankle to push the foot forward through the finish
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus, not the gastrocnemius, does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee bent
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the one ski from its little-toe edge onto its big-toe edge, build the edge into late shaping, make the constant small balance corrections on one edge, then ease it
    confidence: medium
    basis: Highly active in turns, attributed to edge control; balancing on one ski adds continuous co-contraction, and here the whole edge change is made by this foot. A balance effort, so it changes little with intensity; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - psia-c-outside-ski-turn
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: tibialis-posterior
    side: outside
    serves: [ankle.inversion, foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Brief eccentric let-go of the loaded little-toe edge while the peroneals roll the ski over, then arch support and co-contraction with the peroneals for balance on the big-toe edge
    confidence: low
    basis: Anatomy and the mechanics of a one-foot edge change; until the ski is flat the snow force acts on its outer edge, an inversion moment. Not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - psia-c-outside-ski-turn
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow. A balance effort, so it changes little with intensity
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the stance hip, a minor role
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow. The stance hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. It carries no snow force from the transition to the set-down; nothing rests on the snow.
  # Inside gastrocnemius is left out: pointing the foot would tip the lifted ski down.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lifts the inside thigh and the whole ski before the edge change and holds them up to the set-down
    confidence: low
    basis: Inference; no study has measured iliopsoas on snow, and only rectus femoris has been measured as an inside-leg hip flexor. Holding up the leg, boot and ski, about 16 kg, with nothing on the snow is about 0.6 Nm/kg of hip flexion moment (our estimate), a moderate hip-flexor effort held through the whole turn; the load factor adds 6-22 % at the fall line, too little to move a level
    sources:
      - jiroumaru-2014
      - juan-2024
      - andersson-1997
      - kroll-2010
      - { source: lind-sanders-2004, pages: "47, 103" }
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works as a hip flexor on the inside leg, not as a knee extensor
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg in normal turns; here it holds the whole ski up all turn. Changes little with intensity
    sources:
      - kroll-2010
      - cuniberti-2026
      - seifert-2023
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 0, shaping: 0, finish: 1 }
    contraction: { initiation: null, shaping: null, finish: eccentric }
    role: Idle while the leg is lifted; take the load again as the ski is set down to become the next stance ski
    confidence: medium
    basis: Measured low on the inside leg in normal turns; lower still with the leg off the snow
    sources:
      - kroll-2010
      - { source: cross-raschner-2023, pages: 14 }
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Bends the knee to lift the ski, then holds the heel up so the ski stays level; its short head is a pure knee bender
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the lift is mechanics. Holding the lower leg, boot and ski with the shank hanging close to the balance axis is a light effort, about a tenth of maximum by our estimate
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Help bend the knee and hold the ski up
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gracilis
    side: inside
    serves: [knee.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Bends the knee and keeps the lifted leg at hip width
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: sartorius
    side: inside
    serves: [hip.flexion, hip.rotation, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Flexes the hip, turns the thigh out and bends the knee together, which is the lifted-leg posture
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps hold the thigh up
    confidence: low
    basis: Hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Keep the lifted thigh at hip width; pectineus also lifts it
    confidence: low
    basis: Modelled in normal turns
    sources: [heinrich-2023]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the lifted thigh out so the ski stays parallel to the stance ski
    confidence: low
    basis: Anatomy; not measured on snow. With the hip deeply flexed their external rotation moment arm shrinks, and piriformis flips to an internal rotator, so gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps turn the lifted thigh out so the ski stays parallel
    confidence: low
    basis: Anatomy and moment arms; not measured on snow
    sources: [delp-1999]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the free thigh from falling inward
    confidence: low
    basis: Inside gluteus medius is active in normal turns; its role here is mechanics
    sources: [seifert-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Keeps the shin on the tongue and the lifted ski level against its forebody's weight, tips it onto its little-toe edge, and keeps the ankle closed as it is set down
    confidence: low
    basis: Modelled on the inside leg in normal turns. The forebody's pitch moment is a few newton-metres, a small share of the dorsiflexors' strength, and the cuff carries part of it; low by mechanics
    sources:
      - heinrich-2023
      - { source: lind-sanders-2004, pages: 47 }
