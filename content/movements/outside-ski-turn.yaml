id: outside-ski-turn
name: Turn balanced on the outside ski, inside ski tail lifted
# No study has measured this drill; intensities are inferred from EMG of normal turns.
activations:
  - muscle: quadriceps
    side: outside
    intensity: { initiation: 2, shaping: 2, finish: 3 }
    contraction: [eccentric, isometric]
    role: Holds the flexed knee against turn forces
    confidence: medium
    basis: Measured in normal turns; peaks late in the turn
    sources: [hintermeister-1995, hintermeister-1997, berg-1999]
  - muscle: gluteus-maximus
    side: outside
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: [isometric, eccentric]
    role: Controls hip flexion; extends at the transition
    confidence: medium
    basis: Measured in wedge, parallel and giant slalom turns
    sources: [hintermeister-1997]
  - muscle: gluteus-medius
    side: outside
    intensity: { initiation: 2, shaping: 3, finish: 3 }
    contraction: [isometric]
    role: Keeps the pelvis level over one leg
    confidence: medium
    basis: Measured in giant slalom turns; the one-leg role is inferred
    sources: [chollet-2025]
  - muscle: adductors
    side: outside
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Frontal-plane control together with the abductors
    confidence: medium
    basis: Measured in wedge, parallel and giant slalom turns
    sources: [hintermeister-1997]
  - muscle: hamstrings
    side: outside
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Co-contracts with the quadriceps for fore-aft control and ACL protection
    confidence: medium
    basis: Measured in normal turns; ACL role from an in-vivo injury recording
    sources: [hintermeister-1997, sporri-2022]
  - muscle: deep-hip-rotators
    side: outside
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: [concentric, isometric]
    role: Turn the femur under a still pelvis
    confidence: low
    basis: Body mechanics; no EMG
    sources: []
  - muscle: tibialis-anterior
    side: outside
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: [isometric]
    role: Keeps the shin forward against the boot as the turn starts
    confidence: medium
    basis: Measured in normal turns
    sources: [hintermeister-1997]
  - muscle: calf
    side: outside
    intensity: { initiation: 1, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Fore-aft balance against the boot under load
    confidence: medium
    basis: Measured in normal turns
    sources: [hintermeister-1997]
  - muscle: peroneals
    side: outside
    intensity: { initiation: 1, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Angulate the foot and ankle inside the boot
    confidence: low
    basis: Body mechanics only
    sources: []
  - muscle: hip-flexors
    side: inside
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: [isometric]
    role: Hold the inside thigh up so the tail clears the snow
    confidence: low
    basis: Body mechanics only
    sources: []
  - muscle: hamstrings
    side: inside
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: [concentric, isometric]
    role: Flex the knee to lift the tail
    confidence: low
    basis: Body mechanics only
    sources: []
  - muscle: obliques
    side: both
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Keep the upper body still while the legs turn
    confidence: medium
    basis: Measured in normal turns
    sources: [hintermeister-1997]
  - muscle: erector-spinae
    side: both
    intensity: { initiation: 2, shaping: 2, finish: 2 }
    contraction: [isometric]
    role: Hold the trunk tall over the outside ski
    confidence: medium
    basis: Measured in normal turns
    sources: [hintermeister-1997]
joint_actions:
  - { joint: hip, side: outside, action: Femur rotates inward in the hip socket while the pelvis stays level, confidence: medium }
  - { joint: knee and ankle, side: outside, action: Stay flexed; the shin presses the boot tongue, confidence: medium }
  - { joint: hip and knee, side: inside, action: Flex so the foot rides beside the outside boot with the tail up, confidence: high }
  - { joint: spine, side: both, action: Stays quiet; movement here is a fault the drill reveals, confidence: medium }
reviewed_by: []
