structures:
  - structure: acl
    side: outside
    phases: [shaping, finish]
    mechanism: Loaded if the skier falls back and the one ski catches its inner edge while the knee straightens and turns in, the slip-catch seen in racing injuries; with no inside ski to catch the fall, a backward lean loads this knee alone
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: inside
    phases: [finish]
    mechanism: Loaded if the lifted ski is set down wide or tip out and catches, so the leg re-engages in a wedge and the knee twists inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
      - { source: lind-sanders-2004, pages: 193 }
  - structure: mcl
    side: inside
    phases: [finish]
    mechanism: Our inference from the same wedge catch, which the sources describe without naming this ligament; the knee caving in opens its inner side
    protected_by: [medial-hamstrings, gracilis, sartorius]
    confidence: low
    sources:
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: patellar-tendon
    side: outside
    phases: [shaping, finish]
    mechanism: Pulled hard through long quadriceps holds at a deep knee bend on one leg, more so at higher intensity
    protected_by: [vasti]
    confidence: low
    sources: []
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under the turn load
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

