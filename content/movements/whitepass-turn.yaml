      initiation: { action: "Head faces down the hill with the chest, eyes along the arc", contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
      shaping: { action: Held with the chest, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
