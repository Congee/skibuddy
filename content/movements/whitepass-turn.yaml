structures:
  - structure: acl
    side: outside
    phases: [shaping, finish]
    mechanism: Loaded if the ski is set down with the leg straight and the skier behind it, or later the skier falls back on the one ski and its inner edge catches while the knee straightens and turns in, the slip-catch seen in racing injuries
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
  - structure: acl
    side: outside
    phases: [shaping]
    mechanism: Our inference from the dynamic snowplow, which the sources describe on a re-landing inside ski; here the outside ski lands wide, tip out, and catches, twisting the knee inward
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
      - { source: lind-sanders-2004, pages: 193 }
  - structure: mcl
    side: outside
    phases: [shaping]
    mechanism: Our inference from the same wide landing; the knee caving in opens its inner side
    protected_by: [medial-hamstrings, gracilis, sartorius]
    confidence: low
    sources:
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: patellar-tendon
    side: outside
    phases: [finish]
    mechanism: Pulled hard through the long single-leg hold at a deep knee bend, the drill's highest load, more so at higher intensity
    protected_by: [vasti]
    confidence: low
    sources: []
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under the turn load, with the side bend reversed in sense each time the stance changes ski
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

