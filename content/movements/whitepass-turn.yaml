id: whitepass-turn
name: Turn started on the inside ski's little-toe edge, finished on the outside ski alone
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns, the one-legged
# racer (ishige-2021) and mechanics.
# Phases: initiation = LeMaster's and IASI's initiation; shaping = LeMaster's control phase, IASI's fall line;
# finish = completion. Their transition sits between our finish and the next initiation.
# Sides are the current turn's. Each leg runs one cycle over two turns (psia-c-white-pass-turn, IASI pp 175-176):
#   as the outside leg: held up through initiation; extends to set the ski down near the fall line (shaping); carries
#   the whole load through the finish, and alone through the transition, where its edge changes and it becomes the
#   next turn's inside leg;
#   as the inside leg: stands alone on the little-toe edge through initiation; shares the load briefly and shortens
#   as the outside ski takes over (shaping); lifted before the finish and held up through the transition, where it
#   tips over to become the next turn's outside ski.
# So the edge change is made on one ski, the old outside ski, rolling from its big-toe to its little-toe edge
# Flattening the old outside ski removes its lateral support, as lifting it does in LeMaster pp 151-152, so the
# body falls into the new turn.
#
# Intensity (the drill's scenarios). Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and
# below it (heading 135°):
#   gentle    8 m/s,  R 15 m, 14°:   about 0.99, 1.06, 1.14  (tilt about 11°, 24°, 32°)
#   moderate 10 m/s,  R 16 m, 17°:   about 1.02, 1.15, 1.28  (tilt about 20°, 34°, 41°)
#   dynamic  12 m/s,  R 17 m, 20°:   about 1.07, 1.28, 1.45  (tilt about 29°, 43°, 50°)
# One ski carries it all except around the fall line: the inside ski at the top (about 1.0-1.07 W, the lightest
# part of the turn, but on the weaker little-toe edge), the outside ski from late shaping (1.06-1.28 W) through the
# finish (1.14-1.45 W), more than stork turns ask of it (1.09-1.33 W). Speeds and radii are our inference for a
# carved drill on recreational carving skis, well under race levels.
# Carve geometry (Lind & Sanders eq 3.7 p 65, Technote 5 pp 209-211): with an 18 m sidecut and the edge equal to the
# tilt, the carve radius near the fall line is about 16 m gentle, 15 m moderate and 13 m dynamic, close to the
# scenario radii; below the fall line the edge keeps growing and the arc tightens (LeMaster pp 33, 49). A pure carve
# needs v <= sqrt(g Rsc), about 13 m/s on that ski, so the dynamic setting sits near the limit and needs angulation
# for any edge beyond the tilt.
# Edge angle: progressive, but on two skis in turn. The inside ski's little-toe edge builds from flat through
# initiation (the IASI and PSIA point: commit the CoM inside, tipping from the lower leg); the outside ski, tipped in
# the air in step, is set down on an edge already near the tilt, and its edge keeps building to a peak in late
# shaping or early finish (IASI p 31: around or just after the apex), then releases through the transition on that
# same ski.
# Flexion pattern, per leg: the stance leg is most flexed in the transition, as in any turn, extends a little
# through initiation and stays quasi-isometric to the fall line (LeMaster pp 40-42, P&T p 27); there it yields and
# shortens while the outside ski takes over, then lifts. The outside leg differs from a normal turn: held up and
# folded through initiation, it extends to reach the snow near the fall line (the only real extension of the turn,
# IASI p 37: most extension with most edge), is quasi-isometric briefly, then absorbs through the finish into the
# next transition.
# Per-setting angles are our inference: outside knee about 58°, 64°, 70° in late shaping and 66°, 72°, 79° at the
# transition; outside hip about 50°, 57°, 64° and 60°, 68°, 76°; chest 20-33° forward of vertical. Race reference:
# heinrich-2022's GS outside knee 56-80°, hip 50-81°.
# The balance stabilisers change little with intensity: they answer balance on one edge, not the turn force.
#
# Equipment assumed: carving skis with a longer sidecut radius, about 16-20 m (18 m in the numbers above), as a
# Level 3 drill on blue to gentle black terrain calls for; boots with about 15° cuff lean, about 0.9° binding ramp
# (4.7 mm) and about 42 mm stand height. A shorter sidecut tightens every arc at the same speed (LeMaster pp 32-33,
# L&S p 53); more lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167); a higher stand height adds edge
# leverage, which the little-toe edge needs most, but loads the knee (ruedl-2022, LeMaster pp 131-132).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Held up with the ski about level to the snow, the shin kept on the tongue so the boot carries the ski's weight and the forebody does not drop
        moment: Dorsiflexion, holding the lifted ski's forebody up
        contraction: isometric
        cue: Shin on the tongue, lifted ski level
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lind-sanders-2004, pages: 47 }
      shaping:
        action: The toes are pulled up and the foot drawn back as the ski is set down, so the forebody engages first; then held flexed against the load coming onto it
        moment: Plantarflexion once the ski carries load, shared with the boot shaft
        contraction: concentric
        cue: Pull the foot back as the ski touches down
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "79-81" }
          - { source: iasi-2021, pages: 33 }
      finish:
        action: Opens progressively as the foot slides forward under the body, still flexed past upright; pressure moves toward the heel and stays there into the transition
        contraction: concentric
        cue: Let the foot slide ahead as the turn ends, shin still on the tongue
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Closes from the transition, the foot drawn back so the one ski's forebody engages on its little-toe edge; held flexed as the load builds
        moment: Plantarflexion as the load comes on, shared with the boot shaft
        contraction: concentric
        cue: Pull the toes up and the foot back on the stance ski
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 182-183" }
          - { source: cross-raschner-2023, pages: 14 }
          - psia-c-white-pass-turn
      shaping:
        action: Held flexed, shin on the tongue, while the outside ski takes over the load
        contraction: isometric
        cue: Keep the shin on the tongue as the other ski lands
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
      finish:
        action: Stays closed as the ski is lifted, the shin carrying the ski level through the boot
        moment: Dorsiflexion, holding the lifted ski's forebody up
        contraction: isometric
        cue: Shin on the tongue as the ski comes up
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lind-sanders-2004, pages: 47 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: In the air, the foot everts so the lifted ski tips onto its big-toe edge in step with the stance ski's tilt
        contraction: concentric
        cue: Tip the lifted ski the same way as the stance ski
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Set down already on its big-toe edge near the body's tilt; eversion keeps building as the ski takes the load, to its most in late shaping
        moment: Eversion
        contraction: concentric
        cue: Land on the big-toe edge and keep rolling onto it
        confidence: medium
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "123-124, 127-128" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Held near its peak on one edge with constant small corrections, then released toward flat at the end of the finish, so the same ski can roll onto its other edge in the transition
        moment: Eversion, falling
        contraction: eccentric
        cue: Hold the edge, then let it go on the same ski
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 128" }
          - { source: lind-sanders-2004, pages: "54-55, 137" }
          - { source: iasi-2021, pages: 31 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: The stance foot inverts inside the boot so the one ski rolls from flat onto its little-toe edge, the edge building progressively as the body inclines into the turn
        moment: Inversion, against a snow force on the lateral edge that would flatten the ski
        contraction: concentric
        cue: Roll the stance ski onto its little-toe edge early, from the foot
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: iasi-2021, pages: "175-176" }
          - { source: lind-sanders-2004, pages: "54-55, 125" }
      shaping:
        action: Edge held as the outside ski lands, then eased as that ski takes the load
        contraction: eccentric
        cue: Keep the little-toe edge until the other ski has it
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "137-139" }
      finish:
        action: The lifted ski stays tilted on its little-toe edge, in step with the stance ski, until it tips over in the transition
        contraction: isometric
        cue: Keep the lifted ski tilted with the turn
        confidence: low
        sources:
          - psia-c-white-pass-turn
  - dof: foot.arch
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
      shaping:
        action: Arch held up as the foot takes the load, pressure spread over heel and both balls of the foot
        contraction: isometric
        cue: Land on the whole foot, arch up
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
          - { source: lemaster-2010, pages: 139 }
      finish:
        action: Arch held up under the peak load on one ski, pressure moving to the heel
        contraction: isometric
        cue: Keep the arch from collapsing as the load peaks
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
  - dof: foot.arch
    side: inside
    cells:
      initiation:
        action: The foot balances the whole load on its outer border, which is not built for it; the arch and toes grip to spread the pressure toward the heel and little-toe ball
        contraction: isometric
        cue: Stand on the heel and the little-toe ball, toes quiet
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "137-139" }
          - { source: iasi-2021, pages: 190 }
      shaping:
        action: Held as the load leaves the foot
        contraction: isometric
        cue: Keep the foot quiet as the other ski lands
        confidence: low
        sources: []
      finish: { neutral: true, contraction: isometric, cue: A quiet foot in the lifted boot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Held bent, more than the stance knee, with the heel drawn up so the lifted ski stays level
        moment: Flexion, holding the shank, boot and ski up
        contraction: isometric
        cue: Heel up, ski level
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: 55 }
      shaping:
        action: "Two sub-phases: first the lifted leg is lowered to reach the snow near the fall line, the knee extending under a flexion moment, so the hamstrings yield (eccentric); then, once the ski carries load, the knee keeps lengthening against it as the ski bends from its centre (concentric vasti, the dominant work), to its longest in late shaping, about 58° gentle, 64° moderate, 70° dynamic (our inference; heinrich-2022 GS 56-80°)"
        moment: Flexion while the unloaded leg is lowered; extension once the ski carries load
        contraction: concentric
        cue: Extend the outside leg to put the ski down and stand on it
        confidence: medium
        sources:
          - psia-c-white-pass-turn
          - { source: iasi-2021, pages: "37, 175-176" }
          - { source: bacharach-cross-2023, pages: 27 }
          - heinrich-2022
      finish:
        action: Flexes, absorbing the load as it peaks below the fall line with no help from the other leg, into its deepest bend in the transition, about 66° gentle, 72° moderate, 79° dynamic (our inference)
        contraction: eccentric
        cue: Flex under control as the turn ends, still on one ski
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 90" }
          - { source: iasi-2021, pages: "65-66" }
          - { source: bacharach-cross-2023, pages: 27 }
          - falda-buscaiot-2017
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Lengthens a little from its deepest bend in the transition as the body inclines, then held quasi-isometric on the one ski
        moment: Extension
        contraction: concentric
        cue: Grow tall enough to balance on the little-toe edge
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
          - ishige-2021
      shaping:
        action: Yields and shortens as the outside ski lands and takes over, so the inside leg ends shorter than the outside one
        moment: Extension, falling
        contraction: eccentric
        cue: Let the inside leg shorten as you move onto the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
          - { source: iasi-2021, pages: 65 }
      finish:
        action: Flexes to lift the ski before the finish, then held bent with the heel drawn up
        moment: Flexion, holding the shank, boot and ski up
        contraction: concentric
        cue: Lift the inside ski, heel toward your seat
        confidence: low
        sources:
          - psia-c-white-pass-turn
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites as the ski lands, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, moment: Resisting the twist the edged load invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Lifted knee points where the ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Land with the knee over the foot, not caving in", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Knee stays over the foot, not caving in", confidence: medium, sources: [zorko-2020, heinrich-2023] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation:
        neutral: true
        moment: Resisting the knee bowing outward, varus, that standing on the little-toe edge invites
        contraction: isometric
        cue: Knee stays over the foot, not bowing out
        confidence: low
        sources:
          - { source: lind-sanders-2004, pages: 125 }
      shaping: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Lifted knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Held flexed, more than the stance hip, so the lifted ski rides level beside the stance boot with no tip support
        moment: Flexion, holding the leg, boot and ski up
        contraction: isometric
        cue: Thigh up, ski level beside the other boot
        confidence: medium
        sources:
          - kroll-2010
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "61-62" }
      shaping:
        action: "Two sub-phases: first the thigh is lowered to set the ski down, the hip extending under a flexion moment, so iliopsoas yields (eccentric); then, once loaded, the hip opens as the leg lengthens against the load (concentric extensors, the dominant work), to its most open in late shaping, about 50° gentle, 57° moderate, 64° dynamic (our inference; heinrich-2022 GS 50-81°)"
        moment: Flexion while lowering, extension once loaded
        contraction: concentric
        cue: Reach the outside ski to the snow and stand on it
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further with the knee, absorbing the load on one leg, into the transition, about 60° gentle, 68° moderate, 76° dynamic (our inference)
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn and more here with no inside support
        contraction: eccentric
        cue: Fold at the hips, not the waist, as the turn ends
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Opens a little with the knee from the transition, then held, the hip hinge carrying the forward fold over the one ski
        moment: Extension
        contraction: concentric
        cue: Fold at the hip over the stance ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
          - ishige-2021
      shaping:
        action: Flexes as the leg shortens and the outside ski takes over, more flexed than the outside hip
        moment: Extension, falling
        contraction: eccentric
        cue: Inside hip and knee bend as the outside ski lands
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
          - heinrich-2022
      finish:
        action: Flexes to lift the thigh and ski before the finish, then held up through the finish
        moment: Flexion, holding the leg, boot and ski up
        contraction: concentric
        cue: Lift the inside thigh, ski level
        confidence: medium
        sources:
          - kroll-2010
          - psia-c-white-pass-turn
          - { source: cross-raschner-2023, pages: 14 }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The lifted thigh held beside the stance leg at about hip width, neither crossing nor swinging wide; with the free leg off the snow the net moment is small
        contraction: isometric
        cue: Lifted boot at hip width
        confidence: low
        sources: []
      shaping:
        action: The ski is set down at hip width; as it loads, the pelvis tips over the new stance thigh so the inside half rises, the outside abductors hiking it, pelvis on femur; hip angulation builds with the edge to its most in late shaping
        moment: Abduction
        contraction: concentric
        cue: Land at hip width and get over the outside hip
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
          - moore-2020
          - psia-c-white-pass-turn
      finish:
        action: Held under the peak load with the inside ski lifted, carrying the unsupported inside half of the pelvis, and held into the transition
        moment: Abduction
        contraction: isometric
        cue: Stay strong over the outside hip with the inside ski up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
          - ganderton-2017
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The stance femur tips into the turn under a pelvis kept closer to level, so the hip sits adducted while its abductors hold up the unsupported outside half of the pelvis, pelvis on femur
        moment: Abduction
        contraction: concentric
        cue: Keep the lifted side of your hips up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
          - moore-2020
          - ganderton-2017
      shaping:
        action: Releases the pelvic hold as the outside ski lands and takes the load; the thigh then held adducted beside the outside leg
        moment: Abduction, falling to small
        contraction: eccentric
        cue: Hand the hips over to the outside leg
        confidence: low
        sources:
          - heinrich-2023
      finish:
        action: The lifted thigh held beside the stance leg at about hip width
        contraction: isometric
        cue: Lifted boot at hip width
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward in the air with the stance ski so the lifted ski stays parallel and pointed along the new arc
        contraction: concentric
        cue: Keep the lifted ski parallel to the stance ski
        confidence: low
        sources: [delp-1999]
      shaping:
        action: Lands turned in under the pelvis and held as the ski carves
        moment: Small and mostly external (braking) in a carved turn, extrapolated from a modelled GS turn
        contraction: isometric
        cue: Knee over the foot as the ski carves
        confidence: low
        sources: [heinrich-2023]
      finish:
        action: Turns further inward relative to the pelvis as the ski carves across under a quieter upper body, the turn braked by the external rotators
        moment: External, braking
        contraction: eccentric
        cue: Let the ski turn under you; don't twist it
        confidence: low
        sources:
          - heinrich-2023
          - { source: lemaster-2010, pages: "73-74" }
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Starts turned in under a pelvis that still faces down the hill from the last turn, then turns outward as the carving ski comes round toward the fall line under it, the windup releasing
        contraction: concentric
        cue: Let the stance ski turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "107, 109-110" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Held turned out as the outside ski takes over
        moment: Internal, holding the femur against turning out further (modelled on the inside leg)
        contraction: isometric
        cue: Inside knee points where the ski points
        confidence: low
        sources: [heinrich-2022]
      finish:
        action: Held turned out so the lifted ski stays parallel; the tip must not drift onto the stance ski
        contraction: isometric
        cue: Keep the lifted tip from crossing
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Comes up a little from the transition's hip hinge with the stance leg, the low back slightly flattened from standing, never arched or slumped
        contraction: concentric
        cue: Rise with the leg; the hinge stays at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "40-42, 62-63" }
      shaping:
        action: Hinge held at its most open over the lengthening outside leg, more tilted the harder the turn; tilting further than the balance needs, so the low back arches, is a fault
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
          - { source: iasi-2021, pages: 194 }
      finish:
        action: Tilts forward again with the hip hinge as the outside leg flexes into the transition
        contraction: eccentric
        cue: Fold at the hips as the leg flexes
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: "Reversed here: the half held up is the outside half, not the inside half as in other turns, because the stance leg is the inside leg. Standing on it, the pelvis's outside half has no support; it is held up by the inside hip's abductors while the stance leg tips into the turn"
        contraction: concentric
        cue: Keep the lifted side of your hips up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
          - psia-c-advanced-one-ski
      shaping:
        action: Passes through level as both skis are briefly on the snow, then the inside half rises over the outside hip as the outside ski takes the load
        contraction: concentric
        cue: Inside hip up as you move onto the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Inside half held up with no support from the lifted inside ski, to the end of the finish and into the transition
        contraction: isometric
        cue: Don't let the inside hip drop with the ski up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Faces down the hill from the last turn while the stance ski turns toward the fall line under it, so the angle between pelvis and ski closes
        contraction: isometric
        cue: Upper body faces the fall line; let the ski come round to it
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "109-110" }
      shaping:
        action: Close to square with the skis at the fall line, then a slight counter forms as the outside ski carves on
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Counter grows as the ski carves across under a pelvis that stays facing down the hill, ready for the next turn
        contraction: isometric
        cue: Keep facing the fall line as the ski turns across
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "73-74" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped, and nearly constant through the turn; the fold is made at the hips
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped; fold at the hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened from standing under the load, never arched or slumped
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing under the peak load on one leg, never arched or slumped; a harder turn folds more at the hips, not the low back
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened; fold at the hips
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: The body inclines into the turn over the inside ski while the low back bends a little back toward the outside, counterbalancing over the one edge; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Commit the hips inside; shoulders stay over the stance ski
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: iasi-2021, pages: "62-63, 175-176" }
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Keeps building with the outside ski's edge to its most in late shaping, angulation moving the pressure onto the outside ski
        contraction: eccentric
        cue: Hips in, shoulders out, onto the outside ski
        confidence: medium
        sources:
          - sporri-2016
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Held through the finish on the one ski, then eases as the edge releases in the transition
        contraction: isometric
        cue: Stay over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 128 }
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Separation comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: "Separation comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
      finish: { neutral: true, contraction: isometric, cue: "Separation comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest forward, about 20-33° from vertical through the turn, a little more the harder the turn; it rises a little with the hips as the stance leg lengthens
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "182-183" }
      shaping:
        action: Slight forward flexion held
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 74 }
      finish:
        action: Slight forward flexion held
        contraction: isometric
        cue: Don't sit up as the turn ends
        confidence: low
        sources: []
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips back toward the outside a little more than the pelvis, the counterbalance that keeps the CoM over the inside ski's edge; too little and the skier falls inside, too much and the ski stands flat
        contraction: eccentric
        cue: Counterbalance with the shoulders over the stance ski
        confidence: low
        sources:
          - psia-c-white-pass-turn
          - { source: lemaster-2010, pages: 70 }
          - fujimori-2014
      shaping:
        action: Keeps building with the outside ski's edge to its most in late shaping
        contraction: eccentric
        cue: Outside shoulder over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-72, 128" }
      finish:
        action: Held, then eases with the release in the transition
        contraction: isometric
        cue: Shoulders level with the slope
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Faces down the hill with the pelvis while the stance ski turns under them
        contraction: isometric
        cue: Chest to the fall line
        confidence: low
        sources:
