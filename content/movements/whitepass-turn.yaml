activations:
  # Outside leg: lifted through initiation, set down in shaping, the whole load through the finish and transition.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 0
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: null, shaping: concentric, finish: eccentric }
    role: Idle while the leg is held up; extend the knee to set the ski down and stand on it, then hold and absorb the whole load through the finish
    confidence: medium
    basis: Measured in normal turns, where activity peaks in the steering phase at a steady knee bend. Here one leg carries the whole load from late shaping, about 1.1-1.5 times body weight below the fall line by Lind & Sanders eq 4.9, at a deeper bend as the turn gets harder; the per-setting values are our inference
    sources:
      - hintermeister-1997
      - kroll-2010
      - panizzolo-2013
      - heinrich-2022
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [hip.flexion, knee.flexion]
    intensity:
      initiation: 2
      shaping: 2
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: concentric, finish: eccentric }
    role: Holds the lifted thigh up as a hip flexor, then works as a knee extensor once the ski is down
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg and a knee extensor on the outside leg in normal turns; this drill asks both of it in turn
    sources: [kroll-2010, panizzolo-2013, seifert-2023]
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: eccentric, finish: isometric }
    role: Holds the lifted leg, boot and ski level with no tip support, lowers it to the snow, then co-contracts on the stance hip
    confidence: low
    basis: Inference; iliopsoas has not been measured on snow. Holding about 16 kg of leg, boot and ski level is a moderate hip-flexor effort, a little more than with a resting tip
    sources:
      - jiroumaru-2014
      - juan-2024
      - { source: lind-sanders-2004, pages: "70, 103" }
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: isometric, shaping: concentric, finish: eccentric }
    role: Opens the hip to set the ski down, then holds the folded hip under the whole load and brakes the thigh's inward turn as the ski carves
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn with help from the inside leg; here none, so the finish is harder than a stork turn's. Per-setting values are inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - distefano-2009
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: 2
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Hikes the pelvis's inside half over the stance hip as the ski lands, then holds it up, unsupported, with the inside ski lifted
    confidence: medium
    basis: Measured on both legs in normal turns; the one-leg pelvic hold follows from mechanics and single-leg exercise data. Highest in the finish, where the load peaks and the inside ski is off the snow
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - distefano-2009
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: 2
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur under the one-leg load
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow. Scaled as gluteus medius
    sources: [moore-2020, ganderton-2017, uebayashi-2026, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.flexion, pelvis.list]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Helps hold the lifted thigh up, then the pelvis over the stance hip
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024, andersson-1997]
  - muscle: adductors
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: concentric, finish: isometric }
    role: Keep the lifted thigh beside the stance leg, then turn the bent thigh inward to edge the landed ski and brace against the abductors
    confidence: medium
    basis: Measured in normal turns; the edging role is mechanics of the bent leg
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 0
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: null, shaping: concentric, finish: eccentric }
    role: Shares the hip extension moment once the leg is loaded
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, hip.rotation, knee.rotation]
    intensity:
      initiation: 2
      shaping: 1
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the lifted knee bent with the heel drawn up, then co-contracts with the quadriceps to steady the loaded knee and brake the thigh's inward turn
    confidence: medium
    basis: Inside-leg hamstring activity and outside-leg co-contraction are measured in normal turns; holding the shank, boot and ski up with no tip support is a moderate effort
    sources: [chollet-2025, hintermeister-1997, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.flexion, knee.rotation, knee.valgus]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Help hold the lifted knee bent, then resist the loaded knee twisting outward and caving in
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity:
      initiation: 1
      shaping: 1
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: eccentric }
    role: Steady the hip, then brake the thigh's inward turn as the ski carves across
    confidence: low
    basis: The carved turn's outside hip rotation moment is small and external, extrapolated from a model of a GS turn
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 0, shaping: 1, finish: 1 }
    contraction: { initiation: null, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the loaded bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: concentric, finish: eccentric }
    role: Keeps the lifted ski level with the shin on the tongue, pulls the foot back as the ski lands so the forebody engages, then only co-contracts under the load
    confidence: medium
    basis: Highly active in normal turns; active ankle flexion is a book technique point. The loaded ankle's net moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: concentric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 0
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: null, shaping: eccentric, finish: concentric }
    role: Idle while the ski is up; yields as the shin presses into the tongue under the landing load, then opens the ankle to push the foot forward through the finish
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [knee.flexion, ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Helps hold the lifted knee bent, then adds a little ankle stiffness
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 2, finish: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Tip the lifted ski to its big-toe edge in the air, build the edge as it lands, make the constant small corrections on one edge, then let it go
    confidence: medium
    basis: Highly active in turns, attributed to edge control; balancing on one ski adds continuous co-contraction. A balance effort, so it changes little with intensity; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
      - { source: lind-sanders-2004, pages: "54-55, 137" }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 0, shaping: 1, finish: 1 }
    contraction: { initiation: null, shaping: isometric, finish: isometric }
    role: Holds the arch up under the landed load and co-contracts with the peroneals for balance on one edge
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 0, shaping: 1, finish: 1 }
    contraction: { initiation: null, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole and make fine balance corrections
    confidence: low
    basis: Anatomy and the mechanics of balancing on one ski; not measured on snow
    sources:
      - { source: lind-sanders-2004, pages: 137 }
  # Inside leg: alone on the little-toe edge through initiation, shortening as the outside ski lands, lifted before the finish.
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: 2
      shaping: 1
      finish: 0
    contraction: { initiation: concentric, shaping: eccentric, finish: null }
    role: Lengthen the stance knee from the transition and hold it on the one ski, then let it shorten as the outside ski takes over; idle once the ski is lifted
    confidence: medium
    basis: Single-leg load at the top of the turn, about 1.0-1.1 times body weight, but on the weaker edge and through a deeper knee as the turn gets harder; measured as an outside-leg pattern in the one-legged racer's turns. The load is at or below stork turns' single-leg load, so it matches stork's stance-leg 2; the little-toe edge loads the ankle and hip rotators more than the knee extensors. Per-setting values are inference
    sources:
      - ishige-2021
      - kroll-2010
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: inside
    serves: [knee.flexion, hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 2 }
    contraction: { initiation: concentric, shaping: eccentric, finish: concentric }
    role: A knee extensor on the stance leg, then a hip flexor that lifts the ski before the finish
    confidence: medium
    basis: Measured as a hip flexor on the lightly loaded inside leg in normal turns
    sources: [kroll-2010, cuniberti-2026, seifert-2023]
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: concentric }
    role: Co-contracts on the stance hip, then lifts the thigh, boot and ski and holds them level
    confidence: low
    basis: Inference; not measured on snow. The lift with no tip support is a moderate hip-flexor effort
    sources: [jiroumaru-2014, juan-2024, andersson-1997]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 2, moderate: 2, dynamic: 3 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Holds the folded stance hip on one ski and turns the thigh out as the ski comes round, then keeps the lifted ski parallel
    confidence: low
    basis: Hip extension on a single stance leg is mechanics; the share on the little-toe edge is inferred from the one-legged racer's outside-edge turns
    sources: [ishige-2021, heinrich-2022, delp-1999]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Holds up the unsupported outside half of the pelvis while the skier stands on the little-toe edge, then hands the hold to the outside hip and keeps the lifted thigh from falling in
    confidence: medium
    basis: The single-leg pelvic hold (hip hitch) ranks top for gluteus medius off snow; standing on the inside edge removes all support from the outside half. The hip's frontal lever is the same as on stork turns' stance leg, whose initiation is 2, at a similar load of about 1.0-1.1 W; the little-toe edge moves the reaction under the foot, not the hip, so it stays 2. A balance-and-posture effort, so it changes little with intensity
    sources: [moore-2020, ganderton-2017, distefano-2009, seifert-2023]
  - muscle: gluteus-minimus
    side: inside
    serves: [hip.abduction, pelvis.list]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Shares the pelvic hold with gluteus medius and steadies the femoral head on the stance leg
    confidence: medium
    basis: Inferred from single-leg exercise data; not measured on snow. Matched to gluteus medius and to stork turns' stance leg at a similar load
    sources: [moore-2020, ganderton-2017, uebayashi-2026]
  - muscle: tensor-fasciae-latae
    side: inside
    serves: [hip.abduction, hip.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: eccentric, finish: isometric }
    role: Helps the pelvic hold on the stance leg, then helps hold the lifted thigh up
    confidence: low
    basis: The hip hike drove TFL to about 47 % of maximum off snow; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
