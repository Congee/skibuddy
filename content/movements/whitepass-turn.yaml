      finish:
        action: Counter held and growing as the ski carves across, the chest still toward the fall line
        contraction: isometric
        cue: Chest stays to the fall line
        confidence: low
        sources:
          - psia-c-white-pass-turn
  - dof: shoulder-girdle.protraction
