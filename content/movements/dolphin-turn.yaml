id: dolphin-turn
name: Turn that loads the tails at the finish, lifts the tips and retracts the legs into the next turn
# No study has measured this drill: nothing is high confidence. Efforts are inferred from normal turns, flexion
# transitions (seifert-2023) and mechanics.
# Phases: initiation = the tips landing on the new edges, the shins back on the tongues and the forebody engaged;
# shaping = a normal turn around the fall line, edge and load building; finish = the ankles open, pressure moves to
# the tails, the tails bend and the tips lift. Between finish and initiation sits the transition: tips in the air,
# both legs retracted under the hips, tips pointed down (IASI p174). The matrix puts the retraction at the start of
# initiation, which is where it ends, and the tail loading in the finish.
#
# Intensity (the drill's scenarios): two skis on the snow, about 60-75 % on the outside foot through shaping
# (heinrich-2022, falda-buscaiot-2017). Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and
# below it (heading 135°):
#   gentle     8 m/s, R 12 m, 14°:   about 1.02, 1.11, 1.21
#   moderate  10 m/s, R 14 m, 17°:   about 1.05, 1.20, 1.34
#   dynamic   12 m/s, R 16 m, 20°:   about 1.10, 1.31, 1.49
# Speeds, radii and pitches are our inference for a Level 4 drill on a groomed blue, well under race levels.
# The load peaks below the fall line, where this drill moves it to the tails. The retraction unweights the skis
# for an instant and the landing pays it back: in Lind & Sanders' reference cycle (Fig 5.4a, pp 118-120, T6
# pp 215-217) a 0.2 s retraction at zero load needs a catch of about 2 times body weight for 0.2 s. A real
# dolphin landing is softer than that, because the tips touch first and the legs extend into it; the 2 W figure
# is a ceiling for the reference cycle, not a measurement. Its size grows with how high the tips fly, so with
# speed and pitch.
#
# Fore-aft: the effective load point under the boot moves by the boot's pitch moment (f·S = ℓ·FN, L&S p 54):
# ahead of the toe as the forebody engages at initiation, back past the heel as the afterbody loads at the finish
# (Fig 3.8 d-e, pp 69-70; p 146). In a boot the ankle cannot point the foot much, so "opening the ankle" means the
# shin leaving the tongue as the feet slide forward under the hips (LeMaster p 81): the boot's lean keeps the
# ankle dorsiflexed, about 8-12° inside the shell against 18-22° with the shin on the tongue (our inference from
# the 15° cuff), and the rear spoiler takes the push. The tip lift comes from the bent tail and the CoM behind the
# feet, not from an ankle push (IASI's "opening the ankle", p 174, read through LeMaster pp 79-81 and
# P&T p 89: no triple extension in a boot). The shins go back to the tongues in the retraction: the toes pulled
# up and the feet drawn back point the tips down before they land (LeMaster p 81, IASI pp 33, 174). Aft is a
# moment at the end of the turn, never a position (IASI p 92); fore and aft are equal and opposite (IASI p 37).
#
# Flexion pattern, which this drill changes: the legs are most flexed in the transition, by active retraction
# (hip flexors and hamstrings pull the feet up; a flexion transition, seifert-2023, LeMaster pp 97-98, 152-154,
# L&S p 120), not by passive sinking; they catch the landing and lengthen a little through initiation; hold
# quasi-isometric through shaping (bacharach-cross-2023 p 27); and absorb through the finish, eccentric, with the
# feet sliding forward so the knee extension moment rises as the load point moves behind the heel (L&S pp 192-193).
# Our inference, solved for balance over the foot: outside knee in shaping about 62° gentle, 68° moderate,
# 74° dynamic; at the end of the finish about 75°, 80°, 86°; in the retraction both knees about 90-100° and the
# hips about 85-95° (seifert-2023 put flexion transitions near 90° at knee, hip and trunk). Race reference:
# heinrich-2022's GS outside knee 56-80°, hip 50-81°.
# Edging: early and progressive; the tips land on the new edges, the edge builds to its peak in late shaping and
# releases through the finish as the pressure moves aft (IASI pp 31, 37: aft goes with decreasing edge).
#
# Equipment assumed: recreational carving skis of about 15 m sidecut with a little tip rocker; boots with about 15°
# cuff lean, a firm but progressive rear spoiler, about 0.9° binding ramp (4.7 mm) and about 42 mm stand height.
# More lean or ramp deepens the knee (posch-2025, LeMaster pp 164-167); a higher stand height adds edge leverage but
# loads the knee (ruedl-2022, LeMaster pp 131-132). A stiff tail and a binding mounted forward make the tail load
# easier to feel and the tips lift sooner; a centre mount or a short ski makes fore-aft work harder (IASI p 94,
# L&S p 47). Without fore-aft give in the boot, the push from the bent tail reaches the shin directly (L&S p 192).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Closes hard out of the transition, toes pulled up and the feet drawn back under the hips so the tips point down, then the shin meets the tongue as the tips land and the forebody engages; flexed about as far as it goes in the turn
        moment: Dorsiflexion in the air, unloaded; plantarflexion once the tips land and the load comes on, shared with the boot shaft
        contraction: concentric
        cue: Pull the toes up and point the tips down
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81" }
          - { source: iasi-2021, pages: "33, 174" }
          - { source: cross-raschner-2023, pages: 14 }
      shaping:
        action: Held flexed with the shin on the tongue against the rising load to the fall line, a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
      finish:
        action: Opens deliberately, the feet sliding forward under the hips until the shin leaves the tongue and rests toward the spoiler; still dorsiflexed in the shell, about 8-12° (inference), never pointed. Pressure goes through the heel to the tail
        moment: Plantarflexion while the feet are pushed forward, then dorsiflexion once the load point is behind the heel, held by the rear spoiler with tibialis anterior
        contraction: eccentric
        cue: Let the feet run ahead; feel the heels and the tails
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 182-183" }
          - { source: iasi-2021, pages: "33, 174" }
          - { source: lind-sanders-2004, pages: "54, 69-70" }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Closes with the outside ankle in the retraction, toes up, tip pointed down, the shin on the tongue as the ski lands
        contraction: concentric
        cue: Both shins forward, not just the outside one
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
          - { source: iasi-2021, pages: 174 }
      shaping:
        action: Held flexed, shin on the tongue, more lightly loaded than the outside
        moment: Plantarflexion, smaller than outside
        contraction: isometric
        cue: Inside shin on the tongue too
        confidence: medium
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Opens with the outside ankle as both feet slide forward and both tails load; the inside foot leads a little
        contraction: eccentric
        cue: Both feet forward together
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 81" }
          - { source: iasi-2021, pages: 174 }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts as the tips land, putting the new outside ski on its big-toe edge from the first contact
        contraction: concentric
        cue: Land on the big-toe edge
        confidence: low
        sources:
          - { source: iasi-2021, pages: "174, 189" }
          - { source: lemaster-2010, pages: 127 }
      shaping:
        action: Eversion keeps building to its most in late shaping, then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Releases toward flat as the pressure moves aft; the tails still grip enough to bend
        contraction: eccentric
        cue: Let the edge go as you move back
        confidence: low
        sources:
          - { source: iasi-2021, pages: "31, 37" }
          - { source: lemaster-2010, pages: 38 }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts as the ski lands, onto its little-toe edge with the outside ski, leading the tip-over
        contraction: concentric
        cue: Land on the little-toe edge
        confidence: low
        sources:
          - { source: iasi-2021, pages: 189 }
      shaping:
        action: Inversion held, building with the outside edge
        contraction: isometric
        cue: Keep the inside ski tipped with the outside
        confidence: low
        sources: []
      finish:
        action: Releases toward flat with the outside foot
        contraction: eccentric
        cue: Flatten both skis together
        confidence: low
        sources:
          - { source: iasi-2021, pages: 37 }
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held as the landing loads the forefoot
        contraction: isometric
        cue: Land on the ball of the foot with the heel in contact
        confidence: low
        sources:
          - { source: iasi-2021, pages: 190 }
      shaping:
        action: Arch held under peak load, pressure spread
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
      finish:
        action: Arch held as the pressure runs back along the inside of the foot to the heel
        contraction: isometric
        cue: Ball, arch, heel
        confidence: low
        sources:
          - { source: iasi-2021, pages: 33 }
  - dof: foot.arch
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: "Dominant action: the catch, flexing under load as the tips land. Before it, the knee is pulled up in the retraction (concentric flexors, unloaded), about 90-100° at its deepest (inference); after it, the leg lengthens a little as the new turn loads (concentric extensors)"
        moment: Flexion in the air; extension once the tips land, briefly up to about 2 times body weight in the reference catch (L&S Fig 5.4a)
        contraction: eccentric
        cue: Land soft on the tips, then grow into the turn
        confidence: low
        sources:
          - seifert-2023
          - { source: lind-sanders-2004, pages: "118-120" }
          - { source: lemaster-2010, pages: "40-42, 97-98" }
      shaping:
        action: Held near its longest, quasi-isometric, while the load builds; about 62° gentle, 68° moderate, 74° dynamic (our inference)
        moment: Extension, near its peak
        contraction: isometric
        cue: Stay long and steady on the outside leg
        confidence: medium
        sources:
          - { source: bacharach-cross-2023, pages: 27 }
          - { source: cross-raschner-2023, pages: "11-14" }
          - alhammoud-2020
          - heinrich-2022
      finish:
        action: Flexes, absorbing the late load while the feet slide forward; with the load point behind the heel the knee extension moment climbs, about 75° gentle, 80° moderate, 86° dynamic at the end (our inference)
        moment: Extension, rising as the pressure moves back
        contraction: eccentric
        cue: Flex as the tails load, hips stay above the knees
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42, 62" }
          - { source: lind-sanders-2004, pages: "192-193" }
          - { source: iasi-2021, pages: "65-66" }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Pulled up in the retraction with the outside knee, the old outside leg shortening most, then catches the landing
        contraction: eccentric
        cue: Pull both feet up under you
        confidence: low
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "152, 154" }
      shaping:
        action: Held more flexed than the outside knee and loaded, so the inside leg is shorter and both skis tip together
        moment: Extension, smaller than outside
        contraction: isometric
        cue: Inside leg short, outside leg long
        confidence: medium
        sources:
          - heinrich-2022
          - kroll-2011
          - { source: lemaster-2010, pages: 55 }
      finish:
        action: Flexes with the outside knee as both tails load, the inside foot a little ahead
        contraction: eccentric
        cue: Both legs absorb
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, moment: Resisting the twist of the landing, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee points where the ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, moment: Resisting the inward collapse a landing on edge invites, contraction: isometric, cue: Land with the knee over the foot, confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: "120-122" }] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: Knee stays over the foot, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Land with the knee over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: "Dominant action: the catch, the hip folding under load as the tips land. Before it, the hip flexes hard in the retraction (concentric hip flexors, unloaded), drawing the knee up and forward so the tip drops, about 85-95° (inference); after it, the hip opens a little as the leg lengthens into the turn (concentric extensors)"
        moment: Flexion in the air, from the hip flexors; extension once loaded
        contraction: eccentric
        cue: Knees up and forward, tips down
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "97-98, 154" }
          - { source: lind-sanders-2004, pages: 120 }
      shaping:
        action: Held at its most open, folded at the hip with the pelvis countered, about 52° gentle, 58° moderate, 65° dynamic (our inference; heinrich-2022 GS 50-81°)
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further as the feet run ahead and the hips drop back toward the heels; the chest stays forward so the hips do not sink below the knees
        moment: Extension, rising with the load behind the heel
        contraction: eccentric
        cue: Hips back for a moment, chest still forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62, 81" }
          - { source: iasi-2021, pages: "66, 92" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Flexes in the retraction, the old outside leg pulled up most, knee forward so the tip drops, then catches the landing
        contraction: concentric
        cue: Pull the old outside foot up and back
        confidence: medium
        sources:
          - seifert-2023
          - kroll-2010
          - { source: lemaster-2010, pages: "152, 154" }
      shaping:
        action: Held more flexed than the outside hip and loaded; the inside leg stays short
        moment: Extension, like the outside hip
        contraction: isometric
        cue: Inside knee up and forward
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "55, 61-62" }
      finish:
        action: Folds with the outside hip as both tails load
        contraction: eccentric
        cue: Fold at both hips
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: Moves toward abduction, pelvis on femur, as the legs tip in on landing and the outside ski takes the load
        contraction: concentric
        cue: Keep the inside hip up as you land
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71" }
          - moore-2020
      shaping:
        action: Hip angulation builds with the edge to its most in late shaping, then held
        moment: Changes sign within the turn in models of carving; abductors and adductors co-contract
        contraction: concentric
        cue: Strong over the outside hip
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Releases toward neutral as the edges flatten and the pressure moves aft
        contraction: eccentric
        cue: Level out as you move back
        confidence: low
        sources: []
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The inside knee tips toward the turn with the ski as it lands; the thigh is drawn a little toward the outside leg
        contraction: concentric
        cue: Tip the inside knee in with the ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 67 }
      shaping:
        action: Adducted and held beside the outside leg
        moment: Adduction (adductor longus in a modelled carved turn)
        contraction: isometric
        cue: Keep the knees in step
        confidence: medium
        sources:
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held, then returns toward neutral as the edges release
        contraction: isometric
        cue: Feet hip-width
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward as the skis land and the legs steer them into the new turn, with the skis light for the instant after landing
        contraction: concentric
        cue: Steer from the thighs as you land
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108" }
          - { source: iasi-2021, pages: "27, 64" }
          - delp-1999
      shaping:
        action: Held turned in, the rotation spread through the turn rather than rushed
        moment: Small; internal when steering, external if carved
        contraction: isometric
        cue: Smooth, steady leg rotation
        confidence: low
        sources:
          - heinrich-2023
          - { source: iasi-2021, pages: 38 }
      finish:
        action: Held, then back toward neutral as the edges release
        contraction: isometric
        cue: Let the thighs unwind with the release
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward with the turn as the ski lands, keeping it parallel
        contraction: concentric
        cue: Turn the inside thigh out with the turn
        confidence: low
        sources: [delp-1999]
      shaping:
        action: Held turned out against a small internal moment
        moment: Internal (modelled), so the internal rotators hold
        contraction: isometric
        cue: Keep the skis parallel
        confidence: medium
        sources: [heinrich-2022]
      finish:
        action: Held, then back toward neutral
        contraction: isometric
        cue: Skis parallel as they release
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Tilted forward with the hip fold in the retraction, the abdominals and hip flexors drawing the legs up; comes up a little with the hips as the legs lengthen after the landing. Low back slightly flattened, never arched or slumped
        contraction: concentric
        cue: Pull the knees up, don't round the back
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "62-63, 97-98" }
      shaping:
        action: Hinge held, more tilted the harder the turn; never standing tall, never arched
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Tilts forward further as the hips drop back toward the heels, so the chest stays over the knees and the low back does not arch to compensate
        contraction: eccentric
        cue: Hips back, chest forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63, 94" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half rises as the legs tip in on landing, held by the outside hip abductors
        contraction: concentric
        cue: Inside hip up as you land
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Inside half held up, building with the edge; the loaded inside foot gives some support
        contraction: isometric
        cue: Don't let the inside hip drop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 140" }
      finish:
        action: Levels as the edges release
        contraction: eccentric
        cue: Level the hips for the edge change
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet while the legs, light after the landing, turn under it; the pole plant steadies it
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "107, 112-116" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Slight counter held, a by-product of the legs turning
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Counter held as the legs flex; it squares as the skis release
        contraction: isometric
        cue: Upper body calm as the feet run ahead
        confidence: low
        sources:
          - { source: iasi-2021, pages: 39 }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched or slumped; the retraction folds the hips, not the spine
        moment: Extension, small in the air, rising with the landing
        contraction: isometric
        cue: Fold at the hips to pull the knees up, not the back
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
      shaping:
        action: Held slightly flattened under load
        moment: Extension, against the forward fold
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened as the hips move back; arching it to keep the chest up is the fault
        contraction: isometric
        cue: Don't arch as you move back
        confidence: low
        sources:
          - { source: iasi-2021, pages: 194 }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski as the skis land on edge; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Upper body over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Builds with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Hips in, shoulders out
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 128" }
      finish:
        action: Returns toward straight as the edges release
        contraction: concentric
        cue: Straighten up as the skis flatten
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
      finish: { neutral: true, contraction: isometric, cue: "Counter comes from the hip sockets, not the low back", confidence: low, sources: [] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest forward over the knees through the retraction and landing, so the CoM is over the forebody when the tips touch
        contraction: isometric
