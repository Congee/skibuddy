structures:
  - structure: acl
    side: both
    phases: [finish, initiation]
    mechanism: Loaded if the moment aft becomes a position, the trunk behind the knees, and the skier lands or recovers on the tails; the rear spoiler pushes the tibia forward while the quadriceps contract hard, the back-weighted landing seen in racing injuries
    protected_by: [biceps-femoris, medial-hamstrings, tibialis-anterior, gluteus-maximus]
    confidence: medium
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: outside
    phases: [initiation, shaping]
    mechanism: Loaded if a tip lands on its inside edge with the knee straight and turned in, so the ski catches; the slip-catch pattern
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2013
      - { source: jordan-sporri-taylor-2023, pages: 121 }
  - structure: patellar-tendon
    side: both
    phases: [initiation, finish]
    mechanism: Pulled hard in the landing catch at a deep knee bend and in the aft finish, where the knee extension moment climbs
    protected_by: [vasti]
    confidence: low
    sources: [{ source: lind-sanders-2004, pages: "118-120" }]
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist under the turn load and the landing; worse if the retraction folds the back instead of the hips
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

