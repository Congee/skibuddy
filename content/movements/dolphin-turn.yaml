activations:
  # Outside leg. Load-bearing efforts scale with the load factor, the knee bend and, in the finish, the load point
  # moving behind the heel; the landing catch adds a brief peak at initiation.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Catches the landing and lengthens the knee into the turn, holds it through shaping, then absorbs the late load as the feet run ahead and the load point moves behind the heel
    confidence: medium
    basis: Measured in normal turns, where activity peaks in the steering phase at a steady knee bend. The drill adds two things by mechanics, both our inference. In the finish the load point behind the heel raises the knee extension moment the vasti must hold, the back-seat mechanism, so the finish rises above the stork's. At initiation the landing catch, at most about 2 times body weight briefly in the reference cycle, comes after a near-zero-load retraction, so the phase averages lower than its peak
    sources:
      - hintermeister-1997
      - panizzolo-2013
      - seifert-2023
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: "103, 118-120, 192-193" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: 2
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the thigh up in the retraction, then works with the vasti as a knee extensor once the ski is loaded
    confidence: medium
    basis: Rectus femoris was much higher in flexion transitions than in extension transitions in instructors on snow (seifert-2023, mV, used to rank only); its knee-extensor role on the outside leg is measured in normal turns
    sources: [seifert-2023, kroll-2010, panizzolo-2013]
  - muscle: iliopsoas
    side: outside
    serves: [hip.flexion, pelvis.tilt]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the leg up and the knee forward in the retraction so the tip drops; afterwards co-contracts to steady the pelvis
    confidence: low
    basis: Inference; iliopsoas has never been measured on snow. Active retraction is hip-flexor work by mechanics (LeMaster pp 97-98, L&S p 120); its share at deep hip flexion comes from off-snow EMG
    sources:
      - jiroumaru-2014
      - juan-2024
      - { source: lemaster-2010, pages: "97-98" }
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 3, dynamic: 3 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Catches the hip fold on landing (its dominant initiation action; it then opens the hip a little as the leg lengthens), holds the folded hip against the turn load, then controls the deeper fold as the hips move back over the heels
    confidence: medium
    basis: The hip extension moment is about 1.3 Nm/kg in a modelled carved turn; measured above 50 % MVC in normal turns. The deeper finish fold with the load aft raises it, our inference
    sources:
      - hintermeister-1997
      - heinrich-2022
      - heinrich-2023
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: 2
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the inside half of the pelvis up as the skis land on edge and the angulation builds, then lets it level as the edges release
    confidence: medium
    basis: Measured on both legs in normal turns; the pelvic hold is pelvis-on-femur mechanics backed by single-leg exercise data. The loaded inside ski shares the pelvis, so it stays below the stork's one-leg hold
    sources: [seifert-2023, louie-1984, moore-2020, { source: lemaster-2010, pages: "70-71, 140" }]
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the femoral head on landing
    confidence: low
    basis: Inferred from single-leg exercise data; not measured on snow
    sources: [moore-2020, ganderton-2017, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation, hip.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps flex the hip in the retraction and turn the thigh inward as the skis land
    confidence: low
    basis: Exercise EMG for hip flexion and abduction; not measured on snow
    sources: [selkowitz-2024, andersson-1997]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: { gentle: 1, moderate: 2, dynamic: 2 }, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to steer and edge the landed ski, then brace against the abductors
    confidence: medium
    basis: Measured in normal turns; the steering role is mechanics of the bent leg
    sources: [hintermeister-1997, { source: lemaster-2010, pages: "108, 124-125" }]
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings, more so in the deep finish fold
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.rotation]
    intensity:
      initiation: 2
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the foot up and back in the retraction; through the turn co-contracts with the quadriceps, and in the finish guards the knee against the forward pull of the tibia when the load is aft
    confidence: medium
    basis: Hamstrings measured in normal turns; the retraction is knee-flexor work by mechanics. Co-contraction protects the ACL with the knee bent and the hips above the knees (heinrich-2023, LeMaster p 62); the boot-and-quadriceps drawer when aft is the back-seat mechanism (bere-2011). Finish values are our inference
    sources:
      - hintermeister-1997
      - heinrich-2023
      - bere-2011
      - { source: lemaster-2010, pages: 62 }
      - { source: jordan-sporri-taylor-2023, pages: "119-121" }
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.flexion, knee.valgus, knee.rotation]
    intensity: { initiation: 2, shaping: 1, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help pull the foot up in the retraction; resist the knee caving in and twisting, and the anterior drawer when the load is aft
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low in normal turns. Retraction and aft roles are mechanics
    sources: [zorko-2020, heinrich-2023, bere-2011]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn when the ski grips
    confidence: low
    basis: Extrapolated from a model of a carved turn; the sign depends on carving or brushing
    sources: [heinrich-2023, delp-1999]
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: { gentle: 2, moderate: 2, dynamic: 3 }, shaping: 1, finish: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the toes up and the foot back to point the tip down before it lands; co-contracts through shaping; in the finish lets the ankle open under control and, with the rear spoiler, holds the shin once the load point is behind the heel
    confidence: medium
    basis: Highly active in normal turns; the drill makes its closing the cue that lands the tips first. The finish role follows from the force line behind the ankle (L&S p 54, pp 192-193), our inference. Dynamic needs a faster, bigger closing after a higher tip lift
    sources:
      - hintermeister-1997
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: "79-81" }
      - { source: lind-sanders-2004, pages: 54 }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior to point the tip down
    confidence: low
    basis: Anatomy and the coaching cue; not measured on snow
    sources: [{ source: lemaster-2010, pages: 81 }]
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Yields as the shin meets the tongue on landing, holds the flexed ankle with the boot shaft, then yields as the feet slide forward and the ankle opens at the finish
    confidence: medium
    basis: Modelled ankle moments put the muscles' share near the boot's; with the knee bent the soleus does the ankle work. In the finish the load point moves behind the heel, so the ankle moment turns to dorsiflexion (L&S pp 192-193) and the bent tail lifts the tips (P&T p 89); the soleus only yields, our inference
    sources: [heinrich-2022, { source: lemaster-2010, pages: 81 }, { source: lind-sanders-2004, pages: "192-193" }, { source: bacharach-cross-2023, pages: 89 }]
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion, knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps flex the knee in the retraction; adds a little ankle stiffness, slack with the knee bent
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Put the landing ski on its big-toe edge, build the edge into late shaping, then let it go
    confidence: medium
    basis: Highly active in turns, attributed to edge control; the boot shell carries most of the edging moment
    sources: [louie-1984, { source: cross-raschner-2023, pages: 14 }, { source: lemaster-2010, pages: 127 }]
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch as the pressure runs from the ball to the heel
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole as it moves from forefoot to heel
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [{ source: iasi-2021, pages: 33 }]
  # Inside leg: loaded and short through shaping, retracted most in the transition (it was the old outside leg).
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: { gentle: 1, moderate: 2, dynamic: 2 } }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Catch the landing and hold the short, loaded inside leg; absorb with the outside leg as both tails load
    confidence: medium
    basis: Inside vastus lateralis measured about half the outside in normal turns (kroll-2010); the inside knee still needs an extension moment because it is more flexed (heinrich-2022). The aft finish raises it, our inference
    sources: [kroll-2010, heinrich-2022, heinrich-2023]
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity: { initiation: { gentle: 2, moderate: 2, dynamic: 3 }, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the old outside leg up hardest in the retraction, then holds the inside leg short as a hip flexor
    confidence: medium
    basis: Inside rectus femoris was higher in flexion transitions in instructors (seifert-2023) and works as a hip flexor on the inside leg in normal turns (kroll-2010). Dynamic retracts further from a bigger tail load, our inference
    sources: [seifert-2023, kroll-2010, cuniberti-2026]
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the inside thigh up in the retraction and helps keep the inside leg short
    confidence: low
    basis: Inference from off-snow hip-flexor EMG; never measured on snow
    sources: [jiroumaru-2014, juan-2024]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the inside foot up and back under the hips in the retraction, then co-contracts
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns; the retraction is mechanics
    sources: [chollet-2025, cuniberti-2026]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Help pull the inside foot up and steady the knee
    confidence: medium
    basis: Inside-leg hamstring activity measured in normal turns
    sources: [chollet-2025]
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: { gentle: 1, moderate: 2, dynamic: 2 }, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: eccentric }
    role: Holds the deeply flexed, loaded inside hip and helps turn the thigh out
    confidence: medium
    basis: The inside hip needs an extension moment close to the outside's in a modelled carved turn because it is more flexed (heinrich-2022)
    sources: [heinrich-2022, delp-1999]
  - muscle: adductors
    side: inside
    serves: [hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Hold the inside thigh beside the outside leg; adductor longus carries the inside hip's adduction moment
    confidence: medium
    basis: Modelled in a carved turn (heinrich-2023)
    sources: [heinrich-2023]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Its front fibres hold the inside thigh against further outward rotation
    confidence: medium
    basis: Inside gluteus medius active in normal turns (seifert-2023); the rotation-holding role is the modelled internal moment (heinrich-2022)
    sources: [seifert-2023, heinrich-2022]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh out with the turn as the ski lands
    confidence: low
    basis: Anatomy; not measured on snow
    sources: [delp-1999]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Points the inside tip down with the outside one and tips the ski onto its little-toe edge; holds the shin on the tongue
    confidence: medium
    basis: Inside tibialis anterior was the second most active inside muscle in a modelled carved turn (heinrich-2023); the tip-pointing is the drill's cue
    sources: [heinrich-2023, { source: lemaster-2010, pages: 81 }]
  - muscle: toe-extensors
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes up with tibialis anterior
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Tips the inside ski onto its little-toe edge and holds it
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Holds the inside ankle against the lighter load, then pushes the foot forward with the outside one
    confidence: low
    basis: Modelled inside ankle moment about half the outside's (heinrich-2022)
    sources: [heinrich-2022]
  # Trunk. The retraction adds an abdominal pull; the aft finish loads the back extensors less than an arched back would.
  - muscle: rectus-abdominis
    side: both
    serves: [pelvis.tilt, lumbar.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps pull the legs up in the retraction with the hip flexors, then balances the back extensors so the low back stays slightly flattened and the skier does not sit back
    confidence: medium
