      initiation: { action: Head turned against the countered chest so the eyes stay on the path, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
      shaping: { action: Held against the counter, contraction: isometric, cue: Look where you are going, confidence: low, sources: [] }
