structures:
  - structure: acl
    side: inside
    phases: [shaping, finish]
    mechanism: Loaded if the skier falls back on the stance ski, it slips, and its edge catches as the knee straightens and twists, the slip-catch mechanism, here on the uphill leg
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: "121-122" }
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the lifted downhill ski is put down wide and catches in a wedge to save balance, twisting the knee inward; the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }

