structures:
  - structure: acl
    side: outside
    phases: [finish]
    mechanism: Loaded if the skier sits back as the arc slows and the downhill ski's inside edge catches while the knee straightens and turns in, the slip-catch seen in racing injuries; a back-weighted stop pushes the shin forward through the boot
    protected_by: [biceps-femoris, medial-hamstrings, gluteus-maximus, gluteus-medius, deep-hip-rotators]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - heinrich-2023
      - { source: jordan-sporri-taylor-2023, pages: "119-123" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: acl
    side: inside
    phases: [shaping, finish]
    mechanism: Our inference; loaded if the uphill ski catches its edge and is forced out into a wedge, twisting the knee inward, as in the dynamic snowplow seen in racing
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: patellar-tendon
    side: inside
    phases: [shaping]
    mechanism: The uphill knee is held deeply bent under load through the carve, which pulls hard on the tendon for its load
    protected_by: [vasti]
    confidence: low
    sources: [heinrich-2022]
  - structure: lumbar-discs
    side: both
    phases: [shaping, finish]
    mechanism: Squeezed by forward flexion, side bend and twist combined under the turn load, the side bend and counter largest near the stop
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

