id: crab-wedge-turn
name: Wedge turn carved on the outside ski, inside ski brushing
# No study has measured this drill. Wedge turns were measured (hintermeister-1997, abstract; hermann-2023), so
# muscles shared with a plain wedge are at most medium; the crab-specific edging work is inferred from mechanics.
# Phases: initiation = from the hand-over at the end of the last turn until the new outside ski is tipped up and
# bending, about the fall line; shaping = the carve around and below the fall line as edge angle and load build;
# finish = the release of the outside ski's edge toward the flatter wedge edge as the other ski tips up.
# There is no edge change and no crossover: both skis stay on their big-toe edges all the time, and the centre of
# mass stays between the feet (psia-c-crab-wedge; the plain wedge works the same way). The "transition" is the
# hand-over between the two outside skis.
#
# Intensity (the drill's scenarios). Load factor n, Lind & Sanders eq 4.9 (p 103), at the top, the fall line and
# below it (heading 135°):
#   gentle    3.5 m/s, R 13.5 m,  6°:  about 0.99, 1.00, 1.01; balanced tilt about -1°, 5°, 9°
#   moderate  4.5 m/s, R 13 m,    8°:  about 0.99, 1.00, 1.02; tilt about 1°, 9°, 15°
#   dynamic   5.5 m/s, R 12.75 m, 10°: about 0.99, 1.01, 1.05; tilt about 4°, 14°, 20°
# The load is about body weight at every setting; the outside ski takes most of it, about 70-85 % by our
# inference (a crab wedge loads the outside ski more than a plain wedge, whose split is closer to even).
# The drill's demand is the edge angle, not the load. A carve's radius is about the sidecut radius × cos(edge
# angle) (L&S eq 3.7, p 65; LeMaster pp 32-33): on a 14 m ski these lines, close to the sidecut, need about 15°,
# 22° and 24° of edge (softer snow bends the ski tighter, so a little less: L&S pp 209-211). The balanced tilt
# is only about 5-14° in the fall line, so a gap of about 10° comes from angulation (L&S notes, T5): the wedge
# leg already slopes in from foot to pelvis, the femur turns in to move the knee in (LeMaster pp 124-125), the
# ankle everts (LeMaster p 127), and the pelvis and trunk shift over the outside ski. Edge and load both rise a
# little with speed and pitch; a tighter line on the same ski would need 30° or more of edge, too much for this
# level, so a skier who wants it tighter lets the outside ski brush a little: a partial carve.
# The inside ski is the base's other side: with the centre of mass between the feet, the force on the outside
# ski leans in toward the inside foot, which helps the outside edge hold (L&S pp 95-98: each leg's force is
# about perpendicular to its ski).
# Edge angle: early but progressive on the outside ski, building to its most in late shaping, then released
# toward the flatter wedge edge in the finish; the inside ski does the reverse, flattening early and tipping up
# again at the hand-over. No ski ever passes through flat to the other edge.
# Flexion: smaller than in parallel turns. The new outside leg lengthens a little as it takes the weight,
# holds quasi-isometric through the carve, then flexes a little as it hands the weight over; the inside leg does
# the opposite, a little shorter while it is light (LeMaster pp 40-42 for the pattern, scaled down here).
# Our inference: outside knee about 35-45° and hip about 35-45° of flexion, a little deeper at the dynamic
# setting; chest about 15-25° forward of vertical.
# Per-setting values are inference; a single number means it changes little with intensity.
#
# Equipment assumed: recreational carving skis of about 13-15 m sidecut radius; boots with about 15° cuff lean,
# about 0.9° binding ramp (4.7 mm) and about 42 mm stand height. A deeper sidecut carves the same line at a
# lower edge angle (LeMaster pp 32-33, L&S p 65); more lean or ramp deepens the knee (posch-2025, LeMaster
# pp 164-167); a higher stand height adds edge leverage but loads the knee (ruedl-2022, LeMaster pp 131-132).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Dorsiflexes as the ski is tipped up and takes the weight, the shin pressed into the tongue so the forebody engages
        contraction: concentric
        cue: Shin to the tongue as the ski tips up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81" }
          - { source: cross-raschner-2023, pages: 14 }
          - { source: iasi-2021, pages: 16 }
      shaping:
        action: Held flexed against the load so the pressure stays over the middle of the foot while the ski bends
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue; three contact points in the boot
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "81, 85" }
          - psia-c-carved-uphill-arc
      finish:
        action: Stays closed, shin on the tongue, as the edge is released; the wedge never sits back on the heels
        contraction: isometric
        cue: Stay over the middle of the foot as the edge lets go
        confidence: low
        sources:
          - kurpiers-2024
          - { source: lemaster-2010, pages: 81 }
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Held flexed, shin on the tongue, as the ski lightens and flattens
        contraction: isometric
        cue: Both shins forward, not just the outside one
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
      shaping:
        action: Held flexed while the ski brushes under a lighter load
        moment: Plantarflexion, small
        contraction: isometric
        cue: Shin on the tongue while the inside ski brushes
        confidence: medium
        sources:
          - heinrich-2023
          - { source: lemaster-2010, pages: 81 }
      finish:
        action: Presses further into the tongue as the ski is tipped up and takes the weight for the next turn
        contraction: concentric
        cue: Shin forward as this ski becomes the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "79-81" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts inside the boot, rolling the ski up from the low wedge edge onto a higher big-toe edge, with the femur turning in
        contraction: concentric
        cue: Roll the outside ankle in; tip the ski with the lower leg
        confidence: medium
        sources:
          - psia-c-crab-wedge
          - { source: lemaster-2010, pages: 127 }
          - { source: cross-raschner-2023, pages: 14 }
      shaping:
        action: Eversion keeps building to its most in late shaping, then holds against the snow force that would flatten the ski
        moment: Eversion, mostly carried by the boot shell
        contraction: concentric
        cue: Keep tipping the outside ski until it bends and carves
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 127" }
          - { source: lind-sanders-2004, pages: "54-55" }
      finish:
        action: Lets the edge back down to the low wedge edge as the other ski tips up; the ski never goes flat or onto its other edge
        contraction: eccentric
        cue: Let the outside edge soften; stay in the wedge
        confidence: low
        sources:
          - psia-c-crab-wedge
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Lets the old outside ski's edge down toward flat, still on its big-toe edge, so it can brush
        moment: Eversion, falling
        contraction: eccentric
        cue: Flatten the inside ski; don't lift it onto its little-toe edge
        confidence: low
        sources:
          - { source: iasi-2021, pages: 45 }
          - psia-c-crab-wedge
      shaping:
        action: Held low on its big-toe edge, with small inversion and eversion corrections so it brushes without catching
        contraction: isometric
        cue: Inside ski light and flat enough to brush
        confidence: low
        sources:
          - { source: iasi-2021, pages: 45 }
      finish:
        action: Begins to evert and tip up for the next turn as the outside ski releases
        contraction: concentric
        cue: Start tipping the inside ski up as the outside one softens
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes most of the load and the ankle rolls in
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
          - { source: iasi-2021, pages: 190 }
      shaping:
        action: Arch held up under the peak load on the big-toe edge
        contraction: isometric
        cue: Keep the arch from collapsing as you tip
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as the load moves to the other foot
        contraction: isometric
        cue: Spread the pressure over the whole foot
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held under a falling load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      shaping: { action: Arch held under a light load while the ski brushes, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { action: Arch held up as the foot takes the load again, contraction: isometric, cue: Stand on the whole foot as it takes over, confidence: low, sources: [{ source: lemaster-2010, pages: 139 }] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Lengthens a little from the hand-over as the leg takes most of the weight; a small range, the wedge never rises tall
        contraction: concentric
        cue: Stand a little taller on the outside ski as it tips up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "65-66" }
      shaping:
        action: Held quasi-isometric while the ski carves, about 35-45° of flexion, a little deeper at the dynamic setting (our inference)
        moment: Extension
        contraction: isometric
        cue: Steady outside leg while the ski bends
        confidence: medium
        sources:
          - hintermeister-1997
          - hermann-2023
          - { source: bacharach-cross-2023, pages: 27 }
      finish:
        action: Flexes a little as the edge releases and the weight moves to the other ski
        contraction: eccentric
        cue: Soften the outside leg as the other ski takes over
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: Flexes a little as the weight leaves it, so the inside leg is the shorter one while the pelvis moves over the outside ski
        moment: Extension, falling
        contraction: eccentric
        cue: Let the inside leg soften as the outside ski takes the weight
        confidence: low
        sources:
          - { source: iasi-2021, pages: 65 }
          - { source: lemaster-2010, pages: 55 }
      shaping:
        action: Held a little more bent than the outside knee, still loaded while the ski brushes
        moment: Extension, smaller than outside
        contraction: isometric
        cue: Inside leg a little shorter, still on the snow
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 55 }
      finish:
        action: Lengthens as it takes the weight and becomes the next outside leg
        contraction: concentric
        cue: Grow onto the next outside ski
        confidence: low
        sources: []
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the twist the edged ski invites, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: "Turn the thigh, not the knee", confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee points along its ski, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the twist of the brushing ski, contraction: isometric, cue: Inside knee points along its ski, confidence: low, sources: [{ source: lind-sanders-2004, pages: 98 }] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee points along its ski, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, moment: Resisting the inward collapse the wedge invites, contraction: isometric, cue: "Knee over the big toe, not caving inside it", confidence: low, sources: [{ source: lemaster-2010, pages: 125 }] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: "Knee over the big toe, not caving inside it", confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Knee over the foot, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee over its foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse if the brushing edge bites, contraction: isometric, cue: "Inside knee over its foot, not falling in", confidence: low, sources: [{ source: jordan-sporri-taylor-2023, pages: 122 }] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee over its foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens a little with the knee as the leg takes the weight; the hinge stays at the hips
        contraction: concentric
        cue: Rise a little over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 54" }
      shaping:
        action: Held flexed about 35-45° (our inference), folded at the hip over the carving ski
        moment: Extension
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - hintermeister-1997
          - { source: lemaster-2010, pages: "54, 73-74" }
      finish:
        action: Folds a little with the knee as the weight leaves it
        contraction: eccentric
        cue: Soften at the hips as the other ski takes over
        confidence: low
        sources: []
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: Folds a little more than the outside hip as the leg lightens and shortens
        moment: Extension, falling
        contraction: eccentric
        cue: Inside hip folds, not drops
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "55, 61-62" }
      shaping:
        action: Held a little more flexed than the outside hip, still loaded
        moment: Extension, smaller than outside
        contraction: isometric
        cue: Inside leg a little shorter
        confidence: low
        sources:
          - heinrich-2022
      finish:
        action: Opens as the leg takes the weight for the next turn
        contraction: concentric
        cue: Grow onto the next outside leg
        confidence: low
        sources: []
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The pelvis moves across over the outside ski and the knee moves in, so the hip goes from the wedge's abduction toward neutral, net adduction; the abductors lengthen under control while the adductors brace, and the pelvis is kept from dropping on the inside rather than hiked
        moment: Abduction, holding the pelvis over the stance hip
        contraction: eccentric
        cue: Move the hips over the outside ski, inside hip up
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128" }
          - hintermeister-1997
          - moore-2020
      shaping:
        action: Held, the outside hip carrying most of the pelvis with the inside ski as a light second support; abductors and adductors co-contract
        moment: Abduction, with adductor co-contraction keeping the wedge size
        contraction: isometric
        cue: Stay over the outside hip; keep the wedge the same size
        confidence: medium
        sources:
          - hintermeister-1997
          - heinrich-2023
          - { source: lemaster-2010, pages: "70-71, 140" }
      finish:
        action: The pelvis moves back toward the middle of the wedge and the hip returns to its abducted wedge position
        contraction: concentric
        cue: Move back to the middle as the other ski takes over
        confidence: low
        sources:
          - psia-c-wedge-turn
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: Abducts a little further as the pelvis moves away over the outside ski while the inside foot stays wide; adductors keep the wedge from opening
        contraction: concentric
        cue: Keep the wedge size as you move over the outside ski
        confidence: low
        sources:
          - hintermeister-1997
          - { source: lind-sanders-2004, pages: "95-98" }
      shaping:
        action: Held abducted in the wedge, adductors and abductors co-contracting
        contraction: isometric
        cue: Wedge the same size, tip to tail
        confidence: medium
        sources:
          - hintermeister-1997
      finish:
        action: Comes back toward the wedge's middle as the pelvis moves over this foot
        contraction: eccentric
        cue: Move over this foot as it takes over
        confidence: low
        sources: []
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward a little beyond the wedge's internal rotation, moving the knee in so the ski rolls up its edge; the adductors and anterior gluteals drive it at this hip flexion
        contraction: concentric
        cue: Turn the outside thigh in to tip the ski
        confidence: medium
        sources:
          - psia-c-crab-wedge
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - delp-1999
      shaping:
        action: Held turned in, holding the edge against the snow's torque that would flatten the ski and push the knee out
        moment: Internal rotation, small
        contraction: isometric
        cue: Keep the thigh turned in while the ski carves
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "123-125" }
      finish:
        action: Lets the thigh turn back out to the wedge position as the edge releases
        contraction: eccentric
        cue: Let the thigh unwind as the edge softens
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Held turned in at the wedge angle, tip toward the other tip, as the ski flattens
        contraction: isometric
        cue: Keep the inside tip in its place
        confidence: low
        sources:
          - { source: iasi-2021, pages: "44-45" }
      shaping:
        action: Held turned in against the brushing ski, whose drag would swing its tip outward
        moment: Internal rotation, small
        contraction: isometric
        cue: Inside ski steady; don't let it wander
        confidence: low
        sources:
          - delp-1999
      finish:
