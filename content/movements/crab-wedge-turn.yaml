activations:
  # Outside leg: most of a load of about body weight, at a modest knee bend. hintermeister-1997 measured
  # vasti, biceps femoris, gluteus maximus and adductors above 50 % MVC in wedge turns (abstract only, old skis,
  # a plain wedge); hermann-2023 found the plough the lowest thigh task in older women. We place the outside
  # extensors at 2, rising in shaping at the dynamic setting, between the two.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Lengthen the outside knee a little as it takes the weight, hold it while the ski carves, then let it soften as the other ski takes over
    confidence: medium
    basis: Measured high in wedge turns (hintermeister-1997, abstract) and low in the plough in recreational women (hermann-2023). Here the outside leg carries about 70-85 % of about body weight at a modest bend; the per-setting values are our inference from load and depth
    sources:
      - hintermeister-1997
      - hermann-2023
      - { source: bacharach-cross-2023, pages: 27 }
      - { source: lind-sanders-2004, pages: 103 }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor on the stance leg
    confidence: medium
    basis: Measured as an outside-leg knee extensor in normal turns; low at wedge loads by inference
    sources: [kroll-2010, hermann-2023]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 2
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Holds the folded outside hip against the load and helps hold the pelvis over it
    confidence: medium
    basis: Measured more active in wedge than in parallel turns (hintermeister-1997, abstract); scaled with load and fold by inference
    sources:
      - hintermeister-1997
      - heinrich-2023
      - { source: lemaster-2010, pages: 54 }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Controls the pelvis moving across over the outside ski, holds its inside half up while the edge peaks, and its front fibres help turn the thigh in
    confidence: medium
    basis: Measured on snow in normal turns and in single-leg stance off snow; the inside ski still shares the pelvic support, so it stays at 2 at every setting
    sources:
      - seifert-2023
      - moore-2020
      - delp-1999
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Shares the pelvic hold and, in hip flexion, turns the thigh in
    confidence: low
    basis: Off-snow single-leg EMG and moment arms; not measured on snow
    sources: [moore-2020, delp-1999]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Helps turn the thigh in and hold the pelvis
    confidence: low
    basis: Inferred from exercise EMG; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Turn the bent thigh in to tip the ski and hold the edge, and brace against the abductors so the wedge keeps its size
    confidence: medium
    basis: Adductors averaged above 50 % MVC in wedge turns (hintermeister-1997, abstract); the edging role is the mechanics of the flexed leg (LeMaster). Placed at 2 because this wedge is small and slow
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment and braces the wedge
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured on snow
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee
    confidence: medium
    basis: Measured high in wedge turns (hintermeister-1997) but with the least hamstring co-contraction of any task in the plough (hermann-2023); placed low
    sources: [hintermeister-1997, hermann-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.valgus, knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee caving in and twisting under the tipped ski
    confidence: medium
    basis: Semitendinosus at 6-15 % of maximum in a simulated edged stance; low hamstring co-contraction in the plough
    sources: [zorko-2020, hermann-2023]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the outside foot in to tip the ski up its edge and keep building it into late shaping, then let it back down
    confidence: low
    basis: Tipping from the lower leg is the drill's point (psia-c-crab-wedge); peroneus longus is highly active in turns, attributed to edge control. A balance and edging effort, so it changes little with intensity; the boot shell carries most of the moment
    sources:
      - psia-c-crab-wedge
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 2, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pulls the shin to the tongue as the ski tips up, then co-contracts to keep it there
    confidence: medium
    basis: Measured high in turns including wedge turns; the modelled shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "79-81" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Yields as the shin presses into the tongue, then shares the plantarflexion moment with the boot
    confidence: medium
    basis: Modelled ankle moments in carving; low at wedge loads by inference
    sources: [heinrich-2022]
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the arch up as the ankle rolls in
    confidence: low
    basis: Anatomy; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 139 }
  - muscle: foot-intrinsics
    side: outside
