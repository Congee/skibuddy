structures:
  - structure: acl
    side: inside
    phases: [shaping, finish]
    mechanism: Loaded if the brushing inside ski's edge catches in the wedge, so the ski is pulled outward and the knee is twisted inward and falls in; the wedge catch that Lind & Sanders describe and the dynamic snowplow seen in racing injuries
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: lind-sanders-2004, pages: "98, 193" }
      - { source: jordan-sporri-taylor-2023, pages: 122 }
  - structure: mcl
    side: inside
    phases: [shaping, finish]
    mechanism: Our inference from the same wedge catch; the knee falling in opens its inner side
    protected_by: [medial-hamstrings, adductors]
    confidence: low
    sources:
      - { source: lind-sanders-2004, pages: 98 }
  - structure: acl
    side: outside
    phases: [shaping]
    mechanism: Loaded if the knee is pushed in over the foot to tip the ski (valgus with internal rotation) instead of turning the thigh, and more so if the skier sits back; caught edges in that position are the slip-catch pattern
    protected_by: [medial-hamstrings, biceps-femoris, gluteus-maximus, gluteus-medius]
    confidence: low
    sources:
      - bere-2011
      - { source: lemaster-2010, pages: 125 }
      - { source: jordan-sporri-taylor-2023, pages: "119-122" }

