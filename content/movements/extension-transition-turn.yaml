activations:
  # Outside leg. It pushes the body up through the switch, then works less bent than with a flexion transition.
  - muscle: vasti
    side: outside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Extend the knee through the switch to lift the body over the skis, hold it at the peak and let it flex as the turn ends
    confidence: medium
    basis: Vastus medialis and lateralis averaged above 50 % MVC in GS turns (hintermeister-1997, abstract only; 1997 straight skis, long turns, not split by transition style), the same carved pattern. Outside vastus lateralis ran lower with an extension transition than with a flexion one (seifert-2023, in mV), because the knee works less bent; the push at the switch is a short concentric burst (L&S Fig 5.4b). Per-setting values are our inference from the load and the push
    sources:
      - hintermeister-1997
      - seifert-2023
      - berg-1995
      - { source: lind-sanders-2004, pages: "103, 119" }
  - muscle: rectus-femoris
    side: outside
    serves: [knee.flexion, hip.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 1, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Works with the vasti as a knee extensor in the push and the hold
    confidence: medium
    basis: Outside rectus femoris was much lower in the transition with an extension transition than with a flexion one (seifert-2023, in mV). Levels are our inference
    sources: [seifert-2023, kroll-2010]
  - muscle: gluteus-maximus
    side: outside
    serves: [hip.flexion, hip.rotation, hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 3 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Extends the hip in the push through the switch, then holds the folded hip against the load
    confidence: medium
    basis: Averaged above 50 % MVC in GS turns (hintermeister-1997, abstract only; 1997 straight skis, long turns, not split by transition style); the knee and hip extensors drive the extension through the switch (biomechanics.md D17). Per-setting values are inference from the load and the push
    sources:
      - hintermeister-1997
      - heinrich-2022
      - berg-1995
      - { source: lemaster-2010, pages: "54, 73" }
  - muscle: gluteus-medius
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Keeps the inside half of the pelvis up as the legs tip and the hip angulates
    confidence: medium
    basis: Measured on both legs on snow with both transition styles (seifert-2023); the inside ski shares the pelvic hold. Rises with the angulation at speed by inference
    sources:
      - seifert-2023
      - louie-1984
      - moore-2020
      - { source: lemaster-2010, pages: "70-71, 140" }
  - muscle: gluteus-minimus
    side: outside
    serves: [hip.abduction, pelvis.list, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Shares the pelvic hold with gluteus medius and steadies the head of the femur
    confidence: low
    basis: Never measured on snow; off-snow EMG puts it with gluteus medius
    sources: [moore-2020, ganderton-2017]
  - muscle: tensor-fasciae-latae
    side: outside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Helps hold the pelvis and turn the thigh inward
    confidence: low
    basis: Inferred from exercise data; not measured on snow
    sources: [selkowitz-2024]
  - muscle: adductors
    side: outside
    serves: [hip.rotation, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the bent thigh inward to tip and steer the light skis, then stiffen the hip against the abductors
    confidence: medium
    basis: The adductors averaged above 50 % MVC in GS turns as a group; the carved turn needs little steering, so they sit lower here by inference
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "108, 124-125" }
  - muscle: adductor-magnus
    side: outside
    serves: [hip.flexion, hip.abduction]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Shares the hip extension moment with gluteus maximus and the hamstrings
    confidence: low
    basis: Anatomy and a modelled hip extension moment; not measured apart from the adductor group
    sources: [neumann-2010, heinrich-2022]
  - muscle: biceps-femoris
    side: outside
    serves: [knee.flexion, knee.rotation, hip.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with the quadriceps to steady the knee and brakes the thigh's inward turn as the ski carves
    confidence: medium
    basis: Biceps femoris averaged above 50 % MVC in GS turns on one leg through both turns; modelled as an external rotator braking the outside hip. Per-setting values are inference
    sources: [hintermeister-1997, heinrich-2023, zorko-2020]
  - muscle: medial-hamstrings
    side: outside
    serves: [knee.rotation, knee.valgus, knee.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Resist the knee twisting outward and caving in
    confidence: medium
    basis: Semitendinosus 6-15 % MVC in a simulated edged stance; low in normal turns
    sources: [hintermeister-1997, zorko-2020, heinrich-2023]
  - muscle: deep-hip-rotators
    side: outside
    serves: [hip.rotation, pelvis.rotation]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steady the hip joint and brake the thigh's inward turn as the ski carves
    confidence: low
    basis: Quadratus femoris contributed to the external rotation moment in a model of a carved turn; model only
    sources: [heinrich-2023, delp-1999]
  - muscle: popliteus
    side: outside
    serves: [knee.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies the shin's rotation under the bent knee
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-anterior
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pulls the feet back as the body rises so the extension goes forward over the skis, then co-contracts as the turn loads
    confidence: medium
    basis: Highly active in GS turns (hintermeister-1997); rising up and back is the named fault of this transition. The shaping moment is plantarflexion, so its later work is co-contraction
    sources:
      - hintermeister-1997
      - heinrich-2022
      - { source: lemaster-2010, pages: "79-81, 94" }
  - muscle: toe-extensors
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Pull the toes and foot up with tibialis anterior
    confidence: low
    basis: Anatomy and coaching cue; not measured on snow
    sources:
      - { source: lemaster-2010, pages: 81 }
  - muscle: soleus
    side: outside
    serves: [ankle.flexion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: { gentle: 1, moderate: 2, dynamic: 2 }
    contraction: { initiation: eccentric, shaping: isometric, finish: concentric }
    role: Yields as the shin presses into the tongue, holds the ankle against the load with the boot shaft, then opens it as the foot comes forward
    confidence: medium
    basis: Ankle moments modelled in carving put about 0.85 Nm/kg in the muscles and 1.16 Nm/kg in the boot shaft; with the knee bent the soleus does the ankle work. Scaled with load by inference
    sources:
      - heinrich-2022
      - { source: lemaster-2010, pages: 81 }
  - muscle: gastrocnemius
    side: outside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Adds a little ankle stiffness; slack with the knee bent
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: peroneals
    side: outside
    serves: [ankle.inversion]
    intensity: { initiation: 2, shaping: 2, finish: 1 }
    contraction: { initiation: concentric, shaping: concentric, finish: eccentric }
    role: Roll the foot onto the new big-toe edge as the skis go light, build it into late shaping, then let it go
    confidence: medium
    basis: Peroneus longus is highly active in turns, attributed to edge control; the boot shell carries most of the edging moment
    sources:
      - louie-1984
      - { source: cross-raschner-2023, pages: 14 }
      - { source: lemaster-2010, pages: 127 }
  - muscle: tibialis-posterior
    side: outside
    serves: [foot.arch, ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Holds the arch up and co-contracts with the peroneals
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: foot-intrinsics
    side: outside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the pressure over the sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: iliopsoas
    side: outside
    serves: [pelvis.tilt]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts with gluteus maximus and the abdominals to steady the pelvis on the loaded hip
    confidence: low
    basis: Inference; never measured on snow. The loaded hip carries an extension moment, so the hip flexors only co-contract
    sources:
      - { source: lemaster-2010, pages: "62-63" }
  # Inside leg. At initiation it is the old outside leg, pushing with the new outside leg, then relaxing to
  # become the short, bent inside leg.
  - muscle: iliopsoas
    side: inside
    serves: [hip.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: eccentric, shaping: isometric, finish: isometric }
    role: Helps the new inside hip fold after the push and keeps the inside leg short
    confidence: low
    basis: Inference; iliopsoas has never been measured on snow, and there is no active retraction in this style
    sources: [jiroumaru-2014]
  - muscle: rectus-femoris
    side: inside
    serves: [hip.flexion, knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps the old outside knee push, then switches to a hip flexor that keeps the inside leg short
    confidence: medium
    basis: Inside rectus femoris was lower with an extension transition than with a flexion one (seifert-2023, in mV); measured as an inside-leg hip flexor in recreational turns (kroll-2010)
    sources: [seifert-2023, kroll-2010]
  - muscle: biceps-femoris
    side: inside
    serves: [knee.flexion, hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contracts to steady the inside knee through the push and the turn
    confidence: medium
    basis: Inside-leg hamstring activity measured in turns
    sources: [chollet-2025]
  - muscle: medial-hamstrings
    side: inside
    serves: [knee.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Co-contract to steady the inside knee
    confidence: medium
    basis: Inside-leg hamstring activity measured in turns
    sources: [chollet-2025]
  - muscle: gastrocnemius
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 0, finish: 0 }
    contraction: { initiation: isometric, shaping: null, finish: null }
    role: Adds ankle stiffness through the push while the knee is less bent
    confidence: low
    basis: Anatomy; in a boot the ankle cannot add a push, so it only stiffens (patterson-2023 p 89)
    sources:
      - { source: patterson-2023, pages: 89 }
  - muscle: vasti
    side: inside
    serves: [knee.flexion]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 1, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Push the old outside knee straighter to lift the body across, then hold the bent inside knee under its share of the load
    confidence: medium
    basis: Inside vastus lateralis ran about 54 % below the outside leg in recreational turns; the push at the switch is mechanics (L&S pp 117-120)
    sources:
      - kroll-2010
      - heinrich-2023
      - { source: lind-sanders-2004, pages: "117-120" }
  - muscle: gluteus-maximus
    side: inside
    serves: [hip.flexion, hip.rotation]
    intensity:
      initiation: { gentle: 1, moderate: 1, dynamic: 2 }
      shaping: 1
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Extends the old outside hip in the push, then holds the more-flexed inside hip against its load
    confidence: low
    basis: Mechanics of the push; the inside hip carries an extension moment in a modelled carved turn
    sources: [heinrich-2022, delp-1999]
  - muscle: adductors
    side: inside
    serves: [hip.abduction, hip.rotation]
    intensity: { initiation: 1, shaping: 2, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the inside thigh drawn toward the turn and, with the hip flexed, hold it against further outward turn
    confidence: medium
    basis: Adductor longus ranked among the most active inside-leg muscles in an EMG-validated model of a carved turn; the inside hip carried an internal rotation moment
    sources: [heinrich-2023, heinrich-2022]
  - muscle: deep-hip-rotators
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Turn the inside thigh outward so the inside ski steers with the outside one
    confidence: low
    basis: Anatomy; with the hip deeply flexed their moment arms shrink, so gluteus maximus and sartorius share the work
    sources: [delp-1999]
  - muscle: sartorius
    side: inside
    serves: [hip.rotation]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Helps turn the inside thigh outward as the leg steers
    confidence: low
    basis: Anatomy and hip-flexor EMG off snow
    sources: [andersson-1997, jiroumaru-2014]
  - muscle: gluteus-medius
    side: inside
    serves: [hip.abduction]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Steadies the inside hip through the push and holds a strong inside half through the turn
    confidence: medium
    basis: Inside gluteus medius was higher with an extension transition than with a flexion one, in steering and transition alike (seifert-2023, in mV); levels are inference
    sources: [seifert-2023]
  - muscle: tibialis-anterior
    side: inside
    serves: [ankle.flexion, ankle.inversion]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Draws the new inside foot back after the push, tips the inside ski, and keeps the shin on the tongue, rising after the fall line
    confidence: medium
    basis: The second most active inside-leg muscle in an EMG-validated model of a carved turn, rising after the fall line; scaled by inference
    sources: [heinrich-2023, hintermeister-1997]
  - muscle: toe-extensors
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: isometric }
    role: Pull the inside foot up with tibialis anterior
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: tibialis-posterior
    side: inside
    serves: [ankle.inversion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: concentric, shaping: isometric, finish: eccentric }
    role: Rolls the inside ski onto its little-toe edge and lets it go
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: soleus
    side: inside
    serves: [ankle.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Holds the ankle against the boot during the push and shares the inside ankle's moment afterwards
    confidence: medium
    basis: The modelled inside ankle moment was about 45 % lower than the outside one; in a boot the ankle cannot push the body up (patterson-2023 p 89)
    sources:
      - heinrich-2022
      - { source: patterson-2023, pages: 89 }
  - muscle: foot-intrinsics
    side: inside
    serves: [foot.arch]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Spread the lighter load over the inside sole
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  # Pelvis and trunk. The trunk rises with the body at the switch and must not arch.
  - muscle: erector-spinae
    side: both
    serves: [lumbar.flexion, thoracic.flexion, pelvis.tilt]
    intensity:
      initiation: { gentle: 1, moderate: 2, dynamic: 2 }
      shaping: { gentle: 2, moderate: 2, dynamic: 3 }
      finish: { gentle: 2, moderate: 2, dynamic: 3 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Hold the hinged trunk with the low back slightly flattened as it rises and loads, quiet but not rigid
    confidence: medium
    basis: Measured in turns; the lumbar extension moment was the largest joint moment in a modelled carved turn. The trunk is less folded at the switch than with a flexion transition; levels are inference
    sources:
      - hintermeister-1997
      - zeglinski-1998
      - heinrich-2022
  - muscle: rectus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Balances the back extensors so the low back does not arch as the body rises
    confidence: medium
    basis: Measured at low levels in turns
    sources:
      - hintermeister-1997
      - { source: lemaster-2010, pages: "62-63" }
  - muscle: multifidus
    side: both
    serves: [lumbar.rotation, lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Steadies each segment of the low back
    confidence: low
    basis: Linked to back complaints in racers; not measured in turns
    sources:
      - { source: jordan-sporri-taylor-2023, pages: 116 }
  - muscle: transversus-abdominis
    side: both
    serves: [lumbar.flexion]
    intensity: { initiation: 1, shaping: 1, finish: 1 }
    contraction: { initiation: isometric, shaping: isometric, finish: isometric }
    role: Stiffens the trunk without bracing it rigid
    confidence: low
    basis: Anatomy; not measured on snow
    sources: []
  - muscle: quadratus-lumborum
    side: inside
    serves: [lumbar.side-bend]
    intensity:
      initiation: 1
      shaping: { gentle: 1, moderate: 2, dynamic: 2 }
      finish: 1
    contraction: { initiation: eccentric, shaping: eccentric, finish: concentric }
    role: Controls the low back's bend toward the outside ski, then straightens it
    confidence: low
    basis: EMG off snow; the role here is mechanics. The side bend grows with the edge angle, so its effort rises with speed by inference
    sources: [andersson-1996, mcgill-1996]
  - muscle: quadratus-lumborum
    side: outside
