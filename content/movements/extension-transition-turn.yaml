structures:
  - structure: acl
    side: outside
    phases: [initiation, shaping]
    mechanism: Loaded if the body rises up and back instead of forward, so the new turn starts back-seated with the boot pushing the shin forward against a hard quadriceps pull; a late edge set from there adds the slip-catch
    protected_by: [biceps-femoris, medial-hamstrings, tibialis-anterior, gluteus-maximus]
    confidence: medium
    sources:
      - bere-2011
      - bere-2013
      - { source: jordan-sporri-taylor-2023, pages: "119-122" }
      - { source: lind-sanders-2004, pages: "192-193" }
  - structure: lumbar-discs
    side: both
    phases: [initiation, shaping, finish]
    mechanism: Squeezed by flexion, side bend and twist combined under the turn load; arching the low back to stand up at the switch adds extension under load
    protected_by: [multifidus, erector-spinae, internal-oblique, external-oblique, rectus-abdominis]
    confidence: medium
    sources:
      - sporri-2015
      - sporri-2016
      - { source: cross-raschner-2023, pages: 12 }

