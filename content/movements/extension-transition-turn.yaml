id: extension-transition-turn
name: Linked turns with an extension transition, the body rising over the skis
# Measured in this movement: 23 PSIA Level III instructors, examiners and demo-team members skied both
# transition styles with EMG of rectus femoris, vastus lateralis and gluteus medius on both legs (seifert-2023,
# full text, in mV, so it ranks muscles but sets no absolute effort). Against the flexion transition the
# extension transition gave less quadriceps desaturation and lower perceived exertion, lower outside vastus
# lateralis and rectus femoris, lower inside rectus femoris, and higher inside gluteus medius in both steering
# and transition. The rest is inference from carved turns (D13 pattern) and mechanics.
# Phases: initiation = the switch (the legs push the body up and across the skis as the edges change) and
# engagement up to the fall line; shaping = around the fall line; finish = completion. Through the switch the old
# outside leg becomes the inside leg, so its push sits in the inside rows at initiation.
#
# Mechanics: extending through the switch is up-unweighting. The legs push at about twice body weight for about
# 0.2 s, the body floats for up to about 0.4 s while the edges change, and the new turn must then absorb an equal
# overweighting; the unweighting comes late, after the push (Lind & Sanders pp 118-120, Fig 5.4b; p 119). The
# centre of mass crosses over the skis and rises (seifert-2023). Pumping like this costs energy and raises the
# later peak (komissarov-2022b).
# Intensity (the drill's scenarios). Lind & Sanders eq 4.9 (p 103), total snow force over body weight at the top,
# the fall line and below it:
#   gentle    8 m/s, R 12 m, 12°:   about 1.03, 1.12, 1.20
#   moderate 10 m/s, R 14 m, 15°:   about 1.07, 1.21, 1.33
#   dynamic  12 m/s, R 16 m, 18°:   about 1.13, 1.32, 1.48
# At the switch, where the turn load is near its trough, the brief push replaces it rather than adding to it:
# about 2 W for 0.2 s if the body is lifted hard (L&S Fig 5.4b; our inference that drill skiers push less).
# The outside leg carries about 60-75 % in the turn (heinrich-2022, falda-buscaiot-2017). Speeds and radii are our inference, well under GS levels.
#
# Flexion pattern: flexed as the old turn ends, extending through the switch so the legs are long early in the
# new turn, quasi-isometric through shaping, absorbing through the finish (LeMaster pp 40-42; bacharach-cross-2023
# p 27; IASI pp 35, 38). The difference from a flexion transition is how much and how fast the legs extend at the
# switch, and that the body rises over the skis instead of the skis crossing under it.
# Edging: progressive. The edges change while the skis are light at the top of the rise; the edge angle then builds
# to a peak in late shaping and releases in the finish (LeMaster pp 46-49, 128; IASI pp 31, 37). Extending up and
# back delays the new edge, the common fault (biomechanics.md D17).
#
# Equipment assumed: recreational carving skis of about 14-17 m sidecut; boots with about 15° cuff lean, about
# 0.9° binding ramp and about 42 mm stand height. More lean or ramp deepens the knee (posch-2025, LeMaster pp
# 164-167).
# Book citations give printed page numbers; for the IASI manual, the PDF page.
dof_matrix:
  - dof: ankle.flexion
    side: outside
    cells:
      initiation:
        action: Closes as the feet are drawn back while the body rises and moves forward over the skis, so the extension goes up and forward, not up and back
        contraction: concentric
        cue: Rise forward over the feet, shins on the tongues
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "79-81, 86, 94" }
          - { source: iasi-2021, pages: "33, 38" }
          - hintermeister-1997
      shaping:
        action: Held flexed against the rising load, a little more flexed the harder the turn
        moment: Plantarflexion, shared with the boot shaft
        contraction: isometric
        cue: Keep the shin on the tongue as the turn loads
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "79, 85-86" }
          - { source: cross-raschner-2023, pages: 14 }
      finish:
        action: Opens a little as the foot slides forward under the body and pressure moves toward the heel, still flexed past upright
        contraction: concentric
        cue: Let the feet come forward a little as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "38, 81, 182-183" }
          - falda-buscaiot-2017
  - dof: ankle.flexion
    side: inside
    cells:
      initiation:
        action: Stays closed while the old outside leg pushes, then the foot is drawn back as it becomes the inside foot
        contraction: concentric
        cue: Both shins forward as you rise
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "81, 86" }
      shaping:
        action: Held flexed, shin on the tongue; the inside dorsiflexors work harder after the fall line
        contraction: isometric
        cue: Keep the inside shin on the tongue
        confidence: medium
        sources:
          - heinrich-2023
          - heinrich-2022
      finish:
        action: Held closed while the outside foot comes forward, ready to push as the new turn starts
        contraction: isometric
        cue: Inside ankle stays bent
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "61-62, 86" }
  - dof: ankle.inversion
    side: outside
    cells:
      initiation:
        action: Everts inside the boot as the skis go light at the top of the rise, rolling the ski onto its big-toe edge above the fall line
        contraction: concentric
        cue: Roll onto the new big-toe edge as you rise
        confidence: medium
        sources:
          - { source: cross-raschner-2023, pages: 14 }
          - { source: lemaster-2010, pages: "53, 127, 154" }
      shaping:
        action: Eversion keeps building to its most in late shaping, then holds against the snow force that would flatten the ski
        moment: Eversion
        contraction: concentric
        cue: Keep rolling onto the big-toe edge past the fall line
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "123-124, 128" }
          - { source: lind-sanders-2004, pages: "54-55" }
          - { source: iasi-2021, pages: 31 }
      finish:
        action: Holds, then releases toward flat as the turn ends
        contraction: eccentric
        cue: Let the edge go as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "38, 130" }
  - dof: ankle.inversion
    side: inside
    cells:
      initiation:
        action: Inverts to roll the new inside ski onto its little-toe edge as it unweights after the push
        contraction: concentric
        cue: Tip the inside foot toward its little toe
        confidence: low
        sources:
          - { source: iasi-2021, pages: 46 }
          - psia-c-medium-radius-carved
      shaping:
        action: Tilt held, building with the outside ski's edge
        contraction: isometric
        cue: Keep both skis tipped the same way
        confidence: low
        sources: []
      finish:
        action: Releases toward flat with the outside ski
        contraction: eccentric
        cue: Flatten both skis together
        confidence: low
        sources: []
  - dof: foot.arch
    side: outside
    cells:
      initiation:
        action: Arch held up as the foot takes the new load after the light switch
        contraction: isometric
        cue: Stand on heel, big-toe ball and little-toe ball
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 139 }
      shaping:
        action: Arch held up under the peak load
        contraction: isometric
        cue: Keep the arch from collapsing
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "139, 161-162" }
      finish:
        action: Arch held as pressure moves back
        contraction: isometric
        cue: Spread the pressure as it moves to the heel
        confidence: low
        sources: []
  - dof: foot.arch
    side: inside
    cells:
      initiation: { action: Arch held through the push then under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      shaping: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
      finish: { action: Arch held under a lighter load, contraction: isometric, cue: A quiet inside foot, confidence: low, sources: [] }
  - dof: knee.flexion
    side: outside
    cells:
      initiation:
        action: Extends through the switch, lifting the body up and across onto the new edges; the skis go light at the top of the rise, then the leg meets the new turn long
        moment: Extension, briefly near twice body weight if the push is hard
        contraction: concentric
        cue: Stand up and forward into the new turn
        confidence: medium
        sources:
          - seifert-2023
          - berg-1995
          - { source: lind-sanders-2004, pages: "118-120" }
          - { source: iasi-2021, pages: "35, 38" }
      shaping:
        action: Held near its longest, quasi-isometric, while the load peaks; less bent than with a flexion transition
        moment: Extension, near its peak
        contraction: isometric
        cue: Strong and steady on the outside leg
        confidence: medium
        sources:
          - seifert-2023
          - alhammoud-2020
          - heinrich-2022
          - { source: cross-raschner-2023, pages: "11-13" }
      finish:
        action: Flexes, absorbing the load as it peaks below the fall line and eases, ready for the next push
        contraction: eccentric
        cue: Flex under control as the turn ends
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "40-42" }
          - { source: iasi-2021, pages: "38, 65-66" }
          - { source: bacharach-cross-2023, pages: 27 }
  - dof: knee.flexion
    side: inside
    cells:
      initiation:
        action: The old outside leg pushes with the outside one to lift the body up and across, then relaxes and folds under its own load as it becomes the inside leg
        moment: Extension during the push
        contraction: concentric
        cue: Push off the old outside ski, then let that leg soften
        confidence: medium
        sources:
          - seifert-2023
          - { source: lind-sanders-2004, pages: "117-120" }
          - { source: lemaster-2010, pages: "144-148" }
      shaping:
        action: Held short and more bent than the outside knee under its share of the load
        moment: Extension, about as large as the outside knee's, because it is more bent
        contraction: isometric
        cue: Short inside leg, long outside leg
        confidence: medium
        sources:
          - heinrich-2022
          - kroll-2011
      finish:
        action: Held bent while the outside knee flexes, ready to become the new outside leg and push
        contraction: isometric
        cue: Both knees bent as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: knee.rotation
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [{ source: iasi-2021, pages: 191 }, { source: lemaster-2010, pages: "124-125" }] }
      shaping: { neutral: true, moment: Resisting the twist the snow force invites, contraction: isometric, cue: Turn the thigh not the knee, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Turn the thigh not the knee, confidence: low, sources: [] }
  - dof: knee.rotation
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
      shaping: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee points where its ski points, confidence: low, sources: [] }
  - dof: knee.valgus
    side: outside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Knee stays over the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Resisting the inward collapse the edged load invites, contraction: isometric, cue: Knee stays over the foot and does not cave in, confidence: medium, sources: [zorko-2020, heinrich-2023] }
      finish: { neutral: true, contraction: isometric, cue: Knee stays over the foot and does not cave in, confidence: low, sources: [] }
  - dof: knee.valgus
    side: inside
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
      shaping: { neutral: true, moment: Small abduction moment, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [heinrich-2022] }
      finish: { neutral: true, contraction: isometric, cue: Inside knee in line with the foot, confidence: low, sources: [] }
  - dof: hip.flexion
    side: outside
    cells:
      initiation:
        action: Opens with the knee as the body rises through the switch, the trunk coming up but staying forward of vertical
        contraction: concentric
        cue: Rise forward, not straight up
        confidence: medium
        sources:
          - seifert-2023
          - berg-1995
          - { source: lemaster-2010, pages: "40-42, 94" }
      shaping:
        action: Held at its most open, folded forward at the hip with the pelvis slightly countered
        moment: Extension, about 1.3 Nm/kg in a modelled carved turn, shared by gluteus maximus, the hamstrings and adductor magnus
        contraction: isometric
        cue: Fold at the hips, not the waist
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "73-74" }
      finish:
        action: Folds further with the knee, absorbing the late load
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.flexion
    side: inside
    cells:
      initiation:
        action: The old outside hip opens with the push, then folds again under its own load as the leg becomes the inside leg
        contraction: concentric
        cue: Push, then let the inside hip fold
        confidence: low
        sources:
          - seifert-2023
          - { source: lind-sanders-2004, pages: "117-118" }
      shaping:
        action: Held more flexed than the outside hip
        moment: Extension, similar to the outside hip because it is more flexed
        contraction: isometric
        cue: Inside leg short, inside foot slightly ahead
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "61-62" }
      finish:
        action: Held flexed while the outside hip folds
        contraction: isometric
        cue: Both hips folded as the turn ends
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42" }
  - dof: hip.abduction
    side: outside
    cells:
      initiation:
        action: The leg tips toward the new turn as the body crosses over it; as the load arrives the pelvis tips over the loaded thigh so the inside half stays up, the outside abductors holding it pelvis on femur
        contraction: concentric
        cue: Keep the inside hip up as the legs tip
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
          - moore-2020
          - seifert-2023
      shaping:
        action: Hip angulation builds with the edge to its most in late shaping, then holds
        moment: Changes sign within the turn; abductors and adductors co-contract
        contraction: concentric
        cue: Hips in, shoulders over the outside ski; more with speed
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "70-71, 74, 128" }
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Holds under the late load, then releases as the turn ends
        contraction: eccentric
        cue: Let the hips come back over the skis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 130 }
  - dof: hip.abduction
    side: inside
    cells:
      initiation:
        action: The inside knee tips toward the new turn with its ski as the leg becomes the inside leg; the inside hip is held firmly at hip width
        contraction: concentric
        cue: Inside knee leads the tipping
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "67, 142" }
      shaping:
        action: Held, the inside thigh drawn toward the turn at hip width, with the inside hip abductors working harder than in a flexion transition
        moment: Adduction, the adductor longus the main contributor in a modelled carved turn
        contraction: isometric
        cue: A strong inside half
        confidence: medium
        sources:
          - seifert-2023
          - heinrich-2022
          - heinrich-2023
      finish:
        action: Held, then eases toward neutral as the edges flatten
        contraction: isometric
        cue: Keep the feet hip width apart
        confidence: low
        sources:
          - { source: iasi-2021, pages: 59 }
  - dof: hip.rotation
    side: outside
    cells:
      initiation:
        action: Turns inward a little as the light skis are tipped and pointed into the new turn under a quiet pelvis
        contraction: concentric
        cue: Turn the thigh in the hip socket
        confidence: medium
        sources:
          - { source: lemaster-2010, pages: "107-108, 124-125" }
          - delp-1999
      shaping:
        action: Held turned in as the ski carves
        moment: External in a modelled carved turn, the external rotators braking the inward turn
        contraction: isometric
        cue: Keep the knee over the foot as the ski turns
        confidence: medium
        sources:
          - heinrich-2023
          - heinrich-2022
      finish:
        action: Held, then back toward neutral at the release
        contraction: isometric
        cue: Let the thigh unwind with the release
        confidence: low
        sources: []
  - dof: hip.rotation
    side: inside
    cells:
      initiation:
        action: Turns outward as the new inside leg steers its ski into the new turn
        contraction: concentric
        cue: Steer the inside ski too
        confidence: low
        sources:
          - delp-1999
          - { source: lemaster-2010, pages: 142 }
      shaping:
        action: Held turned out, about 10-26° in a modelled carved turn
        moment: Internal, so the internal rotators hold the femur against further outward turn
        contraction: isometric
        cue: Inside ski parallel
        confidence: medium
        sources:
          - heinrich-2022
      finish:
        action: Held until the release
        contraction: isometric
        cue: Inside ski parallel
        confidence: low
        sources: []
  - dof: pelvis.tilt
    side: trunk
    cells:
      initiation:
        action: Rises with the legs as the body comes up through the switch; the hinge opens but stays forward, and the low back stays slightly flattened, never arched
        contraction: concentric
        cue: Rise with the legs; the hinge stays at the hips
        confidence: medium
        sources:
          - seifert-2023
          - { source: lemaster-2010, pages: "40-42, 62-63, 94" }
      shaping:
        action: Hinge held over the long outside leg, more tilted the harder the turn
        contraction: isometric
        cue: Hinged at the hips, low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Tilts forward again with the hip hinge as the legs flex
        contraction: eccentric
        cue: Fold at the hips as the legs flex
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "40-42, 62-63" }
  - dof: pelvis.list
    side: trunk
    cells:
      initiation:
        action: The inside half stays up as the body crosses over and the legs tip, held by the outside hip abductors
        contraction: concentric
        cue: Inside hip up
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71" }
      shaping:
        action: Kept up, a little more as the edge builds to late shaping
        contraction: concentric
        cue: Don't let the inside hip drop
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-71, 128, 140" }
      finish:
        action: Levels as the edges release
        contraction: eccentric
        cue: Level the hips for the switch
        confidence: low
        sources: []
  - dof: pelvis.rotation
    side: trunk
    cells:
      initiation:
        action: Square to the skis at the switch; a slight counter forms as the legs turn under the quiet pelvis
        contraction: isometric
        cue: Let the legs turn under a quiet pelvis
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73-74, 107" }
          - { source: iasi-2021, pages: 64 }
      shaping:
        action: Slight counter held, about 5-10°
        contraction: isometric
        cue: Belt buckle a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
          - psia-c-medium-radius-carved
      finish:
        action: Squares to the skis as they release
        contraction: isometric
        cue: Chest and pelvis square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: lumbar.flexion
    side: trunk
    cells:
      initiation:
        action: Low back slightly flattened from standing, never arched as the body rises; arching to stand up is the extension fault
        contraction: isometric
        cue: Low back slightly flattened as you rise
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63, 94" }
      shaping:
        action: Held slightly flattened from standing under load
        moment: Extension, the largest moment in a modelled carved turn
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: medium
        sources:
          - heinrich-2022
          - { source: lemaster-2010, pages: "62-63" }
      finish:
        action: Held slightly flattened from standing as the legs flex
        contraction: isometric
        cue: Low back slightly flattened, never arched or slumped
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "62-63" }
  - dof: lumbar.side-bend
    side: trunk
    cells:
      initiation:
        action: Bends toward the outside ski as the body crosses over; the inside quadratus lumborum and obliques lengthen to control it
        contraction: eccentric
        cue: Shoulders level with the slope
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70, 74" }
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Hips in, shoulders out; more as speed builds
        confidence: medium
        sources:
          - sporri-2016
          - { source: lemaster-2010, pages: "74, 126, 128" }
      finish:
        action: Returns toward straight as the edges release
        contraction: concentric
        cue: Straighten up over the skis
        confidence: low
        sources: []
  - dof: lumbar.rotation
    side: trunk
    cells:
      initiation: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }, fujii-2007] }
      shaping: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: medium, sources: [sporri-2016, fujii-2007] }
      finish: { neutral: true, contraction: isometric, cue: Counter comes from the hip sockets not the low back, confidence: low, sources: [{ source: lemaster-2010, pages: 73 }] }
  - dof: thoracic.flexion
    side: trunk
    cells:
      initiation:
        action: Chest rises with the body through the switch but stays forward of vertical, about 20-30°
        contraction: isometric
        cue: Chest over the knees as you rise
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "94, 182-183" }
      shaping:
        action: Slight forward flexion held
        contraction: isometric
        cue: Chest over the knees
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 74 }
      finish:
        action: Slight forward flexion held
        contraction: isometric
        cue: Don't sit up as the turn ends
        confidence: low
        sources: []
  - dof: thoracic.side-bend
    side: trunk
    cells:
      initiation:
        action: Tips toward the outside ski a little more than the pelvis does; the inside obliques lengthen to control it
        contraction: eccentric
        cue: Outside shoulder over the outside ski
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 70 }
          - fujimori-2014
      shaping:
        action: Keeps building with the edge to its most in late shaping, then held
        contraction: eccentric
        cue: Outside shoulder over the outside ski; more as the edge builds
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "70-72, 128" }
      finish:
        action: Returns toward straight through the finish
        contraction: concentric
        cue: Let the shoulders come level
        confidence: low
        sources: []
  - dof: thoracic.rotation
    side: trunk
    cells:
      initiation:
        action: Quiet in space with the pelvis while the femurs turn under
        contraction: isometric
        cue: Chest a little toward the outside of the turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: 73 }
      shaping:
        action: Slight counter held against the legs' turning
        contraction: isometric
        cue: Quiet upper body while the legs turn
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "73, 107" }
          - { source: iasi-2021, pages: 64 }
      finish:
        action: Squares to the skis as they release
        contraction: isometric
        cue: Chest square to the skis as they release
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "116-118" }
  - dof: shoulder-girdle.protraction
    side: both
    cells:
      initiation: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [{ source: lemaster-2010, pages: "142-143" }] }
      shaping: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
      finish: { action: Shoulder blades slightly forward and level, contraction: isometric, cue: Hands forward and in view, confidence: low, sources: [] }
  - dof: shoulder.flexion
    side: outside
    cells:
      initiation:
        action: Arm held forward, hand in view and level with the other
        contraction: isometric
        cue: Outside hand forward
        confidence: low
        sources:
          - { source: lemaster-2010, pages: "142-143, 154" }
      shaping:
        action: Arm held forward, ready
        contraction: isometric
