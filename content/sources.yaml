# Re-read in full (E2c, 2026-10-21); figure values read by eye (moments ±0.15 Nm/kg, hip rotation ±0.03, angles ±2 deg). One professional ski instructor, right turn, GS skis; subject mass and phase shares not printed.
# Table 2: RIGHT = INSIDE leg, LEFT = OUTSIDE leg. Window = steering phase (radius < 32 m): t 0-1.32 s, v 13.5-14.5 m/s, min radius 16 m. Outside force (Fig 4B) flat top ~1.00 BW at t 0.7-0.9 s; the 0.17 s bump (outside 0.86 BW) is an unload-load motion, not the peak.
# Signs are internal (muscle) moments, + = hip flexion, adduction, internal rotation, knee extension, ankle dorsiflexion, lumbar extension, lateral bending (side unstated), left rotation. Our lumbar flexion has the opposite sign: its +1.88 extension is -1.88 here.
# Outside leg at the force peak (t ~0.87 s): hip flexion ~79 deg (range 50.3-80.6; inside hip ~117 deg), hip rotation -0.17 Nm/kg (external; turn range -0.17..+0.06, minimum at t 0.9-1.0 s; inside hip +0.2), hip extension 1.27 (its peak),
# hip adduction ~+0.1 (range -0.39..+0.52: abduction <= 0.39, adduction <= 0.52), knee extension ~0.65 (peak 1.02 at t 0.17 s), ankle plantarflexion ~0.5 (peak 0.85 at t 0.45 s). The inside leg's Table 2 peaks are knee extension <= 0.96, hip adduction <= 0.45, ankle plantarflexion <= 0.47.
# Lumbar: ONE joint with 3 DOF (pelvis to the Hamner torso segment; 8 added muscles: 2x erector spinae, rectus abdominis, external and internal obliques), no thoracic joint, so no thoracic moment. Extension 1.88 Nm/kg (range 0.16-1.88, peak at the force peak) is the net moment of everything above the pelvis: a whole-spine demand.
# Lumbar bending 0.01-0.75 (max at t ~0.5 s; ~0.35 at the force peak), rotation -0.16..-0.01 (~-0.1 at the peak, toward the right).
