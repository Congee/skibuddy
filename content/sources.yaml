# Full text read from the PMC XML (J Hum Kinet 57:51-59, DOI 10.1515/hukin-2017-0046), Tables 1-3. Trunk flexion and extension peak torque of 109 FIS skiers who met Austrian Ski Federation national-team criteria (junior 44, European Cup 42, World Cup 23; 2008-2011) and 47 sport-science students.
# Protocol: CON-TREX TP 1000, STANDING, axis at the lumbosacral junction, lower limbs, hips and upper body strapped (hips fixed), gravity-corrected, concentric isokinetic 150 deg/s (ballistic mode), ROM 60 deg (0 upright to 60 flexion), 4 submaximal then 3 maximal repetitions, best of 2 trials = peak torque. Not isometric.
# Male skiers n 53, 22.1 y, 83.8 ± 5.7 kg: extension 378.2 ± 54.4 Nm = 4.53 ± 0.65 Nm/kg (range 3.5-6.1), flexion 204.9 ± 28.6 Nm = 2.44 ± 0.30 Nm/kg, flexion/extension 0.56 ± 0.09. Female skiers n 56, 63.7 kg: extension 228.1 ± 31.7 Nm = 3.55 ± 0.53 Nm/kg, flexion 127.6 ± 16.2 Nm = 2.05 ± 0.22 Nm/kg.
# Male controls n 21, 76.7 kg: extension 299.1 ± 47.9 Nm = 4.11 ± 0.52 Nm/kg, flexion 173.6 ± 27.3 Nm = 2.32 ± 0.42 Nm/kg. Female controls n 26, 61.6 kg: extension 192.7 ± 38.4 Nm = 3.14 ± 0.48 Nm/kg, flexion 1.74 ± 0.28 Nm/kg.
# Used for the lumbar and thoracic flexion and extension maxima (male skiers x the reference skier's mass). Caveat: a standing concentric peak over 0-60 deg flexion, not pan-2025's seated isometric from neutral; heinrich-2022's skier is flexed (pelvis tilt 28-39 deg, lumbar flexion 23-29 deg).
- id: hildebrandt-2017
  type: article
  citation: Hildebrandt C, Müller L, Heisse C, Raschner C. Trunk strength characteristics of elite alpine skiers - a comparison with physically active controls. J Hum Kinet. 2017;57:51-9.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5504578/
  read: full
# Isometric trunk torques, seated upright, shoulders and pelvis fixed (61 asymptomatic males 24.5 ± 2.3 y, 73.4 ± 15.0 kg): flexion 1.15, extension 1.74, lateral bending left 0.95 / right 0.91, axial rotation left 0.74 / right 0.64 Nm/kg. It says its torques sit below earlier studies (other populations, protocols, devices).
# Its flexion and extension sit 2.1x and 2.6x below hildebrandt-2017's male FIS skiers (2.44 / 4.53 Nm/kg; standing, concentric isokinetic 150 deg/s). The model now takes flexion and extension from hildebrandt-2017; pan-2025 supplies bending (0.93, mean of the sides) and rotation (0.69) only, as it has no athlete value to replace them.
