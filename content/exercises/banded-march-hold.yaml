id: banded-march-hold
name: Banded standing march, hold at top
targets: [{ muscle: iliopsoas, contraction: isometric }, { muscle: rectus-femoris, contraction: isometric }]
single_leg: true
matches_on_snow: Holding the inside ski's tail up
easier: No band
harder: Stand on a balance pad
cautions: [Hip-flexor strain]
dosing:
  per_side: true
  ranges:
    - goal: control
      sets: { min: 2, max: 3 }
      hold_seconds: { min: 10, max: 20 }
      rest_seconds: { min: 30, max: 60 }
      note: Stand tall with the pelvis level; stop the set when the standing hip drops.
      basis: Our own conservative reading for slow, form-first work, not a published dose. Body-weight holds sit well below a maximal effort, so the holds are longer than in maximal isometric training.
      sources: [lum-2019]
    - goal: endurance
      sets: { min: 2, max: 3 }
      hold_seconds: { min: 20, max: 30 }
      rest_seconds: { min: 30, max: 60 }
      note: Easy enough to breathe through the whole hold.
      basis: Body-weight holds sit well below a maximal effort, so the holds are longer than in maximal isometric training. The rest follows ACSM's general guidance.
      sources: [lum-2019, acsm-2009]
  suggested: { goal: control, sets: 2, hold_seconds: 15 }
reviewed_by: []
