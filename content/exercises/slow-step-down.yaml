id: slow-step-down
name: Slow step-down
targets: [{ muscle: vasti, contraction: eccentric }, { muscle: gluteus-medius, contraction: isometric }]
single_leg: true
matches_on_snow: Eccentric knee control, lowering over 3-4 seconds
easier: Lower step
harder: Higher step, added load
cautions: [Knee pain - reduce depth]
dosing:
  per_side: true
  ranges:
    - goal: control
      sets: { min: 2, max: 3 }
      reps: { min: 6, max: 10 }
      rest_seconds: { min: 60, max: 90 }
      note: Lower over 3-4 seconds with the knee tracking over the second toe.
      basis: Our own conservative reading for slow, form-first work, not a published dose; the rest follows ACSM's general guidance.
      sources: [acsm-2009]
    - goal: strength
      sets: { min: 2, max: 3 }
      reps: { min: 8, max: 12 }
      rest_seconds: { min: 60, max: 120 }
      note: Higher step or added load, still lowering slowly.
      basis: Rep and rest ranges follow ACSM's strength zone for healthy adults, kept at the conservative end.
      sources: [acsm-2009]
  suggested: { goal: control, sets: 3, reps: 8 }
reviewed_by: []
