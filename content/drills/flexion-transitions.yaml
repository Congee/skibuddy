  - { primitive: ankle-flexion, modifier: shins kept on the tongues through the low switch }
  - { primitive: tipping, modifier: early while the body is still low }
  - { primitive: leg-rotation, modifier: small }
  - { primitive: counter, modifier: slight }
  - { primitive: hip-angulation }
  - { primitive: pole-touch, modifier: a light touch at the switch }
