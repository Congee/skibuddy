id: flexion-transitions
name: Flexion transitions
movement: flexion-transition-turn
summary: Linked turns, carved or brushed, where the edge change happens low. As a turn ends the legs keep folding, and the old outside leg is pulled up and under the body, so the skis cross under a body that barely rises and the new edges engage while the skier is still low. The legs then reach out to the side into the new turn. Compare with extension transitions, where the body rises over the skis instead.
terrain: Groomed blue runs with room for medium turns; dynamic on a steeper blue
# Settings are how hard the turns are skied; brushed or carved is technique at any setting.
# Loads follow Lind & Sanders eq 4.9, p 103; speeds and radii are our inference, well under GS levels.
scenarios:
  gentle: { speed_mps: 8, radius_m: 12, slope_deg: 12 }
  moderate: { speed_mps: 10, radius_m: 14, slope_deg: 15 }
  dynamic: { speed_mps: 12, radius_m: 16, slope_deg: 18 }
equipment: Efforts assume recreational carving skis of about 14-17 m sidecut and boots with about 15° of cuff lean, about 0.9° of binding ramp (4.7 mm) and about 42 mm stand height. Too little forward lean turns the deep switch into a back-seat position; more lean or ramp deepens the knee; a higher stand height adds edge leverage but loads the knee.
cautions:
  - Fold at the hips and knees with the shins on the tongues; folding at the waist or sitting back at the switch is the back-seat knee injury pattern.
  - Holding the low switch tires the thighs fast; rest before the burn sets in.
sources:
  - seifert-2023
  - komissarov-2022b
  - { source: lind-sanders-2004, pages: "103, 118-120" }
  - { source: lemaster-2010, pages: "58-59, 96-98, 152-154, 164-167" }
  - { source: jordan-sporri-taylor-2023, pages: 120 }
  - posch-2025
  - ruedl-2022
primitives:
