id: turns-on-the-tops
name: Turns on the tops
# No movement of its own yet: it shares the closed-stance short turn's.
movement: closed-stance-short-turn
summary: The recreational line through moguls, each turn starting on top of a bump. On the crest only the middle of the skis touches the snow, so the legs pivot both skis round with little effort (campbell-rogan-2001). Fore-aft, the feet work against the bump. Coming into it, with the legs long, the feet move a little ahead (lemaster-2010 fig 6.2 pp88-89, craenen-2022); a feel cue we use is to let the tails meet the bump and take its rebound. Near the crest the feet pull back under the body, the tails lift and the tips drop early onto the back side (lemaster-2010 pp88-89, smith-j2ski-compression, dipiro-2005 pp36, 44). Then the tips are pressed down into the trough, keeping as much of the ski on the snow as possible, and the legs fold again as the next bump rises (dipiro-2005 p46); long in the trough but never straight (fis-freestyle-judging-2025 p28). On top the skier is at their smallest, a deep squat with the thighs near level and the hips low over the feet, the trunk along the shins rather than bent at the waist, centred over the feet (duncan-smith-2021, gellie-2019-moguls-forward, fis-freestyle-judging-2025 p29). The upper body stays forward and square to the fall line, hands wide and forward at chest height, the edges tipped early on the backside and clear by the fall line (duncan-smith-2021), released on the top just before the crest with the plant downhill (campbell-rogan-2001, duncan-smith-2021), or just below the crest with the pole tip reaching the bump well before the feet (wiegand-2021). An easier line than the zipper (see Moguls), which keeps to the ruts between the bumps; we teach it first (our inference).
terrain: An easy, soft mogul field on a blue, bumps about half a metre high, the line coming round about 50° off the fall line over each crest and riding the saddles' shoulders between them, out of the troughs (duncan-smith-2021, campbell-rogan-2001; angle inferred); dynamic on a steeper, bigger field
# The mogul turn's speeds and radii; inferred.
# A quarter of gravity's pull along the line is braked fore-aft at the feet: most mogul braking is lateral edge skid, which tilts the balance line sideways, not fore-aft; inferred.
# The mass runs straighter than the skis, its path about 2x their arc, so the body inclines as in duncan-smith-2021; inferred.
scenarios:
  gentle: { speed_mps: 5, radius_m: 5, com_radius_m: 10, slope_deg: 15, braking_share: 0.25 }
  moderate: { speed_mps: 6, radius_m: 5, com_radius_m: 10, slope_deg: 18, braking_share: 0.25 }
  dynamic: { speed_mps: 7.5, radius_m: 5.5, com_radius_m: 11, slope_deg: 22, braking_share: 0.25 }
equipment: Efforts assume recreational skis of about 12-15 m sidecut and boots with about 15° of cuff lean. Softer, narrower skis and shorter poles make the bumps easier (lemaster-2010 p185).
cautions:
  - "Common mistake: staying low the whole turn. Stand taller as the skis slide down into the trough, then fold again for the next bump (lemaster-2010 p191)."
  - Control speed by turning across the hill on the crest, not by setting a hard edge on the bump's back.
  - "Common mistake: leaving the feet ahead over the crest. The tails stay locked in the snow and the body falls back; pull the feet under you as you reach the top (dipiro-2005 pp13, 28)."
  - Pick a soft field and stop if the bumps are icy; landing on a crest from speed jars the knees and back.
